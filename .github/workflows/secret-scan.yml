name: Secret scan

# Fails the build if something that looks like a live credential reaches the
# repository. The rules live in tools/scan-secrets.py so the same check can be
# run locally, and as a pre-commit hook, without a network call.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A key added and then amended away still sits in the history and is
          # still compromised, so the whole history is fetched and scanned.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan the working tree
        run: python3 tools/scan-secrets.py

      - name: Scan the commits added by this push or pull request
        # Only the new commits: an old finding would fail every run forever
        # without telling anyone anything new, and the fix for that is to
        # rotate the key, not to keep the build red.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A new branch reports an all-zero "before"; there is no range to diff.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare against — the working-tree scan above covers it."
            exit 0
          fi
          tmp="$(mktemp -d)"
          # Reconstruct each added/modified file as that commit left it, then
          # scan those copies: the value matters, not the surrounding diff.
          git diff --name-only --diff-filter=ACM "$base" "$head" > "$tmp/files.txt" || true
          if [ ! -s "$tmp/files.txt" ]; then echo "No files changed."; exit 0; fi
          mkdir -p "$tmp/tree"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$tmp/tree/$(dirname "$f")"
            git show "$head:$f" > "$tmp/tree/$f" 2>/dev/null || true
          done < "$tmp/files.txt"
          echo "Scanning $(wc -l < "$tmp/files.txt") changed file(s)."
          python3 tools/scan-secrets.py "$tmp/tree"
