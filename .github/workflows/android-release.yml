name: Build Android App Bundle

# Builds the Google Play upload artifact (.aab) on a GitHub runner, which ships
# the Android SDK and can reach Google's Maven repo — neither of which is
# available in every dev environment.
#
#   • Run it from the Actions tab ("Run workflow"), or push a v* tag.
#   • The signed .aab is attached to the run as a downloadable artifact.
#
# Signing needs four repository secrets (Settings → Secrets and variables →
# Actions). Without them the job still builds, but the bundle is UNSIGNED and
# Play will reject it — the verify step below says so loudly rather than
# letting you discover it at upload time.
#
#   KEYSTORE_BASE64      base64 of your upload-keystore.jks
#   KEYSTORE_PASSWORD    the keystore password
#   KEY_ALIAS            the key alias (e.g. upload)
#   KEY_PASSWORD         the key password
#
# See cubefinance/docs/PLAY_STORE.md for creating the key and filling these in.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must be higher than any previous Play upload)'
        required: false
        default: ''
      version_name:
        description: 'versionName shown to users, e.g. 1.0.1'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    # The secrets context is NOT available in a step-level `if`, so it is lifted
    # into the job env here and the steps test that instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      CUBEY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CUBEY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      CUBEY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Work out the version
        id: ver
        run: |
          # A tag push sets the name from the tag; the run number gives a
          # versionCode that always increases, which is what Play requires.
          NAME="${{ inputs.version_name }}"
          CODE="${{ inputs.version_code }}"
          if [ -z "$NAME" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$NAME" ] && echo "CUBEY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          [ -n "$CODE" ] && echo "CUBEY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=${NAME:-<default 1.0.0>}  versionCode=${CODE:-<default 1>}"

      - name: Sync the latest web app into the Android assets
        run: |
          cp cubefinance/web/cubefinance-web.html \
             cubefinance/android/app/src/main/assets/index.html
          echo "bundled $(wc -c < cubefinance/android/app/src/main/assets/index.html) bytes"

      - name: Decode the upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Piped through the environment, never interpolated into the script.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"
          echo "CUBEY_KEYSTORE_PATH=${RUNNER_TEMP}/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "keystore decoded ($(wc -c < "${RUNNER_TEMP}/upload-keystore.jks") bytes)"

      - name: Warn when no signing key is configured
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning title=Unsigned build::No KEYSTORE_BASE64 secret is set, so the bundle will be UNSIGNED and Google Play will reject it. See cubefinance/docs/PLAY_STORE.md."

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('cubefinance/android/**/*.gradle', 'cubefinance/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release bundle (.aab)
        working-directory: cubefinance/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Also build a release APK (handy for sideloading / testing)
        working-directory: cubefinance/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the bundle exists and is signed
        run: |
          set -e
          AAB=$(find cubefinance/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then echo "::error::No .aab was produced."; exit 1; fi
          echo "built: $AAB ($(du -h "$AAB" | cut -f1))"
          # A signed bundle carries a signature block in META-INF. Play rejects
          # anything without one, so fail here instead of at upload time.
          if unzip -l "$AAB" | grep -qiE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "signature block present — ready to upload"
          elif [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Unsigned::Bundle built without a signing key. Add the secrets and re-run before uploading to Play."
          else
            echo "::error title=Signing failed::A keystore was supplied but the bundle carries no signature. Check KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD."
            exit 1
          fi

      - name: Upload the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: cubefinance-aab
          path: cubefinance/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cubefinance-apk
          path: cubefinance/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload the mapping file (for crash de-obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: cubefinance-mapping
          path: cubefinance/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
