<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="scene-brand-template">
      <style>
      @font-face {
        font-family: "Heebo";
        src: url("assets/fonts/Heebo-400.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Heebo";
        src: url("assets/fonts/Heebo-700.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Heebo";
        src: url("assets/fonts/Heebo-900.ttf") format("truetype");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      #brand-stage {
        position: absolute;
        inset: 0;
      }
      #brand-fill {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 56px;
        padding: 90px;
      }
      #brand-rings {
        position: absolute;
        left: 230px;
        top: 470px;
        width: 620px;
        height: 620px;
      }
      #brand-stage .ring {
        position: absolute;
        border-radius: 50%;
      }
      #brand-stage .ring-0 {
        width: 620px;
        height: 620px;
        left: 0px;
        top: 0px;
        border: 4px solid rgba(255, 216, 77, 0.75);
        box-shadow: 0 0 50px rgba(255, 216, 77, 0.5);
      }
      #brand-stage .ring-1 {
        width: 470px;
        height: 470px;
        left: 75px;
        top: 75px;
        border: 3px solid rgba(255, 216, 77, 0.57);
        box-shadow: 0 0 40px rgba(255, 216, 77, 0.5);
      }
      #brand-stage .ring-2 {
        width: 330px;
        height: 330px;
        left: 145px;
        top: 145px;
        border: 2px solid rgba(255, 216, 77, 0.39);
        box-shadow: 0 0 30px rgba(255, 216, 77, 0.5);
      }
      #brand-playmark {
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: linear-gradient(150deg, #FFFFFF 0%, #FFE9F4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 26px 60px rgba(60, 0, 32, 0.45);
      }
      #brand-playmark .tri {
        width: 0;
        height: 0;
        border-top: 42px solid transparent;
        border-bottom: 42px solid transparent;
        border-right: 68px solid #E30B79;
        margin-right: 16px;
      }
      #brand-name {
        font-family: "Heebo", sans-serif;
        font-weight: 900;
        font-size: 148px;
        letter-spacing: 4px;
        color: #FFFFFF;
        text-shadow: 0 0 60px rgba(255, 255, 255, 0.45), 0 10px 34px rgba(70, 0, 35, 0.5);
        white-space: nowrap;
      }
      #brand-divider {
        height: 6px;
        width: 0px;
        border-radius: 999px;
        background: #FFD84D;
        box-shadow: 0 0 26px #FFD84D;
      }
      #brand-tagline {
        direction: rtl;
        font-family: "Heebo", sans-serif;
        font-weight: 700;
        font-size: 62px;
        color: #FFFFFF;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.3), 0 6px 26px rgba(70, 0, 35, 0.65);
      }
      </style>

      <div
        data-composition-id="scene-brand"
        data-width="1080"
        data-height="1920"
        data-duration="2.600000"
      >
        <div id="brand-stage">
          <div id="brand-fill">
            <div id="brand-rings">
              <div class="ring ring-0"></div>
              <div class="ring ring-1"></div>
              <div class="ring ring-2"></div>
            </div>

            <div id="brand-playmark"><div class="tri"></div></div>

            <div id="brand-name">STUDIO CUT</div>

            <div id="brand-divider"></div>

            <div id="brand-tagline">מערכת העריכה שדואגת לתוצאות</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const stage = document.getElementById("brand-stage");

        // GlowRings: opacity [0,12] -> [0,1]; rotate [0,78] -25deg -> 20deg (out cubic)
        gsap.set("#brand-rings", { opacity: 0, rotation: -25 });
        tl.to("#brand-rings", { opacity: 1, duration: 12 / 30, ease: "none" }, 0);
        tl.to("#brand-rings", { rotation: 20, duration: 78 / 30, ease: "power2.out" }, 0);

        Array.from(document.querySelectorAll("#brand-stage .ring")).forEach(function (ring, i) {
          gsap.set(ring, { scale: 0.6 });
          tl.to(ring, { scale: 1, duration: (20 + i * 6) / 30, ease: "b13" }, 0);
        });

        // PlayMark: scale [4,24] -> [0.3,1]
        gsap.set("#brand-playmark", { scale: 0.3 });
        tl.to("#brand-playmark", { scale: 1, duration: 20 / 30, ease: "b14" }, 4 / 30);

        // Brand name: opacity [16,28]; translate [16,34] 0,40 -> 0,0
        gsap.set("#brand-name", { opacity: 0, y: 40 });
        tl.to("#brand-name", { opacity: 1, duration: 12 / 30, ease: "none" }, 16 / 30);
        tl.to("#brand-name", { y: 0, duration: 18 / 30, ease: "b10" }, 16 / 30);

        // Divider opens from the centre: width [28,46] -> [0,420]
        tl.to("#brand-divider", { width: 420, duration: 18 / 30, ease: "b10" }, 28 / 30);

        // Tagline: opacity [34,46]; translate [34,50] 0,30 -> 0,0
        gsap.set("#brand-tagline", { opacity: 0, y: 30 });
        tl.to("#brand-tagline", { opacity: 1, duration: 12 / 30, ease: "none" }, 34 / 30);
        tl.to("#brand-tagline", { y: 0, duration: 16 / 30, ease: "b10" }, 34 / 30);

        // Enters under fade() (incoming opacity 0 -> 1 over frames 0-10),
        // leaves with slide({direction:"from-left"}) over frames 68-78.
        tl.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 10 / 30, ease: "spr" }, 0);
        tl.set(stage, { opacity: 1 }, 10 / 30);
        tl.to(stage, { xPercent: 100, duration: 10 / 30, ease: "spr" }, 68 / 30);

        window.__timelines["scene-brand"] = tl;
      </script>
    </template>
  </body>
</html>
