      #ring {

      #ring-shadow {

    </style>

      <!-- נקישה קטנה כשכל חלק נוחת בהרכבה (8 חלקים, בסדר הפוך) -->
      <audio id="click-0" src="assets/sfx/click.m4a" data-start="57.38" data-track-index="2" data-duration="0.05" data-volume="0.55"></audio>
      <audio id="click-1" src="assets/sfx/click.m4a" data-start="57.44" data-track-index="3" data-duration="0.05" data-volume="0.55"></audio>

    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.min.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      /* ───────────── ציר הזמן (שניות המקור) ─────────────
         המילים מתוך התמלול שאושר:
         "תחתוך את הרקע שלי" 34.72 → המסגרת נסגרת לעיגול
         "יש מצלמה"          40.38 → המוצר נכנס
         "שמתפרקת לחתיכות"   45.00 → פירוק
         "המצלמה" (אחרונה)   56.90 → הרכבה
         אחרי יציאת המוצר           → חזרה למסך מלא */
      const DUR = 59.766;
      const T_CLOSE = 34.72;
      const T_MOVE = 35.75;
      const T_IN = 40.38;
      const T_EXPLODE = 45.0;
      const T_LABEL0 = 45.9;
      const LABEL_GAP = 1.15;
      const T_ASM = 56.9;
      const T_PARTS_BACK = 57.1;
      const PART_STAGGER = 0.06;
      const T_TURN_BACK = 57.3;
      const T_EXIT = 58.15;
      const T_OPEN = 58.65;
      const OPEN_LEN = 0.9;

      const W = 1080;
      const H = 1920;

      /* ───────────── עזרים — הכל פונקציה של הזמן בלבד ───────────── */
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const lerp = (a, b, p) => a + (b - a) * p;
      const ramp = (t, a, b) => clamp01((t - a) / (b - a));
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeIn = (p) => p * p * p;
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      /** קפיץ מרוסן (פתרון סגור): 0 → 1, עם חריגה לפי zeta */
      function spring(t, freq = 1.4, zeta = 0.55) {
        if (t <= 0) return 0;
        const w = 2 * Math.PI * freq;
        if (zeta >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
        const wd = w * Math.sqrt(1 - zeta * zeta);
        return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + ((zeta * w) / wd) * Math.sin(wd * t));
      }

      /* ───────────── העיגול ─────────────
         קואורדינטות המקור (1080×1920). העיגול תמיד בתוך גבולות הווידאו
         (insets ≥ 0), כך שקצה הפריים לא נראה אף פעם. */
      const C_SRC = { x: 540, y: 820 };
      const D_SRC = 1040;
      const INSET_T = { t: C_SRC.y - D_SRC / 2, b: H - (C_SRC.y + D_SRC / 2), l: (W - D_SRC) / 2, r: (W - D_SRC) / 2 };
      const D_FINAL = 640;
      const S_FINAL = D_FINAL / D_SRC;
      const C_FINAL = { x: 540, y: 1555 };
      const T_CENTER = { x: 0, y: 960 - C_SRC.y };
      const T_FINAL = { x: C_FINAL.x - S_FINAL * C_SRC.x, y: C_FINAL.y - S_FINAL * C_SRC.y };

      function circleState(t) {
        // סגירה: כל קצה נמשך פנימה על קפיץ רך משלו
        const e = (d) => Math.max(0, spring(t - T_CLOSE - d, 1.15, 0.62));
        let ins = { t: INSET_T.t * e(0), b: INSET_T.b * e(0.05), l: INSET_T.l * e(0.02), r: INSET_T.r * e(0.07) };
        const closeP = spring(t - T_CLOSE, 1.15, 0.75);
        let radius = (D_SRC / 2) * clamp01(closeP);
        // מרכוז ואז תזוזה לצד שנבחר (למטה)
        const cP = spring(t - T_CLOSE, 1.0, 0.8);
        const mP = spring(t - T_MOVE, 1.1, 0.68);
        let s = lerp(1, S_FINAL, mP);
        let tx = lerp(T_CENTER.x * cP, T_FINAL.x, mP);
        let ty = lerp(T_CENTER.y * cP, T_FINAL.y, mP);
        let ringO = clamp01((t - T_CLOSE) / 0.5);

        // פתיחה: דרך מלבן מעוגל, נוחתת בדיוק בפריים המקורי (בלי חריגה)
        if (t >= T_OPEN) {
          const p = easeInOut(ramp(t, T_OPEN, T_OPEN + OPEN_LEN));
          ins = { t: INSET_T.t * (1 - p), b: INSET_T.b * (1 - p), l: INSET_T.l * (1 - p), r: INSET_T.r * (1 - p) };
          radius = (D_SRC / 2) * Math.pow(1 - p, 2.2);
          s = lerp(S_FINAL, 1, p);
          tx = lerp(T_FINAL.x, 0, p);
          ty = lerp(T_FINAL.y, 0, p);
          ringO = 1 - ramp(t, T_OPEN + OPEN_LEN * 0.55, T_OPEN + OPEN_LEN);
        }
        if (t < T_CLOSE) {
          ins = { t: 0, b: 0, l: 0, r: 0 };
          radius = 0;
          s = 1;
          tx = 0;
          ty = 0;
          ringO = 0;
        }
        return { ins, radius, s, tx, ty, ringO };
      }

      /* ───────────── המוצר: Sony a7R II (גוף בלבד) ─────────────
         מידות חיצוניות לפי מפרט היצרן: 126.9 × 95.7 × 60.3 מ"מ.
         רשימת החלקים לפי מדריך הפירוק של iFixit (Guide 45597).
         גודל החלקים הפנימיים משורטט בפרופורציה בלבד — שום מספר מהם לא מוצג. */
      const BODY = { w: 126.9, h: 95.7, d: 60.3 };
      const LINE = new THREE.Color("#7de8f5");
      const LINE_HI = new THREE.Color("#ffffff");
      const FILL = new THREE.Color("#0b0a2a");

      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x000000, 0);

      const scene = new THREE.Scene();
      // מצלמה אורתוגרפית ביחידות פיקסל: x=0 במרכז, y=0 במרכז המסך
      const camera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -5000, 5000);
      camera.position.set(0, 0, 2000);

      const product = new THREE.Group();
      scene.add(product);

      const lineMats = [];
      function solid(geo, pos, rot) {
        const g = new THREE.Group();
        const fillMat = new THREE.MeshBasicMaterial({
          color: FILL,
          transparent: true,
          opacity: 0.88,
          polygonOffset: true,
          polygonOffsetFactor: 1,
          polygonOffsetUnits: 1,
        });
        const mesh = new THREE.Mesh(geo, fillMat);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), null);
        g.add(mesh, edges);
        g.position.set(...pos);
        if (rot) g.rotation.set(...rot);
        g.userData.edges = edges;
        return g;
      }
      const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
      const cyl = (r, h, seg = 40) => new THREE.CylinderGeometry(r, r, h, seg);
      const ZROT = [Math.PI / 2, 0, 0];

      /** בונה חלק: אוסף צורות + נקודת עוגן לתווית (בקואורדינטות החלק) */
      function part(name, shapes, anchor) {
        const g = new THREE.Group();
        g.name = name;
        const mat = new THREE.LineBasicMaterial({ color: LINE.clone(), transparent: true, opacity: 1 });
        lineMats.push(mat);
        shapes.forEach((s) => {
          s.userData.edges.material = mat;
          g.add(s);
        });
        g.userData.mat = mat;
        g.userData.anchor = new THREE.Vector3(...anchor);
        return g;
      }

      // ציר העומק = z (קדימה אל העדשה = +z). סדר החלקים מלפנים לאחור.
      const PARTS = [
        // 0 — חזית הגוף, תושבת E וגריפ (בלי תווית)
        part(
          "front",
          [
            solid(box(BODY.w, 72, 14), [0, -11.8, 22]),
            solid(cyl(29, 9), [-10, -9, 33.5], ZROT),
            solid(cyl(23, 10), [-10, -9, 34], ZROT),
            solid(box(30, 72, 17), [48, -11.8, 36.5]),
            solid(box(54, 23.7, 40), [-10, 36, 10]),
          ],
          [0, 0, 30],
        ),
        // 1 — תריס שקט
        part(
          "shutter",
          [solid(box(52, 40, 5), [-10, -9, 13]), solid(box(44, 4, 1.5), [-10, 2, 16]), solid(box(44, 4, 1.5), [-10, -9, 16]), solid(box(44, 4, 1.5), [-10, -20, 16])],
          [-10, 11, 13],
        ),
        // 2 — חיישן Exmor R (35.9×24 מ"מ, פול פריים)
        part(
          "sensor",
          [solid(box(54, 44, 2), [-10, -9, 7]), solid(box(35.9, 24, 1.4), [-10, -9, 8.7])],
          [-10, 13, 7],
        ),
        // 3 — מייצב 5 צירים: מגש + 3 סלילים
        part(
          "ibis",
          [
            solid(box(78, 64, 5), [-10, -9, 1]),
            solid(cyl(7, 4, 24), [-36, 12, 3.5], ZROT),
            solid(cyl(7, 4, 24), [16, 12, 3.5], ZROT),
            solid(cyl(7, 4, 24), [-10, -32, 3.5], ZROT),
          ],
          [-10, 23, 1],
        ),
        // 4 — לוח אם עם המעבדים
        part(
          "board",
          [
            solid(box(112, 62, 2), [0, -9, -6]),
            solid(box(16, 16, 2), [-20, -2, -4]),
            solid(box(12, 12, 2), [8, -16, -4]),
            solid(box(10, 6, 2), [26, 4, -4]),
          ],
          [0, 22, -6],
        ),
        // 5 — סוללה NP-FW50 (בתוך הגריפ)
        part("battery", [solid(box(20, 52, 38), [48, -14, -2])], [48, 12, -2]),
        // 6 — גב הגוף ועינית (בלי תווית)
        part(
          "rear",
          [solid(box(BODY.w, 72, 10), [0, -11.8, -14]), solid(box(30, 22, 12), [-10, 35, -17])],
          [0, 24, -14],
        ),
        // 7 — מסך LCD מתקפל
        part("lcd", [solid(box(82, 56, 5), [4, -14, -22.5])], [4, 14, -22.5]),
      ];
      PARTS.forEach((p) => product.add(p));

      /* ───────────── התוויות (אושרו) ───────────── */
      const LABELS = [
        { part: 1, name: "תריס שקט", desc: "חושף את החיישן לאור בכל צילום", zone: "up", row: 2 },
        { part: 2, name: "חיישן Exmor R ‏42.4MP", desc: "הפול־פריים הראשון שמואר מאחור", zone: "down", row: 2 },
        { part: 3, name: "מייצב 5 צירים", desc: "3 סלילים מגנטיים מזיזים את החיישן", zone: "up", row: 1 },
        { part: 4, name: "לוח אם · BIONZ X", desc: "המוח: מעבד התמונה והזיכרון", zone: "down", row: 1 },
        { part: 5, name: "סוללה NP-FW50", desc: "‏7.2V · 1020mAh", zone: "down", row: 0 },
        { part: 7, name: "מסך LCD ‏3 אינץ'", desc: "מתקפל · 1,228,800 נקודות", zone: "up", row: 0 },
      ];
      // שורות: 0 = הכי קרובה למוצר. גובה תווית נמדד בבנייה (~131px)
      const ROW_UP = [306, 163, 20];
      const ROW_DOWN = [765, 908, 1051];
      let LABEL_H = 131;

      const labelsEl = document.getElementById("labels");
      const svg = document.getElementById("labels-svg");
      const NS = "http://www.w3.org/2000/svg";
      LABELS.forEach((L, i) => {
        const box = document.createElement("div");
        box.className = "label";
        box.id = `label-${i}`;
        box.innerHTML = `<span class="name">${L.name}</span><span class="desc">${L.desc}</span>`;
        labelsEl.appendChild(box);
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.id = `dot-${i}`;
        labelsEl.appendChild(dot);
        const line = document.createElementNS(NS, "line");
        line.setAttribute("stroke", "#22d3ee");
        line.setAttribute("stroke-width", "3");
        line.setAttribute("stroke-linecap", "round");
        line.id = `line-${i}`;
        svg.appendChild(line);
        L.box = box;
        L.dot = dot;
        L.line = line;
      });

      /* ───────────── תנועת המוצר ───────────── */
      const K = 4.9; // פיקסלים למ"מ: רוחב ~620px, ממלא את החצי העליון עם שוליים
      const K_EXPLODED = 2.3;
      const GAP = 64; // מרווח הפירוק לאורך ציר העומק (מ"מ)
      const HOME_Y = 960 - 610; // מרכז האזור שמעל העיגול
      const REST_Z = PARTS.map(() => 0);
      // מבט מאחור, מלמעלה ומהצד: ציר העומק נפרש אנכית על המסך
      const EXPLODE_ROT = { x: 1.94, y: 0.55 };
      const EXPLODE_X = -335; // הערימה זזה לשמאל, התוויות בעמודה מימין
      const FRONT_ROT = { x: 0.1, y: 0 };

      function floatRot(t) {
        const u = t - T_IN;
        return {
          x: 0.1 + 0.05 * Math.sin(u * 0.9),
          y: (25 * Math.PI) / 180 * Math.sin((u * 2 * Math.PI) / 7.5),
        };
      }

      function productState(t) {
        // כניסה מלמטה על קפיץ, עצירה, ריחוף איטי
        const inP = spring(t - T_IN, 0.95, 0.52);
        let y = lerp(-1250, HOME_Y, inP) + (t > T_IN ? 9 * Math.sin((t - T_IN) * 1.3) : 0);
        let rot = floatRot(t);
        let k = K;
        let x = 0;

        // פירוק: סיבוב לזווית מאחור ומהצד
        const turn = easeInOut(ramp(t, T_EXPLODE, T_EXPLODE + 0.9));
        const fr = floatRot(T_EXPLODE);
        if (t >= T_EXPLODE) {
          rot = { x: lerp(fr.x, EXPLODE_ROT.x, turn), y: lerp(fr.y, EXPLODE_ROT.y, turn) };
          k = lerp(K, K_EXPLODED, turn);
          x = lerp(0, EXPLODE_X, turn);
        }
        // הרכבה: חוזר אליי שלם
        if (t >= T_TURN_BACK) {
          const back = easeInOut(ramp(t, T_TURN_BACK, T_TURN_BACK + 0.8));
          rot = { x: lerp(EXPLODE_ROT.x, FRONT_ROT.x, back), y: lerp(EXPLODE_ROT.y, FRONT_ROT.y, back) };
          k = lerp(K_EXPLODED, K, back);
          x = lerp(EXPLODE_X, 0, back);
        }
        // יציאה מהמסך (למעלה) — לפני שהעיגול נפתח
        if (t >= T_EXIT) {
          const ex = easeIn(ramp(t, T_EXIT, T_EXIT + 0.45));
          y = lerp(y, HOME_Y + 1400, ex);
        }

        const offsets = PARTS.map((_, i) => {
          const center = (PARTS.length - 1) / 2;
          const target = (i - center) * -GAP; // החלק הקדמי זז קדימה, האחורי אחורה
          const out = spring(t - T_EXPLODE - 0.15 - i * 0.05, 1.05, 0.58);
          // חוזרים בסדר הפוך — האחרון שיצא חוזר ראשון
          const back = t >= T_PARTS_BACK ? spring(t - T_PARTS_BACK - (PARTS.length - 1 - i) * PART_STAGGER, 2.2, 0.9) : 0;
          return target * out * (1 - back);
        });
        // נקישה: הבהוב קצר בקווים כשכל חלק נוחת
        const land = PARTS.map((_, i) => {
          const tl = T_PARTS_BACK + (PARTS.length - 1 - i) * PART_STAGGER + 0.28;
          return Math.max(0, 1 - Math.abs(t - tl) / 0.08);
        });
        return { x, y, rot, k, offsets, land, visible: t >= T_IN - 0.05 && t < T_EXIT + 0.5 };
      }

      const tmp = new THREE.Vector3();
      function project(obj, local) {
        tmp.copy(local);
        obj.localToWorld(tmp);
        return { x: W / 2 + tmp.x, y: H / 2 - tmp.y };
      }

      function labelProgress(t, i) {
        const s = T_LABEL0 + i * LABEL_GAP;
        const gather = ramp(t, T_ASM + (LABELS.length - 1 - i) * 0.03, T_ASM + 0.3 + (LABELS.length - 1 - i) * 0.03);
        return {
          dot: easeOut(ramp(t, s, s + 0.18)) * (1 - easeIn(gather)),
          line: easeOut(ramp(t, s + 0.08, s + 0.42)) * (1 - easeOut(gather)),
          name: easeOut(ramp(t, s + 0.32, s + 0.58)),
          desc: easeOut(ramp(t, s + 0.48, s + 0.74)),
          gather,
          active: ramp(t, s, s + 0.2) * (1 - ramp(t, s + LABEL_GAP, s + LABEL_GAP + 0.4)),
        };
      }

      /* ───────────── רינדור פריים אחד — רק מהזמן ───────────── */
      const wrap = document.getElementById("cam-wrap");
      const ring = document.getElementById("ring");
      const ringShadow = document.getElementById("ring-shadow");
      const blobA = document.getElementById("blob-a");
      const blobB = document.getElementById("blob-b");
      // רוחב כל תווית נמדד פעם אחת בבנייה (אחרי טעינת הפונט), לא בזמן seek
      let widths = LABELS.map(() => 560);

      function renderAt(t) {

        // רקע זז לאט
        blobA.style.transform = `translate(${-260 + 140 * Math.sin(t * 0.11)}px, ${-120 + 160 * Math.cos(t * 0.08)}px)`;
        blobB.style.transform = `translate(${80 + 120 * Math.cos(t * 0.09)}px, ${700 + 140 * Math.sin(t * 0.07)}px)`;

        // עיגול
        const c = circleState(t);
        const { ins, radius, s, tx, ty } = c;
        wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
        wrap.style.clipPath = `inset(${ins.t}px ${ins.r}px ${ins.b}px ${ins.l}px round ${radius}px)`;
        const rx = tx + s * ins.l;
        const ry = ty + s * ins.t;
        const rw = s * (W - ins.l - ins.r);
        const rh = s * (H - ins.t - ins.b);
        ring.style.left = `${rx - 1.5}px`;
        ring.style.top = `${ry - 1.5}px`;
        ring.style.width = `${rw + 3}px`;
        ring.style.height = `${rh + 3}px`;
        ring.style.borderRadius = `${s * radius + 1.5}px`;
        ring.style.opacity = c.ringO;
        ringShadow.style.left = `${rx - rw * 0.05}px`;
        ringShadow.style.top = `${ry + rh * 0.62}px`;
        ringShadow.style.width = `${rw * 1.1}px`;
        ringShadow.style.height = `${rh * 0.5}px`;
        ringShadow.style.opacity = c.ringO * 0.9;

        // מוצר
        const st = productState(t);
        product.visible = st.visible;
        product.position.set(st.x, st.y, 0);
        product.rotation.set(st.rot.x, st.rot.y, 0, "YXZ");
        product.scale.setScalar(st.k);
        PARTS.forEach((p, i) => {
          p.position.z = st.offsets[i];
        });
        // הדגשת החלק שהתווית שלו נכנסת עכשיו + הבהוב הנחיתה
        PARTS.forEach((p, i) => {
          let hi = st.land[i];
          LABELS.forEach((L, j) => {
            if (L.part === i) hi = Math.max(hi, labelProgress(t, j).active);
          });
          p.userData.mat.color.copy(LINE).lerp(LINE_HI, hi);
        });
        product.updateMatrixWorld(true);
        renderer.render(scene, camera);

        // תוויות — שכבה שטוחה מעל התלת ממד, ממוקמות לפי נקודת החלק.
        // עמודה מימין לערימה; כל תווית בגובה החלק שלה, קו אופקי באורך שונה.
        LABELS.forEach((L, i) => {
          const lp = labelProgress(t, i);
          const show = st.visible && t >= T_LABEL0 + i * LABEL_GAP && lp.gather < 1;
          L.box.style.display = show ? "block" : "none";
          L.dot.style.display = show ? "block" : "none";
          L.line.style.display = show ? "inline" : "none";
          if (!show) return;
          const a = project(PARTS[L.part], PARTS[L.part].userData.anchor);
          const w = widths[i];
          const bx = W - 24 - w - (i % 2) * 0; // מיושר לימין; אורך הקו נגזר מרוחב התווית
          const by = Math.min(Math.max(a.y - LABEL_H / 2, 20), 1200 - LABEL_H);
          const attachX = bx;
          const attachY = by + LABEL_H / 2;
          const ex = lerp(a.x, attachX, lp.line);
          const ey = lerp(a.y, attachY, lp.line);
          L.line.setAttribute("x1", a.x);
          L.line.setAttribute("y1", a.y);
          L.line.setAttribute("x2", ex);
          L.line.setAttribute("y2", ey);
          L.line.style.opacity = lp.line > 0 ? 0.95 : 0;
          L.dot.style.transform = `translate(${a.x}px, ${a.y}px) scale(${lp.dot})`;
          // כניסה: שם ואז שורת הסבר. איסוף: התווית מתכווצת אל הנקודה
          const g = easeIn(lp.gather);
          const gx = lerp(bx, a.x - w / 2, g);
          const gy = lerp(by, a.y - LABEL_H / 2, g);
          L.box.style.transform = `translate(${gx + (1 - lp.name) * 24}px, ${gy}px) scale(${1 - 0.85 * g})`;
          L.box.style.opacity = lp.name * (1 - g);
          L.box.children[1].style.opacity = lp.desc;
        });
      }

      // תזמון: טיימליין GSAP מושהה אחד (+ אירוע hf-seek של מתאם three)
      const tl = gsap.timeline({ paused: true, onUpdate: () => renderAt(tl.time()) });
      tl.to({ v: 0 }, { v: 1, duration: DUR, ease: "none" }, 0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      document.fonts.ready.then(() => {
        widths = LABELS.map((L) => {
          L.box.style.display = "block";
          LABEL_H = Math.max(LABEL_H, L.box.offsetHeight);
          return L.box.offsetWidth;
        });
        renderAt(0);
        window.__timelines["instr-camera"] = tl;
      });
    </script>
  </body>
</html>
