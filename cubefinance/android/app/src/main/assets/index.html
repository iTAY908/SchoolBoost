        choice("owned", "דירה קנויה / בבעלות", "בלי שכר דירה — רק חשבונות שוטפים", d.ownership === "owned");
      else if (step === "expenses") {
        inner += '<h2 class="authtitle">הערכת הוצאות חודשיות</h2><p class="authsub">לא בטוחים? לחצו "לא יודע / דלג" — ה-AI ישבץ הערכה סטנדרטית.</p>';
        expFields().forEach((k) => {
          const est = d.expEst[k];
          inner += '<label class="flbl">' + EXP_LABELS[k] + (est ? ' <i class="est">(הערכת AI ✨)</i>' : "") + '</label>' +
            '<div class="exprow"><div class="fld" style="flex:1"><span class="cur">₪</span>' +
            '<input data-exp="' + k + '" inputmode="numeric" placeholder="' + EXP_DEFAULTS[k] + '" value="' + (d.exp[k] !== undefined ? d.exp[k] : "") + '"></div>' +
            '<button class="skipbtn" data-skip="' + k + '">לא יודע / דלג</button></div>';
        });
        const tot = expFields().reduce((s, k) => s + (Number(d.exp[k]) || 0), 0);
        inner += '<div class="obsum">סה״כ הוצאות משוערות: <b>₪' + fmt(tot) + '</b></div>';
      }
      else if (step === "work") inner += '<h2 class="authtitle">האם את/ה עובד/ת?</h2><p class="authsub">נבנה את התקציב סביב ההכנסה.</p>' +
        choice("1", "כן, אני עובד/ת", "", d.works === true) + choice("0", "לא כרגע", "נדלג על שאלת ההכנסה", d.works === false);
      else if (step === "income") inner += '<h2 class="authtitle">מהי ההכנסה החודשית המשוערת?</h2><p class="authsub">ההכנסה החודשית נטו שלך.</p>' + money("f", "הכנסה חודשית", "10000", d.income);

      inner += '<button class="distbtn wide" id="obNext" style="margin-top:18px">' + (isLast ? "סיום השאלון 🧊" : "המשך") + '</button>';
      if (idx > 0) inner += '<button class="obback" id="obBack">חזרה</button>';
      inner += '<button class="obexit" id="obExit">↩ יציאה מהחשבון</button>';
      wrap.innerHTML = '<div class="authcard">' + inner + '</div>';
      v.appendChild(wrap);
      v.querySelector("#obExit").onclick = () => { logout(); };

      const bindNum = (id, key) => { const inp = v.querySelector("#" + id); if (inp) inp.oninput = () => { inp.value = digits(inp.value); d[key] = inp.value; syncNext(); }; };
      if (step === "age") bindNum("f", "age");
      else if (step === "balance") bindNum("f", "balance");
      else if (step === "prepaidAmount") bindNum("f", "prepaidAmount");
      else if (step === "income") bindNum("f", "income");
      else if (step === "kidAllowance") bindNum("f", "kidAmount");
      else if (step === "kidGoal") {
        const nm = v.querySelector("#kgName"), am = v.querySelector("#kgAmt");
        if (nm) nm.oninput = () => { d.kidGoalName = nm.value; d.kidGoalSkip = false; syncNext(); };
        if (am) am.oninput = () => { am.value = digits(am.value); d.kidGoalPrice = am.value; d.kidGoalSkip = false; syncNext(); };
        const sk = v.querySelector("#kgSkip");
        if (sk) sk.onclick = () => { d.kidGoalSkip = true; d.kidGoalName = ""; d.kidGoalPrice = ""; renderOnboarding(); };
      }
      else if (step === "expenses") {
        v.querySelectorAll("input[data-exp]").forEach((inp) => {
          inp.oninput = () => {
            inp.value = digits(inp.value);
            d.exp[inp.dataset.exp] = inp.value;
            d.expEst[inp.dataset.exp] = false; // manual edit overrides the estimate
            syncNext(); updateSum();
          };
        });
        // "לא יודע / דלג" -> assign the industry-standard default for an 18yo
        v.querySelectorAll(".skipbtn").forEach((b) => {
          b.onclick = () => {
            const k = b.dataset.skip;
            d.exp[k] = String(EXP_DEFAULTS[k]);
            d.expEst[k] = true;
            renderOnboarding();
          };
        });
      }
      const autof = v.querySelector(".authcard input"); if (autof && step !== "expenses") setTimeout(() => autof.focus(), 40);

      v.querySelectorAll(".ob-opt").forEach((b) => {
        b.onclick = () => {
          const raw = b.dataset.v;
          if (step === "account") {
            d.account = raw;
            if (raw !== "bank" && raw !== "both") d.balance = "";
            if (raw !== "prepaid" && raw !== "both") d.prepaidAmount = "";
          }
          else if (step === "work") { d.works = raw === "1"; if (raw !== "1") d.income = ""; }
          else if (step === "living") { d.living = raw; if (raw === "parents") { d.ownership = null; d.exp = {}; d.expEst = {}; } }
          else if (step === "property") { if (d.ownership !== raw) { d.exp = {}; d.expEst = {}; } d.ownership = raw; }
          else if (step === "kidAllowance") { d.kidFreq = raw; if (raw === "none") d.kidAmount = ""; }
          renderOnboarding();
        };
      });

      function syncNext() { const nb = v.querySelector("#obNext"); if (nb) nb.disabled = !canNext(); }
      function updateSum() { const b2 = v.querySelector(".obsum b"); if (b2) b2.textContent = "₪" + fmt(expFields().reduce((s, k) => s + (Number(d.exp[k]) || 0), 0)); }
      syncNext();

      v.querySelector("#obNext").onclick = () => {
        if (!canNext()) return;
        if (isLast) {
          ob.building = true;
          renderOnboarding();
          setTimeout(finishOnboarding, 1500); // the 1.5s AI build moment
        } else { ob.i = idx + 1; renderOnboarding(); }
      };
      const back = v.querySelector("#obBack");
      if (back) back.onclick = () => { ob.i = Math.max(0, idx - 1); renderOnboarding(); };
    }

    function finishOnboarding() {
      const d = ob.d;
      const num = (x) => Number(x) || 0;
      const age = num(d.age);
      // ---- Kids track: allowance + one goal, nothing about rent or investments
      if (age > 0 && age < KID_AGE_MAX) {
        const perMonth = d.kidFreq === "week" ? 52 / 12 : 1;
        const monthly = d.kidFreq === "none" ? 0 : Math.round(num(d.kidAmount) * perMonth);
        const kidProfile = {
          age: age, kid: true, kidFreq: d.kidFreq, kidAmount: num(d.kidAmount), kidMonthly: monthly,
          goal: d.kidGoalSkip ? null : { name: (d.kidGoalName || "").trim(), price: num(d.kidGoalPrice) },
          works: false, income: monthly, hasBank: false, balance: 0,
          withParents: true, ownership: null, exp: {}, expEstimated: [],
        };
        state.profile = kidProfile;
        state.cubes = generateKidCubes(kidProfile);
        state.pool = monthly; // start with one month's pocket money ready to split
        state.salary.lastApplied = monthKey(); // this month's money is already in the pool
        state.onboarded = true;
        incomeScheduleSoon(); // the server starts recording the fixed income from next month
        state.screen = "app";
        clearOb();
        render();
        saveState();
        showToast("🧊 הקוביות שלך מוכנות!");
        return;
      }
      const prepaid = d.account === "prepaid" || d.account === "both";
      const profile = {
        age: age, kid: false,
        accountType: d.account || "none",
        prepaid: prepaid,
        prepaidBalance: prepaid ? num(d.prepaidAmount) : 0,
        hasBank: d.account === "bank" || d.account === "both",
        balance: num(d.balance) + (prepaid ? num(d.prepaidAmount) : 0),
        works: !!d.works, income: num(d.income),
        withParents: d.living === "parents",
        ownership: d.living === "alone" ? d.ownership : null,
        exp: {
          rent: num(d.exp.rent), arnona: num(d.exp.arnona), committee: num(d.exp.committee),
          electricity: num(d.exp.electricity), water: num(d.exp.water), food: num(d.exp.food),
        },
        expEstimated: Object.keys(d.expEst).filter((k) => d.expEst[k]),
      };
      state.profile = profile;
      state.cubes = generateCubes(profile);
      state.pool = profile.balance || (profile.works ? profile.income : 0);
      state.salary.lastApplied = monthKey(); // this month's income is already in the pool
      state.onboarded = true;
      incomeScheduleSoon(); // the server starts recording the fixed income from next month
      state.screen = "app";
      clearOb(); // questionnaire done — drop the saved draft

      // A prepaid card holds one concrete sum, so there is nothing to wait for:
      // the AI breaks that exact amount into the buckets straight away and the
      // user lands on a finished plan rather than an untouched pile of money.
      let split = null;
      if (profile.prepaid && state.pool > 0) {
        split = splitByPercent(state.pool);
        split.rows.forEach((r) => { const c = state.cubes.find((x) => x.key === r.key); if (c) c.balance += r.amount; });
        state.pool = split.leftover;
        state.game.flags.dist = true;
        state.justFunded = new Set(split.rows.filter((r) => r.amount > 0).map((r) => r.key));
      }
      render();
      saveState();
      if (split) {
        burstCoins("💳");
        animateCounts();
        showToast("💳 ה-AI פירק את ₪" + fmt(split.given) + " שבכרטיס ל-" + split.rows.filter((r) => r.amount > 0).length + " קוביות");
        setTimeout(() => { state.justFunded = new Set(); }, 800);
      } else {
        showToast("🧊 הקוביות שלך מוכנות!");
      }
    }

    // =====================================================================
    // PREPAID CARD panel + top-up sheet.
    // Everything here exists to make one thing unmissable: the loaded amount
    // is the ceiling. There is no overdraft to fall into.
    // =====================================================================
    function prepaidCard() {
      const loaded = loadedTotal();
      const emg = state.cubes.find(isEmergency);
      const untouchable = emg ? Math.round(emg.balance) : 0;
      const spendable = Math.max(0, loaded - untouchable);
      const burn = essentialMonthlySpend();
      const card = el("div", "ppcard");
      card.innerHTML =
        '<div class="pptop"><span class="ppchip">💳 כרטיס נטען</span>' +
          '<span class="ppno">•••• ' + String(1000 + ((loaded * 7) % 9000)).slice(-4) + '</span></div>' +
        '<div class="pplbl">טעון בכרטיס</div>' +
        '<div class="ppval">₪' + fmt(loaded) + '</div>' +
        '<div class="ppsplit">' +
          '<div><span>זמין להוצאה</span><b>₪' + fmt(spendable) + '</b></div>' +
          '<div><span>שמור לחירום 🛟</span><b>₪' + fmt(untouchable) + '</b></div>' +
        '</div>' +
        '<div class="ppnote">🚫 אי אפשר להיכנס למינוס — אפשר להוציא רק את מה שטעון' +
          (burn > 0 && spendable > 0 ? ' · הסכום הזה מחזיק אותך כ-' + (Math.round((spendable / burn) * 10) / 10) + ' חודשים' : '') + '</div>' +
        '<button class="ppbtn" id="ppTop">＋ טענתי כסף לכרטיס</button>';
      card.querySelector("#ppTop").onclick = openTopUp;
      return card;
    }

    let topUp = null; // { amount, auto }
    function openTopUp() { clearToasts(); dep = null; topUp = { amount: "", auto: true }; renderTopUp(); }
    function closeTopUp() { notifyNativeBusy(false); topUp = null; const w = $("depwrap"); w.classList.remove("on"); w.innerHTML = ""; }
    function renderTopUp() {
      if (!topUp) return;
      notifyNativeBusy(true);
      const amt = Math.round(Number(topUp.amount) || 0);
      const w = $("depwrap"); w.className = "ccwrap on";
      w.onclick = (e) => { if (e.target === w) closeTopUp(); };
      const preview = amt > 0 && topUp.auto ? splitByPercent(amt) : null;
      w.innerHTML = '<div class="ccsheet">' +
        '<div class="handle"></div>' +
        '<h2 class="authtitle" style="font-size:22px">💳 טעינת הכרטיס</h2>' +
        '<p class="authsub">כמה כסף טענת עכשיו לכרטיס? הסכום הזה מצטרף למה שכבר יש (₪' + fmt(loadedTotal()) + ').</p>' +
        '<div class="fld"><span class="cur">₪</span><input id="tuAmt" inputmode="numeric" placeholder="200" value="' + esc(topUp.amount) + '"></div>' +
        '<div class="depchips">' + [50, 100, 200, 500].map((n) =>
          '<button class="fchip depq' + (amt === n ? " on" : "") + '" data-n="' + n + '">' + n + ' ₪</button>').join("") + '</div>' +
        '<div class="swrow" style="margin-top:16px"><div><div class="setmail">חלוקה אוטומטית לקוביות 🤖</div>' +
          '<div class="setlbl" style="margin-top:4px">ה-AI יפרק את הטעינה לפי האחוזים שהגדרת</div></div>' +
          '<button class="sw' + (topUp.auto ? " on" : "") + '" id="tuAuto" aria-label="חלוקה אוטומטית"></button></div>' +
        (preview
          ? '<div class="setcard" style="margin-top:12px">' + preview.rows.filter((r) => r.amount > 0).map((r) =>
              '<div class="pctprev"><span>' + r.emoji + ' ' + esc(r.name) + '</span><b style="color:' + r.color + '">₪' + fmt(r.amount) + '</b></div>').join("") +
              (preview.leftover > 0 ? '<div class="pctprev leftover"><span>🪙 יישאר ביתרה הפנויה</span><b>₪' + fmt(preview.leftover) + '</b></div>' : "") +
            '</div>'
          : "") +
        '<button class="distbtn wide" id="tuGo" style="margin-top:16px"' + (amt > 0 ? "" : " disabled") + '>' +
          (amt > 0 ? "טען ₪" + fmt(amt) : "טעינה") + '</button>' +
        '<button class="obback" id="tuCancel">ביטול</button>' +
      '</div>';
      const inp = w.querySelector("#tuAmt");
      inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, ""); topUp.amount = inp.value; renderTopUp(); };
      w.querySelectorAll(".depq").forEach((b) => { b.onclick = () => { topUp.amount = b.dataset.n; renderTopUp(); }; });
      w.querySelector("#tuAuto").onclick = () => { topUp.auto = !topUp.auto; renderTopUp(); };
      w.querySelector("#tuCancel").onclick = closeTopUp;
      w.querySelector("#tuGo").onclick = () => {
        const value = Math.round(Number(topUp.amount) || 0);
        const auto = topUp.auto;
        if (value <= 0) return;
        closeTopUp();
        const res = topUpCard(value, auto);
        if (!res) return;
        if (res.split) state.justFunded = new Set(res.split.rows.filter((r) => r.amount > 0).map((r) => r.key));
        burstCoins("💳");
        render();
        animateCounts();
        showToast(res.split
          ? "💳 נטענו ₪" + fmt(value) + " וחולקו אוטומטית לקוביות"
          : "💳 נטענו ₪" + fmt(value) + " — מחכים ביתרה הפנויה לחלוקה");
        setTimeout(() => { state.justFunded = new Set(); }, 800);
      };
      setTimeout(() => { const f = w.querySelector("#tuAmt"); if (f && !topUp.amount) f.focus(); }, 40);
    }


    // ---- module icons -----------------------------------------------------
    // Drawn rather than typed: emoji at icon size render differently on every
    // platform and never share a stroke weight, so a grid of them reads as
    // stickers instead of navigation. One 24px grid, one 1.7 weight, round caps.
    const NAV_ICON = {
      income:     '<rect x="2.6" y="6" width="18.8" height="12" rx="2.4"/><circle cx="12" cy="12" r="2.7"/><path d="M6.2 9.6v4.8M17.8 9.6v4.8"/>',

      debt:       '<rect x="3" y="5.5" width="18" height="13" rx="2.6"/><path d="M3 10h18"/><path d="M7 14.8h3"/>',
    };
    const navIcon = (key) => '<svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (NAV_ICON[key] || "") + '</svg>';

    // ---- Dashboard --------------------------------------------------------
    function renderDashboard() {
      const v = $("view");
      v.innerHTML = "";

      const brand = el("div", "brand brandrow");
      brand.innerHTML = '<span>🧊 CubeFinance <small>· קיובפייננס</small></span>' +
        '<button class="settbtn" id="settbtn">⚙️ הגדרות</button>';
      v.appendChild(brand);
      brand.querySelector("#settbtn").onclick = openSettings;

      const kid = isKidMode();
      const hero = el("div", "hero");
      hero.innerHTML =
        '<div class="hl">' + (kid ? "כל הכסף שלי" : "סה״כ בקוביות") + '</div>' +
        '<div class="hv">₪' + fmt(totalBalance()) + '</div>';
      const pb = el("div", "poolbox");
      pb.innerHTML =
        '<div class="field"><span>₪</span>' +
        '<input id="poolInput" inputmode="numeric" value="' + state.pool + '" aria-label="סכום לחלוקה"></div>';
      const btn = el("button", "distbtn");
      btn.textContent = kid ? "חלק את הכסף" : "חלק לתקציב";
      btn.disabled = state.pool <= 0;
      btn.onclick = distribute;
      pb.appendChild(btn);
      hero.appendChild(pb);
      v.appendChild(hero);

      const pInput = hero.querySelector("#poolInput");
      const splitLabel = () => state.pool > 0 ? "חלק ₪" + fmt(state.pool) : (kid ? "חלק את הכסף" : "חלק לתקציב");
      pInput.oninput = () => {
        pInput.value = pInput.value.replace(/[^0-9]/g, "");
        state.pool = Number(pInput.value) || 0;
        btn.disabled = state.pool <= 0;
        btn.textContent = splitLabel();
      };
      btn.textContent = splitLabel();

      // Prepaid card panel — the card IS the money, so it sits right under the
      // total and says out loud what is loaded and what that buys.
      if (isPrepaid()) v.appendChild(prepaidCard());

      // living-situation notice (based on the answered profile)
      const prof = state.profile || {};
      const note = el("div", "parents");
      note.innerHTML = kid
        ? '<span class="pi">🌟</span><span class="pt">כל פעם שאתה מקבל כסף — לחץ על ה-<b>＋</b> בקובייה שאליה הוא הולך. ככה תמיד תדע כמה יש לך לכל דבר.</span>'
        : (prof.withParents !== false
          ? '<span class="pi">💡</span><span class="pt">מגורים עם ההורים <b>משחררים את כסף השכירות</b> — הפנינו אותו לקוביות בוני-העושר: <b>חיסכון, השקעות ובילויים</b> קיבלו נתח גדול יותר.</span>'
          : (prof.ownership === "rent"
            ? '<span class="pi">🔑</span><span class="pt">נוצרה קוביית <b>בעל הדירה (שכירות)</b> נעולה על שכר הדירה שלך, לצד קוביית <b>חשבונות הבית</b> — כדי ששכירות לעולם לא תתפספס.</span>'
            : '<span class="pi">🏠</span><span class="pt">דירה בבעלות — <b>אין קוביית שכירות</b>. נוצרו רק קוביות <b>חשבונות הבית ואוכל</b>, והיתר הופנה לחיסכון ולהשקעות.</span>'));
      v.appendChild(note);

      // Findable by friends: accounts from before shared savings live only on
      // this phone. One email check gives them a server profile people can find.
      if (SERVER_FEATURES && state.authUser && !sbLoad() && !shGet("findme_dismissed", false)) {
        const fm = el("div", "setcard findme");
        fm.innerHTML = '<span style="font-size:24px">🔎</span><div style="flex:1"><div class="setmail" style="font-size:14px">שחברים יוכלו למצוא אותך</div>' +
          '<div class="setlbl">אימות מייל חד-פעמי, ואז אפשר להזמין אותך לחיסכון משותף לפי שם. המייל עצמו לא מוצג לאף אחד.</div></div>';
        const go = el("button", "fchip on"); go.textContent = "אימות";
        go.onclick = () => { state.screen = "shared"; render(); };
        const no = el("button", "fchip"); no.textContent = "לא עכשיו";
        no.onclick = () => { shPut("findme_dismissed", true); render(); };
        fm.appendChild(go); fm.appendChild(no);
        v.appendChild(fm);
      }

      // engagement modules nav — kids only see the age-appropriate modules
      const nav = el("div", "modnav");
      // [route, label, tint] — the tint gives each destination its own identity
      // so the grid is scannable by colour before it is read.
      const modules = kid
        ? [["income", "כסף חודשי", "#10c088"], ["expenses", "הוצאות", "#f5b544"], ["whatif", "סימולטור", "#8f9aff"],
           ["books", "ספרים", "#e8845e"], ["calm", "רוגע", "#37d0a6"], ["guide", "מדריך", "#6472ff"],
           ["challenges", "אתגרים", "#f2b134"], ["shared", "חיסכון משותף", "#3b82f6"]]
        : [["income", "הכנסה", "#10c088"], ["expenses", "הוצאות", "#f5b544"], ["whatif", "סימולטור", "#8f9aff"],
           ["books", "ספרים", "#e8845e"], ["calm", "רוגע", "#37d0a6"], ["guide", "מדריך", "#6472ff"],
           ["challenges", "אתגרים", "#f2b134"], ["shared", "חיסכון משותף", "#3b82f6"], ["debt", "חובות", "#f0555a"]];
      if (!SERVER_FEATURES) { const at = modules.findIndex((m) => m[0] === "shared"); if (at >= 0) modules.splice(at, 1); }
      modules.forEach((m) => {
        const route = m[0], label = m[1], tint = m[2];
        const b = el("button", "modbtn");
        const isPrem = route === "debt" && !state.premium;
        b.style.setProperty("--tint", tint);
        b.innerHTML = '<span class="mi">' + navIcon(route) +
          (isPrem ? '<span class="lockb">🔒</span>' : "") +
          // unread shared-savings events, from the server inbox
          (route === "shared" ? '<span class="shbadge" data-shbadge' + (shState.unread ? '>' + shState.unread : ' hidden>') + '</span>' : "") +
          '</span><span class="ml">' + label + '</span>';
        b.onclick = () => { if (route === "calm") { openCalm(); return; } state.screen = route; render(); };
        nav.appendChild(b);

      v.appendChild(nav);

    // ---- Custom cube modal ------------------------------------------------
    let cc = null;
    const PRIO_BANDS = ["", "נחמד שיהיה", "נחמד שיהיה", "לא בוער", "לא בוער", "רוצה את זה", "רוצה את זה", "חשוב לי", "חשוב מאוד 🔥", "דחוף 🔥", "קריטי 🔥"];
    function openCustomCube() { clearToasts(); cc = { mode: null, name: "", amount: "", priority: 5, goalPrice: "", goalMonths: "", computed: false, explanation: "", blocked: "" }; renderCustomCube(); }

        '<label class="flbl">שם הקובייה</label>' +

        '<button class="ob-opt' + (cc.mode === "ai" ? " on" : "") + '" data-m="ai"><span class="obrad"><i></i></span><span class="obtxt"><b>תן ל-AI להחליט 🤖</b><span>לפי חשיבות הקובייה עבורך</span></span></button>';

          '<div class="prioband' + (aggressive ? " hot" : "") + '" id="ccBand">' + PRIO_BANDS[cc.priority] +
            (aggressive ? ' · מעל 7 — מצב חיסכון אגרסיבי' : ' · הקצאה מתונה') + '</div>' +

          '<button class="distbtn wide" id="ccCalc" style="margin-top:10px">חשב עם AI 🤖</button>' +
          (cc.blocked ? '<div class="gwarn" style="margin-top:12px">' + esc(cc.blocked) + '</div>' +
            '<button class="fchip wide on" id="ccIncome" style="margin-top:8px">💸 למסך ההכנסה החודשית</button>' : "") +
          '<div class="aiRes" id="ccRes" style="display:' + (cc.computed ? "block" : "none") + '">' +
            (cc.computed ? '<div class="aiAmt">₪' + fmt(cc.amount) + ' <span>לחודש</span></div><div class="aiExp">' + esc(cc.explanation) + '</div>' : "") + '</div>';

      inner += '<button class="distbtn wide" id="ccCreate" style="margin-top:16px"' + (canCreate ? "" : " disabled") + '>צור קובייה</button>' +

      w.innerHTML = '<div class="ccsheet">' + inner + '</div>';

      const nameInp = w.querySelector("#ccName");
