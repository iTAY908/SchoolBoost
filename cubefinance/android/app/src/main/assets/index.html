      } else {
        cubes.push(mk("kidsave", "חיסכון גדול", "🐷", "var(--c-savings)", "הכסף שגדל לדברים גדולים", 40));
        cubes.push(mk("kidfun", "כיף וממתקים", "🍬", "var(--c-lifestyle)", "מה שבא לי עכשיו", 30));
        cubes.push(emg(15));
        cubes.push(mk("kidgive", "מתנות ועזרה", "🎁", "var(--c-essentials)", "מתנות לחברים ולעזור לאחרים", 15));
      }
      return cubes;
    }
    // Resolve a category to an existing cube (the bank manager uses "housing" as the
    // generic fixed-costs category; new profiles have bills/landlord instead).
    function cubeFor(key) {
      if (state.cubes.find((c) => c.key === key)) return key;
      if (key === "housing") {
        if (state.cubes.find((c) => c.key === "bills")) return "bills";
        if (state.cubes.find((c) => c.key === "landlord")) return "landlord";
      }
      return "essentials";
    }

    // =====================================================================
    // BUDGETING CORE
    //   • one fixed monthly income, split into the cubes by their percentages
    //   • a mandatory "קרן חירום" cube that every account has, old or new
    //   • an expense journal where money that left is reported and reflected on
    // =====================================================================
    const EMERGENCY_KEY = "emergency";
    const isEmergency = (c) => c && c.key === EMERGENCY_KEY;

    // ---- prepaid card ("כרטיס נטען") --------------------------------------
    // A prepaid card is not a bank account: there is no credit line and no
    // overdraft, so spending is bound to the amount that was loaded onto it.
    // In this app that means one hard rule — the money in the cubes plus the
    // free balance IS the card, and nothing may be spent beyond it.
    const isPrepaid = () => !!(state.profile && state.profile.prepaid);
    const loadedTotal = () => Math.round(totalBalance() + state.pool);
    // Top up the card: new money the user physically loaded onto it.
    function topUpCard(amount, autoSplit) {
      const v = Math.max(0, Math.round(Number(amount) || 0));
      if (v <= 0) return null;
      if (state.profile) state.profile.prepaidBalance = loadedTotal() + v;
      if (!autoSplit) { state.pool += v; saveState(); return { loaded: v, split: null }; }
      const plan = splitByPercent(v);
      plan.rows.forEach((r) => { const c = state.cubes.find((x) => x.key === r.key); if (c) c.balance += r.amount; });
      state.pool += plan.leftover;
      state.game.flags.dist = true;
      saveState();
      return { loaded: v, split: plan };
    }

    // The single monthly figure the whole budget is built on: salary for adults,
    // pocket money for kids. Everything else is a percentage of this.
    function monthlyIncome() {
      const p = state.profile;
      if (!p) return 0;
      if (p.kid) return Math.max(0, Math.round(Number(p.kidMonthly) || 0));
      return p.works ? Math.max(0, Math.round(Number(p.income) || 0)) : 0;
    }
    function setMonthlyIncome(amount) {
      const v = Math.max(0, Math.round(Number(amount) || 0));
      if (!state.profile) return;
      if (state.profile.kid) { state.profile.kidMonthly = v; state.profile.income = v; }
      else { state.profile.income = v; state.profile.works = v > 0; }
      retargetCubes(); // percentages are the source of truth — money follows them
      saveState();
    }
    // Recompute every flexible cube's monthly target from its percentage.
    // Locked cubes (rent, bills) keep their real-world amount untouched.
    function retargetCubes() {
      const income = monthlyIncome();
      if (income <= 0) return;
      state.cubes.forEach((c) => {
        if (c.locked) return;
        c.amount = Math.round(income * ((Number(c.pct) || 0) / 100));
      });
    }

    // ---- mandatory emergency fund -----------------------------------------
    // Three months of the money you cannot skip — rent, bills, food. With no
    // expense data yet, half the income is a reasonable stand-in.
    function essentialMonthlySpend() {
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const sum = ["landlord", "bills", "housing", "essentials"]
        .reduce((s, k) => s + (by[k] ? Number(by[k].amount) || 0 : 0), 0);
      if (sum > 0) return Math.round(sum);
      const income = monthlyIncome();
      return income > 0 ? Math.round(income * 0.5) : 0;
    }
    const emergencyTarget = () => Math.round(essentialMonthlySpend() * 3);

    // Back-fill for accounts created before the emergency fund existed. The new
    // cube is funded by trimming 15% off every FLEXIBLE cube's target (locked
    // housing costs are never touched), so the percentages still add up to the
    // same total and nobody's rent quietly shrinks.
    function ensureEmergencyCube() {
      if (!Array.isArray(state.cubes) || !state.cubes.length) return false;
      if (state.cubes.some(isEmergency)) return false;
      const share = 0.15;
      const flexible = state.cubes.filter((c) => !c.locked);
      let pct = 0, amount = 0;
      flexible.forEach((c) => {
        const cutPct = Math.round((Number(c.pct) || 0) * share * 10) / 10;
        const cutAmt = Math.round((Number(c.amount) || 0) * share);
        c.pct = Math.round(Math.max(0, (Number(c.pct) || 0) - cutPct) * 10) / 10;
        c.amount = Math.max(0, Math.round((Number(c.amount) || 0) - cutAmt));
        pct += cutPct; amount += cutAmt;
      });
      const kid = !!(state.profile && state.profile.kid);
      const cube = {
        key: EMERGENCY_KEY,
        name: kid ? "קופת חירום" : META.emergency.name,
        emoji: META.emergency.emoji, color: META.emergency.color,
        note: kid ? "לא נוגעים — למקרה שמשהו נשבר או הולך לאיבוד" : META.emergency.note,
        pct: Math.round(pct * 10) / 10, amount: Math.round(amount),
        locked: false, balance: 0, mandatory: true,
      };
      // Sits right after the fixed costs so it reads as a bill you pay yourself.
      const at = state.cubes.findIndex((c) => !c.locked);
      state.cubes.splice(at < 0 ? state.cubes.length : at, 0, cube);
      return true;
    }

    // ---- fixed monthly income → percentage buckets -------------------------
    const monthKey = (d) => { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
    const monthLabel = () => ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"][new Date().getMonth()];

    // Split `amount` across the cubes and return what each one got.
    //
    // Bills come first: a locked cube (rent, utilities) is a real obligation, so
    // it receives its exact fixed amount — NOT a percentage share, which would
    // silently overpay the landlord the moment the salary went up. Whatever is
    // left is then divided among the flexible cubes by their percentage of the
    // income. If those percentages ask for more than remains, every share is
    // scaled down proportionally rather than starving the last cube in the list.
    // Any remainder stays available, so money is never invented and never lost.
    function splitByPercent(amount) {
      amount = Math.max(0, Math.round(amount));
      let remaining = amount, given = 0;
      const rows = [];
      const row = (c, give) => rows.push({ key: c.key, name: c.name, emoji: c.emoji, color: c.color,
        pct: Number(c.pct) || 0, amount: give, fixed: !!c.locked });

      state.cubes.forEach((c) => {
        if (!c.locked) return;
        const give = Math.min(remaining, Math.max(0, Math.round(Number(c.amount) || 0)));
        remaining -= give; given += give;
        row(c, give);
      });

      const flexible = state.cubes.filter((c) => !c.locked);
      const want = flexible.map((c) => Math.max(0, Math.round(amount * ((Number(c.pct) || 0) / 100))));
      const wantTotal = want.reduce((s, n) => s + n, 0);
      const scale = wantTotal > remaining && wantTotal > 0 ? remaining / wantTotal : 1;
      flexible.forEach((c, i) => {
        let give = Math.round(want[i] * scale);
        if (give > remaining) give = remaining;
        remaining -= give; given += give;
        row(c, give);
      });
      // keep the rows in the same order the dashboard shows the cubes
      const order = state.cubes.map((c) => c.key);
      rows.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
      return { rows: rows, given: given, leftover: remaining };
    }

    // Deposit one month's income and split it. `auto` runs it at most once per
    // calendar month; the manual button can always be pressed again.
    function receiveMonthlyIncome(manual) {
      const income = monthlyIncome();
      if (income <= 0) return { ok: false, reason: "noincome" };
      const mk = monthKey();
      if (!manual && state.salary.lastApplied === mk) return { ok: false, reason: "already" };
      return depositIncome(income, mk, null);
    }
    // The one place income enters the cubes — the app's own monthly run, the
    // manual button, and a record the server made (`serverId` set) all use it.
    function depositIncome(income, mk, serverId) {
      const plan = splitByPercent(income);
      plan.rows.forEach((r) => { if (r.amount > 0) { const c = state.cubes.find((x) => x.key === r.key); if (c) c.balance += r.amount; } });
      state.pool += plan.leftover;
      if (!state.salary.lastApplied || mk >= state.salary.lastApplied) state.salary.lastApplied = mk;
      const rec = { m: mk, amount: income, given: plan.given };
      if (serverId) { rec.id = serverId; rec.auto = true; }
      state.salary.history = (state.salary.history || []).concat([rec]).slice(-24);
      state.game.flags.dist = true;
      saveState();
      // Opt-in monthly share for shared savings: a record, never a charge.
      try { sharedRecurringAfterIncome(income, mk); } catch (e) {}
      return { ok: true, income: income, given: plan.given, leftover: plan.leftover, rows: plan.rows };
    }

    // ---- expense journal ---------------------------------------------------
    // "What did you actually do with the money?" — amount, which cube it left,
    // what it was for, and one honest reflection. The reflection is the point:
    // it is what turns a list of numbers into a habit you can change.
    const SPEND_REASONS = [
      { id: "need",    label: "הייתי חייב", emoji: "🧱", tone: "ok",   note: "הוצאה הכרחית" },
      { id: "planned", label: "תכננתי מראש", emoji: "🗓️", tone: "ok",   note: "היה בתוכנית" },
      { id: "worth",   label: "התפנקתי ושווה", emoji: "😄", tone: "ok",   note: "פינוק מודע" },
      { id: "impulse", label: "נסחפתי", emoji: "🌀", tone: "warn", note: "החלטה של רגע" },
      { id: "regret",  label: "מתחרט", emoji: "😞", tone: "warn", note: "לא היה שווה" },
    ];
    const reasonById = (id) => SPEND_REASONS.find((r) => r.id === id) || SPEND_REASONS[0];

    function logExpense(entry) {
      state.expenses.unshift({
        id: "e" + Date.now(),
        at: new Date().toISOString(),
        amount: Math.max(0, Math.round(Number(entry.amount) || 0)),
        cubeKey: entry.cubeKey || null,
        cubeName: entry.cubeName || "",
        what: (entry.what || "").trim(),
        reason: entry.reason || "need",
      });
      if (state.expenses.length > 300) state.expenses.length = 300;
      state.game.flags.logged = true;
      saveState();
    }
    // Reads the journal back as something actionable rather than a receipt pile.
    function expenseInsights() {
      const list = state.expenses || [];
      if (!list.length) return null;
      const since = Date.now() - 30 * 24 * 3600 * 1000;
      const recent = list.filter((e) => Date.parse(e.at) >= since);
      const use = recent.length ? recent : list;
      const total = use.reduce((s, e) => s + e.amount, 0);
      const byReason = {};
      use.forEach((e) => { byReason[e.reason] = (byReason[e.reason] || 0) + e.amount; });
      const regretted = (byReason.impulse || 0) + (byReason.regret || 0);
      const byCube = {};
      use.forEach((e) => { const k = e.cubeName || "ללא קובייה"; byCube[k] = (byCube[k] || 0) + e.amount; });
      const topCube = Object.keys(byCube).sort((a, b) => byCube[b] - byCube[a])[0] || null;
      return {
        count: use.length, total: total, windowed: recent.length > 0,
        byReason: byReason, regretted: regretted,
        regretPct: total > 0 ? Math.round((regretted / total) * 100) : 0,
        topCube: topCube, topCubeAmount: topCube ? byCube[topCube] : 0,
        byCube: byCube,
      };
    }

    // ====================================================================
    // Mock Auth Service — simulated secure local user store (no real DB).
    // Passwords are salted + key-stretched with a mock hash (NOT crypto-secure;
    // a production app must hash server-side). Users live in localStorage.
    // ====================================================================
    const USERS_KEY = "cubefinance_web:users";
    const SESSION_KEY = "cubefinance_web:session";
    const loadUsers = () => { try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); } catch (e) { return {}; } };
    const saveUsers = (u) => { try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch (e) {} };
    function mockHash(s) {
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
      for (let r = 0; r < 800; r++) h = ((h * 33) ^ (h >>> 7)) >>> 0; // key-stretch
      return h.toString(16);
    }
    const hashPw = (pw, salt) => mockHash(salt + "::" + pw);
    const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const normEmail = (e) => (e || "").trim().toLowerCase();

    // ====================================================================
    // Security core — password policy, lockout / rate limiting.
    //
    // The "live security log" was REMOVED. It used to persist a rolling event
    // list to localStorage under "cubefinance_web:seclog" and paint it on the
    // login screen and in Settings → Privacy. Several of those events embedded
    // the account's email address, so anyone holding the device (or reading the
    // browser's storage) could recover it. There is no user-facing benefit to
    // showing security internals, so both the storage and the view are gone.
    //
    // secLog() is intentionally kept as an inert no-op: dozens of call sites
    // across the app mark security-relevant moments, and keeping the calls
    // (without keeping any data) documents those moments without a chance of a
    // future edit accidentally resurrecting the panel.
    // ====================================================================
    const SECLOG_KEY = "cubefinance_web:seclog"; // legacy key — purged, never written
    function secLog() { /* intentionally does nothing — no security events are recorded or displayed */ }
    // Purge anything an older build of the app left on this device, including
    // the email addresses those entries contained.
    function clearSecLog() { try { localStorage.removeItem(SECLOG_KEY); } catch (e) {} }
    clearSecLog();

    // Password policy: 8+ chars, uppercase, lowercase, digit, special char.
    const PW_RULES = [
      { re: /.{8,}/, label: "לפחות 8 תווים" },
      { re: /[A-Z]/, label: "אות גדולה (A–Z)" },
      { re: /[a-z]/, label: "אות קטנה (a–z)" },
      { re: /[0-9]/, label: "ספרה (0–9)" },
      { re: /[^A-Za-z0-9]/, label: "תו מיוחד (!@#…)" },
    ];
    const pwScore = (pw) => PW_RULES.reduce((s, r) => s + (r.re.test(pw || "") ? 1 : 0), 0);
    const PW_LABELS = ["", "חלשה מאוד", "חלשה", "בינונית", "חזקה", "מצוינת 💪"];
    const GENERIC_ERR = "שגיאה: פרטי ההתחברות שגויים או שהחשבון ננעל זמנית";
    const LOCK_MS = 30000, MAX_FAILS = 3;

    function authSignUp(email, pw) {
      const e = normEmail(email);
      if (!validEmail(e)) return { error: "כתובת אימייל לא תקינה" };
      // enforce the strong-password policy (never accept weak credentials)
      const missing = PW_RULES.filter((r) => !r.re.test(pw || ""));
      if (missing.length) {
        secLog("WARN", "הרשמה נדחתה — הסיסמה לא עומדת במדיניות (" + missing.length + " דרישות חסרות)");
        return { error: "סיסמה חלשה מדי — חסר: " + missing.map((m) => m.label).join(", ") };
      }
      const users = loadUsers();
      if (users[e]) { secLog("WARN", "ניסיון הרשמה עם אימייל קיים נחסם"); return { error: "האימייל כבר רשום במערכת" }; }
      const salt = Math.random().toString(36).slice(2);
      const id = "acc_" + mockHash(e).slice(0, 8) + Date.now().toString(36);
      users[e] = { id, email: e, salt, hash: hashPw(pw, salt), failCount: 0, lockUntil: 0, createdAt: Date.now() };
      saveUsers(users);
      secLog("INFO", "נוצר salt אקראי ייחודי לחשבון");
      secLog("INFO", "הסיסמה עברה גיבוב מוקשה (bcrypt מדומה, 800 סבבים) — לא נשמרת כטקסט גלוי");
      secLog("INFO", "חשבון חדש נוצר: " + e);
      return { user: { id, email: e } };
    }
    // Rate limiting: 3 wrong passwords in a row lock the account for 30s.
    // Errors are deliberately generic so attackers can't probe which part failed.
    function authLogIn(email, pw) {
      const e = normEmail(email);
      const users = loadUsers();
      const u = users[e];
      const now = Date.now();
      if (u && u.lockUntil && u.lockUntil > now) {
        const left = Math.ceil((u.lockUntil - now) / 1000);
        secLog("ERROR", "ניסיון התחברות לחשבון נעול יורט (" + left + " שניות לשחרור)");
        return { error: GENERIC_ERR, lockedFor: left };
      }
      if (!u) { secLog("WARN", "ניסיון התחברות עם אימייל לא מוכר יורט"); return { error: GENERIC_ERR }; }
      if (u.hash !== hashPw(pw, u.salt)) {
        u.failCount = (u.failCount || 0) + 1;
        secLog("WARN", "ניסיון התחברות שגוי יורט (" + u.failCount + "/" + MAX_FAILS + ")");
        if (u.failCount >= MAX_FAILS) {
          u.lockUntil = now + LOCK_MS;
          u.failCount = 0;
          saveUsers(users);
          secLog("ERROR", "זוהה דפוס Brute-Force — החשבון ננעל זמנית ל-30 שניות");
          return { error: GENERIC_ERR, lockedFor: Math.ceil(LOCK_MS / 1000) };
        }
        saveUsers(users);
        return { error: GENERIC_ERR };
      }
      u.failCount = 0; u.lockUntil = 0; saveUsers(users);
      secLog("INFO", "אימות הצליח — נפתח סשן מאובטח עבור " + e);
      return { user: { id: u.id, email: u.email } };
    }
    const setSession = (e) => { try { localStorage.setItem(SESSION_KEY, normEmail(e)); } catch (x) {} };
    const clearSession = () => { try { localStorage.removeItem(SESSION_KEY); } catch (x) {} };
    const getSession = () => { try { return localStorage.getItem(SESSION_KEY); } catch (x) { return null; } };

    // Per-account app state (pool, cubes, onboarding) namespaced by user id.
    const stateKey = () => "cubefinance_web:state:" + (state.authUser ? state.authUser.id : "anon");
    function saveState() {
      if (state.screen === "auth" || !state.authUser) return;
      try {
        localStorage.setItem(stateKey(), JSON.stringify({
          onboarded: state.onboarded, pool: state.pool, profile: state.profile, cubes: state.cubes,
          incognito: !!state.incognito, premium: !!state.premium && !compl.grantedPremium, game: state.game, shared: state.shared, debts: state.debts,
          calmLog: state.calmLog, salary: state.salary, expenses: state.expenses, books: state.books,
          worksheet: state.worksheet, chat: state.chat, notif: state.notif,
        }));
      } catch (e) {}
    }
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(stateKey()) || "null"); } catch (e) {}
      state.profile = s && s.profile ? s.profile : null;
      state.onboarded = !!(s && s.onboarded);
      state.pool = s && s.pool != null ? s.pool : 0;
      state.cubes = s && Array.isArray(s.cubes) ? s.cubes : [];
      state.incognito = !!(s && s.incognito);
      state.premium = !!(s && s.premium) || isComplimentaryAccount();
      const g = (s && s.game) || {};
      state.game = { points: g.points || 0, claimed: g.claimed || {}, flags: g.flags || {} };
      state.shared = s && Array.isArray(s.shared) ? s.shared : [];
      state.debts = s && Array.isArray(s.debts) ? s.debts : [];
      state.calmLog = s && Array.isArray(s.calmLog) ? s.calmLog : [];
      const sal = (s && s.salary) || {};
      state.salary = { auto: sal.auto !== false, lastApplied: sal.lastApplied || "", history: Array.isArray(sal.history) ? sal.history : [],
        // serverManaged: the backend records this income every month (so the
        // app no longer does it on open); applied: server records already
        // reflected in this device's cubes; synced: the first sync happened.
        serverManaged: !!sal.serverManaged, applied: Array.isArray(sal.applied) ? sal.applied : [], synced: !!sal.synced };
      state.chat = normChat(s && s.chat);
      state.notif = Object.assign({}, NOTIF_DEFAULT, (s && s.notif) || {});
      state.expenses = s && Array.isArray(s.expenses) ? s.expenses : [];
      state.books = { owned: (s && s.books && s.books.owned) || {} };
      state.worksheet = wsNormalize(s && s.worksheet);
      notifyNativePremium(); // keep the Android wrapper's ad state in sync
    }

    // ─────────────────────────────────────────────────────────────────────
    //  Email verification (4-digit one-time code).
    //  API_BASE points at the CubeFinance backend (see backend/src/routes/auth.js).
    //  Leave it empty and the app runs fully offline: the code is generated
    //  locally and shown on screen, clearly marked as a local dev code. Real
    //  email delivery ALWAYS requires the server — a browser cannot send mail,
    //  and shipping mail credentials to the client would expose them.
    // ─────────────────────────────────────────────────────────────────────
    // Email codes are mailed by the Vercel functions in web/api/auth. On the
    // Vercel site they are same-origin; anywhere else (the Android app's
    // file:// page, a preview link) the page calls the live site.
    const AUTH_HOST = "https://cubefinance.vercel.app";
    const API_BASE = /^https?:$/.test(location.protocol) && /\.vercel\.app$/.test(location.hostname)
      ? location.origin : AUTH_HOST;
    const CODE_LEN = 6;                        // must match web/api/_lib.js
    // EmailJS (emailjs.com) mails the code straight from the app through the
    // owner's connected Gmail — no server of our own. These three values are
    // PUBLIC by design (EmailJS calls it a public key), so they may live here.
    // Leave publicKey empty to use the Vercel functions in web/api instead.
    // ---- Server features: OFF -------------------------------------------------
    // Shared savings, the findable-by-friends profile, codes sent by Supabase and
    // creator access decided by the server all need the Supabase email sender
    // (docs/SUPABASE_SETUP.md). While that is not set up they are switched off:
    // sign-up, login and password-reset codes go out through EmailJS only, the
    // shared-savings screens are hidden, and the creator account below is
    // recognised on this device. Set to true to bring everything back.
    const SERVER_FEATURES = false;
    const OWNER_EMAILS = ["itayleiss2010@gmail.com"];   // free Premium, free books, no ads, no code screen
    const isOwnerEmail = (e) => OWNER_EMAILS.includes(normEmail(e));
    const EMAILJS = { serviceId: "service_upg7kqp", templateId: "template_7q8srkg", publicKey: "g7STyZwRjLgIMZXrA", inviteTemplateId: "template_3utf1eb" };
    const useEmailJS = () => !!(EMAILJS.serviceId && EMAILJS.templateId && EMAILJS.publicKey);
    const blankDigits = () => Array(CODE_LEN).fill("");
    const VERIFY_TTL_MS = 10 * 60 * 1000;      // must match the server (10 min)
    const RESEND_COOLDOWN_MS = 30 * 1000;
    const MAX_CODE_ATTEMPTS = 5;
    let vf = null; // { email, digits[], token, error, expiresAt, resendAt, localCode, attempts, busy }

    // ---- Android wrapper bridge -------------------------------------------
    // When this page runs inside the CubeFinance Android app, a small native
    // bridge is injected. It lets us switch AdMob interstitials off for premium
    // users and pause them while a sheet is open. In a plain browser the object
    // simply doesn't exist and every call is skipped.
    const nativeApp = (typeof window !== "undefined" && window.CubeyNative) ? window.CubeyNative : null;
    function notifyNativePremium() {
      try { if (nativeApp && nativeApp.setPremium) nativeApp.setPremium(!!state.premium); } catch (e) {}
    }
    function notifyNativeBusy(busy) {

    function notifyNativeAccount(email) {
      try {
        if (!nativeApp || !nativeApp.setAppAccount) return;
        let any = false;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || k.indexOf("cubefinance_web:state:") !== 0) continue;
          try { if ((JSON.parse(localStorage.getItem(k)) || {}).premium) { any = true; break; } } catch (e) {}

    // ====================================================================

    // ====================================================================
    const NOTIF_DEFAULT = { chatPush: true, incomePush: true, sharedPush: true, hideSensitive: false, changedAt: 0 };
    const push = {

      onLinkResult(ok, data, err) {

      onUnlinked() { if (state.screen === "notifications") render(); },
      onOpenTarget() { pushCheckTarget(); },
      onFcmToken(token) { sharedOnFcmToken(token); },
      onForegroundPush(type, data) {
        if (type === "shared") { loadShared(true); return; }
        if (type === "chat" && state.chat && data && data.conversationId === state.chat.cid) chatPoll(0);
        if (type === "income") incomeSync().then((r) => { if (r && r.applied.length) afterIncomeApplied(r.applied); });
      },
      onPermission() { if (state.screen === "notifications") render(); },
      onServerResetSent(ok) {
        showToast(ok ? "📧 שלחנו מייל לאיפוס הסיסמה של חשבון ההתראות" : "לא הצלחנו לשלוח את המייל. נסו שוב בעוד רגע");
      },
    };

    function pushLinkAccount(email, password) {
      if (!push.available()) { push.status = "off"; return; }

    }
    function pushUnlinkAccount() {
      push.linked = false; push.uid = null; push.target = null; push.status = "off";

      try { if (push.available()) nativeApp.pushUnlink(); } catch (e) {}
    }
    // Settings go to the native mirror (read by the push service when the app
    // is closed) and to the server (which decides what to send at all).
    function pushSyncPrefs(toServer) {
      const n = Object.assign({}, NOTIF_DEFAULT, state.notif || {});
      const p = { chatPush: !!n.chatPush, incomePush: !!n.incomePush, hideSensitive: !!n.hideSensitive };
      try { if (nativeApp && nativeApp.pushSetLocalPrefs) nativeApp.pushSetLocalPrefs(JSON.stringify(Object.assign({ sharedPush: n.sharedPush !== false }, p))); } catch (e) {}
      if (toServer && push.ready()) push.call("setPrefs", p).catch(() => {});
    }
    function pushSetActiveConversation(cid) {
      try { if (push.available()) nativeApp.pushSetActiveConversation(cid || ""); } catch (e) {}
    }

    // Route a tapped notification once we know who is signed in. Not logged
    // in yet → it waits through the login form and opens right after.
    function pushCheckTarget() {
      if (!nativeApp || !nativeApp.pushConsumeTarget) return;
      if (!push.target) {
        let raw = null;
        try { raw = nativeApp.pushConsumeTarget(); } catch (e) {}
        if (raw) { try { push.target = JSON.parse(raw); } catch (e) {} }
      }
      const t = push.target;
      if (!t) return;
      if (!state.authUser) {
        if (state.screen === "auth") showToast("🔔 התחברו כדי לפתוח את ההתראה");
        return;
      }
      if (state.screen === "onboarding" || state.screen === "verify") return;
      if (t.type === "shared") {
        // Shared savings: only for the account the event was sent to (the key
        // is a SHA-256 of the email, computed natively the same way as the server).
        let mine = null;
        try { mine = nativeApp.accountKey(state.authUser.email); } catch (e) {}
        push.target = null;
        if (!mine || mine !== t.acct) { showToast("ההתראה הזו שייכת לחשבון אחר"); return; }
        closeChat(); shState.focus = t.goalId; shState.loaded = false; state.screen = "shared"; render();
        return;
      }
      if (!push.linked) return;                                       // onLinkResult calls back here
      if (t.uid && t.uid !== push.uid) { push.target = null; return; } // another account's notification
      if (state.screen === "onboarding" || state.screen === "verify") return;
      push.target = null;
      if (t.type === "chat" && t.conversationId) openChatFromPush(t.conversationId, t.messageId);
      else if (t.type === "income") openIncomeFromPush(t.entryId);
    }

    // ---- monthly income, server side ------------------------------------
    // The server keeps the schedule (amount, currency, on/off, time zone) and
    // writes one record per month. The app sends the schedule whenever any of
    // it changes, and turns each new record into a deposit into the cubes —
    // exactly once per record, via depositIncome().
    let incomeSchedTimer = null;
    function incomePushSchedule() {
      clearTimeout(incomeSchedTimer);
      if (!push.ready() || !state.authUser || !state.onboarded) return Promise.resolve(false);
      const amount = monthlyIncome();
      return push.call("incomeSetSchedule", {
        amount: amount, currency: "ILS", enabled: !!state.salary.auto && amount > 0,
        timezone: userTimeZone(), lastAppliedMonth: state.salary.lastApplied || "",
      }).then(() => {
        if (!state.salary.serverManaged) { state.salary.serverManaged = true; saveState(); }
        return true;
      }).catch(() => false);
    }
    function incomeScheduleSoon() { clearTimeout(incomeSchedTimer); incomeSchedTimer = setTimeout(incomePushSchedule, 1200); }

    let incomeSyncing = null;
    function incomeSync() {
      if (!push.ready() || !state.authUser || !state.onboarded) return Promise.resolve(null);
      if (incomeSyncing) return incomeSyncing;
      const who = state.authUser.id;
      incomeSyncing = push.call("incomeSync", {}).then((r) => {
        if (!state.authUser || state.authUser.id !== who) return null;   // logged out meanwhile
        const sal = state.salary, cur = monthKey(), applied = [];
        const entries = ((r && r.entries) || []).slice().sort((a, b) => (a.month < b.month ? -1 : 1));
        entries.forEach((e) => {
          if (!e || sal.applied.indexOf(e.id) !== -1) return;
          sal.applied.push(e.id);
          if (sal.lastApplied === e.month) return;               // already put in by the app itself
          if (sal.lastApplied && e.month < sal.lastApplied) return;
          if (!sal.synced && e.month !== cur) return;             // first sync here: no replay of old months
          if (!(e.amount > 0)) return;
          const res = depositIncome(e.amount, e.month, e.id);
          applied.push({ id: e.id, month: e.month, amount: e.amount, given: res.given, rows: res.rows });
        });
        sal.synced = true;
        sal.applied = sal.applied.slice(-36);
        saveState();
        return { entries: entries, applied: applied };
      }).catch(() => null).then((x) => { incomeSyncing = null; return x; });
      return incomeSyncing;
    }
    function afterIncomeApplied(applied) {
      const last = applied[applied.length - 1];
      state.justFunded = new Set((last.rows || []).filter((x) => x.amount > 0).map((x) => x.key));
      render();
      if (state.screen === "app") { burstCoins(); animateCounts(); }
      showToast("💸 ההכנסה החודשית נרשמה — ₪" + fmt(last.given) + " חולקו לקוביות");
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }
    function incomeAfterLink() {
      // Schedule first (it tells the server which month the app already
      // booked), then pick up whatever the server recorded meanwhile.
      if (!state.onboarded) return;
      incomePushSchedule().then(() => incomeSync()).then((r) => { if (r && r.applied.length) afterIncomeApplied(r.applied); });
    }

    let incomeHighlight = null;
    function openIncomeFromPush(entryId) {
      closeChat();
      incomeSync().then(() => {
        incomeHighlight = entryId || null;
        state.screen = "income";
        render();
      });
    }

    // Back from the background: catch up on replies and records.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !push.ready() || !state.authUser) return;
      chatPoll(0);
      incomeSync().then((r) => { if (r && r.applied.length) afterIncomeApplied(r.applied); });
    });

    function enterApp(user) {
      state.authUser = user; state.authError = ""; setSession(user.email);
      sharedReset();
      setTimeout(() => sharedOnEnter(user), 0);   // shared savings: flush queued records, sync the inbox
      loadState();
      notifyNativeAccount(user.email);   // the purchase check runs for THIS account
      setTimeout(() => { if (state.authUser === user) complimentaryCheck(); }, 0);
      if (state.onboarded) { state.screen = "app"; }
      else { startOnboarding(); state.screen = "onboarding"; }
      if (state.onboarded) {
        // Migration: the emergency fund is mandatory, so accounts created before
        // it existed get one now — funded by trimming the flexible cubes, never
        // by inventing money.
        const added = ensureEmergencyCube();
        // Fixed monthly income lands in the cubes on its own, once per calendar
        // month, the first time the app is opened that month — unless the
        // server now records it (then it arrives through incomeSync, and
        // doing it here too would book the month twice).
        const auto = state.salary.auto && !state.salary.serverManaged ? receiveMonthlyIncome(false) : { ok: false };
        if (added || auto.ok) saveState();
        if (added) setTimeout(() => showToast("🛟 נוספה לך קוביית קרן חירום — רשת הביטחון של כל תקציב"), 700);
        if (auto.ok) setTimeout(() => showToast("💸 הכנסת " + monthLabel() + " חולקה אוטומטית — ₪" + fmt(auto.given) + " לקוביות"), added ? 2600 : 700);
      }
      render();
      // Tie the server notifications to this account (fresh password if the
      // user just typed one, the remembered server session otherwise). The
      // result continues in CubeyPush.onLinkResult: income sync, pending chat
      // replies, and the notification the app may have been opened from.
      const pw = push.pendingPw && push.pendingPw.email === normEmail(user.email) ? push.pendingPw.pw : null;
      push.pendingPw = null;
      pushLinkAccount(user.email, pw);
      pushCheckTarget();   // a shared-savings notification the app was opened from
    }
    function logout() {
      try { sharedLogout(); } catch (e) {}
      clearSession();
      state.authUser = null; state.screen = "auth"; state.authMode = "login"; state.authError = "";
      state.onboarded = false; state.pool = 0; state.profile = null; state.cubes = []; state.incognito = false;
      state.game = { points: 0, claimed: {}, flags: {} }; state.shared = []; state.debts = []; state.premium = false;
      state.calmLog = [];
      state.salary = { auto: true, lastApplied: "", history: [] }; state.expenses = []; state.books = { owned: {} };
      state.worksheet = wsNormalize(null);
      state.chat = null; state.notif = null;
      notifyNativeAccount(null); // nobody signed in: no one's AI Premium applies (chat locked, ads as usual)
      compl = { account: null, ok: false, grantedPremium: false };   // complimentary access never carries over
      resetModuleGlobals(); // clear per-session module state so it never leaks to the next account
      pushUnlinkAccount();  // this phone stops receiving the account's notifications
      render();
    }
    // Wipe module-scoped globals that hold one account's derived data (bank
    // report, debt result, simulator/guide UI state, chat) so a different user
    // logging in on the same device never sees the previous account's data.
    function resetModuleGlobals() {
      debtResult = null; debtDraft = { name: "", balance: "", rate: "", type: "credit", unknown: false };
      sharedReset(); guideFeat = null; cc = null; settStep = 0; exDraft = null; topUp = null; dep = null;
      bkTermsOk = false;
      try { clearCalmTimers(); } catch (e) {} calm = null;
      wiScenario = null; wiWithCut = false; wiCustomType = "once"; wiCustomAmt = "";
      gs = { target: "__all", extra: "", months: 12 };
      try { resetChat(); } catch (e) {}
    }
    // ====================================================================
    // Release reset + store-review account.
    //
    // Accounts in this app live ONLY in this device's localStorage -- there is
    // no server-side user table to clear (the backend keeps sessions in a Map
    // that empties on restart). So "delete every existing user" has to happen
    // where the users actually are: here, on each device, the first time it
    // loads a build carrying a new stamp.
    //
    // Bumping RESET_STAMP drops the local user table, the saved session, every
    // per-account state blob and every onboarding draft, then re-seeds the
    // reviewer account below. That is destructive and irreversible for anyone
    // holding the device. It is safe right now only because the app has never
    // shipped, so the sole accounts it can destroy are our own test ones --
    // do NOT bump it again once real users exist.
    // ====================================================================
    const RESET_STAMP_KEY = "cubefinance_web:reset";
    const RESET_STAMP = "2026-08-26-store-review";

    function purgeAllAccounts() {
      const drop = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          // The stamp itself and the language choice are not account data:
          // wiping users must not silently throw the reader back into Hebrew.
          if (k && k.indexOf("cubefinance_web:") === 0 && k !== RESET_STAMP_KEY && k !== LANG_KEY) drop.push(k);
        }
        drop.forEach((k) => localStorage.removeItem(k));
      } catch (e) {}
      return drop.length;
    }

    // --------------------------------------------------------------------
    // The App Store / Google Play reviewer needs to reach every screen without
    // paying, so this account is seeded already onboarded and already entitled.
    //
    // The password is NOT in this file and never was: REVIEWER.salt/hash are the
    // salted, key-stretched digest the login path already compares against, and
    // the plaintext lives only in the Play Console's "App access" form. Anyone
    // reading the repo therefore cannot recover it.
    //
    // Caveat worth knowing: mockHash() folds down to 32 bits, so this digest is
    // brute-forceable and a collision would open THIS demo account. It holds
    // nothing but sample data, and every other account in the app has the same
    // property, but real server-side auth must use bcrypt/argon2 instead.
    // --------------------------------------------------------------------
    const REVIEWER_ID = "acc_reviewer";
    const REVIEWER = {
      email: "ytylyys707@gmail.com",
      salt: "dd718a093462c416",
      hash: "b776a357",
    };

    // Is the signed-in account the store-review one? Decided by the `reviewer`
    // flag on its stored record and by a fixed id -- never by a credential, so
    // nothing read here can be used to sign in as anyone.
    //
    // This flag is local because the app has no auth server to hold it: the
    // backend keeps no user table at all (see backend/src/data/store.js), and

    // Complimentary (creator) access: every paid feature and no ads, without a

    // cf2_my_entitlements) for the verified email of this account's Supabase
    // session — the page holds no list of emails and grants nothing from what
    // was typed in a form or kept in localStorage.

    //            reports back through CubeyBilling.onEntitlement(…, "complimentary").
    //   Browser: the page asks the server directly.
    // The answer lives in memory, for one account; sign-out drops it.
    let compl = { account: null, ok: false, grantedPremium: false };
    function isComplimentaryAccount() {
      return !!(compl.ok && state.authUser && compl.account === state.authUser.id);
    }
    function setComplimentary(ok) {
      if (!state.authUser) return;
      const was = isComplimentaryAccount();
      compl = { account: state.authUser.id, ok: !!ok, grantedPremium: compl.account === state.authUser.id && compl.grantedPremium };
      if (ok && !state.premium) { state.premium = true; compl.grantedPremium = true; notifyNativePremium(); }
      if (!ok && was && compl.grantedPremium) { state.premium = false; compl.grantedPremium = false; }
      if (ok !== was) { saveState(); render(); }
    }
    // After every sign-in (and after the email is verified): ask, with the
    // verified session. No session yet → nothing is granted until there is one.
    async function complimentaryCheck() {
      if (!state.authUser) return;
      if (!SERVER_FEATURES) {                     // no server: the creator's email is recognised here
        if (isOwnerEmail(state.authUser.email)) setComplimentary(true);
        return;
      }
      const who = state.authUser.id;
      let token = null;
      try { token = await sbAccess(false); } catch (e) {}
      if (!token || !state.authUser || state.authUser.id !== who) return;
      if (nativeApp && nativeApp.verifyComplimentary) { try { nativeApp.verifyComplimentary(token); } catch (e) {} return; }
      try {
        const r = await rpc2("cf2_my_entitlements", {});
        if (r && r.ok && state.authUser && state.authUser.id === who && r.email === normEmail(state.authUser.email)) setComplimentary(!!r.complimentary);
      } catch (e) {}
    }

    function isReviewerAccount() {
      const u = state.authUser;
      if (!u) return false;
      if (u.id === REVIEWER_ID) return true;
      try {
        const rec = loadUsers()[u.email];
        return !!(rec && rec.reviewer);
      } catch (e) { return false; }
    }

    // A finished profile, so the reviewer lands on a working dashboard instead
    // of an empty questionnaire: employed, renting alone, real bills to show.
    function reviewerProfile() {
      return {
        age: 27, kid: false, accountType: "bank", prepaid: false, prepaidBalance: 0,
        hasBank: true, balance: 8400, works: true, income: 12000,
        withParents: false, ownership: "rent",
        exp: { rent: 3200, arnona: 260, committee: 120, electricity: 180, water: 90, food: 1400 },
        expEstimated: [],
      };
    }

    function seedReviewerAccount() {
      const users = loadUsers();
      if (users[REVIEWER.email]) return false;      // never clobber an existing one
      const id = REVIEWER_ID;
      users[REVIEWER.email] = {
        id: id, email: REVIEWER.email, salt: REVIEWER.salt, hash: REVIEWER.hash,
        failCount: 0, lockUntil: 0, createdAt: Date.now(), reviewer: true,
      };
      saveUsers(users);

      // Write the account's state blob directly, in the exact shape loadState()
      // reads, with the entitlement already granted.
      const profile = reviewerProfile();
      const cubes = generateCubes(profile);
      const pool = profile.balance;
      try {
        localStorage.setItem("cubefinance_web:state:" + id, JSON.stringify({
          onboarded: true, pool: pool, profile: profile, cubes: cubes,
          incognito: false,
          premium: true,                 // <- reviewer bypasses the paywall
          game: { points: 0, claimed: {}, flags: {} },
          shared: [], debts: [], calmLog: [],
          salary: { auto: true, lastApplied: monthKey(), history: [] },
          expenses: [], books: { owned: {} }, worksheet: null,
        }));
      } catch (e) {}
      return true;
    }

    // Runs once per stamp, before any account is read.
    function applyReleaseReset() {
      let stamp = null;
      try { stamp = localStorage.getItem(RESET_STAMP_KEY); } catch (e) {}
      if (stamp === RESET_STAMP) return;
      purgeAllAccounts();
      seedReviewerAccount();
      try { localStorage.setItem(RESET_STAMP_KEY, RESET_STAMP); } catch (e) {}
    }

    function initAuth() {
      applyLangDir();
      startTranslateObserver();
      applyReleaseReset();
      const email = getSession();
      const users = loadUsers();
      // A saved session only skips the login form — never the email check.
      if (email && users[email] && !needsEmailCheck(users[email])) { enterApp({ id: users[email].id, email: users[email].email }); }
      else if (email && users[email]) {
        // Someone who signed up before verification existed and is still
        // logged in: after the update, the app opens straight on the code
        // screen for the address they registered with.
        notifyNativeAccount(null);   // not in yet
        startVerification(users[email].email, "existing");
      }
      else {
        notifyNativeAccount(null);   // nobody signed in — the ad gate stops waiting for an account
        state.screen = "auth"; state.authMode = Object.keys(users).length ? "login" : "signup";
        render();
        playIntro(); // logged out → the intro splash plays over the auth screen
      }
    }

    // =====================================================================
    // Intro splash: a money jar shakes, falls and shatters, a magical poof
    // reveals the brand screen, and "בוא נתחיל" dissolves it onto the
    // sign-up / log-in screen that is already rendered underneath.
    // =====================================================================
    // ---- intro soundtrack -------------------------------------------------
    // Synthesized live with the Web Audio API (no audio files, so the app stays
    // a single self-contained page). Browsers block autoplay audio, so the
    // intro starts silent and the 🔊 button joins the score MID-FLIGHT: only
    // the cues that haven't happened yet are scheduled, still perfectly in sync.
    let ivAudio = null, introStartedAt = 0;
    function ivAudioInit() {
      if (ivAudio) return ivAudio;
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try {

        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 9; comp.attack.value = .003; comp.release.value = .22;
        const master = ctx.createGain(); master.gain.value = 1; // always full volume
        master.connect(comp); comp.connect(ctx.destination);
        const len = Math.floor(ctx.sampleRate * 2);
        const noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        ivAudio = { ctx: ctx, master: master, noiseBuf: noiseBuf, bus: null };
      } catch (e) { return null; }
      return ivAudio;
    }
    // Let the soundtrack ring out gracefully when the intro closes (a short
    // fade, not an abrupt cut) so the final chord doesn't get chopped off.
    function ivStopAudio(fadeSec) {
      if (!ivAudio || !ivAudio.bus) return;
      try {
        const g = ivAudio.bus.gain, t = ivAudio.ctx.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(0, t + (fadeSec == null ? .45 : fadeSec));
      } catch (e) {}
      ivAudio.bus = null;
    }
    function ivPlayScore(fromSec) {
      const A = ivAudioInit(); if (!A) return false;
      if (A.ctx.state === "suspended") { try { A.ctx.resume(); } catch (e) {} }
      ivStopAudio();
      const bus = A.ctx.createGain(); bus.gain.value = 1; bus.connect(A.master);
      A.bus = bus;
      const ctx = A.ctx, now = ctx.currentTime, t0 = now + .03 - fromSec;
      const R = (a, b) => a + Math.random() * (b - a);
      // filtered noise burst — rattles, whooshes, spraying glass
      const noise = (rel, dur, type, freq, q, vol, sweepTo) => {
        const at = t0 + rel; if (at < now) return;
        const src = ctx.createBufferSource(); src.buffer = A.noiseBuf; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = type;
        f.frequency.setValueAtTime(Math.max(40, freq), at);
        if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40, sweepTo), at + dur);
        if (q) f.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(.0001, at);
        g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), at + Math.min(.03, dur * .25));
        g.gain.exponentialRampToValueAtTime(.0001, at + dur);
        src.connect(f); f.connect(g); g.connect(bus);
        src.start(at); src.stop(at + dur + .05);
      };
      // pitched tone — thuds, glass tinkles, chimes
      const tone = (rel, freq, dur, type, vol, freqEnd) => {
        const at = t0 + rel; if (at < now) return;
        const o = ctx.createOscillator(); o.type = type || "sine";
        o.frequency.setValueAtTime(freq, at);
        if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), at + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(.0001, at);
        g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), at + .014);
        g.gain.exponentialRampToValueAtTime(.0001, at + dur);
        o.connect(g); g.connect(bus);
        o.start(at); o.stop(at + dur + .05);
      };
      // ---- the score, locked to the visual timeline (seconds) ----
      for (let i = 0; i < 10; i++) noise(.12 + i * .115, .075, "bandpass", R(1600, 3600), 1.4, R(.05, .09)); // jar rattle
      tone(.15, 430, .5, "sine", .025);
      for (let j = 0; j < 16; j++) noise(1.1 + j * .045, .05, "bandpass", R(2000, 5200), 2, R(.08, .13));    // shaking harder
      tone(1.1, 620, .55, "sine", .04);
      noise(1.82, .85, "lowpass", 320, 1, .10, 1500);                                                        // camera pan
      noise(2.9, .5, "bandpass", 900, 1.2, .11, 240); tone(2.92, 300, .45, "sine", .06, 110);                 // the fall
      tone(3.4, 115, .5, "sine", .34, 40);                                                                   // impact thud
      noise(3.4, .16, "highpass", 2400, .7, .30);                                                            // the crack
      noise(3.43, .75, "highpass", 3600, .7, .18);                                                           // spraying glass
      for (let k = 0; k < 18; k++) tone(3.45 + Math.random() * .6, R(2200, 6200), R(.10, .26), "triangle", R(.04, .085));
      noise(3.9, .55, "lowpass", 300, 1, .20, 2800);                                                         // the poof
      const sparkle = [784, 988, 1175, 1568, 1976];
      for (let m = 0; m < sparkle.length; m++) tone(3.95 + m * .055, sparkle[m], .45, "sine", .085);
      const chord = [523.25, 659.25, 783.99, 1046.50];                                                       // brand reveal
      for (let n = 0; n < chord.length; n++) tone(4.5 + n * .07, chord[n], 1.5, "sine", .095);
      tone(4.5, 130.81, 1.7, "triangle", .07);
      noise(4.52, 1.1, "highpass", 6000, .7, .045);
      tone(5.15, 1568, .8, "sine", .05);
      return true;
    }

    // =====================================================================
    // GOAL ENGINE — how much a personal cube should get every month.
    //
    // The old version derived everything from (salary − housing). Anyone
    // without a salary on file — a kid, someone between jobs, anyone who
    // skipped the income question — got a flat "₪0 לחודש" with no explanation,
    // and the ₪50 floor was itself gated behind income > 0 so it never
    // rescued them. allocationBase() now walks through every honest source of
    // a monthly number and, when there genuinely isn't one, says so instead of
    // printing a zero.
    // =====================================================================
    const CUSTOM_COLORS = ["#A29BFE", "#55EFC4", "#FD79A8", "#74B9FF", "#81ECEC", "#FAB1A0", "#B2BEC3"];

    function allocationBase() {
      const income = monthlyIncome();
      if (income > 0) {
        const fixed = state.cubes.filter((c) => c.locked).reduce((s, c) => s + (Number(c.amount) || 0), 0);
        return { amount: Math.max(0, Math.round(income - fixed)), source: "income",
                 label: "התקציב החודשי הפנוי שלך" };
      }
      // No income recorded — use what the cubes themselves already plan to move.
      const planned = state.cubes.filter((c) => !c.locked).reduce((s, c) => s + (Number(c.amount) || 0), 0);
      if (planned > 0) return { amount: Math.round(planned), source: "cubes",
                                label: "הסכום החודשי שכבר מתוכנן בקוביות" };
      // Still nothing — spread what is actually saved over half a year.
      const savedUp = Math.round(totalBalance() + state.pool);
      if (savedUp > 0) return { amount: Math.max(1, Math.round(savedUp / 6)), source: "balance",
                                label: "היתרות הקיימות שלך פרוסות על חצי שנה" };
      return { amount: 0, source: "none", label: "" };
    }

    // priority > 7 ⇒ the aggressive band. Below it the cube gets a deliberately
    // small, symbolic share so the main savings goals keep the budget.
    const PRIORITY_AGGRESSIVE = 7;
    function priorityShare(p) {
      return p > PRIORITY_AGGRESSIVE
        ? 0.12 + (p - 8) * 0.09    // 12% → 21% → 30% of the free budget
        : 0.01 + (p - 1) * 0.008;  // 1% → ~5.8%
    }

    // goal = { price, months } — both optional. With a price and a deadline the
    // engine works backwards from what the goal actually costs per month.
    function allocateCustomCube(priority, goal) {
      const p = Math.max(1, Math.min(10, Math.round(priority)));
      const base = allocationBase();
      const aggressive = p > PRIORITY_AGGRESSIVE;
      goal = goal || {};
      const price = Math.max(0, Math.round(Number(goal.price) || 0));
      const months = Math.max(0, Math.round(Number(goal.months) || 0));
      const needed = price > 0 && months > 0 ? Math.ceil(price / months) : 0;

      if (base.amount <= 0) {
        // Be honest rather than confidently wrong. The UI turns this into a
        // shortcut to the income screen instead of showing "₪0 לחודש".
        return { ok: false, amount: 0, priority: p, tone: aggressive ? "high" : "low", base: base,
          explanation: "אין לי עדיין מספר חודשי לעבוד איתו — לא הכנסה, לא יעדים חודשיים בקוביות ולא יתרה. " +
            "הזינו סכום חודשי במסך „הכנסה חודשית” ואחשב לכם הקצאה אמיתית." };
      }

      let amount = Math.round(base.amount * priorityShare(p));
      let note = "";
      if (needed > 0) {
        if (aggressive) {
          // Urgent AND on a deadline: fund what the deadline actually needs,
          // capped at 60% of the free budget so the rest of life still works.
          const cap = Math.round(base.amount * 0.6);
          const want = Math.min(needed, cap);
          if (want > amount) { amount = want; note = " העליתי את הסכום כדי לעמוד בלוח הזמנים שביקשת."; }
          if (needed > cap) note = " היעד דורש ₪" + fmt(needed) + " בחודש — יותר מדי ביחס לתקציב, אז הקצאתי את המקסימום הבטוח (₪" + fmt(cap) + ").";
        } else if (needed < amount) {
          amount = needed; note = " זה בדיוק מה שצריך כדי להגיע ליעד בזמן, בלי להקצות יותר מדי.";
        } else {
          note = " בקצב הזה היעד יושג תוך " + Math.ceil(price / Math.max(1, amount)) + " חודשים — קצת אחרי מה שביקשת, אבל בלי לפגוע בשאר התקציב.";
        }
      }
      // A real, non-zero floor whenever there IS money to work with.
      const floor = Math.min(aggressive ? 100 : 50, base.amount);
      if (amount < floor) amount = floor;
      if (amount > base.amount) amount = base.amount;

      const monthsToGoal = price > 0 && amount > 0 ? Math.ceil(price / amount) : 0;
      const share = Math.round((amount / base.amount) * 100);
      const src = share + "% מ" + base.label + ", שעומד על ₪" + fmt(base.amount);
      const head = aggressive
        ? "דירגת את זה " + p + "/10 — זו עדיפות גבוהה, אז עברתי למצב אגרסיבי: ₪" + fmt(amount) +
          " בחודש. זה " + src + ", על חשבון צמצום בקוביית הבילויים."
        : "דירגת את זה " + p + "/10, אז זה לא דחוף. הקצאתי ₪" + fmt(amount) +
          " בחודש — " + src + " — כדי שהיעדים העיקריים יישארו במרכז.";
      const tail = monthsToGoal > 0 ? " בקצב הזה תגיע ל-₪" + fmt(price) + " תוך " + monthsToGoal + " חודשים." : "";
      return { ok: true, amount: amount, priority: p, tone: aggressive ? "high" : "low", base: base,
               needed: needed, monthsToGoal: monthsToGoal, explanation: head + note + tail };
    }

    function createCustomCube(name, amount, meta) {
      meta = meta || {};
      const income = monthlyIncome();
      amount = Math.max(0, Math.round(amount));
      const idx = state.cubes.filter((c) => c.custom).length;
      const price = Math.max(0, Math.round(Number(meta.goalPrice) || 0));
      // With no salary on file, percentages are taken against whatever monthly
      // budget the engine actually used — otherwise every custom cube shows 0%.
      const pctBase = income > 0 ? income : allocationBase().amount;
      const cube = {
        key: "custom_" + Date.now(),
        name: (name || "").trim() || "קובייה אישית",
        emoji: "🎯", color: CUSTOM_COLORS[idx % CUSTOM_COLORS.length],
        note: (meta.priority ? "יעד אישי · עדיפות " + meta.priority + "/10" : "יעד אישי") +
              (price > 0 ? " · יעד ₪" + fmt(price) : ""),
        pct: pctBase > 0 ? Math.round((amount / pctBase) * 1000) / 10 : 0,
        amount: amount, locked: false, balance: 0, custom: true, priority: meta.priority || null,
      };
      if (price > 0) cube.goalTarget = price; // the card then fills toward the price
      // Urgent cubes (priority > 7) "make room" by trimming the Lifestyle target.
      if (meta.priority && meta.priority > PRIORITY_AGGRESSIVE) {
        const life = state.cubes.find((c) => c.key === "lifestyle");
        if (life) {
          const cut = Math.min(life.amount || 0, amount);
          life.amount = Math.round((life.amount || 0) - cut);
          life.pct = pctBase > 0 ? Math.round((life.amount / pctBase) * 1000) / 10 : life.pct;
        }
      }
      state.cubes.push(cube);
      state.justFunded = new Set([cube.key]);
      saveState();
      render();
      showToast("🎯 נוצרה קובייה: " + cube.name);
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }

    // Onboarding wizard draft (module-scoped; reset when onboarding starts).
    let ob = null;
    const obKey = () => "cubefinance_web:ob:" + (state.authUser ? state.authUser.id : "anon");
    function saveOb() { if (!state.authUser || !ob) return; try { localStorage.setItem(obKey(), JSON.stringify(ob)); } catch (e) {} }
    function loadOb() { try { const s = JSON.parse(localStorage.getItem(obKey()) || "null"); return s && s.d ? s : null; } catch (e) { return null; } }
    function clearOb() { try { localStorage.removeItem(obKey()); } catch (e) {} }
    function startOnboarding() {
      // Resume an in-progress questionnaire if the user refreshed mid-flow.
      const saved = loadOb();
      ob = saved || { i: 0, building: false, d: { age: "", account: null, balance: "", prepaidAmount: "",
                        works: null, income: "",
                        living: null, ownership: null, exp: {}, expEst: {},
                        kidAmount: "", kidFreq: null, kidGoalName: "", kidGoalPrice: "", kidGoalSkip: false } };
      ob.building = false; // never resume stuck inside the build animation
    }
    // Conditional step machine:
    // parents  -> straight to the income questions (no property/expenses)
    // alone    -> property status -> dynamic expense fields (per status)
    function obSteps() {
      const d = ob.d, age = Number(d.age);
      const s = ["age"];
      // Kids get a short, concrete track: pocket money + what they're saving for.
      if (age > 0 && age < KID_AGE_MAX) { s.push("kidAllowance", "kidGoal"); return s; }
      // How the money is actually held. Asked from 13 up (not 16) because a
      // prepaid card is exactly the instrument a 13–15 year old can hold, under
      // a parent's name — and it is also the answer for anyone who simply never
      // wants to be able to go into overdraft.
      s.push("account");
      if (d.account === "prepaid" || d.account === "both") s.push("prepaidAmount");
      if (d.account === "bank" || d.account === "both") s.push("balance");
      s.push("living");
      if (d.living === "alone") { s.push("property", "expenses"); }
      s.push("work"); if (d.works) s.push("income");
      return s;
    }
    // Expense fields per property status + realistic defaults for an 18-year-old
    // (used by the per-field "לא יודע / דלג" buttons).
    const EXP_DEFAULTS = { rent: 2200, arnona: 180, committee: 80, electricity: 250, water: 60, food: 1000 };

    function onGisCredential(resp) {

        const json = decodeURIComponent(Array.prototype.map.call(bin, (c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));

    // =====================================================================
    // Email verification screen — 6 one-time digits, mailed by web/api/auth.
    // Flow: register → a code is mailed → this screen → survey (onboarding).
    // =====================================================================
    function randomCode(len) {
      // CSPRNG in the browser; falls back only if crypto is unavailable.
      const max = Math.pow(10, len);
      try {
        const a = new Uint32Array(1);
        crypto.getRandomValues(a);
        return String(a[0] % max).padStart(len, "0");
      } catch (e) { return String(Math.floor(Math.random() * max)).padStart(len, "0"); }
    }

    // One email through EmailJS's REST endpoint. The template on emailjs.com
    // uses {{to_email}} as the recipient and {{code}} in the subject/body.
    async function sendViaEmailJS(email, code) {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id: EMAILJS.serviceId, template_id: EMAILJS.templateId, user_id: EMAILJS.publicKey,
          template_params: { to_email: email, code: code },
        }),
      });
      if (!res.ok) throw new Error("emailjs " + res.status + " " + (await res.text()).slice(0, 160));
    }

    async function apiPost(path, body) {
      const res = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { status: res.status, data: data };
    }

    /** Ask for a code — via the backend when configured, locally otherwise. */
    async function requestCode(email, isResend) {
      vf.busy = true; vf.error = ""; renderVerify();
      try {
        // Preferred: Supabase Auth emails the code and checks it on the server.
        // That is what gives the account a real server identity — and with it
        // a profile friends can find in shared savings. If Supabase cannot send
        // right now, the code goes out through EmailJS as before.
        if (SERVER_FEATURES && vf.mode !== "emailjs" && await sbRequestCodeFor(email)) {
          vf.mode = "supabase";
          vf.mailedCode = null; vf.localCode = null;
        } else if (useEmailJS()) {
          vf.mode = "emailjs";
          const code = randomCode(CODE_LEN);
          try { await sendViaEmailJS(email, code); }
          catch (err) {
            secLog("ERROR", "שליחת קוד דרך EmailJS נכשלה: " + err.message);
            vf.error = "שליחת המייל נכשלה. נסו שוב בעוד רגע.";
            vf.busy = false; renderVerify(); return false;
          }
          vf.mailedCode = code;                    // kept in memory only, never shown
          vf.localCode = null;
        } else {
          const r = await apiPost(isResend ? "/api/auth/resend" : "/api/auth/register", { email: email });
          if (r.status === 429) {
            vf.error = (r.data && r.data.message) || "נשלחו יותר מדי קודים. נסו שוב מאוחר יותר.";
            vf.busy = false; renderVerify(); return false;
          }
          if (!r.data || r.data.ok !== true) {
            vf.error = (r.data && r.data.message) || "שליחת הקוד נכשלה. נסו שוב.";
            vf.busy = false; renderVerify(); return false;
          }
          vf.localCode = r.data.devCode || null;   // only present in dev
          vf.token = r.data.token || null;         // signed by the server; carries no code
        }
        vf.expiresAt = Date.now() + VERIFY_TTL_MS;
        vf.resendAt = Date.now() + RESEND_COOLDOWN_MS;
        vf.attempts = 0;
        vf.digits = blankDigits();
        vf.busy = false;
        renderVerify();
        showToast(isResend ? "📧 נשלח קוד חדש למייל" : "📧 שלחנו לך קוד למייל");
        return true;
      } catch (e) {
        vf.error = "אין חיבור לשרת. בדקו את החיבור ונסו שוב.";
        vf.busy = false; renderVerify(); return false;
      }
    }

    function startVerification(email, purpose) {
      vf = { email: email, purpose: purpose || "signup", digits: blankDigits(), token: null, error: "", expiresAt: 0,
             resendAt: 0, localCode: null, attempts: 0, busy: false };
      state.screen = "verify";
      render();
      requestCode(email, false);
    }

    async function submitCode() {
      const code = vf.digits.join("");
      if (code.length !== CODE_LEN) return;
      vf.busy = true; vf.error = ""; renderVerify();

      let ok = false, msg = "";
      if (vf.mode === "supabase") {
        if (Date.now() > vf.expiresAt) msg = "הקוד פג תוקף. בקשו קוד חדש.";
        else if (vf.attempts >= MAX_CODE_ATTEMPTS) msg = "יותר מדי ניסיונות שגויים. בקשו קוד חדש.";
        else {
          const r = await sbVerifyCodeFor(vf.email, code);
          if (r === true) ok = true;
          else if (r === "network") msg = "אין חיבור לשרת. בדקו את החיבור ונסו שוב.";
          else {
            vf.attempts++;
            const left = MAX_CODE_ATTEMPTS - vf.attempts;
            msg = left > 0 ? "הקוד שגוי. נותרו " + left + " ניסיונות." : "יותר מדי ניסיונות שגויים. בקשו קוד חדש.";
          }
        }
      } else if (!useEmailJS()) {
        try {
          const r = await apiPost("/api/auth/verify", { email: vf.email, code: code, token: vf.token });
          ok = !!(r.data && r.data.ok);
          msg = (r.data && r.data.message) || "";
          if (!ok && r.data && typeof r.data.attemptsLeft === "number") vf.attempts = MAX_CODE_ATTEMPTS - r.data.attemptsLeft;
        } catch (e) { msg = "אין חיבור לשרת."; }
      } else {
        // EmailJS mode checks here, with the server's rules: expiry + attempt cap.
        if (Date.now() > vf.expiresAt) { msg = "הקוד פג תוקף. בקשו קוד חדש."; }
        else if (vf.attempts >= MAX_CODE_ATTEMPTS) { msg = "יותר מדי ניסיונות שגויים. בקשו קוד חדש."; }
        else if (vf.mailedCode && code === vf.mailedCode) { ok = true; vf.mailedCode = null; }
        else {
          vf.attempts++;
          const left = MAX_CODE_ATTEMPTS - vf.attempts;
          msg = left > 0 ? "הקוד שגוי. נותרו " + left + " ניסיונות." : "יותר מדי ניסיונות שגויים. בקשו קוד חדש.";
        }
      }

      vf.busy = false;
      if (ok) {
        secLog("INFO", "האימייל אומת בהצלחה עם קוד חד-פעמי");
        markEmailVerified(vf.email);
        if (vf.purpose === "reset") {        // the code proved it — now pick a new password
          resetEmail = vf.email; vf = null;
          state.screen = "newpw"; render();
          return;
        }
        const users = loadUsers();
        const u = users[vf.email];
        vf = null;
        showToast("✅ האימייל אומת!");
        if (u) enterApp({ id: u.id, email: u.email });   // → the survey (onboarding)
        else { state.screen = "auth"; render(); }
        return;
      }
      vf.error = msg || "הקוד שגוי. בדקו את הספרות ונסו שוב.";
      vf.digits = blankDigits();
      renderVerify();
      const w = document.querySelector(".otpwrap");
      if (w) { w.classList.add("bad"); setTimeout(() => w.classList.remove("bad"), 450); }
      secLog("WARN", "ניסיון אימות שגוי נרשם");
    }

    // The store-review account is exempt: reviewers cannot read that inbox.
    function needsEmailCheck(user) {
      if (!SERVER_FEATURES && user && isOwnerEmail(user.email)) return false;   // the creator is never asked for a code
      const u = loadUsers()[normEmail(user && user.email)];
      return !(u && (u.emailVerified || u.id === REVIEWER_ID));
    }

    function markEmailVerified(email) {
      const users = loadUsers();
      if (users[email]) { users[email].emailVerified = true; saveUsers(users); }
    }

    let vfTimer = null;
    function renderVerify() {
      if (!vf) return;
      const v = $("view"); v.innerHTML = "";
      if (vfTimer) { clearInterval(vfTimer); vfTimer = null; }

      const wrap = el("div", "authwrap");
      const secsLeft = Math.max(0, Math.ceil((vf.expiresAt - Date.now()) / 1000));
      const mm = String(Math.floor(secsLeft / 60)).padStart(2, "0");
      const ss = String(secsLeft % 60).padStart(2, "0");
      const canResend = Date.now() >= vf.resendAt && !vf.busy;
      const resendIn = Math.max(0, Math.ceil((vf.resendAt - Date.now()) / 1000));

      wrap.innerHTML =
        '<div class="authcard">' +
          '<div class="authbrand">' + (vf.purpose === "reset" ? "🔑 איפוס סיסמה" : "📧 אימות אימייל") + '</div>' +
          '<h2 class="authtitle">הזינו את הקוד</h2>' +
          (vf.purpose === "existing"
            ? '<div class="otpnote">🔒 <b>עדכון אבטחה:</b> כדי להמשיך להשתמש באפליקציה, אשרו פעם אחת שזה המייל שלכם. הנתונים שלכם נשמרו.</div>'
            : "") +
          '<p class="otpmail">שלחנו קוד בן ' + CODE_LEN + ' ספרות אל<br><b dir="ltr">' + esc(vf.email) + '</b></p>' +
          '<p class="otpmail" style="font-size:12.5px;margin-top:4px">לא מוצאים? בדקו גם בתיקיית הספאם / קידומי מכירות</p>' +
          '<div class="otpwrap" id="otpWrap">' +
            blankDigits().map((_, i) =>
              '<input class="otpbox' + (vf.digits[i] ? " filled" : "") + '" id="otp' + i + '" inputmode="numeric" ' +
              'autocomplete="one-time-code" maxlength="1" value="' + esc(vf.digits[i]) + '"' +
              (vf.busy ? " disabled" : "") + '>').join("") +
          '</div>' +
          '<div class="otperr">' + esc(vf.error || "") + '</div>' +
          (vf.localCode ? '<div class="devcode">🧪 <b>' + esc(vf.localCode) + '</b><br>' +
             'מצב מקומי ללא שרת דואר — הקוד מוצג כאן במקום להישלח במייל. ' +
             'בחיבור לשרת (API_BASE) הקוד יישלח לתיבה האמיתית ולא יוצג.</div>' : "") +
          '<div class="otpmeta">' +
            '<span class="otptimer" id="otpTimer">' + (secsLeft > 0 ? "הקוד תקף עוד " + mm + ":" + ss : "הקוד פג תוקף") + '</span>' +
            '<button class="otpresend" id="otpResend"' + (canResend ? "" : " disabled") + '>' +
              (canResend ? "שלח קוד חדש" : "שלח קוד חדש (" + resendIn + ")") + '</button>' +
          '</div>' +
          (vf.mode === "supabase" ? '<button class="otpresend" id="otpAlt" style="display:block;margin:8px auto 0">לא הגיע קוד? שליחה בדרך אחרת</button>' : "") +
          '<button class="obexit" id="otpBack">' + (vf.purpose === "existing" ? "← התנתקות" : "← חזרה למסך הכניסה") + '</button>' +
        '</div>';
      v.appendChild(wrap);

      const boxes = blankDigits().map((_, i) => wrap.querySelector("#otp" + i));
      const focusFirstEmpty = () => {
        const idx = vf.digits.findIndex((d) => !d);
        (boxes[idx === -1 ? CODE_LEN - 1 : idx] || boxes[0]).focus();
      };
      boxes.forEach((box, i) => {
        box.oninput = () => {
          const digits = box.value.replace(/\D/g, "");
          if (digits.length > 1) { spread(digits, i); return; }   // handles paste
          vf.digits[i] = digits;
          box.value = digits;
          box.classList.toggle("filled", !!digits);
          if (digits && i < CODE_LEN - 1) boxes[i + 1].focus();
          if (vf.digits.every((d) => d)) setTimeout(submitCode, 120);
        };
        box.onkeydown = (e) => {
          if (e.key === "Backspace" && !box.value && i > 0) { boxes[i - 1].focus(); vf.digits[i - 1] = ""; boxes[i - 1].value = ""; }
          if (e.key === "ArrowLeft" && i > 0) boxes[i - 1].focus();
          if (e.key === "ArrowRight" && i < CODE_LEN - 1) boxes[i + 1].focus();
          if (e.key === "Enter" && vf.digits.every((d) => d)) submitCode();
        };
        box.onpaste = (e) => {
          e.preventDefault();
          const t = (e.clipboardData || window.clipboardData).getData("text") || "";
          spread(t.replace(/\D/g, ""), 0);
        };
      });
      function spread(digits, from) {
        for (let k = 0; k < digits.length && from + k < CODE_LEN; k++) {
          vf.digits[from + k] = digits[k];
          boxes[from + k].value = digits[k];
          boxes[from + k].classList.add("filled");
        }
        focusFirstEmpty();
        if (vf.digits.every((d) => d)) setTimeout(submitCode, 120);
      }

      wrap.querySelector("#otpResend").onclick = () => { if (Date.now() >= vf.resendAt) requestCode(vf.email, true); };
      const alt = wrap.querySelector("#otpAlt");
      if (alt) alt.onclick = () => { vf.mode = "emailjs"; vf.resendAt = 0; requestCode(vf.email, true); };
      wrap.querySelector("#otpBack").onclick = () => {
        if (vfTimer) { clearInterval(vfTimer); vfTimer = null; }
        if (vf.purpose === "existing") clearSession(); // leaving means logging out
        vf = null; state.screen = "auth"; state.authMode = "login"; render();
      };
      if (!vf.busy) setTimeout(focusFirstEmpty, 60);

      // live countdown + resend cooldown, without re-rendering the whole screen
      vfTimer = setInterval(() => {
        if (!vf || state.screen !== "verify") { clearInterval(vfTimer); vfTimer = null; return; }
        const left = Math.max(0, Math.ceil((vf.expiresAt - Date.now()) / 1000));
        const t = $("otpTimer");
        if (t) t.textContent = left > 0
          ? "הקוד תקף עוד " + String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0")
          : "הקוד פג תוקף";
        const rb = $("otpResend");
        if (rb) {
          const wait = Math.max(0, Math.ceil((vf.resendAt - Date.now()) / 1000));
          rb.disabled = wait > 0 || vf.busy;
          rb.textContent = wait > 0 ? "שלח קוד חדש (" + wait + ")" : "שלח קוד חדש";
        }
      }, 1000);
    }

    // ---- Onboarding (multi-step, conditional, with skip-estimates) --------
    function renderOnboarding() {
      if (!ob) startOnboarding();
      saveOb(); // persist the draft so a refresh mid-questionnaire resumes here
      const v = $("view");

      // AI-processing animation before the dashboard appears
      if (ob.building) {
        v.innerHTML = "";
        const wrap = el("div", "authwrap");

          '<div class="buildcube">🧊</div>' +

          '<div class="procbar" style="margin-top:16px"><i></i></div></div>';

      const steps = obSteps();

      const d = ob.d, age = Number(d.age);
      const digits = (val) => val.replace(/[^0-9]/g, "");

      const canNext = () => {
        switch (step) {
          case "age": { const a = Number(d.age); return a >= 6 && a <= 120; }
          case "kidAllowance": return d.kidFreq === "none" || (!!d.kidFreq && Number(d.kidAmount) > 0);
          case "kidGoal": return !!d.kidGoalSkip || (!!(d.kidGoalName || "").trim() && Number(d.kidGoalPrice) > 0);
          case "account": return d.account !== null;

          case "prepaidAmount": return d.prepaidAmount !== "" && Number(d.prepaidAmount) >= 0;
          case "living": return d.living !== null;
          case "property": return d.ownership !== null;
          case "expenses": return expFields().every((k) => d.exp[k] !== undefined && d.exp[k] !== "");
          case "work": return d.works !== null;
          case "income": return Number(d.income) > 0;
          default: return false;
        }
      };

      v.innerHTML = "";
      const wrap = el("div", "authwrap");
      const money = (id, lbl, ph, val) =>

            : "הבחירה הזו קובעת איך נחשב את התקציב — ואם בכלל אפשר להיכנס למינוס.") + '</p>' +
          choice("prepaid", "כרטיס נטען (פריפייד) 💳",

            d.account === "prepaid") +
          choice("bank", "חשבון בנק רגיל 🏦", "יתרה שוטפת שאני מנהל בעצמי", d.account === "bank") +
          choice("both", "גם וגם", "חשבון בנק ולצידו כרטיס נטען להוצאות היומיום", d.account === "both") +
          choice("none", "אין לי עדיין", "נתחיל בלי סכום פתיחה — אפשר להוסיף בכל רגע", d.account === "none");
