    // Self-service JSON export was removed. Note for whoever revisits this:
    // everything the export produced already lives on the device in
    // localStorage and is never sent anywhere, so no copy of it is being
    // withheld from the user -- but if the app ever ships to the EU, check
    // whether a portability route (Art. 20) is still expected of it.
    // =====================================================================
    function clearHistory() {
      resetChat();
      // The conversation is gone from the server too, and the next message
      // starts a fresh one.
      const old = state.chat && state.chat.cid;
      if (old && push.ready()) push.call("chatDeleteConversation", { conversationId: old }).catch(() => {});
      state.chat = normChat(null);
      saveState();
      clearSecLog();
      secLog("INFO", "היסטוריית הפעולות והצ׳אט נוקתה לבקשת המשתמש");
      showToast("🧹 ההיסטוריה נוקתה");
    }

    // =====================================================================
    // Fixed monthly income → percentage buckets.
    // One number in, a transparent split out. The percentages are editable and
    // are the single source of truth: the monthly targets are derived from them,
    // never the other way round.
    // =====================================================================
    function renderIncomePage() {
      const kid = isKidMode();
      const body = pageShell(kid ? "הכסף החודשי שלי 💸" : "הכנסה חודשית קבועה 💸", () => { state.screen = "app"; render(); });
      const applied = state.salary.lastApplied === monthKey();

      const amtCard = el("div", "setcard");
      amtCard.innerHTML =
        '<div class="setlbl">' + (kid ? "כמה כסף נכנס לך כל חודש? (דמי כיס, עבודות קטנות)" : "כמה נכנס לחשבון כל חודש, נטו?") + '</div>' +
        '<div class="fld" style="margin-top:8px"><span class="cur">₪</span><input id="incAmt" inputmode="numeric" placeholder="8000" value="' + (monthlyIncome() || "") + '"></div>' +
        '<div class="setlbl" style="margin-top:10px">כל האחוזים למטה מחושבים מהסכום הזה.</div>';
      body.appendChild(amtCard);

      const autoCard = el("div", "setcard swrow");
      autoCard.innerHTML = '<div><div class="setmail">חלוקה אוטומטית בכל חודש 🔁</div>' +
        '<div class="setlbl" style="margin-top:4px">' + (state.salary.serverManaged && push.ready()
          ? "ב-1 בכל חודש בבוקר ההכנסה נרשמת אוטומטית — גם כשהאפליקציה סגורה — ונכנסת לקוביות לפי האחוזים. רישום לניהול התקציב בלבד, לא העברת כסף אמיתית"
          : "בפעם הראשונה שתפתח/י את האפליקציה בחודש חדש, ההכנסה נכנסת לקוביות לפי האחוזים — בלי ללחוץ כלום") + '</div></div>' +
        '<button class="sw' + (state.salary.auto ? " on" : "") + '" id="swAuto" aria-label="חלוקה אוטומטית"></button>';
      body.appendChild(autoCard);
      autoCard.querySelector("#swAuto").onclick = () => {
        state.salary.auto = !state.salary.auto;
        autoCard.querySelector("#swAuto").classList.toggle("on", state.salary.auto);
        saveState();
        incomePushSchedule();   // turning it off cancels the server's monthly record too
        showToast(state.salary.auto ? "🔁 חלוקה אוטומטית מופעלת" : "חלוקה אוטומטית כבויה — אפשר תמיד לחלק ידנית");
      };

      const st1 = el("div", "section-t"); st1.textContent = "החלוקה לקוביות"; body.appendChild(st1);

      const editor = el("div", "setcard");
      body.appendChild(editor);
      const preview = el("div", "setcard");
      body.appendChild(preview);

      const goBtn = el("button", "distbtn wide");
      body.appendChild(goBtn);
      const hint = el("div", "setlbl"); hint.style.textAlign = "center";
      body.appendChild(hint);

      // Repaint only the derived parts, so typing in a field never steals focus.
      function paintDerived() {
        const income = monthlyIncome();
        const plan = splitByPercent(income);
        preview.innerHTML =
          '<div class="setlbl">כך ייראה חודש שלם של ₪' + fmt(income) + '</div>' +
          (income > 0
            ? plan.rows.map((r) => '<div class="pctprev"><span>' + r.emoji + ' ' + esc(r.name) + (r.fixed ? ' 🔒' : "") + '</span>' +
                '<b style="color:' + r.color + '">₪' + fmt(r.amount) + '</b></div>').join("") +
              (plan.leftover > 0 ? '<div class="pctprev leftover"><span>🪙 נשאר ביתרה הפנויה</span><b>₪' + fmt(plan.leftover) + '</b></div>' : "")
            : '<div class="setlbl" style="margin-top:8px">הזינו סכום חודשי למעלה כדי לראות את החלוקה.</div>');
        // Locked bills are paid in full first, so only the flexible cubes'
        // percentages compete for what's left — that's the number to report.
        const fixed = state.cubes.reduce((s, c) => s + (c.locked ? Math.round(Number(c.amount) || 0) : 0), 0);
        const flexPct = Math.round(state.cubes.reduce((s, c) => s + (c.locked ? 0 : Number(c.pct) || 0), 0) * 10) / 10;
        const room = income > 0 ? Math.round(((income - fixed) / income) * 1000) / 10 : 0;
        const over = flexPct > room + 0.5;
        hint.textContent = income <= 0 ? ""
          : (fixed > 0 ? "₪" + fmt(fixed) + " הולכים להוצאות קבועות ונעולות (" + (Math.round((100 - room) * 10) / 10) + "%), ונשארים " + room + "% לחלוקה. " : "") +
            (over
              ? "האחוזים שהגדרת מסתכמים ב-" + flexPct + "% — יותר ממה שנשאר, אז החלוקה תוקטן פרופורציונלית."
              : "האחוזים שהגדרת: " + flexPct + "%" + (flexPct < room - 0.5 ? " — ההפרש יישאר כיתרה פנויה לחלוקה ידנית." : ""));
        hint.style.color = over ? "var(--warning)" : "var(--dim)";
        goBtn.disabled = income <= 0;
        goBtn.textContent = income <= 0
          ? "הזינו סכום חודשי"
          : (applied ? "💸 חלק שוב ₪" + fmt(income) + " (" + monthLabel() + " כבר חולק)" : "💸 קבל את הכנסת " + monthLabel() + " וחלק לקוביות");
      }

      // Percentage editor — locked cubes show their real fixed cost and are not
      // editable; the emergency fund is marked mandatory and cannot go to 0.
      editor.innerHTML = '<div class="setlbl">אחוז מההכנסה לכל קובייה</div>' +
        state.cubes.map((c, i) =>
          '<div class="pctrow' + (c.locked ? " lockedrow" : "") + '">' +
            '<span class="pctname">' + c.emoji + ' ' + esc(c.name) + (c.mandatory ? ' <i class="must">חובה</i>' : "") + '</span>' +
            (c.locked
              ? '<span class="pctfixed">₪' + fmt(c.amount || 0) + ' קבוע 🔒</span>'
              : '<span class="pctinput"><input inputmode="numeric" data-i="' + i + '" value="' + (Number(c.pct) || 0) + '"><b>%</b></span>') +
          '</div>').join("");
      editor.querySelectorAll(".pctinput input").forEach((inp) => {
        inp.oninput = () => {
          inp.value = inp.value.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
          const cube = state.cubes[Number(inp.dataset.i)];
          if (!cube) return;
          let v = Math.max(0, Math.min(100, Number(inp.value) || 0));
          if (cube.mandatory && v < 1) v = Number(inp.value) === 0 ? 0 : v; // allow clearing while typing
          cube.pct = Math.round(v * 10) / 10;
          retargetCubes();
          saveState();
          paintDerived();
        };
        inp.onblur = () => {
          const cube = state.cubes[Number(inp.dataset.i)];
          if (!cube) return;
          // The emergency fund is mandatory: it may be lowered, never switched off.
          if (cube.mandatory && (Number(cube.pct) || 0) < 5) { cube.pct = 5; showToast("🛟 קרן החירום היא חובה — הושארה על 5% לפחות"); }
          inp.value = Number(cube.pct) || 0;
          retargetCubes(); saveState(); paintDerived();
        };
      });

      goBtn.onclick = () => {
        const r = receiveMonthlyIncome(true);
        if (!r.ok) { showToast("קודם הזינו סכום חודשי 🙂"); return; }
        incomePushSchedule();   // the server learns this month is already in, so it won't book it again
        state.justFunded = new Set(r.rows.filter((x) => x.amount > 0).map((x) => x.key));
        state.screen = "app";
        burstCoins();
        render();
        animateCounts();
        showToast("🪙 חולקו ₪" + fmt(r.given) + " לקוביות" + (r.leftover > 0 ? " · ₪" + fmt(r.leftover) + " נשארו ביתרה" : ""));
        setTimeout(() => { state.justFunded = new Set(); }, 800);
      };

      amtCard.querySelector("#incAmt").oninput = (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "");
        setMonthlyIncome(e.target.value);
        incomeScheduleSoon();   // a changed (or cleared) amount reaches the server's schedule
        paintDerived();
      };

      paintDerived();

      // Recent records — automatic ones marked, and the one a notification
      // pointed at highlighted and scrolled into view.
      const hist = (state.salary.history || []).slice(-12).reverse();
      if (hist.length) {
        const st2 = el("div", "section-t"); st2.textContent = "רישומי הכנסה אחרונים"; body.appendChild(st2);
        const hc = el("div", "setcard");
        hc.innerHTML = hist.map((h) =>
          '<div class="pctprev increc' + (incomeHighlight && (h.id === incomeHighlight || h.m === incomeHighlight) ? " hl" : "") + '">' +
            '<span>' + esc(monthName(h.m)) + (h.auto ? ' <i class="autotag">🔁 נרשם אוטומטית</i>' : "") + '</span>' +
            '<b>₪' + fmt(h.amount) + '</b></div>').join("");
        body.appendChild(hc);
        const hl = hc.querySelector(".hl");
        if (hl) {
          setTimeout(() => hl.scrollIntoView({ block: "center", behavior: "smooth" }), 80);
          setTimeout(() => { incomeHighlight = null; hl.classList.remove("hl"); }, 4000);
        } else incomeHighlight = null;
      }

      const sp = el("div"); sp.style.height = "40px"; body.appendChild(sp);

      // Opening the page picks up anything the server recorded meanwhile.
      if (push.ready() && Date.now() - incomePageSyncedAt > 30000) {
        incomePageSyncedAt = Date.now();
        incomeSync().then((r) => { if (r && r.applied.length && state.screen === "income") render(); });
      }
    }
    let incomePageSyncedAt = 0;
    // "2026-10" → "אוקטובר 2026"
    function monthName(mk) {
      const p = String(mk || "").split("-");
      const names = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
      const i = Number(p[1]) - 1;
      return names[i] ? names[i] + " " + p[0] : String(mk || "");
    }

    // =====================================================================
    // Expense journal — report what actually happened to the money, and say
    // why. The "why" is the feature: five honest options turn a receipt list
    // into something you can act on next month.
    // =====================================================================
    let exDraft = null;
    function newExDraft() {
      const first = state.cubes.find((c) => !c.locked) || state.cubes[0];
      return { amount: "", cubeKey: first ? first.key : null, what: "", reason: "need", deduct: true };
    }
    function renderExpensesPage() {
      const kid = isKidMode();
      const body = pageShell(kid ? "על מה הוצאתי כסף 🧾" : "יומן הוצאות 🧾", () => { exDraft = null; state.screen = "app"; render(); });
      if (!exDraft) exDraft = newExDraft();

      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl">' + (kid
        ? "כל פעם שהוצאת כסף — ספר כאן על מה ולמה. ככה תראה בעצמך לאן הכסף שלך הולך."
        : "דווחו כאן על כסף שיצא: כמה, מאיזו קובייה, על מה — ובעיקר <b>למה</b>. הדיווח מוריד את הסכום מהקובייה כדי שהיתרות יישארו אמיתיות.") + '</div>';
      body.appendChild(intro);

      // --- the report form
      const form = el("div", "setcard");
      const cubeOpts = state.cubes.filter((c) => !c.locked);
      form.innerHTML =
        '<label class="flbl" style="margin-top:0">כמה יצא?</label>' +
        '<div class="fld"><span class="cur">₪</span><input id="exAmt" inputmode="numeric" placeholder="120" value="' + esc(exDraft.amount) + '"></div>' +
        '<label class="flbl">מאיזו קובייה?</label>' +
        '<div class="exchips" id="exCubes">' + cubeOpts.map((c) =>
          '<button class="fchip' + (exDraft.cubeKey === c.key ? " on" : "") + '" data-k="' + esc(c.key) + '">' + c.emoji + ' ' + esc(c.name) + '</button>').join("") + '</div>' +
        '<label class="flbl">על מה?</label>' +
        '<div class="fld"><input id="exWhat" placeholder="' + (kid ? "ממתקים בקיוסק" : "ארוחה עם חברים") + '" value="' + esc(exDraft.what) + '"></div>' +
        '<label class="flbl">ולמה? (התשובה הכי חשובה)</label>' +
        '<div class="exchips" id="exReasons">' + SPEND_REASONS.map((r) =>
          '<button class="fchip' + (exDraft.reason === r.id ? " on" : "") + '" data-r="' + r.id + '">' + r.emoji + ' ' + r.label + '</button>').join("") + '</div>' +
        '<div class="swrow" style="margin-top:14px"><div class="setlbl">להוריד את הסכום מיתרת הקובייה</div>' +
          '<button class="sw' + (exDraft.deduct ? " on" : "") + '" id="exDeduct" aria-label="הורדה מהיתרה"></button></div>';
      body.appendChild(form);

      const save = el("button", "distbtn wide");
      const amt = () => Math.round(Number(exDraft.amount) || 0);
      const syncSave = () => { save.disabled = !(amt() > 0); save.textContent = amt() > 0 ? "רשום הוצאה של ₪" + fmt(amt()) : "רשום הוצאה"; };
      body.appendChild(save);

      form.querySelector("#exAmt").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); exDraft.amount = e.target.value; syncSave(); };
      form.querySelector("#exWhat").oninput = (e) => { exDraft.what = e.target.value; };
      form.querySelectorAll("#exCubes .fchip").forEach((b) => {
        b.onclick = () => { exDraft.cubeKey = b.dataset.k; form.querySelectorAll("#exCubes .fchip").forEach((x) => x.classList.toggle("on", x === b)); };
      });
      form.querySelectorAll("#exReasons .fchip").forEach((b) => {
        b.onclick = () => { exDraft.reason = b.dataset.r; form.querySelectorAll("#exReasons .fchip").forEach((x) => x.classList.toggle("on", x === b)); };
      });
      form.querySelector("#exDeduct").onclick = () => {
        exDraft.deduct = !exDraft.deduct;
        form.querySelector("#exDeduct").classList.toggle("on", exDraft.deduct);
      };
      save.onclick = () => {
        const value = amt();
        if (value <= 0) return;
        const cube = state.cubes.find((c) => c.key === exDraft.cubeKey) || null;
        if (exDraft.deduct && cube && cube.balance < value) {
          showToast('בקובייה "' + cube.name + '" יש רק ₪' + fmt(cube.balance) + " — אפשר לכבות את ההורדה מהיתרה או לבחור קובייה אחרת");
          return;
        }
        if (exDraft.deduct && cube) cube.balance = Math.max(0, cube.balance - value);
        logExpense({ amount: value, cubeKey: cube ? cube.key : null, cubeName: cube ? cube.name : "", what: exDraft.what, reason: exDraft.reason });
        const r = reasonById(exDraft.reason);
        exDraft = newExDraft();
        render();
        showToast(r.tone === "warn"
          ? "📝 נרשם — " + r.label + ". טוב שאמרת את זה, זה בדיוק מה שמשנה חודש הבא."
          : "✅ נרשמו ₪" + fmt(value) + (cube ? " מ" + cube.name : ""));
      };
      syncSave();

      // --- what the journal says back
      const ins = expenseInsights();
      if (ins) {
        const st = el("div", "section-t"); st.textContent = "מה זה מספר לך 🪞"; body.appendChild(st);
        const card = el("div", "setcard");
        const lines = [];
        lines.push('<div class="privline">💰 דיווחת על <b>' + (ins.count === 1 ? "הוצאה אחת" : ins.count + " הוצאות") + '</b> בסך <b>₪' + fmt(ins.total) + '</b>' + (ins.windowed ? " ב-30 הימים האחרונים" : "") + '.</div>');
        if (ins.topCube) lines.push('<div class="privline">📍 הכי הרבה יצא מ<b>' + esc(ins.topCube) + '</b> — ₪' + fmt(ins.topCubeAmount) + '.</div>');
        if (ins.regretted > 0) {
          lines.push('<div class="privline">🌀 <b>' + ins.regretPct + '%</b> מהכסף (₪' + fmt(ins.regretted) + ') סומן כ"נסחפתי" או "מתחרט".' +
            (ins.regretPct >= 30
              ? ' זה הרבה — לו רק חצי מזה היה נכנס לקרן החירום, היו לך שם ₪' + fmt(Math.round(ins.regretted / 2)) + ' יותר.'
              : ' זה בסדר גמור — כולם נסחפים לפעמים.') + '</div>');
        } else {
          lines.push('<div class="privline">🎯 כל ההוצאות שדיווחת היו מודעות — לא "נסחפתי" ולא חרטה. זה נדיר, תמשיך ככה.</div>');
        }
        card.innerHTML = lines.join("");
        body.appendChild(card);
      }

      // --- the entries themselves
      if ((state.expenses || []).length) {
        const st2 = el("div", "section-t"); st2.textContent = "מה דיווחת"; body.appendChild(st2);
        const led = el("div", "ledger");
        state.expenses.slice(0, 40).forEach((e) => {
          const r = reasonById(e.reason);
          const d = new Date(e.at);
          const row = el("div", "ledrow exrow");
          row.innerHTML = '<span class="leddate">' + String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + '</span>' +
            '<span class="leddesc">' + (e.what ? esc(e.what) : "הוצאה") +
              '<i class="extag ' + r.tone + '">' + r.emoji + " " + r.label + '</i>' +
              (e.cubeName ? '<i class="excube">' + esc(e.cubeName) + '</i>' : "") + '</span>' +
            '<span class="ledamt neg">−₪' + fmt(e.amount) + '</span>';
          led.appendChild(row);
        });
        body.appendChild(led);
      }
      const sp = el("div"); sp.style.height = "40px"; body.appendChild(sp);
    }

    function renderPrivacyPage() {
      const body = pageShell("פרטיות ונתונים 🔒", () => { state.screen = "settings"; render(); });

      // incognito toggle
      const inc = el("div", "setcard swrow");
      inc.innerHTML = '<div><div class="setmail">מצב סמוי 🕶️</div>' +
        '<div class="setlbl" style="margin-top:4px">מטשטש את הסכומים בדשבורד — ריחוף עם העכבר חושף אותם</div></div>' +
        '<button class="sw' + (state.incognito ? " on" : "") + '" id="swIncog" aria-label="מצב סמוי"></button>';
      body.appendChild(inc);
      inc.querySelector("#swIncog").onclick = () => {
        state.incognito = !state.incognito;
        if (state.incognito) state.game.flags.incog = true; // badge
        inc.querySelector("#swIncog").classList.toggle("on", state.incognito);
        secLog("INFO", "מצב סמוי " + (state.incognito ? "הופעל" : "כובה"));
        saveState();
      };

      // export + clear history
      const list = el("div", "setlist");
      const mk = (label, cls, fn) => { const b = el("button", cls); b.textContent = label; b.onclick = fn; list.appendChild(b); };
      mk("🧹 ניקוי היסטוריית פעולות", "setitem", clearHistory);
      body.appendChild(list);

      // What the app does NOT do — stated plainly instead of dumping an event log.
      const st = el("div", "section-t"); st.textContent = "מה נשמר עליך 📋"; body.appendChild(st);
      const facts = el("div", "setcard");
      facts.innerHTML =
        (push.available()
          ? '<div class="privline">🔐 <b>התקציב נשאר במכשיר שלך.</b> הפרופיל, הקוביות והיתרות נשמרים במכשיר בלבד.</div>' +
            '<div class="privline">☁️ <b>מה כן עובר לשרת.</b> הודעות שנשלחות לצ׳אט ה-AI (יחד עם תמונת מצב של הקוביות, כדי שהתשובה תתבסס על המספרים שלך) וההכנסה החודשית הקבועה (סכום, מטבע ואזור זמן) — כדי לענות גם כשהאפליקציה סגורה ולשלוח התראות. מחיקת החשבון מוחקת גם אותם.</div>'
          : '<div class="privline">🔐 <b>הכול נשאר במכשיר שלך.</b> הפרופיל, הקוביות והיתרות נשמרים ב-localStorage של הדפדפן ולא נשלחים לשום שרת.</div>') +
        '<div class="privline">🤝 <b>חיסכון משותף.</b> אם פתחת או הצטרפת לחיסכון משותף, שם התצוגה, המייל, הרישומים וההתראות של אותו חיסכון נשמרים בשרת (Supabase) — כדי שכל המשתתפים יראו את אותם נתונים מכל מכשיר. הם לא נמחקים אוטומטית; חיסכון נמחק רק כשכל המשתתפים מאשרים, ורישומי ההפקדות שלו נשמרים לתיעוד.</div>' +

        '<div class="privline">💳 <b>גם כרטיס נטען לא מחובר.</b> הסכום שבכרטיס הוא מספר שאתה מזין ומעדכן בעצמך — אין גישה לכרטיס האמיתי ואין תנועות נסתרות.</div>' +

    // =====================================================================
    // MODULE 1 — AI Debt & Savings Optimizer.
    // A real month-by-month amortization simulation implementing the Debt
    // Avalanche (highest APR first) and Snowball (lowest balance first) methods,
    // compared against a naive even-split baseline to quantify interest saved.
    // =====================================================================
    // simulate paying a fixed monthly budget with a given priority order.
    function simulateDebts(debts, budget, mode) {
      budget = Math.max(0, +budget || 0); // a negative budget must never grow a debt
      const ds = debts.map((d) => ({ name: d.name, bal: +d.balance, rate: +d.rate }));
      let order;
      if (mode === "snowball") order = [...ds].sort((a, b) => a.bal - b.bal).map((d) => d.name);
      else if (mode === "avalanche") order = [...ds].sort((a, b) => b.rate - a.rate).map((d) => d.name);
      else order = null; // even-split baseline
      let months = 0, interest = 0;
      const payoff = [];
      const CAP = 1200;
      while (ds.some((d) => d.bal > 0.01) && months < CAP) {
        months++;
        // accrue one month of interest on every outstanding balance
        ds.forEach((d) => { if (d.bal > 0) { const i = d.bal * (d.rate / 100 / 12); d.bal += i; interest += i; } });
        let avail = budget;
        if (order) {
          for (const name of order) {
            const d = ds.find((x) => x.name === name);
            if (!d || d.bal <= 0) continue;
            const pay = Math.min(d.bal, avail);
            d.bal -= pay; avail -= pay;
            if (d.bal <= 0.01 && !payoff.find((p) => p.name === name)) payoff.push({ name: name, month: months });
            if (avail <= 0) break;
          }
        } else {
          const active = ds.filter((d) => d.bal > 0);
          const share = budget / active.length;
          active.forEach((d) => { d.bal -= Math.min(d.bal, share); });
        }
      }
      const payable = ds.every((d) => d.bal <= 0.02);
      return { months: payable ? months : Infinity, interest: Math.round(interest), payoff: payoff, payable: payable, order: order };
    }
    function runOptimizer(debts, budget, mode) {
      const opt = simulateDebts(debts, budget, mode);
      const base = simulateDebts(debts, budget, null); // naive even split
      return {
        opt: opt, base: base,
        monthsSaved: (base.payable && opt.payable) ? base.months - opt.months : null,
        interestSaved: (base.payable && opt.payable) ? Math.max(0, base.interest - opt.interest) : null,
        firstTarget: opt.order ? opt.order[0] : null,
      };
    }

    // Smart defaults when the user doesn't know their interest rate —
    // industry-standard estimates per debt type.
    const DEBT_TYPES = [
      { id: "credit", label: "כרטיס אשראי 💳", rate: 8 },
      { id: "loan", label: "הלוואה רגילה 🏦", rate: 4 },
      { id: "overdraft", label: "מינוס/אוברדרפט 📉", rate: 11 },
      { id: "mortgage", label: "משכנתא 🏠", rate: 3.5 },
    ];
    let debtDraft = { name: "", balance: "", rate: "", type: "credit", unknown: false };
    let debtBudget = "";
    let debtMode = "avalanche";
    let debtResult = null;
    function renderDebtPage() {
      const body = pageShell("אופטימיזציית חובות 💳", () => { debtResult = null; state.screen = "app"; render(); });
      const locked = applyPremiumLock(body); // strict lock when isPremiumUser === false
      const totalDebt = state.debts.reduce((s, d) => s + (+d.balance || 0), 0);

      const intro = el("div", "setcard");

      // add-debt form (with debt-type selector + "I don't know my rate")
      const form = el("div", "setcard");

        '<label class="flbl">שם החוב</label><div class="fld"><input id="dName" placeholder="הלוואת רכב" value="' + debtDraft.name + '"></div>' +

        (debtDraft.unknown ? '<div class="unknote">🤖 תוקצה ריבית משוערת של <b>' + DEBT_TYPES.find((t) => t.id === debtDraft.type).rate + '%</b> לפי הסוג שנבחר (סטנדרט בשוק)</div>' : "") +
        '<button class="fchip wide on" id="dAdd" style="margin-top:12px">הוסף חוב לרשימה</button>';
      body.appendChild(form);
      const tr = form.querySelector("#dTypes");
      DEBT_TYPES.forEach((t) => {
        const c = el("button", "fchip" + (debtDraft.type === t.id ? " on" : ""));

        c.onclick = () => { debtDraft.type = t.id; render(); };
        tr.appendChild(c);
      });
      form.querySelector("#dName").oninput = (e) => { debtDraft.name = e.target.value; };
      form.querySelector("#dBal").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); debtDraft.balance = e.target.value; };
      form.querySelector("#dRate").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9.]/g, ""); debtDraft.rate = e.target.value; };
      form.querySelector("#dUnk").onclick = () => { debtDraft.unknown = !debtDraft.unknown; if (debtDraft.unknown) debtDraft.rate = ""; render(); };
      form.querySelector("#dAdd").onclick = () => {
        const tdef = DEBT_TYPES.find((t) => t.id === debtDraft.type);
        const rate = debtDraft.unknown ? tdef.rate : +debtDraft.rate;
        if (!debtDraft.name.trim() || !(+debtDraft.balance > 0) || !(rate >= 0) || (!debtDraft.unknown && debtDraft.rate === "")) { showToast("צריך שם, יתרה וריבית (או לסמן שאינך יודע) 🙂"); return; }
        state.debts.push({ name: debtDraft.name.trim(), balance: +debtDraft.balance, rate: rate, estimated: debtDraft.unknown, type: debtDraft.type });
        if (debtDraft.unknown) showToast("🤖 הוקצתה ריבית משוערת של " + tdef.rate + "% (" + tdef.label.replace(/\s\S+$/, "") + ")");
        debtDraft = { name: "", balance: "", rate: "", type: debtDraft.type, unknown: false };
        debtResult = null; saveState(); render();
      };

      // budget + strategy + run
      const ctrl = el("div", "setcard");
      ctrl.innerHTML = '<label class="flbl">סכום חודשי פנוי להחזרים</label><div class="fld"><span class="cur">₪</span><input id="dBudget" inputmode="numeric" placeholder="2000" value="' + (debtBudget || "") + '"></div>' +
        '<label class="flbl" style="margin-top:12px">שיטה</label>' +
        '<div class="toggle" id="dMode"><button class="' + (debtMode === "avalanche" ? "on" : "") + '" data-m="avalanche">🏔️ מפולת (ריבית גבוהה)</button>' +
        '<button class="' + (debtMode === "snowball" ? "on" : "") + '" data-m="snowball">⛄ כדור שלג (יתרה נמוכה)</button></div>' +
        '<button class="distbtn wide" id="dRun" style="margin-top:14px">🤖 הפעל את מייעל ה-AI</button>';
      body.appendChild(ctrl);
      ctrl.querySelector("#dBudget").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); debtBudget = e.target.value; };
      ctrl.querySelectorAll("#dMode button").forEach((b) => { b.onclick = () => { debtMode = b.dataset.m; render(); }; });
      ctrl.querySelector("#dRun").onclick = () => {
        if (state.debts.length === 0) { showToast("הוסיפו לפחות חוב אחד 🙂"); return; }
        if (!(+debtBudget > 0)) { showToast("הזינו סכום חודשי פנוי 🙂"); return; }
        debtResult = runOptimizer(state.debts, +debtBudget, debtMode);
        state.game.flags.debt = true; saveState(); render();
      };

      // results
      if (debtResult) {
        const r = debtResult;
        const res = el("div", "debtres");
        if (!r.opt.payable) {
          res.innerHTML = '<div class="wiwarn"><b>⚠️ התקציב נמוך מדי:</b> ₪' + fmt(+debtBudget) + ' בחודש לא מכסים אפילו את הריבית המצטברת. נסו להגדיל את הסכום החודשי.</div>';
          body.appendChild(res); return;
        }
        const y = Math.floor(r.opt.months / 12), mo = r.opt.months % 12;
        res.innerHTML =
          (r.interestSaved != null ? '<div class="savebadge">💰 חסכת ₪' + fmt(r.interestSaved) + ' בריביות!</div>' : "") +
          '<div class="debtstats">' +
            '<div class="dstat"><span class="dsl">להתחיל מ־</span><b>' + r.firstTarget + '</b></div>' +
            '<div class="dstat"><span class="dsl">חופש מחובות תוך</span><b>' + r.opt.months + ' חודשים' + (y ? ' (' + y + ' ש׳ ' + mo + ' ח׳)' : "") + '</b></div>' +
            (r.monthsSaved != null && r.monthsSaved > 0 ? '<div class="dstat"><span class="dsl">מהיר יותר ב־</span><b>' + r.monthsSaved + ' חודשים</b></div>' : "") +
          '</div>' +
          '<div class="section-t" style="margin:16px 2px 10px">לוח סילוקין (סדר החזר)</div>';
        const sched = el("div", "sched");
        r.opt.payoff.forEach((p, i) => {
          const step = el("div", "schedstep");
          step.innerHTML = '<span class="stepn">' + (i + 1) + '</span><div><b>' + p.name + '</b><span>יסולק בחודש ה-' + p.month + '</span></div><span class="stepok">✓</span>';
          sched.appendChild(step);
        });
        res.appendChild(sched);
        const apply = el("button", "distbtn wide"); apply.textContent = "📥 עדכן את קוביות החוב והחיסכון"; apply.style.marginTop = "14px";
        apply.onclick = () => applyDebtPlan(r);
        res.appendChild(apply);
        body.appendChild(res);
      }
    }
    function applyDebtPlan(r) {
      const income = state.profile && state.profile.works ? (+state.profile.income || 0) : 0;
      const totalDebt = state.debts.reduce((s, d) => s + (+d.balance || 0), 0);
      // Debt Cube: monthly repayment plan
      let debtCube = state.cubes.find((c) => c.key === "debt_plan");
      if (!debtCube) {
        debtCube = { key: "debt_plan", name: "החזר חובות", emoji: "💳", color: "#e17055",
          note: "תוכנית " + (debtMode === "avalanche" ? "מפולת" : "כדור שלג"), pct: income > 0 ? Math.round((+debtBudget / income) * 1000) / 10 : 0,
          amount: +debtBudget, locked: false, balance: 0, custom: true };
        state.cubes.push(debtCube);
      } else { debtCube.amount = +debtBudget; }
      debtCube.note = "₪" + fmt(totalDebt) + " · " + (debtMode === "avalanche" ? "מפולת" : "כדור שלג");
      // Savings Cube: reflect the projected monthly interest saved
      const sav = state.cubes.find((c) => c.key === "savings");
      if (sav && r.interestSaved != null && r.opt.months > 0) {
        sav.projectedMonthlySave = Math.round(r.interestSaved / r.opt.months);
        if (sav.projectedMonthlySave > 0) sav.note = "כולל ₪" + fmt(sav.projectedMonthlySave) + " שנחסכים מריבית";
      }
      state.game.flags.debtApplied = true;
      saveState(); render();
      showToast("✅ קוביית החוב עודכנה · חיסכון צפוי ₪" + fmt(r.interestSaved || 0));
    }


    // =====================================================================
    // AGENT 1 — Gatekeeper: paywall, Google Play billing simulation, and
    // server-side purchase verification. During a session isPremiumUser
    // (state.premium) is granted ONLY inside verifyGooglePlayPurchase after the
    // token handshake passes — no UI path flips it directly. (It is also
    // rehydrated from localStorage on load; in a real build the entitlement
    // would be verified server-side rather than trusted from the client.)
    // =====================================================================
    // ─────────────────────────────────────────────────────────────────────
    //  Real Google Play Billing (Android wrapper only).
    //  The native side owns the purchase, acknowledges it with Google and
    //  reports ownership back here. In a plain browser none of this exists and
    //  the app falls back to the clearly-labelled local simulation.
    // ─────────────────────────────────────────────────────────────────────
    let nativePrice = null;      // Premium, as Google reports it
    let premiumBuying = false;   // inside Google's sheet for AI Premium right now
    const PREMIUM_PENDING_MSG = "⏳ התשלום ממתין לאישור — צ׳אט ה-AI והסרת הפרסומות ייפתחו ברגע שהתשלום יושלם";
    const PREMIUM_OTHER_ACCOUNT_MSG = "חשבון Google Play הזה כבר רכש AI Premium עבור חשבון אחר באפליקציה. התחברו לחשבון ההוא כדי ליהנות ממנו";
    let nativeBookPrice = null;  // the guide book, as Google reports it
    const nativeBilling = {
      available() { return !!(nativeApp && nativeApp.buyPremium); },
      // An older APK may not carry the book methods, so this is checked apart
      // from available() -- otherwise the page would call into nothing.
      bookAvailable() { return !!(nativeApp && nativeApp.buyBook); },
      buy() {
        try {
          showToast("פותח את החנות של Google Play…");
          premiumBuying = true;
          nativeApp.buyPremium();
        } catch (e) { premiumBuying = false; showToast("לא הצלחתי לפתוח את החנות"); }
      },
      buyBook() {
        try {
          showToast("פותח את החנות של Google Play…");
          nativeApp.buyBook();
          return true;
        } catch (e) { showToast("לא הצלחתי לפתוח את החנות"); return false; }
      },
      restore() {
        try {
          if (nativeApp && nativeApp.restorePremium) nativeApp.restorePremium();   // answers in onRestoreResult
          else if (nativeApp && nativeApp.restorePurchases) nativeApp.restorePurchases();
        } catch (e) {}
      },
    };

    // Set while the user is inside Google's sheet for the book. It is what
    // separates "they just bought it" (open the reader) from "Play told us at
    // launch that they already own it" (unlock quietly, do not hijack the app).
    let bkAwaitingPlay = null;   // the book id being bought, or null
    // Callbacks invoked from Java (see MainActivity#callJs). Google is the only
    // authority on what this account owns: no UI path grants an entitlement in
    // the Android build, it is always Play reporting back through here.
    window.CubeyBilling = {
      onOwnershipChanged(productId, owned) {
        // Normally onPurchaseResult takes the sheet down, but ownership can
        // also land on its own — a purchase that was PENDING at the till, or a
        // restore arriving while the scrim is up. Without this the user is left
        // staring at a full-screen invisible blocker with no way out.
        if (owned) closeBillingSheetIfOpen();
        // The guide book only. AI Premium belongs to an app account and
        // arrives through onEntitlement below, after the purchase was checked.
        if (productId === BOOK_PRODUCT_ID) applyBookOwnership(!!owned);
      },
      // AI Premium (AI chat + no ads) for the signed-in account, decided on the
      // native side from Google Play (and the server, where set up). This is
      // the only thing that changes state.premium in the Android app.
      //   entitled: true / false / null (not known yet — leave things alone)
      //   event:    "purchase" when a purchase just completed in this session
      onEntitlement(email, entitled, reason, event) {
        if (!state.authUser || !email || normEmail(email) !== normEmail(state.authUser.email)) return;
        if (entitled === null || entitled === undefined) return;
        // Native already put complimentary first; record it for the guide books.
        compl = { account: state.authUser.id, ok: !!entitled && reason === "complimentary", grantedPremium: false };
        const had = !!state.premium;
        if (entitled) closeBillingSheetIfOpen();
        if (had !== !!entitled) {
          state.premium = !!entitled;
          saveState();
          render();
        }
        if (entitled && event === "purchase") {
          premiumBuying = false;
          burstCoins("🎉");
          showToast("הרכישה הושלמה! צ׳אט ה-AI זמין והפרסומות הוסרו 🎉");
        } else if (!entitled && premiumBuying && reason === "other_account") {
          premiumBuying = false;
          showToast(PREMIUM_OTHER_ACCOUNT_MSG);
        } else if (had && !entitled && (reason === "none" || reason === "server_rejected")) {
          // refunded or revoked
          showToast("רכישת AI Premium כבר לא בתוקף בחשבון הזה");
        }
      },
      onRestoreResult(entitled, reason) {
        if (entitled) showToast("👑 הרכישה שוחזרה — צ׳אט ה-AI פתוח והפרסומות הוסרו");
        else if (reason === "other_account") showToast(PREMIUM_OTHER_ACCOUNT_MSG);
        else if (reason === "pending") showToast(PREMIUM_PENDING_MSG);
        else showToast("לא נמצאה רכישת AI Premium בחשבון Google Play הזה");
      },
      onPurchaseResult(productId, ok, reason) {
        closeBillingSheet();
        if (productId === BOOK_PRODUCT_ID) {
          if (ok) { applyBookOwnership(true); return; }  // grants, then opens the reader
          bkAwaitingPlay = null;
          if (reason) showToast("❌ הרכישה לא הושלמה: " + reason);
          else showToast("הרכישה בוטלה");
          return;
        }
        if (ok) return;                    // onEntitlement does the unlocking, once checked
        premiumBuying = false;
        if (reason && reason.indexOf("התשלום ממתין") === 0) showToast(PREMIUM_PENDING_MSG);
        else if (reason) showToast("❌ הרכישה לא הושלמה: " + reason);
        else showToast("הרכישה בוטלה");
      },
      // Billing could not be set up, or Play will not return the products.
      onBillingUnavailable(detail) {
        closeBillingSheetIfOpen();
        showToast("⚠️ החיוב אינו זמין: " + (detail || "שגיאה לא ידועה"));
      },

      const drift = Math.round(w.amount * (wsTotalPct(w) / 100)) - assigned;
      for (let i = rows.length - 1; i >= 0 && drift !== 0; i--) { if (rows[i].amount > 0) { rows[i].amount += drift; break; } }
      return rows;
    }
    function wsSave() { saveState(); }

      wrong_account: "הקוד הזה נשלח למייל אחר. היכנסו עם החשבון של המייל שהוזמן.",
      goal_full: "החיסכון הזה מלא (עד 12 משתתפים).",
      goal_deleted: "החיסכון הזה כבר נמחק.",
      rate_limited: "יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.",
      not_member: "את/ה כבר לא חבר/ה בחיסכון הזה.",
      bad_input: "צריך שם וסכום יעד 🙂",
      bad_amount: "סכום לא תקין.",
      bad_email: "כתובת אימייל לא תקינה",
      too_many_goals: "אפשר לפתוח עד 20 חסכונות משותפים.",
      key_reused: "הפעולה כבר נרשמה עם סכום אחר.",
      last_member: "את/ה המשתתף/ת האחרון/ה — אפשר לבקש מחיקה במקום יציאה.",
      consent_required: "צריך לסמן את האישור כדי להפעיל הפקדה חודשית.",
      no_recurring: "ההפקדה החודשית כבויה בחיסכון הזה.",
      not_yours: "אפשר לבטל רק רישום שלך.",
      not_reversible: "את הרישום הזה אי אפשר לבטל.",
      pending_payments: "יש תשלומים שעדיין ממתינים — אי אפשר למחוק עד שיסתיימו.",
      request_invalidated: "בקשת המחיקה בוטלה כי היו שינויים בחיסכון. אפשר לבקש שוב.",
      request_rejected: "בקשת המחיקה כבר נדחתה.",
      request_cancelled: "בקשת המחיקה בוטלה.",
      request_completed: "החיסכון כבר נמחק.",
      no_request: "בקשת המחיקה לא נמצאה.",
    };
    const shErr = (code) => SH_ERR[code] || "משהו השתבש. נסו שוב.";
    // Errors that mean "the server said no" — the action will not succeed by retrying.
    const SH_FINAL = new Set(["not_member", "goal_deleted", "bad_amount", "key_reused", "no_recurring", "bad_period", "bad_source", "bad_key", "no_profile"]);

    // ---- state ------------------------------------------------------------------
    let shState;
    function sharedReset() {
      clearTimeout(shState && shState.pollTimer);
      shState = {
        phase: "idle",                 // idle | verify | ready
        verify: { step: "send", busy: false, error: "" },
        loaded: false, loading: false, error: "", stale: false,
        goals: [], unread: 0, notes: [], notesOpen: false,
        form: null, newKey: null, invite: null, lastCode: null,
        join: { busy: false, msg: "", ok: false },
        open: {},                      // goalId -> "history" | "recurring" | "delete" | "invite"
        history: {},                   // goalId -> entries
        focus: null, pollTimer: null, armed: {},
        profile: null, profEdit: false, search: null, invites: {}, legacyConflict: false,
      };
    }
    sharedReset();

    // Per-account local stores. The server is the record; these only make the
    // screen work offline and hold actions that have not been confirmed yet.
    const shLsKey = (k) => "cubefinance_web:" + k + ":" + (state.authUser ? state.authUser.id : "anon");
    const shGet = (k, dflt) => { try { const v = JSON.parse(localStorage.getItem(shLsKey(k)) || "null"); return v == null ? dflt : v; } catch (e) { return dflt; } };
    const shPut = (k, v) => { try { localStorage.setItem(shLsKey(k), JSON.stringify(v)); } catch (e) {} };
    // queue:  [{ key, goalId, goalName, amountMinor, source, period, at, state: pending|failed, error, sent, plan }]
    // local:  { goalId: agorot this device took out of its own cubes for that goal }
    const shQueue = () => shGet("shq", []);
    const shLocal = () => shGet("shlocal", {});

    // ---- sync ---------------------------------------------------------------------
    async function sharedEnsureProfile() {
      if (shState.profileOk) return;
      // The v1 device token (if this phone created a v1 profile) is the proof
      // that lets that old profile and its goals be claimed — never the email alone.
      let legacy = null;
      try { legacy = localStorage.getItem("cubefinance_web:cloud:" + state.authUser.id); } catch (e) {}
      const r = okOrThrow(await rpc2("cf2_register", { p_name: cloudName(), p_legacy_token: legacy && legacy.length >= 32 ? legacy : null }));
      shState.profile = r.profile || null;
      shState.legacyConflict = !!r.legacy_conflict;
      shState.profileOk = true;
      sharedRegisterDevice();
    }
    // The person's own name, if they gave one (e.g. from Google sign-in) —
    // never the email or a piece of it.
    function cloudName() {
      const u = state.authUser && loadUsers()[state.authUser.email];
      return (u && u.name) || "";
    }
    // FCM token → this account on the server (multi-device: one row per install).
    function sharedRegisterDevice() {
      try { if (nativeApp && nativeApp.requestFcmToken) nativeApp.requestFcmToken(); } catch (e) {}
    }
    async function sharedOnFcmToken(token) {
      if (!token || !state.authUser || !sbLoad() || !nativeApp || !nativeApp.pushInstallId) return;
      try { await rpc2("cf2_register_device", { p_install: nativeApp.pushInstallId(), p_token: token }); } catch (e) {}
    }

    async function loadShared(silent) {
      if (!state.authUser) return;
      if (!sbLoad()) { shState.phase = "verify"; shState.loaded = true; if (state.screen === "shared") render(); return; }
      shState.phase = "ready";
      if (shState.loading) return;
      shState.loading = true;
      if (!silent) shState.error = "";
      const who = state.authUser.id;
      try {
        await sharedEnsureProfile();
        await sharedFlush();
        const [r, n] = await Promise.all([rpc2("cf2_my_goals", {}), rpc2("cf2_notifications", { p_after_seq: 0 })]);
        if (!state.authUser || state.authUser.id !== who) return;
        okOrThrow(r); okOrThrow(n);
        sharedApplyDeletions(n.items || []);
        shState.goals = r.goals || [];
        shState.unread = n.unread || 0;
        shState.notes = n.items || [];
        shState.error = ""; shState.stale = false;
        shPut("shcache", { goals: shState.goals, notes: shState.notes, unread: shState.unread, at: Date.now() });
        for (const gid of Object.keys(shState.history)) sharedLoadHistory(gid, true);
      } catch (e) {
        if (e.code === "need_verify") { shState.phase = "verify"; }
        else {
          shState.error = e.code || "network";
          const c = shGet("shcache", null);
          if (c && !shState.goals.length) { shState.goals = c.goals || []; shState.notes = c.notes || []; shState.unread = c.unread || 0; }
          shState.stale = true;
        }
      } finally {
        shState.loading = false; shState.loaded = true;
      }
      // A background refresh never redraws under someone's fingers: while a
      // field is focused the data is updated and drawn on the next render.
      const typing = silent && document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
      if (state.screen === "shared" && !typing) render();
      sharedUpdateBadge();
    }

    // While the screen is open: refresh every few seconds, so a contribution
    // on another phone shows here without a manual refresh.
    function sharedPoll() {
      clearTimeout(shState.pollTimer);
      if (state.screen !== "shared" || !state.authUser || shState.phase !== "ready") return;
      shState.pollTimer = setTimeout(async () => {
        if (state.screen === "shared" && !document.hidden) await loadShared(true);
        sharedPoll();
      }, SH_POLL_MS);
    }

    // On every app open (and back from the background): flush what is queued
    // and pick up notifications that arrived while away — push or no push.
    async function sharedOnEnter(user) {
      if (!state.authUser || state.authUser !== user || !sbLoad()) return;
      const before = shGet("shcache", { notes: [] }).notes.reduce((m, n) => Math.max(m, n.seq || 0), 0);
      await loadShared(true);
      const fresh = (shState.notes || []).filter((n) => !n.read_at && (n.seq || 0) > before);
      if (fresh.length && state.screen !== "shared") showToast("🔔 " + (fresh.length === 1 ? sharedNoteText(fresh[0]) : "יש לך " + fresh.length + " עדכונים חדשים בחיסכון המשותף"));
    }

    function sharedUpdateBadge() {
      document.querySelectorAll("[data-shbadge]").forEach((b) => { b.textContent = shState.unread ? String(shState.unread) : ""; b.hidden = !shState.unread; });
    }

    // A goal everyone agreed to delete: the money THIS device took out of its
    // cubes for it goes back to the free balance — once.
    function sharedApplyDeletions(notes) {
      const local = shLocal();
      const done = shGet("shreturned", []);
      let back = 0;
      notes.filter((n) => n.kind === "goal_deleted" && done.indexOf(n.goal_id) === -1).forEach((n) => {
        done.push(n.goal_id);
        const amt = Math.max(0, local[n.goal_id] || 0);
        if (amt > 0) { state.pool += amt / 100; back += amt; }
        delete local[n.goal_id];
      });
      if (done.length) shPut("shreturned", done.slice(-200));
      shPut("shlocal", local);
      if (back > 0) { saveState(); showToast("💸 " + fmtMinor(back) + " שרשמת בחיסכון שנמחק חזרו ליתרה הפנויה"); }
    }

    // ---- contributions: local queue → server -------------------------------------------
    function sharedQueueContribution(goal, amountMinor, source, period) {
      const q = shQueue();
      const key = source === "recurring" ? "rec:" + goal.id + ":" + period
        : "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      if (q.some((o) => o.key === key)) return { ok: false, reason: "queued" };
      if (source === "recurring" && shGet("shrecdone", []).indexOf(key) !== -1) return { ok: false, reason: "done" };
      const plan = buildFundingPlan(amountMinor / 100, null);
      if (!plan) return { ok: false, reason: "funds" };
      plan.forEach((s) => {
        if (s.key === "__pool") state.pool = Math.max(0, state.pool - s.amount);
        else { const c = state.cubes.find((x) => x.key === s.key); if (c) c.balance = Math.max(0, c.balance - s.amount); }
      });
      saveState();
      q.push({ key: key, goalId: goal.id, goalName: goal.name, amountMinor: amountMinor, source: source, period: period || null,
               at: Date.now(), state: "pending", error: "", sent: false, plan: plan });
      shPut("shq", q);
      return { ok: true, key: key };
    }
    function sharedRefund(op) {
      (op.plan || []).forEach((s) => {
        if (s.key === "__pool") state.pool += s.amount;
        else { const c = state.cubes.find((x) => x.key === s.key); if (c) c.balance += s.amount; else state.pool += s.amount; }
      });
      saveState();
    }
    let shFlushing = null;
    function sharedFlush() {
      if (shFlushing) return shFlushing;
      shFlushing = (async () => {
        let q = shQueue();
        for (const op of q.filter((o) => o.state === "pending")) {
          const firstTry = !op.sent;
          op.sent = true; shPut("shq", q);
          let r;
          try {
            r = await rpc2("cf2_contribute", { p_goal: op.goalId, p_amount_minor: op.amountMinor, p_key: op.source === "manual" ? op.key : null,
                                               p_source: op.source, p_period: op.period });
          } catch (e) { break; }   // offline / not verified: stays pending, nothing changes
          q = shQueue();
          const cur = q.find((o) => o.key === op.key);
          if (!cur) continue;
          if (r && r.ok) {
            if (r.duplicate && firstTry && op.source === "recurring") {
              sharedRefund(cur);   // another device already recorded this month — keep this device's money
            } else {
              const local = shLocal(); local[op.goalId] = (local[op.goalId] || 0) + op.amountMinor; shPut("shlocal", local);
              if (op.source === "manual" && !r.duplicate) showToast("✅ נרשמה הפקדה של " + fmtMinor(op.amountMinor) + " ב\"" + op.goalName + "\"");
            }
            if (op.source === "recurring") { const d = shGet("shrecdone", []); d.push(op.key); shPut("shrecdone", d.slice(-300)); }
            q = q.filter((o) => o.key !== op.key);
          } else if (r && SH_FINAL.has(r.error)) {
            sharedRefund(cur);
            cur.state = "failed"; cur.error = r.error;
          } else {
            break;   // unknown answer: try again later
          }
          shPut("shq", q);
        }
      })().finally(() => { shFlushing = null; });
      return shFlushing;
    }
    window.addEventListener("online", () => { if (state.authUser && sbLoad()) loadShared(true); });

    // Monthly opt-in contribution: when this month's income is put into the
    // cubes, record the share the member chose. A bookkeeping entry only —
    // income being recorded never authorizes a charge or a transfer.
    function sharedRecurringAfterIncome(incomeShekels, month) {
      if (!state.authUser) return;
      const goals = (shState.goals && shState.goals.length ? shState.goals : (shGet("shcache", { goals: [] }).goals || []));
      let queued = 0;
      goals.forEach((g) => {
        const amt = sharedRecurringAmount(g.my_recurring, incomeShekels);
        if (!amt) return;
        const r = sharedQueueContribution(g, amt, "recurring", month);
        if (r.ok) queued++;
      });
      if (queued) { showToast("🤝 נרשמה הפקדה חודשית ל-" + queued + " חיסכון/ות משותף/ים"); if (sbLoad()) sharedFlush().then(() => loadShared(true)); }
    }
    function sharedRecurringAmount(rec, incomeShekels) {
      if (!rec) return 0;
      if (rec.mode === "fixed") return Number(rec.value) || 0;
      if (rec.mode === "percent") return Math.round((Number(incomeShekels) || 0) * (Number(rec.value) || 0) / 10000) * 100;
      return 0;
    }

    // ---- texts ---------------------------------------------------------------------------
    function sharedNoteText(n) {
      const who = n.actor_name || "משתתף/ת", goal = "״" + (n.goal_name || "") + "״";
      const amt = n.amount_minor != null ? fmtMinor(n.amount_minor) : "";
      switch (n.kind) {
        case "member_joined": return who + " הצטרף/ה לחיסכון המשותף " + goal + ".";
        case "invited": return who + " הזמין/ה אותך לחיסכון המשותף " + goal + ".";
        case "contribution": return who + " רשם/ה הפקדה של " + amt + " לחיסכון המשותף " + goal + ".";
        case "recurring": return who + " רשם/ה הפקדה חודשית של " + amt + " לחיסכון המשותף " + goal + ".";
        case "reversal": return who + " ביטל/ה רישום של " + amt + " בחיסכון המשותף " + goal + ".";
        case "member_left": return who + " יצא/ה מהחיסכון המשותף " + goal + ".";
        case "deletion_requested": return who + " ביקש/ה למחוק את החיסכון המשותף " + goal + ". נדרש אישור שלך.";
        case "deletion_rejected": return who + " דחה/תה את בקשת המחיקה של " + goal + ". החיסכון נשאר.";
        case "deletion_cancelled": return who + " ביטל/ה את בקשת המחיקה של " + goal + ".";
        case "deletion_invalidated": return "בקשת המחיקה של " + goal + " בוטלה כי היו שינויים בחיסכון. אפשר לבקש שוב.";
        case "goal_deleted": return "כל המשתתפים אישרו — החיסכון המשותף " + goal + " נמחק.";
        default: return "יש עדכון חדש בחיסכון המשותף";
      }
    }
    function sharedEntryText(e) {
      const who = e.me ? "את/ה" : e.name;
      const amt = fmtMinor(Math.abs(e.amount_minor));
      if (e.kind === "deposit") return who + " " + (e.me ? "רשמת" : "רשם/ה") + " הפקדה של " + amt + " לחיסכון המשותף.";
      if (e.kind === "recurring") return who + " " + (e.me ? "רשמת" : "רשם/ה") + " הפקדה חודשית של " + amt + (e.period ? " (" + e.period + ")" : "") + ".";
      if (e.kind === "reversal") return who + " " + (e.me ? "ביטלת" : "ביטל/ה") + " רישום של " + amt + ".";
      if (e.kind === "opening") return who + ": יתרת פתיחה של " + amt + " (מהגרסה הקודמת).";
      return who + ": " + amt;
    }

    // ---- page ----------------------------------------------------------------------------
    function renderSharedPage() {
      const body = pageShell("חיסכון משותף 🤝", () => {
        shState.form = null; shState.invite = null; clearTimeout(shState.pollTimer); state.screen = "app"; render();
      });
      if (!shState.loaded && !shState.loading) loadShared(false);
      if (shState.phase === "verify") { body.appendChild(sharedVerifyCard()); return; }

      const intro = el("p", "termupd");
      intro.textContent = "חוסכים ביחד עם חברים ובני משפחה. כל הפקדה היא רישום: הסכום יורד מהקוביות שלך ונרשם בחיסכון המשותף — האפליקציה לא מעבירה כסף אמיתי.";
      body.appendChild(intro);

      body.appendChild(sharedInboxCard());
      body.appendChild(sharedProfileCard());
      sharedPermissionHint(body);

      const row = el("div", "frow");
      row.style.cssText = "gap:8px;margin-bottom:12px";
      const bNew = el("button", "addcube"); bNew.style.flex = "1";
      bNew.innerHTML = '<span class="addicon">＋</span><span>חיסכון משותף חדש</span>';
      bNew.onclick = () => { shState.form = shState.form === "new" ? null : "new"; shState.newKey = "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); render(); };
      const bJoin = el("button", "addcube"); bJoin.style.flex = "1";
      bJoin.innerHTML = '<span class="addicon">🔑</span><span>יש לי קוד הצטרפות</span>';
      bJoin.onclick = () => { shState.form = shState.form === "join" ? null : "join"; shState.join = { busy: false, msg: "", ok: false }; render(); };
      row.appendChild(bNew); row.appendChild(bJoin);
      body.appendChild(row);

      if (shState.form === "new") body.appendChild(sharedNewForm());
      if (shState.form === "join") body.appendChild(sharedJoinForm());

      if (shState.legacyConflict) {
        const c = el("div", "setcard");
        c.innerHTML = '<div class="setlbl">ℹ️ נמצא בשרת גם פרופיל ישן מהגרסה הקודמת עם המייל הזה. כדי לא לערבב בין חשבונות הוא לא חובר אוטומטית.</div>';
        body.appendChild(c);
      }
      if (shState.error) {
        const c = el("div", "setcard");
        c.innerHTML = '<div class="unknote">⚠️ ' + esc(shErr(shState.error)) + (shState.stale && shState.goals.length ? " מוצגים הנתונים האחרונים שנשמרו." : "") + '</div>' +
          '<button class="fchip on" id="shRetry" style="margin-top:10px">🔄 נסו שוב</button>';
        c.querySelector("#shRetry").onclick = () => loadShared(false);
        body.appendChild(c);
      }
      if (shState.loading && !shState.goals.length) {
        const p = el("p", "termupd"); p.textContent = "טוען… ⏳"; body.appendChild(p);
      } else if (shState.loaded && !shState.goals.length && !shState.form && !shState.error) {
        const p = el("p", "termupd"); p.textContent = "אין עדיין חיסכון משותף — פתחו אחד והזמינו חבר, או הצטרפו עם קוד.";
        body.appendChild(p);
      }
      shState.goals.forEach((g) => body.appendChild(cloudGoalCard(g)));
      // queued actions for goals that are gone from the list
      const orphan = shQueue().filter((o) => !shState.goals.some((g) => g.id === o.goalId));
      if (orphan.length) body.appendChild(sharedQueueList(orphan));

      if (state.shared && state.shared.length) {
        const h = el("h3"); h.textContent = "קוביות משותפות ישנות (הדגמה, רק במכשיר הזה)";
        h.style.cssText = "font-size:14px;color:var(--dim);margin:22px 0 8px";
        body.appendChild(h);
        state.shared.forEach((sc) => body.appendChild(legacySharedCard(sc)));
      }
      if (shState.focus) {
        const target = body.querySelector('[data-goal="' + CSS.escape(shState.focus) + '"]');
        shState.focus = null;
        if (target) { setTimeout(() => target.scrollIntoView({ block: "center", behavior: "smooth" }), 60); target.classList.add("shfocus"); setTimeout(() => target.classList.remove("shfocus"), 2200); }
      }
      sharedPoll();
    }

    // Once per account (and again only if the session is ever revoked): the
    // account's own email gets a code from Supabase. That is what lets the same
    // goals open on another phone, after a reinstall, or after logging out.
    function sharedVerifyCard() {
      const v = shState.verify;
      const c = el("div", "setcard");
      c.innerHTML = '<h3 style="margin:0 0 6px">חיבור החיסכון המשותף לחשבון 🔐</h3>' +
        '<p class="termupd" style="margin:0 0 10px">החסכונות המשותפים נשמרים בשרת ושייכים לחשבון שלך — לא למכשיר. כדי לפתוח אותם נאמת פעם אחת את המייל <b dir="ltr">' + esc(state.authUser.email) + '</b>. אחרי זה הם זמינים מכל מכשיר שבו תתחבר/י.</p>' +
        (v.step === "code"
          ? '<div class="fld"><input id="sbCode" inputmode="numeric" maxlength="6" dir="ltr" placeholder="123456" style="letter-spacing:6px;text-align:center;font-weight:900"></div>' +
            '<button class="distbtn wide" id="sbVerify" style="margin-top:10px"' + (v.busy ? " disabled" : "") + '>' + (v.busy ? "מאמת…" : "אימות") + '</button>' +
            '<button class="obback" id="sbResend">שליחת קוד חדש</button>'
          : '<button class="distbtn wide" id="sbSend"' + (v.busy ? " disabled" : "") + '>' + (v.busy ? "שולח…" : "📧 שליחת קוד למייל") + '</button>') +
        (v.error ? '<div class="aerr">' + esc(shErr(v.error)) + '</div>' : "");
      const send = async () => {
        v.busy = true; v.error = ""; render();
        try { await sbSendCode(); v.step = "code"; } catch (e) { v.error = e.code || "network"; }
        v.busy = false; render();
      };

    function sharedPermissionHint(body) {
      if (!nativeApp || !nativeApp.pushPermissionState) return;

      try { perm = nativeApp.pushPermissionState(); } catch (e) {}
      if (perm === "granted") return;
      const c = el("div", "setcard");
      c.innerHTML = '<div class="setlbl">ההתראות כבויות במכשיר — עדכונים יופיעו רק כאן, בתיבת ההתראות.</div>' +
        '<button class="fchip on" id="shPerm" style="margin-top:8px">' + (perm === "blocked" ? "פתיחת הגדרות ההתראות" : "אפשר התראות") + '</button>';

    function sharedAskPermissionOnce() {

        const p = nativeApp.pushPermissionState();

    // Joining: success is shown ONLY after the server said the membership is
    // saved. A lost response is recovered by asking again with the same code —
    // the server returns the same membership instead of "invalid".
    function sharedJoinForm() {
      const j = shState.join;
      const f = el("div", "setcard");
      f.innerHTML = '<h3 style="margin:0 0 6px">הצטרפות עם קוד</h3>' +
        '<p class="termupd" style="margin:0 0 10px">הקלידו את הקוד בן 6 הספרות שקיבלתם במייל או בווטסאפ.</p>' +
        '<div class="fld"><input id="shCode" inputmode="numeric" maxlength="6" dir="ltr" placeholder="123456" style="letter-spacing:6px;text-align:center;font-weight:900"' + (j.busy ? " disabled" : "") + '></div>' +

        (j.msg ? '<div class="' + (j.ok ? "wisafe" : "aerr") + '" style="margin-top:10px">' + esc(j.msg) + '</div>' : "") +
        '<button class="obback" id="shJoinCancel">ביטול</button>';

    async function sharedJoin(code) {
      const j = shState.join;
      if (!/^\d{6}$/.test(code || "")) { showToast("הקוד הוא 6 ספרות"); return; }
      j.busy = true; j.msg = ""; j.ok = false; j.code = code; render();
      let r = null, lastErr = "network";
      for (let attempt = 0; attempt < 4 && !r; attempt++) {
        try { r = await rpc2("cf2_accept_invite", { p_code: code }); }
        catch (e) {
          lastErr = e.code || "network";
          if (lastErr !== "network") break;
          if (attempt === 0) { j.msg = "החיבור איטי — בודקים מול השרת אם ההצטרפות נשמרה…"; render(); }
          await new Promise((res) => setTimeout(res, 1200 * (attempt + 1)));
        }
      }
      j.busy = false;
      if (!r) {
        // Not confirmed. The same code can be sent again safely; nothing is shown as joined.
        j.msg = shErr(lastErr) + " ההצטרפות לא אושרה עדיין — אפשר ללחוץ שוב, זה בטוח.";
        render(); return;
      }
      if (!r.ok) { j.msg = shErr(r.error); render(); return; }
      j.ok = true; j.msg = "הצטרפת בהצלחה לחיסכון המשותף";
      burstCoins("🤝");
      showToast("הצטרפת בהצלחה לחיסכון המשותף" + (r.goal_name ? " ״" + r.goal_name + "״" : ""));
      sharedAskPermissionOnce();
      shState.focus = r.goal_id;
      await loadShared(true);
      shState.form = null;
      render();
    }

    const SH_COLORS = ["#6c5ce7", "#74B9FF", "#FD79A8", "#55EFC4", "#FAB1A0", "#f5b544", "#00CEC9", "#e8845e"];

    function cloudGoalCard(g) {
      const members = g.members || [];
      const total = Number(g.balance_minor) || 0;

      const pct = Math.min(100, Math.round((total / target) * 100));
      const queued = shQueue().filter((o) => o.goalId === g.id);

        '<div class="shsum">' + fmtMinor(total) + ' <span>מתוך ' + fmtMinor(target) + ' · ' + members.length + ' משתתפים · יתרה מאושרת בשרת</span></div>' +
        '<div class="chtrack big"><i style="width:' + pct + '%"></i></div>' +

        '<div class="shparts"></div>' +
        (g.deletion ? '<div class="shdel"></div>' : "") +
        '<div class="shactions">' +
          '<div class="fld small"><span class="cur">₪</span><input inputmode="numeric" placeholder="200" class="shAmt"></div>' +
          '<button class="distbtn shAdd">רישום הפקדה</button>' +
        '</div>' +
        '<div class="frow" style="gap:8px;margin-top:10px;flex-wrap:wrap">' +
          '<button class="fchip' + (mode === "invite" ? " on" : "") + ' shInv">👥 הזמנת חבר</button>' +
          '<button class="fchip' + (mode === "history" ? " on" : "") + ' shHist">🧾 היסטוריה</button>' +
          '<button class="fchip' + (mode === "recurring" ? " on" : "") + ' shRec">🔁 הפקדה חודשית' + (g.my_recurring ? " ✓" : "") + '</button>' +
          '<button class="fchip shLeave">🚪 יציאה</button>' +
          (g.deletion ? "" : '<button class="fchip shDelReq">🗑️ בקשת מחיקה</button>') +
        '</div>' +
        '<div class="shpanel"></div>';
      const parts = card.querySelector(".shparts");
      members.forEach((m, i) => {
        const c = Number(m.contributed_minor) || 0;

          '<div class="shptrack"><i style="width:' + mp + '%;background:' + SH_COLORS[i % SH_COLORS.length] + '"></i></div>' +
          '<span class="shpamt">' + fmtMinor(c) + '</span>';
        parts.appendChild(r);
      });
      if (queued.length) card.insertBefore(sharedQueueList(queued), card.querySelector(".shactions"));
      if (g.deletion) sharedDeletionPanel(g, card.querySelector(".shdel"));

      const amt = card.querySelector(".shAmt");
      amt.oninput = () => { amt.value = amt.value.replace(/[^0-9]/g, ""); };
      card.querySelector(".shAdd").onclick = () => {
        const amount = Number(amt.value) || 0;
        if (amount <= 0) return;
        const r = sharedQueueContribution(g, toMinor(amount), "manual", null);
        if (!r.ok) { showToast(r.reason === "funds" ? "אין מספיק כסף פנוי בקוביות 🙂" : "הפעולה כבר בתור"); return; }
        amt.value = "";
        render();
        sharedFlush().then(() => loadShared(true));
      };
      const toggle = (m) => () => { shState.open[g.id] = mode === m ? "" : m; if (m === "invite") shState.invite = { goalId: g.id, email: "", result: null }; render(); };
      card.querySelector(".shInv").onclick = toggle("invite");
      card.querySelector(".shHist").onclick = () => { toggle("history")(); if (shState.open[g.id] === "history") sharedLoadHistory(g.id, false); };
      card.querySelector(".shRec").onclick = toggle("recurring");
      const leave = card.querySelector(".shLeave");

        if (!shState.armed["leave" + g.id]) {

          setTimeout(() => { shState.armed["leave" + g.id] = false; if (leave.isConnected) leave.textContent = "🚪 יציאה"; }, 4000);
          showToast("יציאה לא מוחקת את החיסכון ולא את הרישומים שלך בו");

        catch (e) { leave.disabled = false; showToast(shErr(e.code || "network")); }

      const dr = card.querySelector(".shDelReq");

        if (!shState.armed["del" + g.id]) {

          return;
        }

        try {
          const r = okOrThrow(await rpc2("cf2_request_deletion", { p_goal: g.id }));
          showToast(r.deleted ? "החיסכון נמחק" : "נשלחה בקשת מחיקה — החיסכון יימחק רק אחרי שכל המשתתפים יאשרו");
          await loadShared(true);
        } catch (e) { dr.disabled = false; showToast(shErr(e.code || "network")); }
      };

      const panel = card.querySelector(".shpanel");
      if (mode === "invite") panel.appendChild(invitePanel(g));
      if (mode === "history") panel.appendChild(sharedHistoryPanel(g));
      if (mode === "recurring") panel.appendChild(sharedRecurringPanel(g));
      return card;
    }

    async function sharedLoadHistory(goalId, silent) {
      try {
        const r = okOrThrow(await rpc2("cf2_history", { p_goal: goalId, p_before_seq: null, p_limit: 50 }));
        shState.history[goalId] = r.entries || [];
      } catch (e) { if (!silent) shState.history[goalId] = { error: e.code || "network" }; }
      if (state.screen === "shared") render();
    }
    function sharedHistoryPanel(g) {
      const p = el("div", "shhist");
      const h = shState.history[g.id];
      if (!h) { p.innerHTML = '<div class="setlbl">טוען היסטוריה…</div>'; return p; }
      if (h.error) { p.innerHTML = '<div class="unknote">' + esc(shErr(h.error)) + '</div>'; return p; }
      if (!h.length) { p.innerHTML = '<div class="setlbl">עוד אין רישומים.</div>'; return p; }
      p.innerHTML = '<div class="setlbl" style="margin-bottom:6px">כל רישום נשמר בשרת עם שעה ומזהה. ביטול הוא רישום הפוך — שום דבר לא נמחק.</div>';
      h.forEach((e) => {
        const r = el("div", "shentry" + (e.reversed ? " reversed" : ""));
        r.innerHTML = '<span>' + esc(sharedEntryText(e)) + '</span><i>' + esc(new Date(e.created_at).toLocaleString("he-IL", { day: "numeric", month: "numeric", year: "2-digit", hour: "2-digit", minute: "2-digit" })) +
          (e.reversed ? " · בוטל" : "") + '</i>';
        if (e.me && !e.reversed && e.kind !== "reversal") {
          const b = el("button", "fchip"); b.textContent = "ביטול רישום";
          b.onclick = async () => {
            b.disabled = true;
            try {
              const res = okOrThrow(await rpc2("cf2_reverse", { p_entry: e.id }));
              if (!res.duplicate) {
                // the record came out of this account's cubes; it goes back to the free balance
                state.pool += Math.abs(e.amount_minor) / 100; saveState();
                const local = shLocal(); local[g.id] = Math.max(0, (local[g.id] || 0) - Math.abs(e.amount_minor)); shPut("shlocal", local);

              showToast("הרישום בוטל — " + fmtMinor(Math.abs(e.amount_minor)) + " חזרו ליתרה הפנויה");

          };
          r.appendChild(b);
        }
        p.appendChild(r);
      });
      return p;

    // Opt-in monthly contribution from the member's own recorded income. The

    function sharedRecurringPanel(g) {
      const rec = g.my_recurring;
      const income = monthlyIncome();
      const d = shState.recDraft && shState.recDraft.goalId === g.id ? shState.recDraft
        : (shState.recDraft = { goalId: g.id, mode: rec ? rec.mode : "percent",
             value: rec ? (rec.mode === "percent" ? String(rec.value / 100) : String(rec.value / 100)) : "", consent: false });
      const p = el("div", "shrec");
      const preview = () => {
        const v = Number(d.value) || 0;
        const r = d.mode === "percent" ? { mode: "percent", value: Math.round(v * 100) } : { mode: "fixed", value: toMinor(v) };
        const a = sharedRecurringAmount(r, income);
        if (!v) return "בחרו סכום או אחוז.";
        if (d.mode === "percent") return income > 0 ? v + "% × הכנסה חודשית של ₪" + fmt(income) + " = " + fmtMinor(a) + " בכל חודש" : "עוד לא הוזנה הכנסה חודשית — אין ממה לחשב אחוז.";

      };
      p.innerHTML =
        '<div class="setlbl">' + (rec ? "פעיל: " + (rec.mode === "percent" ? (rec.value / 100) + "% מההכנסה" : fmtMinor(rec.value)) + " בכל חודש" : "כבוי") + '</div>' +
        '<div class="frow" style="gap:8px;margin:8px 0"><button class="fchip' + (d.mode === "percent" ? " on" : "") + '" id="rcPct">אחוז מההכנסה</button>' +

        '<div class="fld small"><span class="cur">' + (d.mode === "percent" ? "%" : "₪") + '</span><input id="rcVal" inputmode="decimal" value="' + esc(d.value) + '"></div>' +
        '<div class="setlbl" id="rcCalc" style="margin-top:6px"></div>' +
        '<label class="shconsent"><input type="checkbox" id="rcOk"' + (d.consent ? " checked" : "") + '> ' +
          'אני מאשר/ת שבכל פעם שההכנסה החודשית שלי נכנסת לקוביות, יירשם גם הסכום הזה כהפקדה שלי בחיסכון המשותף. ' +
          '<b>זה רישום בלבד — לא חיוב ולא העברה בנקאית.</b> ההכנסה שלי לא נשלחת לשרת ולא נראית לאחרים.</label>' +
