    // =====================================================================
    // Worker 2 — Shared Cubes: create with mock friends, per-participant
    // progress, and instant updates. The user's own deposits are funded via
    // the same money-sound plan used by the chat (never invented money).
    // =====================================================================
    const FRIENDS = [
      { name: "יוסי", color: "#74B9FF" }, { name: "דנה", color: "#FD79A8" },
      { name: "נועה", color: "#55EFC4" }, { name: "אבי", color: "#FAB1A0" },
    ];
    let shForm = null; // {open, name, target, picked:Set}
    function renderSharedPage() {
      const body = pageShell("קוביות משותפות 🤝", () => { shForm = null; state.screen = "app"; render(); });

      const opener = el("button", "addcube");
      opener.innerHTML = '<span class="addicon">＋</span><span>צור קובייה משותפת</span>';
      opener.onclick = () => { shForm = { name: "", target: "", picked: new Set(["יוסי", "דנה"]) }; render(); };
      if (!shForm) body.appendChild(opener);

      if (shForm) {
        const f = el("div", "setcard");
        f.innerHTML = '<h3 style="margin:0 0 10px">קובייה משותפת חדשה</h3>' +
          '<label class="flbl">שם הקובייה</label><div class="fld"><input id="shName" placeholder="טיול חברים לאילת 2026" value="' + shForm.name + '"></div>' +

          '<label class="flbl">הזמן חברים</label><div class="frow" id="shFriends"></div>' +

          '<button class="obback" id="shCancel">ביטול</button>';
        body.appendChild(f);
        const fr = f.querySelector("#shFriends");
        FRIENDS.forEach((p) => {
          const c = el("button", "fchip" + (shForm.picked.has(p.name) ? " on" : ""));
          c.textContent = p.name;
          c.style.setProperty("--fc", p.color);
          c.onclick = () => { shForm.picked.has(p.name) ? shForm.picked.delete(p.name) : shForm.picked.add(p.name); c.classList.toggle("on"); };
          fr.appendChild(c);
        });
        f.querySelector("#shName").oninput = (e) => { shForm.name = e.target.value; };
        f.querySelector("#shTarget").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); shForm.target = e.target.value; };
        f.querySelector("#shCancel").onclick = () => { shForm = null; render(); };
        f.querySelector("#shCreate").onclick = () => {
          const name = (shForm.name || "").trim(), target = Number(shForm.target) || 0;
          if (!name || target <= 0) { showToast("צריך שם וסכום יעד 🙂"); return; }
          const parts = [{ name: "אתה", me: true, amount: 0, color: "#6c5ce7" }]
            .concat(FRIENDS.filter((p) => shForm.picked.has(p.name)).map((p) => ({ name: p.name, me: false, amount: 0, color: p.color })));
          state.shared.push({ id: "sh_" + Date.now(), name: name, target: target, participants: parts });
          shForm = null;
          saveState(); render();
          showToast("🤝 נוצרה קובייה משותפת: " + name);
        };
      }

      if (!state.shared.length && !shForm) {
        const e0 = el("p", "termupd"); e0.textContent = "אין עדיין קוביות משותפות — צרו אחת והזמינו חברים!";
        body.appendChild(e0);
      }

      state.shared.forEach((sc) => body.appendChild(sharedCard(sc)));
    }
    function sharedCard(sc) {
      const total = sc.participants.reduce((s, p) => s + p.amount, 0);
      const donePct = Math.min(100, Math.round((total / sc.target) * 100));
      const card = el("div", "setcard shcard");
      card.innerHTML =
        '<div class="shtop"><b>🤝 ' + esc(sc.name) + '</b>' +
          (total >= sc.target ? '<span class="shdone">הושלם! 🎉</span>' : '<span class="shpct">' + donePct + '%</span>') + '</div>' +
        '<div class="shsum">₪' + fmt(total) + ' <span>מתוך ₪' + fmt(sc.target) + '</span></div>' +
        '<div class="chtrack big"><i style="width:0%"></i></div>' +
        '<div class="shparts"></div>' +
        '<div class="shactions">' +
          '<div class="fld small"><span class="cur">₪</span><input inputmode="numeric" placeholder="200" class="shAmt"></div>' +
          '<button class="distbtn shAdd">הפקדה שלי</button>' +
          '<button class="fchip on shSim">⚡ חבר מפקיד</button>' +
        '</div>';
      requestAnimationFrame(() => { card.querySelector(".chtrack i").style.width = donePct + "%"; });
      const parts = card.querySelector(".shparts");
      sc.participants.forEach((p) => {
        const pct = sc.target > 0 ? Math.min(100, Math.round((p.amount / sc.target) * 100)) : 0;
        const row = el("div", "shp");
        row.innerHTML = '<span class="shpname"' + (p.me ? ' style="color:var(--primary);font-weight:800"' : "") + '>' + esc(p.name) + '</span>' +
          '<div class="shptrack"><i style="width:0%;background:' + p.color + '"></i></div>' +
          '<span class="shpamt">₪' + fmt(p.amount) + '</span>';
        parts.appendChild(row);
        requestAnimationFrame(() => { row.querySelector("i").style.width = pct + "%"; });
      });
      const amtInp = card.querySelector(".shAmt");
      amtInp.oninput = () => { amtInp.value = amtInp.value.replace(/[^0-9]/g, ""); };
      card.querySelector(".shAdd").onclick = () => {
        const amount = Number(amtInp.value) || 0;
        if (amount <= 0) return;
        const plan = buildFundingPlan(amount, null);
        if (!plan) { showToast("אין מספיק כסף פנוי בקוביות 🙂"); return; }
        plan.forEach((s) => {
          if (s.key === "__pool") state.pool = Math.max(0, state.pool - s.amount);
          else { const c = state.cubes.find((x) => x.key === s.key); if (c) c.balance = Math.max(0, c.balance - s.amount); }
        });
        sc.participants.find((p) => p.me).amount += amount;
        saveState(); render();
        showToast("💸 הפקדת ₪" + fmt(amount) + " (נלקח: " + describeSources(plan) + ")");
      };
      card.querySelector(".shSim").onclick = () => {
        const friends = sc.participants.filter((p) => !p.me);
        if (!friends.length) { showToast("אין חברים בקובייה הזו 🙂"); return; }
        const f = friends[Math.floor(Math.random() * friends.length)];
        const add = (Math.floor(Math.random() * 9) + 2) * 50; // 100–500
        f.amount += add;
        saveState(); render();
        showToast("🎉 " + f.name + " הפקיד/ה ₪" + fmt(add) + ' ל"' + sc.name + '"');
      };
      return card;
    }

        const next = el("button", "distbtn wide");
        next.textContent = m.body ? "בוא נשחרר קצת את הגוף →" : "בוא ננשום רגע →";
        next.onclick = () => calmGo(m.body ? "body" : "breathe");
        wrap.appendChild(next);
        return;
      }

      // ---------- 2. physical release ----------
      if (calm.step === "body") {
        const st = el("div", "calmstep"); st.textContent = "שלב 2 מתוך 3 · הגוף"; wrap.appendChild(st);
        const intro = el("p", "calmintro");
        intro.textContent = "כעס ולחץ נתפסים בגוף לפני שהם מגיעים לראש. עבור על שלושת אלה לאט — כל אחד כמה שניות:";
        wrap.appendChild(intro);
        const items = [
          ["✊", "<b>אגרופים.</b> סגור חזק את שתי כפות הידיים, ספור 3… ואז פתח לגמרי ותן לאצבעות ליפול."],
          ["😬", "<b>לסת.</b> שים לב אם השיניים קפוצות. הרפה את הלסת, תן לפה להיפתח קצת."],
          ["🤷", "<b>כתפיים.</b> הרם אותן לאוזניים, החזק רגע — ותפיל אותן בבת אחת."],
        ];
        const list = el("div", "bodylist");
        items.forEach((it) => {
          const d = el("div", "bodyitem");
          d.innerHTML = '<span class="bi">' + it[0] + '</span><span>' + it[1] + '</span>';
          list.appendChild(d);
        });
        wrap.appendChild(list);
        const next = el("button", "distbtn wide");
        next.textContent = "שחררתי — עכשיו נשימות →";
        next.onclick = () => calmGo("breathe");
        wrap.appendChild(next);
        return;
      }

      // ---------- 3. breathing: 4 in / 6 out ----------
      if (calm.step === "breathe") {
        const st = el("div", "calmstep"); st.textContent = "שלב " + (m.body ? "3" : "2") + " · נשימה"; wrap.appendChild(st);
        const intro = el("p", "calmintro");
        intro.innerHTML = "נשיפה ארוכה מהשאיפה היא מה שמרגיע את הגוף. פשוט לך אחרי העיגול — <b>4 שניות פנימה, 6 החוצה</b>.";
        wrap.appendChild(intro);

        const bwrap = el("div", "breathe");
        const circle = el("div", "bcircle");
        circle.innerHTML = '<div style="text-align:center"><span class="btext" id="bTxt">מתכוננים…</span><span class="bsub" id="bSub"></span></div>';
        bwrap.appendChild(circle);
        wrap.appendChild(bwrap);
        const counter = el("div", "bcount"); counter.id = "bCount";
        counter.textContent = "סבב " + Math.min(calm.cycle + 1, BREATH_CYCLES) + " מתוך " + BREATH_CYCLES;
        wrap.appendChild(counter);

        const skip = el("button", "calmskip"); skip.textContent = "דלג לשאלה האחרונה ←";
        skip.onclick = () => { calm.cycle = 0; calmGo("focus"); };
        wrap.appendChild(skip);

        const txt = circle.querySelector("#bTxt"), sub = circle.querySelector("#bSub");
        const at = (ms, fn) => calmTimers.push(setTimeout(fn, ms));
        // count down inside each phase so the user always knows how long is left
        const countdown = (secs) => {
          for (let i = 0; i < secs; i++) at(i * 1000, () => { if (sub) sub.textContent = String(secs - i); });
        };
        const runCycle = () => {
          if (!calm || calm.step !== "breathe") return;
          if (calm.cycle >= BREATH_CYCLES) { calmGo("focus"); return; }
          const cnt = $("bCount");
          if (cnt) cnt.textContent = "סבב " + (calm.cycle + 1) + " מתוך " + BREATH_CYCLES;
          // inhale 4s
          circle.className = "bcircle in";
          if (txt) txt.textContent = "שאף פנימה";
          countdown(4);
          // short hold
          at(4000, () => { circle.className = "bcircle hold in"; if (txt) txt.textContent = "החזק"; if (sub) sub.textContent = ""; });
          // exhale 6s
          at(4800, () => {
            circle.className = "bcircle out";
            if (txt) txt.textContent = "נשוף לאט";
            countdown(6);
          });
          at(11000, () => { calm.cycle++; runCycle(); });
        };
        at(600, runCycle);
        return;
      }

      // ---------- 4. one small step ----------
      if (calm.step === "focus") {
        const st = el("div", "calmstep"); st.textContent = "לסיום · צעד אחד קטן"; wrap.appendChild(st);
        const c = el("div", "calmcard");
        c.innerHTML = '<span class="ce">🌱</span>' +
          '<b>אתה לא צריך לפתור את כל החיים שלך עכשיו.</b><br>' +
          'אף אחד לא מסדר הכול ברגע אחד, וזו גם לא המטרה כרגע. המטרה היא רק להחזיר לעצמך שליטה קטנה אחת.';
        wrap.appendChild(c);

        const q = el("div", "stepq");
        q.textContent = "מה הדבר הקטן האחד שאתה יכול לעשות בשעה הקרובה כדי להרגיש 1% יותר טוב?";
        wrap.appendChild(q);
        const note = el("p", "stepnote");
        note.textContent = "משהו קטן ממש. לשתות מים, לצאת 5 דקות החוצה, לשלוח הודעה אחת, לסדר פינה אחת בשולחן.";
        wrap.appendChild(note);

        const ta = el("textarea", "stepin");
        ta.rows = 3; ta.placeholder = "הדבר הקטן שלי הוא…";
        ta.value = calm.answer || "";
        ta.oninput = () => { calm.answer = ta.value; const b = wrap.querySelector("#calmSave"); if (b) b.disabled = !ta.value.trim(); };
        wrap.appendChild(ta);

        const save = el("button", "distbtn wide"); save.id = "calmSave";
        save.textContent = "זה הצעד שלי 🌿";
        save.disabled = !(calm.answer || "").trim();
        save.onclick = () => {
          const text = (calm.answer || "").trim();
          if (!text) return;
          const d = new Date();
          const date = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
          state.calmLog = (state.calmLog || []).concat([{ date: date, text: text }]).slice(-20);
          saveState();
          calmGo("done");
        };
        wrap.appendChild(save);
        setTimeout(() => ta.focus(), 60);
        return;
      }

      // ---------- done ----------
      if (calm.step === "done") {
        const d = el("div", "calmdone");
        d.innerHTML = '<span class="de">🌿</span>' +
          '<div class="calmcard" style="text-align:right">' +
            'זהו. לא פתרנו את הכול — רק הורדנו קצת את עוצמת הרעש, וזה מספיק לעכשיו.<br><br>' +
            '<b>הצעד שלך לשעה הקרובה:</b><br>' + esc((calm.answer || "").trim()) +
          '</div>';
        wrap.appendChild(d);
        const again = el("button", "distbtn wide"); again.textContent = "חזרה לקוביות";
        again.onclick = () => { clearCalmTimers(); calm = null; state.screen = "app"; render(); };
        wrap.appendChild(again);
        const more = el("button", "calmskip"); more.textContent = "לעשות עוד סבב ↻";
        more.onclick = () => openCalm();
        wrap.appendChild(more);
        wrap.appendChild(helplineCard());
        return;
      }
    }

    let wiScenario = null, wiWithCut = false, wiCustomType = "once", wiCustomAmt = "";
    const WI_PRESETS = [
      { id: "nowork", label: "🏖️ להפסיק לעבוד ל-3 חודשים", opts: { incomeOff: [1, 3] } },
      { id: "car", label: "🚗 לקנות רכב ב-30,000 ₪", opts: { oneTime: 30000 } },
      { id: "extra", label: "📈 הוצאה קבועה חדשה של 500 ₪ בחודש", opts: { extraMonthly: 500 } },
    ];
    function wiModel() {
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const income = monthlyIncome();
      const housing = (by.housing ? by.housing.amount : 0) + (by.landlord ? by.landlord.amount : 0) + (by.bills ? by.bills.amount : 0);
      const ess = by.essentials ? by.essentials.amount : 0;
      const life = by.lifestyle ? by.lifestyle.amount : 0;
      return { income: income, spend: housing + ess + life, life: life, start: totalBalance() + state.pool };
    }
    function wiProject(opts, lifeCut) {
      const m = wiModel();
      const rows = [];
      let cur = m.start;
      let sim = m.start - (opts.oneTime || 0);
      for (let month = 0; month <= 6; month++) {
        rows.push({ month: month, cur: Math.round(cur), sim: Math.round(sim) });
        cur += m.income - m.spend;
        let inc = m.income;
        if (opts.incomeOff && month + 1 >= opts.incomeOff[0] && month + 1 <= opts.incomeOff[1]) inc = 0;
        const spend = m.spend + (opts.extraMonthly || 0) - (lifeCut ? m.life * lifeCut : 0);
        sim += inc - spend;
      }
      return rows;
    }
    // =====================================================================
    // GROWTH SIMULATOR — "what if I put ₪X extra into this cube every month,
    // and how much will I actually have in N months?"
    //
    // Two projections side by side: the current path (what each cube already
    // receives every month) and the boosted path. No interest is invented —
    // this is deposits only, which is the honest model for a budgeting app.
    // =====================================================================
    let gs = { target: "__all", extra: "", months: 12 };
    const GS_MONTHS = [3, 6, 12, 24, 36];

    // What one cube receives in a normal month. Locked cubes are bills that
    // pass straight through, so they never "grow".
    function cubeMonthlyInflow(c) {
      if (!c || c.locked) return 0;
      const set = Math.round(Number(c.amount) || 0);
      if (set > 0) return set;
      return Math.round(monthlyIncome() * ((Number(c.pct) || 0) / 100));
    }
    // The money that is genuinely free to redirect into an extra contribution.
    function freeMonthlyBudget() {
      const income = monthlyIncome();
      if (income <= 0) return 0;
      const committed = state.cubes.reduce((s, c) => s + (c.locked ? Math.round(Number(c.amount) || 0) : 0), 0);
      return Math.max(0, income - committed);
    }

    function growthProject(targetKey, extra, months) {
      const all = targetKey === "__all";
      const cube = all ? null : state.cubes.find((c) => c.key === targetKey);
      if (!all && !cube) return null;
      const perMonth = all
        ? state.cubes.reduce((s, c) => s + cubeMonthlyInflow(c), 0)
        : cubeMonthlyInflow(cube);
      const start = all ? Math.round(totalBalance() + state.pool) : Math.round(cube.balance);
      const rows = [];
      for (let m = 0; m <= months; m++) {
        rows.push({ month: m, base: Math.round(start + perMonth * m), boost: Math.round(start + (perMonth + extra) * m) });
      }
      const goal = !all && Number(cube.goalTarget) > 0 ? Number(cube.goalTarget)
                 : (!all && cube.key === EMERGENCY_KEY ? emergencyTarget() : 0);
      const hit = (rate) => (goal > 0 && rate > 0 ? Math.ceil(Math.max(0, goal - start) / rate) : 0);
      return {
        rows: rows, start: start, perMonth: perMonth, extra: extra, months: months,
        end: rows[rows.length - 1], goal: goal,
        goalMonthsBase: hit(perMonth), goalMonthsBoost: hit(perMonth + extra),
        name: all ? "כל הכסף שלך" : cube.name, emoji: all ? "🧊" : cube.emoji,
        color: all ? "var(--primary)" : cube.color,
      };
    }
    // Up to 7 evenly spaced sample points, always including now and the end.
    function growthSamples(rows) {
      const last = rows.length - 1;
      if (last <= 6) return rows;
      const out = [];
      for (let i = 0; i <= 6; i++) out.push(rows[Math.round((last * i) / 6)]);
      return out;
    }

      const out = el("div", "gsout");

      function paint() {
        const extra = Math.max(0, Math.round(Number(gs.extra) || 0));
        const p = growthProject(gs.target, extra, gs.months);
        out.innerHTML = "";
        if (!p) return;

        // headline
        const head = el("div", "gshead");
        const gain = p.end.boost - p.end.base;
        head.innerHTML =
          '<div class="gsbig"><span>' + p.emoji + ' ' + esc(p.name) + ' בעוד ' + p.months + ' חודשים</span>' +
            '<b style="color:' + p.color + '">₪' + fmt(p.end.boost) + '</b></div>' +
          '<div class="gssub">במסלול הנוכחי: ₪' + fmt(p.end.base) +
            (extra > 0 ? ' · התוספת מוסיפה <b>₪' + fmt(gain) + '</b>' : '') + '</div>';
        out.appendChild(head);

        if (p.perMonth <= 0 && extra <= 0) {
          const w = el("div", "wiwarn");
          w.innerHTML = '<b>אין עדיין קצב חודשי.</b> הקובייה הזו לא מקבלת סכום חודשי קבוע. הזינו הכנסה חודשית במסך „הכנסה”, או הוסיפו כאן סכום חודשי כדי לראות תחזית.';
          out.appendChild(w);
          return;
        }

        // visual growth timeline
        const rows = growthSamples(p.rows);
        const max = Math.max(1, p.end.boost, p.end.base, p.goal || 0);
        const tbl = el("div", "witable");
        tbl.innerHTML = '<div class="wirow head"><span>חודש</span><span>מסלול נוכחי</span><span>' + (extra > 0 ? "עם ₪" + fmt(extra) + " בחודש" : "עם התוספת") + '</span></div>';
        rows.forEach((r) => {
          const row = el("div", "wirow");
          row.innerHTML = '<span>' + (r.month === 0 ? "עכשיו" : r.month) + '</span>' +
            '<span class="wibar"><i class="cur" style="width:' + Math.round((r.base / max) * 100) + '%"></i><em>₪' + fmt(r.base) + '</em></span>' +
            '<span class="wibar"><i class="sim" style="width:' + Math.round((r.boost / max) * 100) + '%"></i><em>₪' + fmt(r.boost) + '</em></span>';
          tbl.appendChild(row);
        });
        out.appendChild(tbl);

        // goal callout
        if (p.goal > 0) {
          const g = el("div", p.goalMonthsBoost > 0 && p.goalMonthsBoost <= p.months ? "wisafe" : "setcard");
          if (p.start >= p.goal) g.textContent = "🎉 כבר הגעת ליעד של ₪" + fmt(p.goal) + ".";
          else if (p.goalMonthsBoost > 0) {
            const saved = p.goalMonthsBase > 0 ? p.goalMonthsBase - p.goalMonthsBoost : 0;
            g.innerHTML = "🎯 עם התוספת תגיע ל-₪" + fmt(p.goal) + " תוך <b>" + p.goalMonthsBoost + " חודשים</b>" +
              (saved > 0 ? " — " + saved + " חודשים מוקדם יותר מהמסלול הנוכחי." :
               (p.goalMonthsBase > 0 ? " (כמו במסלול הנוכחי)." : "."));
          } else g.textContent = "🎯 היעד הוא ₪" + fmt(p.goal) + ", אבל בקצב הנוכחי לא מתקדמים אליו — הוסיפו סכום חודשי.";
          out.appendChild(g);
        }

        // is the extra actually affordable?
        const free = freeMonthlyBudget();
        const committedFlex = state.cubes.reduce((s, c) => s + (c.locked ? 0 : cubeMonthlyInflow(c)), 0);
        const slack = Math.max(0, free - committedFlex);
        if (extra > 0) {
          const note = el("div", extra > slack ? "wiwarn" : "wisafe");
          if (extra > slack) {
            note.innerHTML = '<b>מאיפה ייקח הכסף?</b> התקציב החודשי שלך כבר מחולק כמעט כולו. ₪' + fmt(extra) +
              ' בחודש ידרשו לצמצם קובייה אחרת' + (slack > 0 ? ' — פנויים כרגע רק ₪' + fmt(slack) + ' בחודש.' : '.') +
              ' הקובייה הכי טבעית לצמצום היא בדרך כלל הבילויים.';
          } else {
            note.textContent = "✅ ₪" + fmt(extra) + " בחודש נכנסים בתקציב — נשארים ₪" + fmt(slack - extra) + " חופשיים.";
          }
          out.appendChild(note);
        }
      }
      paint();
    }

    function renderWhatIfPage() {
      const body = pageShell("סימולטור מה-אם? 🔮", () => { wiScenario = null; wiWithCut = false; state.screen = "app"; render(); });

      renderGrowthSection(body);

      const st2 = el("div", "section-t"); st2.textContent = "מה קורה אם משהו משתנה? ⚠️"; body.appendChild(st2);
      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl">בחרו תרחיש — ה-AI יקרין את המצב הכספי שלכם 6 חודשים קדימה, מול המסלול הנוכחי.</div>';
      body.appendChild(intro);

      const chips = el("div", "wichips");
      WI_PRESETS.forEach((p) => {
        const c = el("button", "fchip wide" + (wiScenario && wiScenario.id === p.id ? " on" : ""));
        c.textContent = p.label;
        c.onclick = () => { wiScenario = p; wiWithCut = false; render(); };
        chips.appendChild(c);
      });
      body.appendChild(chips);

      // custom expense — with a "סוג ההוצאה" (one-time / monthly recurring) toggle
      const typeWrap = el("div", "setcard");
      typeWrap.innerHTML =
        '<div class="setlbl">סוג ההוצאה</div>' +
        '<div class="segtoggle" id="wiType">' +
          '<button data-t="once" class="' + (wiCustomType === "once" ? "on" : "") + '">💥 חד-פעמי</button>' +
          '<button data-t="monthly" class="' + (wiCustomType === "monthly" ? "on" : "") + '">🔁 חודשי קבוע</button>' +
        '</div>';
      body.appendChild(typeWrap);
      typeWrap.querySelectorAll("#wiType button").forEach((btn) => {
        btn.onclick = () => { wiCustomType = btn.getAttribute("data-t"); render(); };
      });

      const cust = el("div", "shactions");
      cust.innerHTML = '<div class="fld small"><span class="cur">₪</span><input inputmode="numeric" value="' + (wiCustomAmt || "") + '" placeholder="' + (wiCustomType === "monthly" ? "500" : "12000") + '" id="wiAmt"></div>' +
        '<button class="distbtn" id="wiRun">' + (wiCustomType === "monthly" ? "הוצאה חודשית קבועה" : "הוצאה חד-פעמית") + '</button>';
      body.appendChild(cust);
      cust.querySelector("#wiAmt").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); wiCustomAmt = e.target.value; };
      cust.querySelector("#wiRun").onclick = () => {
        const amt = Number(cust.querySelector("#wiAmt").value) || 0;
        if (amt <= 0) return;
        wiCustomAmt = String(amt);
        if (wiCustomType === "monthly") {
          // recurring expense — drains the cube every single month in the projection
          wiScenario = { id: "custom", label: "הוצאה חודשית קבועה של ₪" + fmt(amt), opts: { extraMonthly: amt } };
        } else {
          wiScenario = { id: "custom", label: "הוצאה חד-פעמית של ₪" + fmt(amt), opts: { oneTime: amt } };
        }
        wiWithCut = false; render();
      };

      if (!wiScenario) { const s0 = el("div"); s0.style.height = "40px"; body.appendChild(s0); return; }

      const rows = wiProject(wiScenario.opts, wiWithCut ? 0.4 : 0);
      const crisis = rows.find((r) => r.sim < 0);
      const maxAbs = Math.max(1, ...rows.map((r) => Math.max(Math.abs(r.cur), Math.abs(r.sim))));
      const m = wiModel();

      const st = el("div", "section-t"); st.textContent = "תחזית: " + wiScenario.label + (wiWithCut ? " · עם ההמלצה ✨" : ""); body.appendChild(st);

      const tbl = el("div", "witable");
      tbl.innerHTML = '<div class="wirow head"><span>חודש</span><span>מסלול נוכחי</span><span>בתרחיש</span></div>';
      rows.forEach((r) => {
        const row = el("div", "wirow");
        row.innerHTML = '<span>' + (r.month === 0 ? "עכשיו" : r.month) + '</span>' +
          '<span class="wibar"><i class="cur" style="width:' + Math.round(Math.max(0, r.cur) / maxAbs * 100) + '%"></i><em>₪' + fmt(r.cur) + '</em></span>' +
          '<span class="wibar"><i class="' + (r.sim < 0 ? "neg" : "sim") + '" style="width:' + Math.round(Math.abs(r.sim) / maxAbs * 100) + '%"></i><em' + (r.sim < 0 ? ' class="negt"' : "") + '>₪' + fmt(r.sim) + '</em></span>';
        tbl.appendChild(row);
      });
      body.appendChild(tbl);

      if (crisis) {
        const w = el("div", "wiwarn");
        const saveAmt = Math.round(m.life * 0.4);
        const when = crisis.month === 0 ? "מיד" : "תוך " + crisis.month + " חודשים";
        if (wiWithCut) {
          // the recommendation is already applied but the scenario is still negative
          w.innerHTML = '<b>⚠️ עדיין לא מספיק:</b> גם אחרי צמצום של 40% בקוביית הבילויים היתרה מתרוקנת ' + when +
            '. התרחיש הזה גדול מדי ביחס להכנסה — שקלו לפרוס אותו על פני זמן, להגדיל הכנסה, או לוותר עליו.';
          body.appendChild(w);
        } else if (m.life > 0 && saveAmt > 0) {
          w.innerHTML = '<b>⚠️ אזהרה:</b> היתרה שלך תתרוקן ' + when + ' בתרחיש הזה. ' +
            'ה‑AI ממליץ לצמצם את קוביית הבילויים ב-40% (חיסכון של ₪' + fmt(saveAmt) + ' בחודש) כדי לשמור על איזון.';
          body.appendChild(w);
          const b = el("button", "distbtn wide"); b.textContent = "✨ הצג תחזית עם ההמלצה";
          b.onclick = () => { wiWithCut = true; render(); };
          body.appendChild(b);
        } else {
          // no lifestyle cube to trim — don't recommend a ₪0 cut
          w.innerHTML = '<b>⚠️ אזהרה:</b> היתרה שלך תתרוקן ' + when + ' בתרחיש הזה. ' +
            'אין קוביית בילויים משמעותית לצמצם — כדי לאזן צריך להגדיל הכנסה או להקטין את ההוצאה הזו.';
          body.appendChild(w);
        }
      } else {
        const ok = el("div", "wisafe");
        ok.textContent = wiWithCut
          ? "✅ עם ההמלצה התרחיש מאוזן — היתרה נשארת חיובית לאורך כל התקופה."
          : "✅ התרחיש בטוח — היתרה נשארת חיובית לאורך כל 6 החודשים.";
        body.appendChild(ok);
      }
      const sp = el("div"); sp.style.height = "40px"; body.appendChild(sp);
    }

    // Worker 4 — hard wipe: per-account state + user record + session + chat.
    function wipeAccount() {
      if (!state.authUser) return;
      const email = state.authUser.email;
      try { localStorage.removeItem(stateKey()); } catch (e) {}
      try { localStorage.removeItem(obKey()); } catch (e) {} // saved onboarding draft
      const users = loadUsers(); delete users[email]; saveUsers(users);
      clearSecLog(); // the security log holds this user's email — wipe it too
      settStep = 0;
      resetChat();
      logout(); // clears session + in-memory state, routes to the login screen
      showToast("🗑️ החשבון נמחק לצמיתות");
    }

    $("fab").onclick = openChat;
    $("calmfab").onclick = openCalm;

    // ---- boot -------------------------------------------------------------
    initAuth();
  </script>
</body>
</html>
