        (rec ? '<button class="obback" id="rcOff">כיבוי ההפקדה החודשית</button>' : "");
      const calc = () => { p.querySelector("#rcCalc").textContent = preview(); };
      p.querySelector("#rcPct").onclick = () => { d.mode = "percent"; render(); };
      p.querySelector("#rcFix").onclick = () => { d.mode = "fixed"; render(); };
      const val = p.querySelector("#rcVal");
      val.oninput = () => { val.value = val.value.replace(/[^0-9.]/g, ""); d.value = val.value; calc(); };
      p.querySelector("#rcOk").onchange = (e) => { d.consent = e.target.checked; };
      calc();
      p.querySelector("#rcSave").onclick = async (ev) => {
        const v = Number(d.value) || 0;
        if (v <= 0 || (d.mode === "percent" && v > 100)) { showToast("ערך לא תקין"); return; }
        if (!d.consent) { showToast(shErr("consent_required")); return; }
        ev.target.disabled = true;
        try {
          okOrThrow(await rpc2("cf2_set_recurring", { p_goal: g.id, p_mode: d.mode,
            p_value: d.mode === "percent" ? Math.round(v * 100) : toMinor(v), p_consent: true }));
          shState.recDraft = null; shState.open[g.id] = "";
          showToast("🔁 ההפקדה החודשית נשמרה — תירשם כשההכנסה של החודש תיכנס");
          await loadShared(true);
        } catch (e) { ev.target.disabled = false; showToast(shErr(e.code || "network")); }
      };
      const off = p.querySelector("#rcOff");
      if (off) off.onclick = async () => {
        off.disabled = true;
        try { okOrThrow(await rpc2("cf2_set_recurring", { p_goal: g.id, p_mode: "off", p_value: null, p_consent: null })); shState.recDraft = null; await loadShared(true); }
        catch (e) { off.disabled = false; showToast(shErr(e.code || "network")); }
      };
      return p;
    }

    // Deletion by agreement: who approved, who has not answered yet. No answer
    // never counts; one "no" ends the request; any change voids it.
    function sharedDeletionPanel(g, box) {
      const d = g.deletion;
      const mine = (d.votes || []).find((v) => v.me);
      box.innerHTML = '<div class="shdelhead">🗑️ ' + esc(d.mine ? "ביקשת למחוק את החיסכון" : d.requested_by + " ביקש/ה למחוק את החיסכון") + '</div>' +
        '<div class="setlbl">החיסכון יימחק רק אם כל המשתתפים יאשרו. דחייה אחת מבטלת את הבקשה, ושינוי בחברים או בסכומים מבטל אותה.</div>' +
        '<div class="shvotes">' + (d.votes || []).map((v) =>
          '<span class="shvote ' + (v.vote || "wait") + '">' + esc(v.me ? "את/ה" : v.name) + ': ' +
          (v.vote === "approve" ? "✓ אישר/ה" : v.vote === "reject" ? "✗ דחה/תה" : "⏳ ממתין/ה") + '</span>').join("") + '</div>' +
        '<div class="frow" style="gap:8px;margin-top:8px"></div>';
      const row = box.querySelector(".frow");
      const act = (label, cls, fn) => { const b = el("button", cls); b.textContent = label; b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { b.disabled = false; showToast(shErr(e.code || "network")); } }; row.appendChild(b); };
      if (mine && !mine.vote) {
        act("אישור המחיקה", "fchip danger", async () => {
          const r = okOrThrow(await rpc2("cf2_vote_deletion", { p_request: d.id, p_vote: "approve" }));
          showToast(r.status === "completed" ? "כל המשתתפים אישרו — החיסכון נמחק" : "האישור שלך נרשם. ממתינים לשאר המשתתפים.");
          await loadShared(true);
        });
        act("דחייה", "fchip on", async () => {
          okOrThrow(await rpc2("cf2_vote_deletion", { p_request: d.id, p_vote: "reject" }));
          showToast("דחית את הבקשה — החיסכון נשאר"); await loadShared(true);
        });
      }
      if (d.mine) act("ביטול הבקשה", "fchip", async () => {
        okOrThrow(await rpc2("cf2_cancel_deletion", { p_request: d.id }));
        showToast("בקשת המחיקה בוטלה"); await loadShared(true);
      });
    }

    // ---- people: search, avatar, own profile -----------------------------------
    // Search shows registered people who can be invited — that is all it says
    // about them. There is no presence data, so nothing claims anyone is online;
    // and a goal's member list only ever shows people who confirmed joining.
    function shAvatar(name, hue) {
      const t = String(name || "?").replace(/^@/, "").trim();
      const ch = (t.match(/[\p{L}\p{N}]/u) || ["?"])[0].toUpperCase();
      return '<span class="shav" style="background:hsl(' + (Number(hue) || 0) + ',55%,45%)">' + esc(ch) + '</span>';
    }
    const shPublicName = (p) => (p && p.display_name) ? p.display_name : "משתמש/ת CubeFinance";

    // How other people see you, and whether they can find you.
    function sharedProfileCard() {
      const p = shState.profile;
      const c = el("div", "setcard shprof");
      if (!p) return c;
      const ed = shState.profEdit;
      c.innerHTML =
        '<div class="shprow">' + shAvatar(p.display_name || p.username, 210) +
          '<div style="flex:1"><div class="setmail">' + esc(shPublicName(p)) + '</div>' +
          '<div class="setlbl" dir="ltr" style="text-align:start">@' + esc(p.username || "") + '</div></div>' +
          '<button class="fchip" id="prEdit">' + (ed ? "סגירה" : "עריכה") + '</button></div>' +
        (!p.display_name ? '<div class="setlbl" style="margin-top:8px">💡 הוסיפו שם — כך חברים יזהו אתכם בחיפוש. המייל שלכם לא מוצג לאף אחד.</div>' : "") +
        (ed ? '<label class="flbl">שם תצוגה</label><div class="fld"><input id="prName" maxlength="40" placeholder="איך יראו אותך"></div>' +
              '<label class="flbl">שם משתמש</label><div class="fld"><span class="cur">@</span><input id="prUser" dir="ltr" maxlength="20"></div>' +
              '<button class="distbtn wide" id="prSave" style="margin-top:10px">שמירה</button>' : "") +
        '<div class="swrow" style="margin-top:10px"><div><div class="setmail" style="font-size:14px">להופיע בחיפוש</div>' +
          '<div class="setlbl">חברים יוכלו למצוא אותך לפי שם או @שם משתמש ולהזמין אותך. כבוי — רק מי שיש לו קוד יוכל לצרף אותך.</div></div>' +
          '<button class="sw' + (p.discoverable ? " on" : "") + '" id="prDisc" aria-label="להופיע בחיפוש"></button></div>';
      c.querySelector("#prEdit").onclick = () => { shState.profEdit = !ed; render(); };
      if (ed) {
        c.querySelector("#prName").value = p.display_name || "";
        c.querySelector("#prUser").value = p.username || "";
        c.querySelector("#prSave").onclick = async (ev) => {
          const name = c.querySelector("#prName").value.trim();
          const user = c.querySelector("#prUser").value.trim().toLowerCase();
          ev.target.disabled = true;
          try {
            const r = okOrThrow(await rpc2("cf2_update_profile", { p_display_name: name || null, p_username: user && user !== p.username ? user : null, p_discoverable: null }));
            shState.profile = r.profile; shState.profEdit = false;
            showToast("✅ הפרופיל עודכן");
            render();
          } catch (e) { ev.target.disabled = false; showToast(shErr(e.code || "network")); }
        };
      }
      c.querySelector("#prDisc").onclick = async (ev) => {
        const next = !p.discoverable;
        ev.target.disabled = true;
        try {
          const r = okOrThrow(await rpc2("cf2_update_profile", { p_display_name: null, p_username: null, p_discoverable: next }));
          shState.profile = r.profile; render();
        } catch (e) { ev.target.disabled = false; showToast(shErr(e.code || "network")); }
      };
      return c;
    }

    // One invitation per recipient: the code from a search invite, an email or
    // a WhatsApp share is the same code until it is used or expires.
    const shInv = (goalId) => {
      const v = (shState.invites || (shState.invites = {}))[goalId];
      return v && v.until > Date.now() ? v : null;
    };
    function sharedSetInvite(goalId, r, kind, target, name) {
      shState.invites = shState.invites || {};
      shState.invites[goalId] = { code: r.code, until: Date.now() + (Number(r.expires_in) || 600) * 1000, kind: kind, target: target || null, name: name || null };
    }

    function sharedRunSearch(goalId) {
      const s = shState.search;
      clearTimeout(s.timer);
      const qy = (s.q || "").trim();
      if (qy.replace(/^@/, "").length < 2) { s.items = []; s.state = "idle"; s.hasMore = false; shRepaint(goalId); return; }
      s.timer = setTimeout(async () => {
        const mine = ++s.seq;
        s.state = "loading"; shRepaint(goalId);
        try {
          const r = okOrThrow(await rpc2("cf2_search_users", { p_query: qy, p_goal: goalId, p_limit: 20, p_offset: s.offset }));
          if (mine !== s.seq) return;   // a newer query is on its way
          s.items = s.offset ? s.items.concat(r.items || []) : (r.items || []);
          s.hasMore = !!r.has_more; s.state = "done";
        } catch (e) {
          if (mine !== s.seq) return;
          s.state = "error"; s.error = e.code || "network";
        }
        shRepaint(goalId);
      }, 350);
    }

    function shPaintResults(g, list) {
      if (!list) return;
      const s = shState.search;
      list.innerHTML = "";
      const qy = (s.q || "").trim();
      if (s.state === "loading" && !s.items.length) list.innerHTML = '<div class="setlbl">מחפש… ⏳</div>';
      else if (s.state === "error") list.innerHTML = '<div class="aerr">' + esc(shErr(s.error)) + '</div>';
      else if (s.state === "done" && !s.items.length) list.innerHTML = '<div class="setlbl">' +
        (qy.indexOf("@") > 0 ? "לא נמצא משתמש עם המייל הזה (או שבחר/ה לא להופיע בחיפוש). אפשר לשלוח לו/ה הזמנה במייל למטה."
                              : "לא נמצאו משתמשים. נסו שם אחר, @שם משתמש, או מייל מלא.") + '</div>';
      else if (qy && qy.replace(/^@/, "").length < 2) list.innerHTML = '<div class="setlbl">הקלידו לפחות 2 תווים</div>';
      s.items.forEach((u) => {
        const row = el("div", "shuser");
        row.innerHTML = shAvatar(u.display_name || u.username, u.avatar_hue) +
          '<div class="shuname"><b>' + esc(shPublicName(u)) + '</b><span dir="ltr">@' + esc(u.username) + '</span></div>' +
          (u.member ? '<span class="shtag">כבר בחיסכון</span>'
            : '<button class="fchip on">' + (u.invited ? "הוזמן/ה ✓ — הצגת הקוד" : "הזמנה") + '</button>');
        const b = row.querySelector("button");
        if (b) b.onclick = async () => {
          b.disabled = true;
          try {
            const r = okOrThrow(await rpc2("cf2_invite_user", { p_goal: g.id, p_profile: u.profile_id }));
            sharedSetInvite(g.id, r, "profile", u.profile_id, r.target_name || shPublicName(u));
            u.invited = true;
            showToast(r.existing ? "ההזמנה הקיימת עדיין בתוקף" : "📨 ההזמנה נשלחה ל" + (r.target_name || shPublicName(u)));
            render();
          } catch (e) { b.disabled = false; showToast(shErr(e.code || "network")); }
        };
        list.appendChild(row);
      });
      if (s.hasMore && s.state === "done") {
        const more = el("button", "fchip"); more.textContent = "עוד תוצאות";
        more.onclick = () => { s.offset = s.items.length; sharedRunSearch(g.id); };
        list.appendChild(more);
      }

    }
    function shRepaint(goalId) {
      const g = shState.goals.find((x) => x.id === goalId);
      const list = document.getElementById("invList");
      if (g && list) shPaintResults(g, list); else render();
    }

    function invitePanel(g) {
      const s = shState.search && shState.search.goalId === g.id ? shState.search
        : (shState.search = { goalId: g.id, q: "", items: [], state: "idle", offset: 0, hasMore: false, seq: 0, timer: null });
      const inv = shInv(g.id);
      const p = el("div", "invpanel");
      p.innerHTML =
        '<label class="flbl">חיפוש חבר לפי שם, @שם משתמש או מייל מלא</label>' +
        '<div class="fld" style="margin:0"><span class="cur">🔍</span><input id="invQ" placeholder="שם, @שם או מייל" autocomplete="off"></div>' +
        '<div id="invList" class="shresults"></div>' +
        (inv
          ? '<div class="unknote" style="margin-top:10px;text-align:center">' +
              (inv.kind === "profile" ? "הזמנה ל<b>" + esc(inv.name || "") + "</b> — נשלחה גם להתראות שלו/ה<br>" : "") +
              'קוד הצטרפות: <b dir="ltr" style="font-size:22px;letter-spacing:4px">' + esc(inv.code) + '</b><br>' +
              'תקף עד ' + new Date(inv.until).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }) + ' (רק הקוד פג — החיסכון לא)' +
              ' <button class="fchip" id="invCopy" style="margin-inline-start:6px">📋 העתקה</button></div>'
          : "") +
        '<label class="flbl" style="margin-top:12px">' + (inv ? "שליחת אותה הזמנה גם במייל" : "או: הזמנה במייל (גם למי שעוד לא נרשם)") + '</label>' +
        '<div class="frow" style="gap:8px"><div class="fld" style="flex:1;margin:0"><input id="invEmail" type="email" dir="ltr" placeholder="friend@gmail.com"></div>' +
        '<button class="fchip on" id="invMail">📧 שליחה</button></div>' +
        '<button class="gbtn" id="invWa" style="background:#25D366;color:#fff;border-color:#25D366;margin-top:10px">💬 ' + (inv ? "שיתוף אותו קוד בווטסאפ" : "שיתוף קוד בווטסאפ") + '</button>';

      const qi = p.querySelector("#invQ");
      qi.value = s.q;
      qi.oninput = () => { s.q = qi.value; s.offset = 0; sharedRunSearch(g.id); };

      shPaintResults(g, p.querySelector("#invList"));

      // Email and WhatsApp share the SAME invitation while it is valid.
      const getCode = async (forEmail) => {
        const cur = shInv(g.id);
        if (cur && (cur.kind !== "email" || !forEmail || cur.target === forEmail)) return cur;
        const r = okOrThrow(await rpc2("cf2_create_invite", { p_goal: g.id, p_email: forEmail || null }));
        sharedSetInvite(g.id, r, forEmail ? "email" : "open", forEmail);
        return shInv(g.id);
      };
      p.querySelector("#invMail").onclick = async (ev) => {
        const e = normEmail(p.querySelector("#invEmail").value);
        if (!validEmail(e)) { showToast(shErr("bad_email")); return; }
        if (e === normEmail(state.authUser.email)) { showToast("זה המייל שלך 🙂"); return; }
        ev.target.disabled = true;
        try {
          const cur = await getCode(e);
          await sendInviteEmail(e, cur.code, cloudName() || "חבר/ה", g.name);
          showToast("📧 ההזמנה (קוד " + cur.code + ") נשלחה ל-" + e);
          render();
        } catch (er) {
          ev.target.disabled = false;
          showToast(er.code ? shErr(er.code) : "שליחת המייל נכשלה. נסו שוב או שתפו בווטסאפ.");
        }
      };
      p.querySelector("#invWa").onclick = async (ev) => {
        ev.target.disabled = true;
        try {
          const cur = await getCode(null);
          render();
          openWhatsApp(inviteMessage(cloudName(), g.name, Number(g.target_minor) / 100, cur.code));
        } catch (er) { ev.target.disabled = false; showToast(shErr(er.code || "network")); }
      };
      const cp = p.querySelector("#invCopy");
      if (cp) cp.onclick = () => {
        const t = inviteMessage(cloudName(), g.name, Number(g.target_minor) / 100, inv.code);
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
          () => showToast("📋 ההזמנה הועתקה"), () => showToast("הקוד: " + inv.code));
      };
      return p;
    }

    function inviteMessage(inviter, goal, target, code) {
      return "היי! 👋 " + (inviter ? inviter + " מזמין/ה" : "אני מזמין/ה") + " אותך לחסוך ביחד ב-CubeFinance 🤝\n" +
        "המטרה: \"" + goal + "\" (יעד ₪" + fmt(target) + ")\n\n" +
        "קוד ההצטרפות: " + code + "\n" +
        "הקוד תקף ל-" + INVITE_TTL_MIN + " דקות.\n\n" +
        "פותחים את CubeFinance ← חיסכון משותף ← \"יש לי קוד הצטרפות\".";
    }
    function openWhatsApp(text) {
      const url = "https://wa.me/?text=" + encodeURIComponent(text);
      // Inside the Android app the wrapper hands https links to the system,
      // which opens WhatsApp. In a browser, a new tab does the same.
      // (window.open with "noopener" always returns null, so a link click is
      // used instead — it never navigates the app itself away.)
      if (nativeApp) { window.location.href = url; return; }
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
    }
    // The invite email goes through the same EmailJS account as the sign-up
    // codes. With a dedicated invite template it reads as an invitation;
    // without one it falls back to the code template.
    async function sendInviteEmail(email, code, inviter, goal) {
      if (!useEmailJS()) throw new Error("no mail");
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id: EMAILJS.serviceId,
          template_id: EMAILJS.inviteTemplateId || EMAILJS.templateId,
          user_id: EMAILJS.publicKey,
          template_params: { to_email: email, code: code, inviter: inviter, goal: goal },
        }),
      });
      if (!res.ok) throw new Error("emailjs " + res.status);
    }

    // On logout: this phone stops receiving the account's shared pushes.
    function sharedLogout() {
      clearTimeout(shState.pollTimer);
      if (state.authUser && sbLoad() && nativeApp && nativeApp.pushInstallId) {
        rpc2("cf2_unregister_device", { p_install: nativeApp.pushInstallId() }).catch(() => {});
      }
    }

    // The old local demo cubes (made-up friends) stay visible so nobody loses
    // track of money they moved into them; removing one returns that money.
    function legacySharedCard(sc) {
      const mine = (sc.participants.find((p) => p.me) || { amount: 0 }).amount;
      const card = el("div", "setcard shcard");
      card.style.opacity = ".85";
      card.innerHTML = '<div class="shtop"><b>' + esc(sc.name) + '</b><span class="shpct">הדגמה</span></div>' +
        '<div class="shsum">₪' + fmt(mine) + ' <span>הפקדות שלך</span></div>' +
        '<button class="fchip" style="margin-top:6px">🗑️ הסרה' + (mine > 0 ? " והחזרת ₪" + fmt(mine) + " לקוביות" : "") + '</button>';
      card.querySelector("button").onclick = () => {
        state.pool += mine;
        state.shared = state.shared.filter((x) => x.id !== sc.id);
        saveState(); render();
        if (mine > 0) showToast("💸 ₪" + fmt(mine) + " חזרו ליתרה הפנויה");
      };
      return card;
    }

    // =====================================================================
    // Worker 3 — "What-If" simulator: preset scenarios projected 6 months
    // ahead against the real cube data, with crisis detection + an actionable
    // AI recommendation (cut Lifestyle 40%) the user can preview live.
    // =====================================================================
    // =====================================================================
    // AGENT 1 — "מדריך דור העתיד: מאיפה מתחילים?"
    // An interactive hub for young adults (18+) with exactly 7 micro-features.
    // Everything here is FREE (no premium lock) — it's the empowerment layer
    // that teaches the money basics before the AI tools take over.
    // =====================================================================
    let guideFeat = null; // which feature card is expanded

    // helper: small labeled numeric input row inside a guide card
    function gNum(id, label, placeholder) {
      return '<label class="gfield"><span>' + label + '</span>' +
        '<span class="ginput"><i>₪</i><input inputmode="numeric" id="' + id + '" placeholder="' + placeholder + '"></span></label>';
    }
    function gVal(card, id) { const e = card.querySelector("#" + id); return Number((e && e.value || "").replace(/[^0-9.]/g, "")) || 0; }

    // The 7 micro-features. Each builder receives its card body element and
    // wires up its own inputs + live result (no full re-render needed).
    const GUIDE_FEATURES = [
      {
        id: "rent", emoji: "🏠", title: "כמה שכר דירה אני יכול להרשות?",
        sub: "לפי המשכורת — שותפים מול דירה פרטית",
        build(box) {
          box.innerHTML =
            '<p class="gtip">כלל אצבע: שכר דירה לא אמור לעבור <b>30%</b> מהנטו החודשי שלך. מעבר לזה — כל שאר הקוביות נחנקות.</p>' +
            gNum("rSal", "המשכורת החודשית שלי (נטו)", "8000") +
            '<button class="distbtn wide" id="rCalc">חשב תקציב שכירות</button><div class="gout" id="rOut"></div>';
          box.querySelector("#rCalc").onclick = () => {
            const sal = gVal(box, "rSal"); const out = box.querySelector("#rOut");
            if (sal <= 0) { out.innerHTML = '<div class="gwarn">הזינו משכורת 🙂</div>'; return; }
            const budget = Math.round(sal * 0.30);
            const priv = budget;                 // whole budget on your own place
            const sharedFlat = budget * 2;       // even 2-way split → the flat can cost double your share
            out.innerHTML =
              '<div class="gres"><span>תקציב שכירות מומלץ</span><b>₪' + fmt(budget) + ' / חודש</b></div>' +

              '<li>עכשיו רואים בדיוק כמה יש לכל דבר — והכסף של היעד <b>לא נעלם</b> על ממתקים.</li>' +
            '</ol>' +
            '<button class="distbtn wide" id="kcGo">קדימה, לקוביות שלי →</button>';
          box.querySelector("#kcGo").onclick = () => { state.screen = "app"; render(); };
        },
      },
    ];

    // =====================================================================
    // "רגע של רוגע" — a ~3 minute CBT-style grounding flow.
    //
    // Structure (in this order, per mood):
    //   1. Validation — the feeling is allowed, no fixing yet.
    //   2. Physical release — unclench the body (anger/stress).
    //   3. Breathing — one slow round, 4s in / 6s out.
    //   4. Cognitive focus — you don't have to solve your life right now;
    //      one question: the smallest thing that makes the next hour 1% better.
    //
    // Free for everyone, works in kids mode, and never stores anything off-device.
    // =====================================================================
    const CALM_MOODS = {
      anger: {
        emoji: "😤", title: "כועס", sub: "משהו הרתיח אותי ואני מלא בזה",
        validate: "כעס זה לא משהו רע — הוא בדרך כלל סימן שמשהו חשוב לך נדרס. מותר לך להיות כועס. " +
                  "לא נעשה עכשיו כלום עם הסיבה, רק ניתן לגוף להוריד קצת מהלחץ.",
        body: true,
      },
      stress: {
        emoji: "😰", title: "לחוץ / מוצף", sub: "יותר מדי דברים בבת אחת",
        validate: "זה לגמרי מובן להרגיש מוצף כשהכול נערם. זה לא אומר שאתה לא מסתדר — " +
                  "זה אומר שיש הרבה. בוא ניקח דקה אחת רק בשביל לנשום.",
        body: true,
      },
      lost: {
        emoji: "🌫️", title: "אבוד", sub: "לא יודע מה אני עושה עם החיים שלי",
        validate: "התחושה הזאת מוכרת להרבה יותר אנשים ממה שנדמה, וזה בסדר גמור להרגיש אותה. " +
                  "אתה לא חייב לדעת עכשיו לאן הכול הולך.",
        body: false,
      },
    };

    // { mood, step, cycle, phase }  step: 'mood'|'validate'|'body'|'breathe'|'focus'|'done'
    let calm = null;
    let calmTimers = [];
    function clearCalmTimers() { calmTimers.forEach(clearTimeout); calmTimers = []; }
    function openCalm() {
      clearCalmTimers();
      calm = { mood: null, step: "mood", cycle: 0, phase: "idle", answer: "" };
      state.screen = "calm"; render();
    }
    function calmGo(step) { clearCalmTimers(); calm.step = step; render(); }

    const BREATH_CYCLES = 3;
    function renderCalmPage() {
      if (!calm) calm = { mood: null, step: "mood", cycle: 0, phase: "idle", answer: "" };
      const body = pageShell("רגע של רוגע 🌿", () => { clearCalmTimers(); calm = null; state.screen = "app"; render(); });
      const wrap = el("div", "calmwrap"); body.appendChild(wrap);
      const m = calm.mood ? CALM_MOODS[calm.mood] : null;

      // ---------- 0. what are you feeling ----------
      if (calm.step === "mood") {
        const intro = el("p", "calmintro");
        intro.innerHTML = "אם עכשיו קשה — עצור רגע. <b>שלוש דקות</b>, בלי לפתור כלום, רק להוריד את עוצמת הרעש.<br>מה הכי קרוב למה שאתה מרגיש?";
        wrap.appendChild(intro);
        const grid = el("div", "moodgrid");
        Object.keys(CALM_MOODS).forEach((k) => {
          const d = CALM_MOODS[k];
          const b = el("button", "moodbtn");
          b.innerHTML = '<span class="me">' + d.emoji + '</span><span class="mt"><b>' + d.title + '</b><span>' + d.sub + '</span></span>';
          b.onclick = () => { calm.mood = k; calmGo("validate"); };
          grid.appendChild(b);
        });
        wrap.appendChild(grid);

        if ((state.calmLog || []).length) {
          const t = el("div", "section-t"); t.textContent = "הצעדים הקטנים שלך"; wrap.appendChild(t);
          const list = el("div", "pastlist");
          state.calmLog.slice(-4).reverse().forEach((e) => {
            const it = el("div", "pastitem");
            it.innerHTML = '<i>' + esc(e.date) + '</i><span>' + esc(e.text) + '</span>';
            list.appendChild(it);
          });
          wrap.appendChild(list);
        }
        wrap.appendChild(helplineCard());
        return;
      }

      // ---------- 1. validation ----------
      if (calm.step === "validate") {
        const st = el("div", "calmstep"); st.textContent = "שלב 1 מתוך 3 · קודם כול"; wrap.appendChild(st);
        const c = el("div", "calmcard");
        c.innerHTML = '<span class="ce">' + m.emoji + '</span>' + m.validate;
        wrap.appendChild(c);
        const next = el("button", "distbtn wide");
        next.textContent = m.body ? "בוא נשחרר קצת את הגוף →" : "בוא ננשום רגע →";
        next.onclick = () => calmGo(m.body ? "body" : "breathe");
        wrap.appendChild(next);
        return;
      }

      // ---------- 2. physical release ----------
      if (calm.step === "body") {
        const st = el("div", "calmstep"); st.textContent = "שלב 2 מתוך 3 · הגוף"; wrap.appendChild(st);
        const intro = el("p", "calmintro");
        intro.textContent = "כעס ולחץ נתפסים בגוף לפני שהם מגיעים לראש. עבור על שלושת אלה לאט — כל אחד כמה שניות:";
        wrap.appendChild(intro);
        const items = [
          ["✊", "<b>אגרופים.</b> סגור חזק את שתי כפות הידיים, ספור 3… ואז פתח לגמרי ותן לאצבעות ליפול."],
          ["😬", "<b>לסת.</b> שים לב אם השיניים קפוצות. הרפה את הלסת, תן לפה להיפתח קצת."],
          ["🤷", "<b>כתפיים.</b> הרם אותן לאוזניים, החזק רגע — ותפיל אותן בבת אחת."],
        ];
        const list = el("div", "bodylist");
        items.forEach((it) => {
          const d = el("div", "bodyitem");
          d.innerHTML = '<span class="bi">' + it[0] + '</span><span>' + it[1] + '</span>';
          list.appendChild(d);
        });
        wrap.appendChild(list);
        const next = el("button", "distbtn wide");
        next.textContent = "שחררתי — עכשיו נשימות →";
        next.onclick = () => calmGo("breathe");
        wrap.appendChild(next);
        return;
      }

      // ---------- 3. breathing: 4 in / 6 out ----------
      if (calm.step === "breathe") {
        const st = el("div", "calmstep"); st.textContent = "שלב " + (m.body ? "3" : "2") + " · נשימה"; wrap.appendChild(st);
        const intro = el("p", "calmintro");
        intro.innerHTML = "נשיפה ארוכה מהשאיפה היא מה שמרגיע את הגוף. פשוט לך אחרי העיגול — <b>4 שניות פנימה, 6 החוצה</b>.";
        wrap.appendChild(intro);

        const bwrap = el("div", "breathe");
        const circle = el("div", "bcircle");
        circle.innerHTML = '<div style="text-align:center"><span class="btext" id="bTxt">מתכוננים…</span><span class="bsub" id="bSub"></span></div>';
        bwrap.appendChild(circle);
        wrap.appendChild(bwrap);
        const counter = el("div", "bcount"); counter.id = "bCount";
        counter.textContent = "סבב " + Math.min(calm.cycle + 1, BREATH_CYCLES) + " מתוך " + BREATH_CYCLES;
        wrap.appendChild(counter);

        const skip = el("button", "calmskip"); skip.textContent = "דלג לשאלה האחרונה ←";
        skip.onclick = () => { calm.cycle = 0; calmGo("focus"); };
        wrap.appendChild(skip);

        const txt = circle.querySelector("#bTxt"), sub = circle.querySelector("#bSub");
        const at = (ms, fn) => calmTimers.push(setTimeout(fn, ms));
        // count down inside each phase so the user always knows how long is left
        const countdown = (secs) => {
          for (let i = 0; i < secs; i++) at(i * 1000, () => { if (sub) sub.textContent = String(secs - i); });
        };
        const runCycle = () => {
          if (!calm || calm.step !== "breathe") return;
          if (calm.cycle >= BREATH_CYCLES) { calmGo("focus"); return; }
          const cnt = $("bCount");
          if (cnt) cnt.textContent = "סבב " + (calm.cycle + 1) + " מתוך " + BREATH_CYCLES;
          // inhale 4s
          circle.className = "bcircle in";
          if (txt) txt.textContent = "שאף פנימה";
          countdown(4);
          // short hold
          at(4000, () => { circle.className = "bcircle hold in"; if (txt) txt.textContent = "החזק"; if (sub) sub.textContent = ""; });
          // exhale 6s
          at(4800, () => {
            circle.className = "bcircle out";
            if (txt) txt.textContent = "נשוף לאט";
            countdown(6);
          });
          at(11000, () => { calm.cycle++; runCycle(); });
        };
        at(600, runCycle);
        return;
      }

      // ---------- 4. one small step ----------
      if (calm.step === "focus") {
        const st = el("div", "calmstep"); st.textContent = "לסיום · צעד אחד קטן"; wrap.appendChild(st);
        const c = el("div", "calmcard");
        c.innerHTML = '<span class="ce">🌱</span>' +
          '<b>אתה לא צריך לפתור את כל החיים שלך עכשיו.</b><br>' +
          'אף אחד לא מסדר הכול ברגע אחד, וזו גם לא המטרה כרגע. המטרה היא רק להחזיר לעצמך שליטה קטנה אחת.';
        wrap.appendChild(c);

        const q = el("div", "stepq");
        q.textContent = "מה הדבר הקטן האחד שאתה יכול לעשות בשעה הקרובה כדי להרגיש 1% יותר טוב?";
        wrap.appendChild(q);
        const note = el("p", "stepnote");
        note.textContent = "משהו קטן ממש. לשתות מים, לצאת 5 דקות החוצה, לשלוח הודעה אחת, לסדר פינה אחת בשולחן.";
        wrap.appendChild(note);

        const ta = el("textarea", "stepin");
        ta.rows = 3; ta.placeholder = "הדבר הקטן שלי הוא…";
        ta.value = calm.answer || "";
        ta.oninput = () => { calm.answer = ta.value; const b = wrap.querySelector("#calmSave"); if (b) b.disabled = !ta.value.trim(); };
        wrap.appendChild(ta);

        const save = el("button", "distbtn wide"); save.id = "calmSave";
        save.textContent = "זה הצעד שלי 🌿";
        save.disabled = !(calm.answer || "").trim();
        save.onclick = () => {
          const text = (calm.answer || "").trim();
          if (!text) return;
          const d = new Date();
          const date = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
          state.calmLog = (state.calmLog || []).concat([{ date: date, text: text }]).slice(-20);
          saveState();
          calmGo("done");
        };
        wrap.appendChild(save);
        setTimeout(() => ta.focus(), 60);
        return;
      }

      // ---------- done ----------
      if (calm.step === "done") {
        const d = el("div", "calmdone");
        d.innerHTML = '<span class="de">🌿</span>' +
          '<div class="calmcard" style="text-align:start">' +
            'זהו. לא פתרנו את הכול — רק הורדנו קצת את עוצמת הרעש, וזה מספיק לעכשיו.<br><br>' +
            '<b>הצעד שלך לשעה הקרובה:</b><br>' + esc((calm.answer || "").trim()) +
          '</div>';
        wrap.appendChild(d);
        const again = el("button", "distbtn wide"); again.textContent = "חזרה לקוביות";
        again.onclick = () => { clearCalmTimers(); calm = null; state.screen = "app"; render(); };
        wrap.appendChild(again);
        const more = el("button", "calmskip"); more.textContent = "לעשות עוד סבב ↻";
        more.onclick = () => openCalm();
        wrap.appendChild(more);
        wrap.appendChild(helplineCard());
        return;
      }
    }

    // A quiet, non-alarming route to real human help. A self-help exercise is
    // not a substitute for support, and this must never be hidden.
    function helplineCard() {
      const h = el("div", "helpline");
      h.innerHTML = '<b class="hlt">צריך יותר מזה? זה בסדר גמור.</b>' +
        'התרגיל הזה עוזר לרגע קשה — הוא לא תחליף לאדם אמיתי. אם קשה לך באמת, או שהמחשבות מפחידות אותך, ' +
        'מותר ואפשר לדבר עכשיו עם מישהו:' +
        '<span class="hlrow">• <b>ער״ן</b> — קו סיוע 24/7: <a class="tel" href="tel:1201">1201</a></span>' +
        '<span class="hlrow">• <b>סה״ר</b> — תמיכה רגשית בצ׳אט: <a href="https://sahar.org.il" target="_blank" rel="noopener">sahar.org.il</a></span>' +
        '<span class="hlrow">• <b>נט״ל</b> — <a class="tel" href="tel:1800363363">1-800-363-363</a></span>' +
        '<span class="hlrow">ואם יש סכנה מיידית — <a class="tel" href="tel:101">101</a> (מד״א).</span>';
      return h;
    }

    function renderGuidePage() {
      const kid = isKidMode();
      const features = kid ? KID_GUIDE_FEATURES : GUIDE_FEATURES;
      const body = pageShell(kid ? "המדריך שלי 🧭" : "מדריך דור העתיד 🧭", () => { guideFeat = null; state.screen = "app"; render(); });
      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl" style="font-size:15px">' + (kid
        ? "5 דברים ששווה לדעת על כסף — קצר, פשוט, ועם מחשבונים שאפשר לשחק איתם. בחר נושא 👇"
        : "מאיפה מתחילים? 7 כלים קצרים שכל צעיר צריך לפני הדירה, העבודה והחשבונות הראשונים. בחרו נושא 👇") + '</div>';
      body.appendChild(intro);

      const hub = el("div", "guidehub");
      features.forEach((f, i) => {

    let wiScenario = null, wiWithCut = false, wiCustomType = "once", wiCustomAmt = "";
    const WI_PRESETS = [
      { id: "nowork", label: "🏖️ להפסיק לעבוד ל-3 חודשים", opts: { incomeOff: [1, 3] } },
      { id: "car", label: "🚗 לקנות רכב ב-30,000 ₪", opts: { oneTime: 30000 } },
      { id: "extra", label: "📈 הוצאה קבועה חדשה של 500 ₪ בחודש", opts: { extraMonthly: 500 } },
    ];
    function wiModel() {
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const income = monthlyIncome();
      const housing = (by.housing ? by.housing.amount : 0) + (by.landlord ? by.landlord.amount : 0) + (by.bills ? by.bills.amount : 0);
      const ess = by.essentials ? by.essentials.amount : 0;
      const life = by.lifestyle ? by.lifestyle.amount : 0;
      return { income: income, spend: housing + ess + life, life: life, start: totalBalance() + state.pool };
    }
    function wiProject(opts, lifeCut) {
      const m = wiModel();
      const rows = [];
      let cur = m.start;
      let sim = m.start - (opts.oneTime || 0);
      for (let month = 0; month <= 6; month++) {
        rows.push({ month: month, cur: Math.round(cur), sim: Math.round(sim) });
        cur += m.income - m.spend;
        let inc = m.income;
        if (opts.incomeOff && month + 1 >= opts.incomeOff[0] && month + 1 <= opts.incomeOff[1]) inc = 0;
        const spend = m.spend + (opts.extraMonthly || 0) - (lifeCut ? m.life * lifeCut : 0);
        sim += inc - spend;
      }
      return rows;
    }
    // =====================================================================
    // GROWTH SIMULATOR — "what if I put ₪X extra into this cube every month,
    // and how much will I actually have in N months?"
    //
    // Two projections side by side: the current path (what each cube already
    // receives every month) and the boosted path. No interest is invented —
    // this is deposits only, which is the honest model for a budgeting app.
    // =====================================================================
    let gs = { target: "__all", extra: "", months: 12 };
    const GS_MONTHS = [3, 6, 12, 24, 36];

    // What one cube receives in a normal month. Locked cubes are bills that
    // pass straight through, so they never "grow".
    function cubeMonthlyInflow(c) {
      if (!c || c.locked) return 0;
      const set = Math.round(Number(c.amount) || 0);
      if (set > 0) return set;
      return Math.round(monthlyIncome() * ((Number(c.pct) || 0) / 100));
    }
    // The money that is genuinely free to redirect into an extra contribution.
    function freeMonthlyBudget() {
      const income = monthlyIncome();
      if (income <= 0) return 0;
      const committed = state.cubes.reduce((s, c) => s + (c.locked ? Math.round(Number(c.amount) || 0) : 0), 0);
      return Math.max(0, income - committed);
    }

    function growthProject(targetKey, extra, months) {
      const all = targetKey === "__all";
      const cube = all ? null : state.cubes.find((c) => c.key === targetKey);
      if (!all && !cube) return null;
      const perMonth = all
        ? state.cubes.reduce((s, c) => s + cubeMonthlyInflow(c), 0)
        : cubeMonthlyInflow(cube);
      const start = all ? Math.round(totalBalance() + state.pool) : Math.round(cube.balance);
      const rows = [];
      for (let m = 0; m <= months; m++) {
        rows.push({ month: m, base: Math.round(start + perMonth * m), boost: Math.round(start + (perMonth + extra) * m) });
      }
      const goal = !all && Number(cube.goalTarget) > 0 ? Number(cube.goalTarget)
                 : (!all && cube.key === EMERGENCY_KEY ? emergencyTarget() : 0);
      const hit = (rate) => (goal > 0 && rate > 0 ? Math.ceil(Math.max(0, goal - start) / rate) : 0);
      return {
        rows: rows, start: start, perMonth: perMonth, extra: extra, months: months,
        end: rows[rows.length - 1], goal: goal,
        goalMonthsBase: hit(perMonth), goalMonthsBoost: hit(perMonth + extra),
        name: all ? "כל הכסף שלך" : cube.name, emoji: all ? "🧊" : cube.emoji,
        color: all ? "var(--primary)" : cube.color,
      };
    }
    // Up to 7 evenly spaced sample points, always including now and the end.
    function growthSamples(rows) {
      const last = rows.length - 1;
      if (last <= 6) return rows;
      const out = [];
      for (let i = 0; i <= 6; i++) out.push(rows[Math.round((last * i) / 6)]);
      return out;
    }

    function renderGrowthSection(body) {
      const st = el("div", "section-t"); st.textContent = "כמה הכסף שלי יגדל? 📈"; body.appendChild(st);

      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl">בחרו קובייה, הוסיפו סכום חודשי — ותראו בדיוק כמה יהיה לכם בעוד כמה חודשים, מול המסלול הנוכחי.</div>';
      body.appendChild(intro);

      // target picker
      const growable = state.cubes.filter((c) => !c.locked);
      const pick = el("div", "exchips");
      const mkChip = (key, label) => {
        const b = el("button", "fchip" + (gs.target === key ? " on" : ""));
        b.textContent = label;
        b.onclick = () => { gs.target = key; render(); };
        pick.appendChild(b);
      };
      mkChip("__all", "🧊 כל הכסף שלי");
      growable.forEach((c) => mkChip(c.key, c.emoji + " " + c.name));
      body.appendChild(pick);

      // extra + horizon
      const ctl = el("div", "setcard");
      ctl.innerHTML =
        '<label class="flbl" style="margin-top:0">כמה להוסיף כל חודש?</label>' +
        '<div class="fld"><span class="cur">₪</span><input id="gsExtra" inputmode="numeric" placeholder="200" value="' + esc(gs.extra) + '"></div>' +
        '<div class="depchips" id="gsQuick">' + [50, 100, 200, 500].map((n) =>
          '<button class="fchip depq' + (Number(gs.extra) === n ? " on" : "") + '" data-n="' + n + '">' + n + ' ₪</button>').join("") + '</div>' +
        '<label class="flbl">לכמה זמן קדימה?</label>' +
        '<div class="exchips" id="gsMonths">' + GS_MONTHS.map((n) =>
          '<button class="fchip' + (gs.months === n ? " on" : "") + '" data-m="' + n + '">' + n + ' חודשים</button>').join("") + '</div>';
      body.appendChild(ctl);
      ctl.querySelector("#gsExtra").oninput = (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "");
        gs.extra = e.target.value;
        paint();
        ctl.querySelectorAll("#gsQuick .depq").forEach((b) => b.classList.toggle("on", Number(gs.extra) === Number(b.dataset.n)));
      };
      ctl.querySelectorAll("#gsQuick .depq").forEach((b) => {
        b.onclick = () => { gs.extra = b.dataset.n; ctl.querySelector("#gsExtra").value = gs.extra; render(); };
      });
      ctl.querySelectorAll("#gsMonths .fchip").forEach((b) => {
        b.onclick = () => { gs.months = Number(b.dataset.m); render(); };
      });

      const out = el("div", "gsout");
      body.appendChild(out);

      function paint() {
        const extra = Math.max(0, Math.round(Number(gs.extra) || 0));
        const p = growthProject(gs.target, extra, gs.months);
        out.innerHTML = "";
        if (!p) return;

        // headline
        const head = el("div", "gshead");
        const gain = p.end.boost - p.end.base;
        head.innerHTML =
          '<div class="gsbig"><span>' + p.emoji + ' ' + esc(p.name) + ' בעוד ' + p.months + ' חודשים</span>' +
            '<b style="color:' + p.color + '">₪' + fmt(p.end.boost) + '</b></div>' +
          '<div class="gssub">במסלול הנוכחי: ₪' + fmt(p.end.base) +
            (extra > 0 ? ' · התוספת מוסיפה <b>₪' + fmt(gain) + '</b>' : '') + '</div>';
        out.appendChild(head);

        if (p.perMonth <= 0 && extra <= 0) {
          const w = el("div", "wiwarn");
          w.innerHTML = '<b>אין עדיין קצב חודשי.</b> הקובייה הזו לא מקבלת סכום חודשי קבוע. הזינו הכנסה חודשית במסך „הכנסה”, או הוסיפו כאן סכום חודשי כדי לראות תחזית.';
          out.appendChild(w);
          return;
        }

        // visual growth timeline
        const rows = growthSamples(p.rows);
        const max = Math.max(1, p.end.boost, p.end.base, p.goal || 0);
        const tbl = el("div", "witable");
        tbl.innerHTML = '<div class="wirow head"><span>חודש</span><span>מסלול נוכחי</span><span>' + (extra > 0 ? "עם ₪" + fmt(extra) + " בחודש" : "עם התוספת") + '</span></div>';
        rows.forEach((r) => {
          const row = el("div", "wirow");
          row.innerHTML = '<span>' + (r.month === 0 ? "עכשיו" : r.month) + '</span>' +
            '<span class="wibar"><i class="cur" style="width:' + Math.round((r.base / max) * 100) + '%"></i><em>₪' + fmt(r.base) + '</em></span>' +
            '<span class="wibar"><i class="sim" style="width:' + Math.round((r.boost / max) * 100) + '%"></i><em>₪' + fmt(r.boost) + '</em></span>';
          tbl.appendChild(row);
        });
        out.appendChild(tbl);

        // goal callout
        if (p.goal > 0) {
          const g = el("div", p.goalMonthsBoost > 0 && p.goalMonthsBoost <= p.months ? "wisafe" : "setcard");
          if (p.start >= p.goal) g.textContent = "🎉 כבר הגעת ליעד של ₪" + fmt(p.goal) + ".";
          else if (p.goalMonthsBoost > 0) {
            const saved = p.goalMonthsBase > 0 ? p.goalMonthsBase - p.goalMonthsBoost : 0;
            g.innerHTML = "🎯 עם התוספת תגיע ל-₪" + fmt(p.goal) + " תוך <b>" + p.goalMonthsBoost + " חודשים</b>" +
              (saved > 0 ? " — " + saved + " חודשים מוקדם יותר מהמסלול הנוכחי." :
               (p.goalMonthsBase > 0 ? " (כמו במסלול הנוכחי)." : "."));
          } else g.textContent = "🎯 היעד הוא ₪" + fmt(p.goal) + ", אבל בקצב הנוכחי לא מתקדמים אליו — הוסיפו סכום חודשי.";
          out.appendChild(g);
        }

        // is the extra actually affordable?
        const free = freeMonthlyBudget();
        const committedFlex = state.cubes.reduce((s, c) => s + (c.locked ? 0 : cubeMonthlyInflow(c)), 0);
        const slack = Math.max(0, free - committedFlex);
        if (extra > 0) {
          const note = el("div", extra > slack ? "wiwarn" : "wisafe");
          if (extra > slack) {
            note.innerHTML = '<b>מאיפה ייקח הכסף?</b> התקציב החודשי שלך כבר מחולק כמעט כולו. ₪' + fmt(extra) +
              ' בחודש ידרשו לצמצם קובייה אחרת' + (slack > 0 ? ' — פנויים כרגע רק ₪' + fmt(slack) + ' בחודש.' : '.') +
              ' הקובייה הכי טבעית לצמצום היא בדרך כלל הבילויים.';
          } else {
            note.textContent = "✅ ₪" + fmt(extra) + " בחודש נכנסים בתקציב — נשארים ₪" + fmt(slack - extra) + " חופשיים.";
          }
          out.appendChild(note);
        }
      }
      paint();
    }

    function renderWhatIfPage() {
      const body = pageShell("סימולטור מה-אם? 🔮", () => { wiScenario = null; wiWithCut = false; state.screen = "app"; render(); });

      renderGrowthSection(body);

      const st2 = el("div", "section-t"); st2.textContent = "מה קורה אם משהו משתנה? ⚠️"; body.appendChild(st2);
      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl">בחרו תרחיש — ה-AI יקרין את המצב הכספי שלכם 6 חודשים קדימה, מול המסלול הנוכחי.</div>';
      body.appendChild(intro);

      const chips = el("div", "wichips");
      WI_PRESETS.forEach((p) => {
        const c = el("button", "fchip wide" + (wiScenario && wiScenario.id === p.id ? " on" : ""));
        c.textContent = p.label;
        c.onclick = () => { wiScenario = p; wiWithCut = false; render(); };
        chips.appendChild(c);
      });
      body.appendChild(chips);

      // custom expense — with a "סוג ההוצאה" (one-time / monthly recurring) toggle
      const typeWrap = el("div", "setcard");
      typeWrap.innerHTML =
        '<div class="setlbl">סוג ההוצאה</div>' +
        '<div class="segtoggle" id="wiType">' +
          '<button data-t="once" class="' + (wiCustomType === "once" ? "on" : "") + '">💥 חד-פעמי</button>' +
          '<button data-t="monthly" class="' + (wiCustomType === "monthly" ? "on" : "") + '">🔁 חודשי קבוע</button>' +
        '</div>';
      body.appendChild(typeWrap);
      typeWrap.querySelectorAll("#wiType button").forEach((btn) => {
        btn.onclick = () => { wiCustomType = btn.getAttribute("data-t"); render(); };
      });

      const cust = el("div", "shactions");
      cust.innerHTML = '<div class="fld small"><span class="cur">₪</span><input inputmode="numeric" value="' + (wiCustomAmt || "") + '" placeholder="' + (wiCustomType === "monthly" ? "500" : "12000") + '" id="wiAmt"></div>' +
        '<button class="distbtn" id="wiRun">' + (wiCustomType === "monthly" ? "הוצאה חודשית קבועה" : "הוצאה חד-פעמית") + '</button>';
      body.appendChild(cust);
      cust.querySelector("#wiAmt").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); wiCustomAmt = e.target.value; };
      cust.querySelector("#wiRun").onclick = () => {
        const amt = Number(cust.querySelector("#wiAmt").value) || 0;
        if (amt <= 0) return;
        wiCustomAmt = String(amt);
        if (wiCustomType === "monthly") {
          // recurring expense — drains the cube every single month in the projection
          wiScenario = { id: "custom", label: "הוצאה חודשית קבועה של ₪" + fmt(amt), opts: { extraMonthly: amt } };
        } else {
          wiScenario = { id: "custom", label: "הוצאה חד-פעמית של ₪" + fmt(amt), opts: { oneTime: amt } };
        }
        wiWithCut = false; render();
      };

      if (!wiScenario) { const s0 = el("div"); s0.style.height = "40px"; body.appendChild(s0); return; }

      const rows = wiProject(wiScenario.opts, wiWithCut ? 0.4 : 0);
      const crisis = rows.find((r) => r.sim < 0);
      const maxAbs = Math.max(1, ...rows.map((r) => Math.max(Math.abs(r.cur), Math.abs(r.sim))));
      const m = wiModel();

      const st = el("div", "section-t"); st.textContent = "תחזית: " + wiScenario.label + (wiWithCut ? " · עם ההמלצה ✨" : ""); body.appendChild(st);

      const tbl = el("div", "witable");
      tbl.innerHTML = '<div class="wirow head"><span>חודש</span><span>מסלול נוכחי</span><span>בתרחיש</span></div>';
      rows.forEach((r) => {
        const row = el("div", "wirow");
        row.innerHTML = '<span>' + (r.month === 0 ? "עכשיו" : r.month) + '</span>' +
          '<span class="wibar"><i class="cur" style="width:' + Math.round(Math.max(0, r.cur) / maxAbs * 100) + '%"></i><em>₪' + fmt(r.cur) + '</em></span>' +
          '<span class="wibar"><i class="' + (r.sim < 0 ? "neg" : "sim") + '" style="width:' + Math.round(Math.abs(r.sim) / maxAbs * 100) + '%"></i><em' + (r.sim < 0 ? ' class="negt"' : "") + '>₪' + fmt(r.sim) + '</em></span>';
        tbl.appendChild(row);
      });
      body.appendChild(tbl);

      if (crisis) {
        const w = el("div", "wiwarn");
        const saveAmt = Math.round(m.life * 0.4);
        const when = crisis.month === 0 ? "מיד" : "תוך " + crisis.month + " חודשים";
        if (wiWithCut) {
          // the recommendation is already applied but the scenario is still negative
          w.innerHTML = '<b>⚠️ עדיין לא מספיק:</b> גם אחרי צמצום של 40% בקוביית הבילויים היתרה מתרוקנת ' + when +
            '. התרחיש הזה גדול מדי ביחס להכנסה — שקלו לפרוס אותו על פני זמן, להגדיל הכנסה, או לוותר עליו.';
          body.appendChild(w);
        } else if (m.life > 0 && saveAmt > 0) {
          w.innerHTML = '<b>⚠️ אזהרה:</b> היתרה שלך תתרוקן ' + when + ' בתרחיש הזה. ' +
            'ה‑AI ממליץ לצמצם את קוביית הבילויים ב-40% (חיסכון של ₪' + fmt(saveAmt) + ' בחודש) כדי לשמור על איזון.';
          body.appendChild(w);
          const b = el("button", "distbtn wide"); b.textContent = "✨ הצג תחזית עם ההמלצה";
          b.onclick = () => { wiWithCut = true; render(); };
          body.appendChild(b);
        } else {
          // no lifestyle cube to trim — don't recommend a ₪0 cut
          w.innerHTML = '<b>⚠️ אזהרה:</b> היתרה שלך תתרוקן ' + when + ' בתרחיש הזה. ' +
            'אין קוביית בילויים משמעותית לצמצם — כדי לאזן צריך להגדיל הכנסה או להקטין את ההוצאה הזו.';
          body.appendChild(w);
        }
      } else {
        const ok = el("div", "wisafe");
        ok.textContent = wiWithCut
          ? "✅ עם ההמלצה התרחיש מאוזן — היתרה נשארת חיובית לאורך כל התקופה."
          : "✅ התרחיש בטוח — היתרה נשארת חיובית לאורך כל 6 החודשים.";
        body.appendChild(ok);
      }
      const sp = el("div"); sp.style.height = "40px"; body.appendChild(sp);
    }

    // Worker 4 — hard wipe: per-account state + user record + session + chat.
    let wiping = false;
    async function wipeAccount() {
      if (!state.authUser || wiping) return;
      // Server copy first (chat, income schedule and records, devices, the
      // server account). If it can't be reached, stop — deleting only the
      // local half would leave data behind that the user can no longer reach.
      if (push.ready()) {
        wiping = true;
        showToast("מוחק את הנתונים מהשרת…");
        try { await push.call("deleteAccountData", {}, 20000); }
        catch (e) {
          wiping = false;
          showToast("לא הצלחנו למחוק את הנתונים מהשרת. בדקו את החיבור ונסו שוב");
          return;
        }
        wiping = false;
      }
      // Shared savings: no longer findable or invitable (records stay with the goals' members).
      if (sbLoad()) {
        try { await rpc2("cf2_deactivate_profile", {}); }
        catch (e) {
          if (e.code === "network") { showToast("לא הצלחנו לעדכן את השרת של החיסכון המשותף. בדקו את החיבור ונסו שוב"); return; }
        }
      }
      const email = state.authUser.email;
      try { localStorage.removeItem(stateKey()); } catch (e) {}
      try { localStorage.removeItem(obKey()); } catch (e) {} // saved onboarding draft
      const users = loadUsers(); delete users[email]; saveUsers(users);
      clearSecLog(); // the security log holds this user's email — wipe it too
      settStep = 0;
      resetChat();
      logout(); // clears session + in-memory state, routes to the login screen
      showToast("🗑️ החשבון נמחק לצמיתות");
    }

    $("fab").onclick = openChat;
    $("calmfab").onclick = openCalm;

    // ---- boot -------------------------------------------------------------
    initAuth();
    pushCheckTarget();   // opened from a notification while logged out → ask to log in first
    // The shell outside #view (nav labels, the intro splash) is static markup
    // that no render() call rebuilds, so it needs one explicit pass.
    translateTree(document.body);
  </script>
</body>
</html>
