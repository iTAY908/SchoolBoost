      w.querySelectorAll(".ob-opt").forEach((b) => { b.onclick = () => { cc.mode = b.dataset.m; renderCustomCube(); }; });
      const amt = w.querySelector("#ccAmt");
      if (amt) amt.oninput = () => { amt.value = amt.value.replace(/[^0-9]/g, ""); cc.amount = amt.value; syncCC(); };
      const prio = w.querySelector("#ccPrio");
      if (prio) prio.oninput = () => {
        cc.priority = Number(prio.value);
        const hot = cc.priority > PRIORITY_AGGRESSIVE;
        const pv = w.querySelector("#ccPrioV"); pv.textContent = cc.priority; pv.classList.toggle("hot", hot);
        const band = w.querySelector("#ccBand");
        band.textContent = PRIO_BANDS[cc.priority] + (hot ? " · מעל 7 — מצב חיסכון אגרסיבי" : " · הקצאה מתונה");
        band.classList.toggle("hot", hot);
        cc.computed = false; w.querySelector("#ccRes").style.display = "none"; syncCC();
      };
      const gp = w.querySelector("#ccGoalP");
      if (gp) gp.oninput = () => { gp.value = gp.value.replace(/[^0-9]/g, ""); cc.goalPrice = gp.value; cc.computed = false; w.querySelector("#ccRes").style.display = "none"; syncCC(); };
      const gm = w.querySelector("#ccGoalM");
      if (gm) gm.oninput = () => { gm.value = gm.value.replace(/[^0-9]/g, ""); cc.goalMonths = gm.value; cc.computed = false; w.querySelector("#ccRes").style.display = "none"; syncCC(); };
      const upg = w.querySelector("#ccUpg");
      if (upg) upg.onclick = () => { closeCustomCube(); state.screen = "upgrade"; render(); };
      const toInc = w.querySelector("#ccIncome");
      if (toInc) toInc.onclick = () => { closeCustomCube(); state.screen = "income"; render(); };
      const calc = w.querySelector("#ccCalc");
      if (calc) calc.onclick = () => {
        const r = allocateCustomCube(cc.priority, { price: cc.goalPrice, months: cc.goalMonths });
        if (!r.ok) {
          // Never print a confident "₪0 לחודש" — say what's missing and where to fix it.
          cc.computed = false; cc.amount = ""; cc.blocked = r.explanation;
          renderCustomCube();
          return;
        }
        cc.blocked = ""; cc.amount = r.amount; cc.explanation = r.explanation; cc.computed = true;
        const res = w.querySelector("#ccRes");
        res.style.display = "block";
        res.innerHTML = '<div class="aiAmt">₪' + fmt(r.amount) + ' <span>לחודש</span></div><div class="aiExp">' + esc(r.explanation) + '</div>';
        syncCC();
      };
      w.querySelector("#ccCancel").onclick = closeCustomCube;
      w.querySelector("#ccCreate").onclick = () => {
        if (!((cc.name || "").trim() && Number(cc.amount) > 0 && (cc.mode === "manual" || (cc.mode === "ai" && cc.computed)))) return;
        const meta = cc.mode === "ai"
          ? { priority: cc.priority, explanation: cc.explanation, goalPrice: cc.goalPrice }
          : {};
        const name = cc.name, amount = Number(cc.amount);
        closeCustomCube();
        createCustomCube(name, amount, meta);
      };
      function syncCC() { const b = w.querySelector("#ccCreate"); if (b) b.disabled = !((cc.name || "").trim() && Number(cc.amount) > 0 && (cc.mode === "manual" || (cc.mode === "ai" && cc.computed))); }
      setTimeout(() => { const f = w.querySelector("#ccName"); if (f && !cc.name) f.focus(); }, 40);
    }

    // The emergency fund's real goal isn't a monthly target — it's how many
    // months you could survive with no income at all. That's the number that
    // makes people keep funding it, so the card says it out loud.
    function emergencyLine(c) {
      const goal = emergencyTarget();
      const per = essentialMonthlySpend();
      if (goal <= 0 || per <= 0) return '<div class="emgline">🛟 קרן חירום — היעד נקבע לפי ההוצאות החודשיות שלך. הזינו הכנסה חודשית כדי לחשב אותו.</div>';
      const months = Math.floor((c.balance / per) * 10) / 10;
      if (c.balance >= goal) return '<div class="emgline done">🛟 יש לך רשת ביטחון מלאה — כ-3 חודשי הוצאות (₪' + fmt(goal) + '). זה הישג אמיתי.</div>';
      return '<div class="emgline">🛟 ₪' + fmt(c.balance) + ' מתוך ₪' + fmt(goal) + ' (3 חודשי הוצאות) · מכסה כרגע כ-' +
        (months >= 1 ? months + " חודשים" : Math.round((c.balance / per) * 30) + " ימים") + ' בלי הכנסה</div>';
    }

    function cubeCard(c) {
      // Stable monthly target: locked cubes = their fixed amount; others = the
      // set amount, else a share of income. Never fall back to the current
      // balance (that made the bar read 100% with a meaningless "₪1" target).
      const income = monthlyIncome();
      const monthly = c.locked ? (c.amount || 0)
        : (c.amount && c.amount > 0 ? c.amount : Math.round(income * ((c.pct || 0) / 100)));
      // A goal cube (kid's "new bike", a personal target) fills toward its total
      // goal price rather than a monthly figure — that's the motivating number.
      const isGoal = Number(c.goalTarget) > 0;
      const target = isGoal ? Number(c.goalTarget) : (monthly || 0);
      const hasTarget = target >= 10; // hide nonsense targets
      const fill = hasTarget ? Math.max(0, Math.min(1, c.balance / target)) * 100 : (c.balance > 0 ? 100 : 0);
      const reached = isGoal && c.balance >= target;
      const card = el("div", "cube" + (state.justFunded.has(c.key) ? " pop" : "") + (c.key === "landlord" ? " landlordc" : ""));
      card.innerHTML =
        '<div class="top">' +
          '<div class="chip" style="background:' + c.color + '22">' + c.emoji + '</div>' +
          '<div><div class="nm">' + esc(c.name) + (c.locked ? ' <span title="נעול">🔒</span>' : '') + '</div><div class="nt">' + esc(c.note) + '</div></div>' +
          (c.pct ? '<div class="pct" style="color:' + c.color + ';background:' + c.color + '22">' + c.pct + '%</div>' : '') +
        '</div>' +
        '<div class="brow"><span class="bal" data-to="' + c.balance + '">₪' + fmt(c.balance) + '</span>' +
          (hasTarget || c.locked
            ? '<span class="tgt">מתוך ₪' + fmt(target) + (c.locked ? ' (נעול)' : (isGoal ? ' ליעד' : ' לחודש')) + '</span>'
            : '') +
          '<button class="depbtn" title="הפקדה לקובייה הזו" aria-label="הפקדה ל' + esc(c.name) + '">＋</button>' +
        '</div>' +
        '<div class="track"><i style="background:' + c.color + '"></i></div>' +
        (isGoal
          ? '<div class="depgoal">' + (reached
              ? '🎉 הגעת ליעד! אפשר לקנות את ' + esc(c.name)
              : '🎯 עוד ₪' + fmt(target - c.balance) + ' ואתה שם!') + '</div>'
          : (isEmergency(c) ? emergencyLine(c) : ''));
      requestAnimationFrame(() => { const bar = card.querySelector(".track > i"); if (bar) bar.style.width = fill + "%"; });
      card.querySelector(".depbtn").onclick = (e) => { e.stopPropagation(); openDeposit(c.key); };
      return card;
    }

    // ---- Manual deposit into ONE cube -------------------------------------
    // "I got ₪100 from a friend and want all of it in Fun" — money can either be
    // brand-new (a gift / allowance / odd job) or moved out of the free balance.
    let dep = null; // { key, amount, source: 'new' | 'pool' }
    function openDeposit(key) {
      const cube = state.cubes.find((c) => c.key === key);
      if (!cube) return;
      clearToasts();
      topUp = null;
      dep = { key: key, amount: "", source: state.pool > 0 ? "pool" : "new" };
      renderDeposit();
    }
    function closeDeposit() { notifyNativeBusy(false); dep = null; const w = $("depwrap"); w.classList.remove("on"); w.innerHTML = ""; }
    function renderDeposit() {
      if (!dep) return;
      notifyNativeBusy(true);
      const cube = state.cubes.find((c) => c.key === dep.key);
      if (!cube) return closeDeposit();
      const amt = Math.round(Number(dep.amount) || 0);
      const avail = Math.round(state.pool);
      const overPool = dep.source === "pool" && amt > avail;
      const w = $("depwrap"); w.className = "ccwrap on";
      w.onclick = (e) => { if (e.target === w) closeDeposit(); };
      w.innerHTML = '<div class="ccsheet">' +
        '<div class="handle"></div>' +
        '<h2 class="authtitle" style="font-size:22px">' + cube.emoji + ' הפקדה ל' + esc(cube.name) + '</h2>' +
        '<p class="authsub">כמה כסף להכניס לקובייה הזו?</p>' +
        '<div class="fld"><span class="cur">₪</span><input id="depAmt" inputmode="numeric" placeholder="100" value="' + esc(dep.amount) + '"></div>' +
        '<div class="depchips">' + [10, 20, 50, 100, 200].map((n) =>
          '<button class="fchip depq' + (amt === n ? " on" : "") + '" data-n="' + n + '">' + n + ' ₪</button>').join("") + '</div>' +
        '<label class="flbl" style="margin-top:16px">מאיפה הכסף?</label>' +
        '<div class="segtoggle" id="depSrc">' +
          '<button data-s="new" class="' + (dep.source === "new" ? "on" : "") + '">' +
            (isPrepaid() ? '💳 טעינה חדשה<small>כסף שנטען עכשיו לכרטיס</small>' : '💝 כסף חדש<small>מתנה · דמי כיס · עבודה</small>') + '</button>' +
          '<button data-s="pool" class="' + (dep.source === "pool" ? "on" : "") + '"' + (avail <= 0 ? " disabled" : "") + '>🪙 מהיתרה הפנויה<small>' + (avail > 0 ? "זמין ₪" + fmt(avail) : "אין יתרה פנויה") + '</small></button>' +
        '</div>' +
        (overPool ? '<div class="gwarn">ביתרה הפנויה יש רק ₪' + fmt(avail) + ' — אפשר לבחור "כסף חדש" 🙂</div>' : "") +
        '<button class="distbtn wide" id="depGo" style="margin-top:16px"' + (amt > 0 && !overPool ? "" : " disabled") + '>' +
          (amt > 0 ? "הפקד ₪" + fmt(amt) : "הפקדה") + '</button>' +
        '<button class="obback" id="depCancel">ביטול</button>' +
      '</div>';
      const inp = w.querySelector("#depAmt");
      inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, ""); dep.amount = inp.value; renderDeposit(); };
      w.querySelectorAll(".depq").forEach((b) => {
        b.onclick = () => { dep.amount = b.getAttribute("data-n"); renderDeposit(); };
      });
      w.querySelectorAll("#depSrc button").forEach((b) => {
        b.onclick = () => { if (b.disabled) return; dep.source = b.getAttribute("data-s"); renderDeposit(); };
      });
      w.querySelector("#depCancel").onclick = closeDeposit;
      w.querySelector("#depGo").onclick = doDeposit;
      setTimeout(() => { const f = w.querySelector("#depAmt"); if (f && !dep.amount) f.focus(); }, 40);
    }
    function doDeposit() {
      if (!dep) return;
      const cube = state.cubes.find((c) => c.key === dep.key);
      const amt = Math.round(Number(dep.amount) || 0);
      if (!cube || amt <= 0) return;
      const fromPool = dep.source === "pool";
      if (fromPool) {
        if (amt > state.pool) { showToast("אין מספיק ביתרה הפנויה 🙂"); return; }
        state.pool -= amt;
      }
      // On a prepaid card, "new money" is a top-up — keep the recorded card
      // balance in step so the panel never drifts from the cubes.
      if (!fromPool && isPrepaid() && state.profile) state.profile.prepaidBalance = loadedTotal() + amt;
      cube.balance += amt;
      const name = cube.name, key = cube.key;
      const reached = Number(cube.goalTarget) > 0 && cube.balance >= Number(cube.goalTarget);
      closeDeposit();
      state.justFunded = new Set([key]);
      saveState();
      burstCoins(reached ? "🎉" : "🪙");
      render();
      animateCounts();
      showToast(reached
        ? "🎉 הגעת ליעד של " + name + "!"
        : "✅ ₪" + fmt(amt) + " נכנסו ל" + name + (fromPool ? " (מהיתרה הפנויה)" : " 💝"));
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }

    // ---- distribute (animation + count-up) --------------------------------
    function distribute() {
      const pool = state.pool;
      if (pool <= 0) return;
      state.game.flags.dist = true; // badge: distributed a budget
      // One shared allocator for every path that moves money into cubes (this
      // button, the monthly income, the simulator preview) — bills first, then
      // percentages, remainder stays free.
      const plan = splitByPercent(pool);
      plan.rows.forEach((r) => { const c = state.cubes.find((x) => x.key === r.key); if (c) c.balance += r.amount; });
      const distributed = plan.given;
      state.pool = plan.leftover;
      state.justFunded = new Set(state.cubes.map((c) => c.key));
      burstCoins();
      render();
      animateCounts();
      showToast("🪙 חולקו ₪" + fmt(distributed) + " לקוביות");
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }

    function animateCounts() {
      document.querySelectorAll(".bal").forEach((node) => {
        const to = Number(node.dataset.to), from = 0, start = performance.now(), dur = 650;
        (function tick(t) {
          const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
          node.textContent = "₪" + fmt(from + (to - from) * e);
          if (p < 1) requestAnimationFrame(tick);
        })(start);
      });
    }

    function burstCoins(emoji) {
      const box = $("coins");
      for (let i = 0; i < 16; i++) {
        const c = el("div", "coin"); c.textContent = emoji || "🪙";
        c.style.left = (Math.random() * 320 + 24) + "px";
        box.appendChild(c);
        const dur = 800 + Math.random() * 500, delay = Math.random() * 250;
        c.animate(
          [{ transform: "translateY(-40px) rotate(0)", opacity: 1 },
           { transform: "translateY(840px) rotate(" + (360 + Math.random() * 360) + "deg)", opacity: 0 }],
          { duration: dur, delay: delay, easing: "cubic-bezier(.4,0,.7,1)", fill: "forwards" }
        );
        setTimeout(() => c.remove(), dur + delay + 50);
      }
    }

    function showToast(msg) {
      const t = el("div", "toast"); t.textContent = msg;
      $("view").parentElement.appendChild(t); // .screen is the positioned container
      requestAnimationFrame(() => t.classList.add("on"));
      setTimeout(() => { t.classList.remove("on"); setTimeout(() => t.remove(), 400); }, 2800);
    }
    // Clear any toast still on screen — called when a bottom sheet opens so a
    // leftover message can never sit on top of the sheet's action button.
    function clearToasts() {
      document.querySelectorAll(".toast").forEach((t) => { t.classList.remove("on"); setTimeout(() => t.remove(), 400); });
    }

    // =====================================================================
    // Worker 1 — Cubey chat, persistent DOM.
    // The shell (header/messages/suggestions/input) is built ONCE; messages
    // are appended incrementally. No full re-render => no flicker/jumping,
    // the open animation runs only on first open, and history survives
    // close/reopen. scrollToBottom() fires on every append + stream tick.
    // =====================================================================
    let chatBuilt = false, chatOpen = false, streaming = false, pendingAction = null;
    let chatPollTimer = null;
    const SUGG = ["עזור לי להחליט מה לקנות", "מה מצב קרן החירום?", "כמה אני יכול לחסוך בחודש?", "תכניס 100 ₪ לחיסכון"];

    function scrollToBottom() { const m = $("msgs"); if (m) m.scrollTop = m.scrollHeight; }

    function buildChatShell() {
      if (chatBuilt) return;
      chatBuilt = true;
      const w = $("chatwrap");
      w.innerHTML =
        '<div class="chat" id="chatbox">' +
          '<div class="ch"><div><div class="t">Cubey 🧊</div><div class="s" id="chstate">היועץ הפיננסי החכם שלך · מכיר את הקוביות</div></div>' +
          '<button class="x" id="chx" aria-label="סגור">✕</button></div>' +
          '<div class="msgs" id="msgs"><div class="intro" id="chintro"><div class="e">👋</div><p>היי! אני Cubey, היועץ הפיננסי שלך. אני רואה את הקוביות, את ההכנסה ואת קרן החירום — אז אפשר להתייעץ איתי באמת: <b>"כדאי לי לקנות אוזניות ב-600 או שעון ב-900?"</b>, "מתי אגיע ליעד?", "בזבזתי 200 על מסעדה", או פשוט "תכניס 200 ₪ לקוביית טיול".</p></div></div>' +
          '<div class="sugg" id="sugg"></div>' +
          '<div class="inbar"><input id="cin" placeholder="כתוב ל-Cubey…"><button id="csend">➤</button></div>' +
        '</div>';
      w.onclick = (e) => { if (e.target === w) closeChat(); };
      $("chx").onclick = closeChat;
      const sg = $("sugg");
      SUGG.forEach((s) => { const b = el("button"); b.textContent = s; b.onclick = () => send(s); sg.appendChild(b); });
      const input = $("cin");
      const go = () => { const val = (input.value || "").trim(); if (val && !streaming) { input.value = ""; send(val); } };
      $("csend").onclick = go;
      input.onkeydown = (e) => { if (e.key === "Enter") go(); };
      renderChatHistory();   // the saved conversation, including replies that arrived while away
      // Keyboard-overlap guard: when the on-screen keyboard shrinks the visual
      // viewport, pad the chat so the input stays visible, and re-anchor scroll.
      input.onfocus = () => setTimeout(scrollToBottom, 250);
      // Bind the viewport-resize handler exactly once (buildChatShell can run
      // many times — every logout/clear-history/upgrade cycle — so re-adding it
      // would stack duplicate listeners).
      if (window.visualViewport && !vvBound) {
        vvBound = true;
        window.visualViewport.addEventListener("resize", () => {
          if (!chatOpen) return;
          const vv = window.visualViewport;
          const overlap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
          const box = $("chatbox");
          if (box) box.style.paddingBottom = overlap ? overlap + "px" : "";
          scrollToBottom();
        });
      }
    }
    let vvBound = false;

    function openChat() {
      // The AI buddy (Cubey chat) is part of the one-time Premium purchase.
      if (!state.premium) { openChatLocked(); return; }
      buildChatShell();
      chatOpen = true;
      $("chatwrap").classList.add("on");
      // While this conversation is on screen its replies show up here, not
      // as a system notification.
      if (state.chat) pushSetActiveConversation(state.chat.cid);
      chatPoll(0);
      setTimeout(() => { scrollToBottom(); const i = $("cin"); if (i && !streaming) i.focus(); }, 60);
    }
    // Premium gate for the chat: shows the AI buddy behind a gold lock with an
    // upgrade CTA, so free users see the value but the chat itself stays paid.
    function openChatLocked() {
      const w = $("chatwrap");
      w.innerHTML =
        '<div class="chat chatlocked" id="chatbox">' +
          '<div class="ch"><div><div class="t">Cubey 🧊</div><div class="s">היועץ הפיננסי החכם שלך</div></div>' +
          '<button class="x" id="chx" aria-label="סגור">✕</button></div>' +
          '<div class="chlockbody"><div class="goldlock">🔒</div>' +
            '<h3>הצ׳אט עם Cubey הוא פיצ׳ר Premium</h3>' +
            '<p>שאל כל שאלה כספית, דווח על הוצאות בשפה חופשית ובקש פעולות אמיתיות — "תעביר 200 ₪ לקוביית טיול". Cubey מכיר את הקוביות שלך ועונה לפי המצב האמיתי.</p><p>תשלום חד-פעמי — שגם מסיר את כל הפרסומות באפליקציה.</p>' +
            '<button class="distbtn wide" id="chUp">👑 שדרוג ל-\u2066AI Premium · ' + priceLabel() + '\u2069</button>' +
            '<span class="chlockman">אפשר להמשיך לנהל הכול ידנית גם בלי שדרוג 🙂</span>' +
          '</div>' +
        '</div>';
      w.classList.add("on");
      w.onclick = (e) => { if (e.target === w) closeChat(); };
      $("chx").onclick = closeChat;
      // Straight into the purchase rather than a detour through the upgrade
      // page: what Premium unlocks is spelled out immediately above this
      // button, and Google's own sheet names the product and the price.
      $("chUp").onclick = () => { closeChat(); startPremiumPurchase(); };
      chatOpen = true; chatBuilt = false;
    }
    function closeChat() { chatOpen = false; $("chatwrap").classList.remove("on"); pushSetActiveConversation(""); }
    // Drops the chat UI (logout, account switch). The saved conversation
    // itself lives in state.chat and belongs to the account.
    function resetChat() {
      pendingAction = null; streaming = false;
      chatBuilt = false; chatOpen = false;
      clearTimeout(chatPollTimer);
      pushSetActiveConversation("");
      const w = $("chatwrap"); w.classList.remove("on"); w.innerHTML = "";
    }

    function setTyping(on) {
      streaming = on;
      const s = $("chstate"); if (s) s.textContent = on ? "מכין תשובה…" : "היועץ הפיננסי החכם שלך · מכיר את הקוביות";
      const i = $("cin"); if (i) i.disabled = on;
      const b = $("csend"); if (b) b.disabled = on;
    }

    function appendBubble(role, text, id) {
      const intro = $("chintro"); if (intro && role === "u") intro.remove();
      if (role === "u") { const sg = $("sugg"); if (sg) sg.classList.add("hidden"); }
      const b = el("div", "bubble " + (role === "u" ? "u" : "b"));
      b.textContent = text;
      if (id) b.dataset.mid = id;
      const think = $("chthink");
      $("msgs").insertBefore(b, think || null);   // the "thinking…" bubble stays last
      scrollToBottom();
      return b;
    }

    function showQuickButtons(buttons) {
      const holder = el("div", "qbtns");
      buttons.forEach((qb) => {
        const b = el("button", qb.kind === "danger" ? "qd" : "qp");
        b.textContent = qb.label;
        b.onclick = () => { if (streaming) return; holder.remove(); chatRecord("u", qb.label); appendBubble("u", qb.label); botSay(qb.run()); };
        holder.appendChild(b);
      });
      $("msgs").appendChild(holder);
      scrollToBottom();
    }

    // One entry in the saved conversation (state.chat, persisted per account).
    function chatRecord(role, text, extra) {
      if (!state.chat) state.chat = normChat(null);
      const m = Object.assign({ id: newId(role === "u" ? "m" : "l"), role: role, text: text, at: Date.now() }, extra || {});
      state.chat.messages.push(m);
      if (state.chat.messages.length > 100) state.chat.messages.splice(0, state.chat.messages.length - 100);
      saveState();
      return m;
    }

    function send(text) {
      if (streaming) return;
      // Anything that moves money or logs an expense is answered right here on
      // the device — it acts on THIS budget and needs its confirm buttons.
      // Everything else goes to the AI on the server when it is connected;
      // without it, the local advisor answers as it always has.
      const local = respond(text, { actionsOnly: push.ready() });
      if (local) {
        chatRecord("u", text);
        appendBubble("u", text);
        botSay(local);
        return;
      }
      aiSend(text);
    }

    // A bot reply appears whole, the moment it exists — no typing effect, no
    // artificial delay. Optional buttons follow it.
    function botSay(res, rec) {
      const full = res.text || "";
      const m = rec || chatRecord("b", full);
      if (!chatBuilt || !$("msgs")) return;
      appendBubble("b", full, m.id);
      if (res.quick && res.quick.length) showQuickButtons(res.quick);
      const inp = $("cin"); if (inp && chatOpen && !streaming) inp.focus();
    }

    // ---- AI replies from the server ------------------------------------------
    // The message is stored on the server and answered there, so leaving the
    // app does not lose the answer: it is saved in this conversation and, if
    // the chat is not on screen, announced with a notification. While the app
    // waits, the server holds the request open (chatAwait) and returns the
    // moment the answer is saved, so it shows up immediately.
    let aiTimeoutMs = 60 * 1000;            // how long the user waits before "try again"
    const aiActive = new Set();             // messages with a live wait loop
    const pendingAi = () => (state.chat ? state.chat.messages.filter((x) => x.role === "u" && x.status === "pending") : []);

    // The numbers the AI may use — the same snapshot the local advisor works from.
    function aiContext() {
      const s = advisorSnapshot();
      return {
        currency: "ILS", income: s.income, total: s.total, pool: s.pool, emgBalance: s.emgBalance, emgGoal: s.emgGoal,
        essentials: s.essentials, slack: s.slack, prepaid: !!s.prepaid, kid: isKidMode(),
        cubes: state.cubes.slice(0, 20).map((c) => ({
          name: c.name, balance: Math.round(Number(c.balance) || 0), amount: Math.round(Number(c.amount) || 0),
          pct: Number(c.pct) || 0, goalTarget: Number(c.goalTarget) || 0, locked: !!c.locked,
        })),
      };
    }

    function aiSend(text) {
      const m = chatRecord("u", text, { status: "pending" });
      appendBubble("u", text, m.id);
      aiRun(m);
    }
    function aiPost(m) {
      return push.call("chatSend", { conversationId: state.chat.cid, messageId: m.id, text: m.text, context: aiContext() });
    }
    const aiSleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Send (idempotent — the same id is accepted once), then wait for the
    // answer. Done → shown at once. Server error / no answer within the limit
    // / no connection → a clear message with a "try again" button.
    async function aiRun(m) {
      if (aiActive.has(m.id)) return;
      aiActive.add(m.id);
      showThinking(true);
      const cid = state.chat.cid;
      const deadline = Date.now() + aiTimeoutMs;
      const still = () => state.chat && state.chat.cid === cid && m.status === "pending";
      try {
        // 1. hand the question over (a lost answer is retried with the same id)
        let sent = false, lastErr = "network";
        while (!sent && still() && Date.now() < deadline) {
          try { await aiPost(m); sent = true; }
          catch (e) {
            lastErr = (e && e.message) || "network";
            if (lastErr !== "network" && lastErr !== "timeout") break;
            await aiSleep(1500);
          }
        }
        if (!still()) return;
        if (!sent) { aiFail(m, lastErr === "timeout" ? "network" : lastErr); return; }
        // 2. wait for it; each call returns as soon as the answer is saved
        while (still() && Date.now() < deadline) {
          const left = deadline - Date.now();
          let r = null;
          try { r = await push.call("chatAwait", { conversationId: cid, messageId: m.id, waitMs: Math.min(20000, left) }, Math.min(20000, left) + 8000); }
          catch (e) { await aiSleep(1000); continue; }
          if (!still()) return;
          if (r && r.status === "done" && r.reply) { aiDeliver(m, r.reply); return; }
          if (r && r.status === "error") { aiFail(m, "server"); return; }
          if (r && r.status === "missing") { try { await aiPost(m); } catch (e) {} }
        }
        if (still()) aiFail(m, "timeout");
      } finally {
        aiActive.delete(m.id);
        if (!pendingAi().length) showThinking(false);
      }
    }

    // The answer, right under its question, drawn immediately.
    function aiDeliver(q, reply) {
      const local = state.chat.messages;
      if (!local.some((x) => x.id === reply.id)) {
        const b = { id: reply.id, role: "b", text: reply.text, at: reply.createdAt || Date.now(), inReplyTo: q.id };
        const qi = local.findIndex((x) => x.id === q.id);
        if (qi === -1) local.push(b); else local.splice(qi + 1, 0, b);
      }
      q.status = "done"; delete q.error;
      saveState();
      if (!chatBuilt || !$("msgs")) return;
      const last = local[local.length - 1];
      if (last.id === reply.id && !$("chthink") && !document.querySelector("#msgs .bubble.err")) appendBubble("b", reply.text, reply.id);
      else renderChatHistory();
      if (!pendingAi().length) showThinking(false);
      const inp = $("cin"); if (inp && chatOpen) inp.focus();
    }

    const AI_ERR = {
      timeout: "התשובה מתעכבת יותר מדקה. אפשר לנסות שוב — ואם היא תגיע בינתיים, היא תופיע כאן.",
      network: "אין חיבור לשרת כרגע. בדקו את האינטרנט ונסו שוב.",
      quota: "הגעת למכסת השאלות ל-AI לשעה הקרובה. אפשר לנסות שוב מאוחר יותר.",
      not_linked: "הצ׳אט עוד לא מחובר לשרת. נסו שוב בעוד רגע.",
      server: "לא הצלחתי להכין תשובה הפעם. נסו שוב.",
    };
    function aiFail(m, code) {
      if (m.status !== "pending") return;
      m.status = "failed";
      m.error = AI_ERR[code] ? code : "server";
      saveState();
      if (!pendingAi().length) showThinking(false);
      renderChatHistory();
    }
    // Try again: the same question. If the server already gave up on it, a
    // new id is used; otherwise the same one (it may still be answered).
    function aiRetry(id) {
      const m = state.chat && state.chat.messages.find((x) => x.id === id);
      if (!m || m.status !== "failed" || streaming) return;
      if (m.error === "server") m.id = newId("m");
      m.status = "pending"; delete m.error; m.at = Date.now();
      saveState();
      renderChatHistory();
      aiRun(m);
    }

    // Animated "preparing an answer" — shown only while a real request is open.
    function showThinking(on) {
      const box = $("msgs");
      if (!chatBuilt || !box) return;
      let t = $("chthink");
      if (on && !t) {
        t = el("div", "bubble b thinking"); t.id = "chthink";
        t.setAttribute("role", "status"); t.setAttribute("aria-live", "polite");
        t.innerHTML = '<span>מכין תשובה</span><span class="tdots" aria-hidden="true"><i></i><i></i><i></i></span>';
        box.appendChild(t); scrollToBottom();
        setTyping(true);
      } else if (!on && t) {
        t.remove();
        setTyping(false);
      }
    }

    // Background catch-up (back from the background, another device, a push):
    // fold in what the server has; resume waiting for questions still open.
    function chatPoll(delay) {
      clearTimeout(chatPollTimer);
      if (!push.ready() || document.hidden || !state.chat) return;
      chatPollTimer = setTimeout(chatPollNow, delay != null ? delay : 1500);
    }
    async function chatPollNow() {
      const cid = state.chat && state.chat.cid;
      if (!cid || !push.ready()) return;
      let r = null;
      try { r = await push.call("chatGet", { conversationId: cid }); } catch (e) {}
      if (r && state.chat && state.chat.cid === cid) chatMerge(r, false);
      pendingAi().forEach((m) => {
        if (aiActive.has(m.id)) return;
        if (Date.now() - (m.at || 0) < aiTimeoutMs) aiRun(m); else aiFail(m, "timeout");
      });
    }
    function chatResumePending() { chatPoll(0); }

    // Fold the server's copy of the conversation into the local one. An answer
    // that arrives after "try again" was shown replaces the error message.
    function chatMerge(r, instant) {
      const local = state.chat.messages;
      const byId = {}; local.forEach((m) => { byId[m.id] = m; });
      let fresh = 0;
      (r.messages || []).forEach((s) => {
        if (s.role === "assistant") {
          if (byId[s.id]) return;
          const m = { id: s.id, role: "b", text: s.text, at: s.createdAt, inReplyTo: s.inReplyTo };
          const qi = local.findIndex((x) => x.id === s.inReplyTo);
          if (qi === -1) local.push(m); else local.splice(qi + 1, 0, m);   // right under its question
          byId[m.id] = m; fresh++;
          const q = byId[s.inReplyTo];
          if (q && (q.status === "pending" || q.status === "failed")) { q.status = "done"; delete q.error; }
        } else if (s.role === "user") {
          const q = byId[s.id];
          if (!q) {
            // From another device, or a conversation opened from a notification.
            const m = { id: s.id, role: "u", text: s.text, at: s.createdAt, status: s.status === "done" ? "done" : s.status === "error" ? "failed" : "pending" };
            if (m.status === "failed") m.error = "server";
            local.push(m); byId[m.id] = m; fresh++;
          } else if (q.status === "pending" && s.status === "error") {
            aiFail(q, "server");
          }
        }
      });
      if (local.length > 100) local.splice(0, local.length - 100);
      saveState();
      if (!chatBuilt || !$("msgs")) return;
      if (fresh) renderChatHistory();
      else if (!pendingAi().length) showThinking(false);
    }

    function renderChatHistory() {
      const box = $("msgs");
      if (!box || !state.chat) return;
      box.querySelectorAll(".bubble, .qbtns").forEach((n) => n.remove());
      const msgs = state.chat.messages;
      if (msgs.length) {
        const intro = $("chintro"); if (intro) intro.remove();
        const sg = $("sugg"); if (sg) sg.classList.add("hidden");
      }
      msgs.forEach((m) => {
        const b = el("div", "bubble " + (m.role === "u" ? "u" : "b"));
        b.textContent = m.text; b.dataset.mid = m.id;
        box.appendChild(b);
        if (m.role === "u" && m.status === "failed") {
          const e = el("div", "bubble b err");
          e.setAttribute("role", "alert");
          e.innerHTML = '<span>⚠️ ' + esc(AI_ERR[m.error] || AI_ERR.server) + '</span>';
          const r = el("button", "errretry"); r.textContent = "↻ לנסות שוב";
          r.onclick = () => aiRetry(m.id);
          e.appendChild(r);
          box.appendChild(e);
        }
      });
      if (pendingAi().length) showThinking(true); else setTyping(false);
      scrollToBottom();
    }

    // Tapped "צ'אט AI שלח לך הודעה": straight into that conversation, at that reply.
    let chatInstantUntil = 0;
    async function openChatFromPush(cid, mid) {
      // The user came for this reply: show it whole, no typing animation
      // (also for a poll that was already on its way when they tapped).
      chatInstantUntil = Date.now() + 5000;
      state.screen = "app";
      render();
      if (!state.chat || state.chat.cid !== cid) {
        // A conversation that is not the one on this device (another phone,
        // or history cleared since): show the server's copy of it.
        resetChat();
        state.chat = { cid: cid, messages: [] };
        saveState();
      }
      openChat();
      if (!chatBuilt) return;   // Premium gate showed instead
      try {
        const r = await push.call("chatGet", { conversationId: cid });
        if (state.chat && state.chat.cid === cid) chatMerge(r, true);
      } catch (e) {}
      renderChatHistory();
      chatPoll();
      const b = mid ? [...document.querySelectorAll("#msgs .bubble")].find((n) => n.dataset.mid === mid) : null;
      if (b) {
        b.scrollIntoView({ block: "center" });
        b.classList.add("flash");
        setTimeout(() => b.classList.remove("flash"), 1800);
      }
    }

    // =====================================================================
    // Worker 2 — conversational actions: "תכניס 200 ₪ לקוביית X".
    // Parses intent + amount + target cube; builds a funding plan that never
    // creates money out of nowhere (free pool first, then small proportional
    // deductions from other cubes); asks for confirmation before executing.
    // =====================================================================
    const CHAT_SYNONYMS = {
      lifestyle: ["בילויים", "פנאי", "בילוי", "כיף"],
      essentials: ["שוטף", "אוכל", "מכולת"],
      savings: ["חיסכון", "חסכון"],
      investments: ["השקעות", "השקעה"],
      housing: ["דיור", "שכירות"],
      emergency: ["חירום", "קרן חירום", "רשת ביטחון", "קופת חירום"],
    };
    function findCubeByName(nameRaw) {
      const n = (nameRaw || "").trim();
      if (!n) return null;
      for (const c of state.cubes) if (c.name === n || c.name.includes(n) || n.includes(c.name)) return c;
      for (const key in CHAT_SYNONYMS)
        if (CHAT_SYNONYMS[key].some((s) => n.includes(s))) { const c = state.cubes.find((x) => x.key === key); if (c) return c; }
      return null;
    }

    // Free pool first, then spread the remainder across donor cubes
    // proportionally to their balances (so no single cube takes the whole hit).
    function buildFundingPlan(amount, excludeKey) {
      const sources = [];
      let remaining = amount;
      if (state.pool > 0 && remaining > 0) {
        const take = Math.min(state.pool, remaining);
        sources.push({ key: "__pool", name: "היתרה הפנויה", amount: take });
        remaining -= take;
      }
      if (remaining <= 0) return sources;
      const order = ["lifestyle", "essentials", "savings", "investments"];
      const ok = (c) => c && c.key !== excludeKey && !c.locked && c.balance > 0;
      const baseDonors = order.map((k) => state.cubes.find((c) => c.key === k)).filter(ok);
      // personal-goal cubes are only tapped if the base cubes can't cover it
      let donors = baseDonors;
      if (baseDonors.reduce((s, d) => s + d.balance, 0) < remaining) {
        donors = baseDonors.concat(state.cubes.filter((c) => c.custom).filter(ok));
      }
      const totalAvail = donors.reduce((s, d) => s + d.balance, 0);
      if (totalAvail < remaining) return null; // not enough money anywhere
      const takes = donors.map((d) => Math.min(d.balance, Math.floor(remaining * d.balance / totalAvail)));
      let leftover = remaining - takes.reduce((s, t) => s + t, 0);
      for (let i = 0; i < donors.length && leftover > 0; i++) {
        const room = donors[i].balance - takes[i];
        const add = Math.min(room, leftover);
        takes[i] += add; leftover -= add;
      }
      donors.forEach((d, i) => { if (takes[i] > 0) sources.push({ key: d.key, name: d.name, amount: takes[i] }); });
      return sources;
    }

    function describeSources(sources) {
      return sources.map((s) => "₪" + fmt(s.amount) + " מ" + (s.key === "__pool" ? "היתרה הפנויה" : '"' + s.name + '"')).join(" ו־");
    }
    function confirmButtons() {
      return [
        { label: "לאשר ✓", run: () => { const a = pendingAction; pendingAction = null; return a ? execFunding(a) : { text: "אין פעולה ממתינה 🙂" }; } },
        { label: "ביטול", kind: "danger", run: () => { pendingAction = null; return { text: "בוטל 👍 לא שיניתי כלום." }; } },
      ];
    }

    // =====================================================================
    // AI FINANCIAL ADVISOR
    // Cubey is wired into the same engine the rest of the app runs on — the
    // income, the percentage split, the emergency fund, the goal cubes and the
    // expense journal. Every answer below is computed from those numbers, so
    // the advice moves when the user's money moves.
    // =====================================================================
    function advisorSnapshot() {
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const fun = by.lifestyle || by.kidfun || null;
      const emg = state.cubes.find(isEmergency) || null;
      const income = monthlyIncome();
      const committedFlex = state.cubes.reduce((s, c) => s + (c.locked ? 0 : cubeMonthlyInflow(c)), 0);
      const slack = Math.max(0, freeMonthlyBudget() - committedFlex);
      return {
        income: income,
        total: Math.round(totalBalance() + state.pool),
        pool: Math.round(state.pool),
        fun: fun, funBalance: fun ? Math.round(fun.balance) : 0,
        emergency: emg, emgBalance: emg ? Math.round(emg.balance) : 0,
        emgGoal: emergencyTarget(), essentials: essentialMonthlySpend(),
        emgMonths: emg && essentialMonthlySpend() > 0 ? Math.round((emg.balance / essentialMonthlySpend()) * 10) / 10 : 0,
        slack: Math.round(slack), // money not yet promised to any cube each month
        goals: state.cubes.filter((c) => Number(c.goalTarget) > 0),
        prepaid: isPrepaid(), // no overdraft exists — the loaded amount is the ceiling
      };
    }

    // The core consultation: is spending `amount` on `label` a good idea, and why?
    // Returns a verdict plus the numbers that produced it, so the chat can
    // explain rather than pronounce.
    function advisePurchase(amount, label) {
      const s = advisorSnapshot();
      const name = label ? '"' + label + '"' : "הקנייה הזו";
      const perMonth = s.slack > 0 ? s.slack : (s.income > 0 ? Math.round(s.income * 0.1) : 0);
      const monthsToSave = perMonth > 0 ? Math.ceil(amount / perMonth) : 0;
      const shareOfAll = s.total > 0 ? amount / s.total : 99;
      const emgThin = s.emgGoal > 0 && s.emgBalance < s.essentials; // less than one month of cover

      let verdict, why;
      if (amount > s.total) {
        verdict = "no";
        why = (s.prepaid
            ? "בכרטיס טעונים ₪" + fmt(s.total) + ", ו-₪" + fmt(amount) + " זה יותר מזה — העסקה פשוט תידחה בקופה. אין מינוס בכרטיס נטען. "
            : "₪" + fmt(amount) + " זה יותר מכל מה שיש לך כרגע (₪" + fmt(s.total) + "). ") +
          (monthsToSave > 0
            ? "בקצב שלך (₪" + fmt(perMonth) + " פנויים בחודש) זה " + monthsToSave + " חודשי חיסכון — אפשר לפתוח על זה קובייה ולראות את זה מתקרב."
            : (s.prepaid ? "אפשר לפתוח על זה קובייה ולצבור אליה בכל טעינה." : "כדי לתכנן את זה צריך קודם להזין הכנסה חודשית במסך „הכנסה”."));
      } else if (emgThin && shareOfAll > 0.2) {
        verdict = "no";
        why = "בקרן החירום יש ₪" + fmt(s.emgBalance) + " — פחות מחודש הוצאות (₪" + fmt(s.essentials) + "). " +
          "הוצאה של ₪" + fmt(amount) + " עכשיו תיקח נתח משמעותי מהרשת שלך. הייתי קודם מביא את קרן החירום לחודש אחד לפחות, ואז חוזר לזה — " +
          (perMonth > 0 ? "זה עניין של " + Math.ceil(Math.max(0, s.essentials - s.emgBalance) / perMonth) + " חודשים בערך." : "גם ₪100 בחודש עושים את זה.");
      } else if (s.fun && amount <= s.funBalance) {
        verdict = "yes";
        why = "יש ₪" + fmt(s.funBalance) + ' בקוביית "' + s.fun.name + '" — הכסף הזה כבר מיועד בדיוק לדברים כאלה. ' +
          "אחרי הקנייה יישארו שם ₪" + fmt(s.funBalance - amount) + ", וכל השאר לא זז.";
      } else if (shareOfAll <= 0.15) {
        verdict = "yes";
        why = "₪" + fmt(amount) + " זה " + Math.round(shareOfAll * 100) + "% מהכסף שלך — הוצאה קטנה יחסית. " +
          (s.fun ? 'בקוביית "' + s.fun.name + '" חסרים ₪' + fmt(Math.max(0, amount - s.funBalance)) + ", אז שווה למשוך את ההפרש משם או מהיתרה הפנויה במודע." : "רק תרשמו את זה ביומן ההוצאות כדי שהמספרים יישארו אמיתיים.");
      } else if (monthsToSave > 0 && monthsToSave <= 3) {
        verdict = "wait";
        why = "אפשר, אבל לא הכי חכם עכשיו: " + name + " שווה " + Math.round(shareOfAll * 100) + "% מכל הכסף שלך. " +
          "אם תחכה " + monthsToSave + " חודש" + (monthsToSave > 1 ? "ים" : "") + " ותשים בצד ₪" + fmt(perMonth) +
          " בחודש, תקנה את זה בלי לגעת בשום קובייה. זו אותה קנייה — רק בלי המחיר הנסתר.";
      } else {
        verdict = "careful";
        why = "זה גבולי. ₪" + fmt(amount) + " זה " + Math.round(shareOfAll * 100) + "% מהכסף שלך" +
          (s.fun ? ", ובקוביית הבילויים יש רק ₪" + fmt(s.funBalance) : "") + ". " +
          (s.prepaid
            ? "בכרטיס נטען אין מינוס, אז ההפרש חייב לצאת מקובייה אחרת — כלומר אתה לא באמת מוסיף כסף, אתה לוקח אותו ממשהו אחר שרצית."
            : "אפשר לעשות את זה, אבל ההפרש ייצא מחיסכון — כלומר תשלם על זה בעוד כמה חודשים, לא היום.");
      }
      return { verdict: verdict, why: why, amount: amount, label: label || "", snapshot: s, monthsToSave: monthsToSave, perMonth: perMonth };
    }
    const VERDICT_HEAD = { yes: "כן, אפשר בשקט ✅", wait: "כן — אבל שווה לחכות ⏳", careful: "בזהירות ⚖️", no: "לא עכשיו 🛑" };

    // Free-form "X or Y" comparison. Handles prices when they're there, and
    // gives a real decision framework when they aren't.
    // Strip the question wrapper off a captured item name, one leading word at a
    // time — "כדאי לי לקנות אוזניות" must come out as just "אוזניות".
    const ITEM_PREFIXES = [/^מה\s+/, /^אז\s+/, /^האם\s+/, /^עדיף\s+/, /^כדאי\s+/, /^שווה\s+/, /^תגיד\s+/,
      /^לי\s+/, /^לך\s+/, /^אני\s+/, /^צריך\s+/, /^רוצה\s+/, /^מתלבט\s+/, /^בין\s+/,
      /^לקנות\s+/, /^קניית\s+/, /^לבחור\s+/, /^לקחת\s+/, /^להוציא\s+/, /^על\s+/, /^את\s+/];
    function cleanItemName(s) {
      let out = String(s || "").replace(/^[\s,?!־-]+/, "").trim();
      for (let pass = 0; pass < 8; pass++) {
        const before = out;
        ITEM_PREFIXES.forEach((re) => { out = out.replace(re, ""); });
        if (out === before) break;
      }
      return out.replace(/["'.!?]+$/g, "").trim();
    }

    function parseComparison(text) {
      const t = text.replace(/,/g, " ").replace(/\s+/g, " ").trim();
      const clean = cleanItemName;
      const money = "(?:₪|ש\"ח|שח|שקלים|שקל)?";
      const two = new RegExp("([^,?!]{1,40}?)\\s*(?:ב|במחיר)\\s*[-־]?\\s*(\\d{2,7})\\s*" + money +
                             "\\s*(?:או|לעומת|מול|vs\\.?)\\s*([^,?!]{1,40}?)\\s*(?:ב|במחיר)\\s*[-־]?\\s*(\\d{2,7})");
      const m = t.match(two);
      if (m) return { a: { name: clean(m[1]), price: Number(m[2]) }, b: { name: clean(m[3]), price: Number(m[4]) } };
      const m2 = t.match(/([^,?!]{1,40}?)\s+(?:או|לעומת|מול)\s+([^,?!]{1,40}?)\s*[?.!]?$/);
      if (m2 && /(עדיף|כדאי|לקנות|לבחור|שווה|אקנה|להחליט)/.test(t))
        return { a: { name: clean(m2[1]), price: 0 }, b: { name: clean(m2[2]), price: 0 } };
      return null;
    }

    function adviseComparison(cmp) {
      const s = advisorSnapshot();
      if (!cmp.a.price || !cmp.b.price) {
        return { text: "בכיף, בוא נחליט ביחד בין " + cmp.a.name + " ל" + cmp.b.name + " 🤔\n" +
          "כדי לתת לך תשובה אמיתית ולא ניחוש, אני צריך שני דברים: כמה כל אחד עולה, ובאיזה מהם תשתמש יותר בחודש הקרוב.\n" +
          'כתוב לי למשל: "' + cmp.a.name + " ב-800 או " + cmp.b.name + ' ב-1,200" ואני ארוץ על המספרים שלך.' };
      }
      const cheap = cmp.a.price <= cmp.b.price ? cmp.a : cmp.b;
      const rich = cmp.a.price <= cmp.b.price ? cmp.b : cmp.a;
      const diff = rich.price - cheap.price;
      const ac = advisePurchase(cheap.price, cheap.name);
      const ar = advisePurchase(rich.price, rich.name);
      const lines = [];
      lines.push("בוא נשים את שניהם על השולחן 👇");
      lines.push("• " + cheap.name + " — ₪" + fmt(cheap.price) + ": " + VERDICT_HEAD[ac.verdict]);
      lines.push("• " + rich.name + " — ₪" + fmt(rich.price) + ": " + VERDICT_HEAD[ar.verdict]);
      lines.push("");
      const rank = { yes: 3, wait: 2, careful: 1, no: 0 };
      if (rank[ac.verdict] > rank[ar.verdict]) {
        lines.push("ההמלצה שלי: " + cheap.name + ". " + ac.why);
        lines.push("ההפרש של ₪" + fmt(diff) + " הוא לא רק כסף — " +
          (s.emgGoal > 0 && s.emgBalance < s.emgGoal
            ? "אם הוא נכנס לקרן החירום, הרשת שלך גדלה בעוד " + Math.round((diff / Math.max(1, s.essentials)) * 30) + " ימי כיסוי."
            : "אם הוא נשאר בצד, זה " + (ac.perMonth > 0 ? Math.round(diff / ac.perMonth * 10) / 10 + " חודשי חיסכון שחסכת לעצמך." : "כסף שנשאר לך פנוי.")));
      } else if (rank[ar.verdict] === rank[ac.verdict]) {
        lines.push("מבחינה כספית שניהם באותו מקום אצלך, אז המספרים לא יכריעו — מה שיכריע זה שימוש.");
        lines.push("השאלה שאני תמיד שואל: באיזה מהם תשתמש יותר ב-30 הימים הקרובים? זה שתשתמש בו יותר שווה את ההפרש של ₪" + fmt(diff) + ", והשני לא.");
      } else {
        lines.push("ההמלצה שלי: " + rich.name + " דווקא. " + ar.why);
      }
      lines.push("");
      lines.push("ואם בא לך, אני יכול לפתוח קובייה לאחד מהם — פשוט תכתוב: \"תכניס " + fmt(Math.min(cheap.price, 200)) + " ₪ ל" + cheap.name + "\".");
      return { text: lines.join("\n") };
    }

    // opts.actionsOnly: answer only the requests that act on the budget
    // (confirmations, transfers, purchase/comparison advice with its buttons,
    // expense reports) and return null for the rest — those go to the AI.
    function respond(text, opts) {
      const q = text.toLowerCase();
      const cubes = state.cubes;
      const byKey = Object.fromEntries(cubes.map((c) => [c.key, c]));
      const total = totalBalance();
      const num = (text.replace(/,/g, "").match(/(\d+)/) || [])[1];

      // 0. A funding action is waiting for confirmation.
      if (pendingAction) {
        if (/^(כן|לאשר|אשר|מאשר|בצע|אוקיי|יאללה|ok)/.test(q.trim())) {
          const a = pendingAction; pendingAction = null; return execFunding(a);
        }
        if (/(לא|בטל|ביטול|עזוב)/.test(q)) { pendingAction = null; return { text: "בוטל 👍 לא שיניתי כלום." }; }
        return { text: 'יש פעולה שממתינה לאישור — אפשר ללחוץ על הכפתור או לכתוב "לאשר" / "ביטול" 🙂', quick: confirmButtons() };
      }

      // 1. Funding command: "תכניס 200 שקל לקוביית שיעורי נהיגה"
      const fund = text.match(/(?:תכניס|תעביר|הוסף|תוסיף|העבר|שים)\s+([\d,]+)\s*(?:שקלים|שקל|ש"ח|שח|₪)?\s+ל(.+)/)
        || text.match(/(?:put|move|transfer|add)\s+(?:₪|ils\s*)?([\d,]+)\s*(?:shekels?|ils|₪)?\s+(?:in|into|to)\s+(?:the\s+)?(.+)/i);
      if (fund) {
        const amount = Number(fund[1].replace(/,/g, ""));
        const name = fund[2].trim()
          .replace(/^(קוביית|קובית|קובייה|קוביה)\s+/, "")
          .replace(/["'.!?]+$/g, "");
        if (!(amount > 0)) return { text: 'לא הבנתי את הסכום 🙂 נסה למשל: "תכניס 200 ₪ לחיסכון".' };
        const target = findCubeByName(name);
        if (target && target.locked) return { text: 'קוביית "' + target.name + '" נעולה על הוצאות הדיור הקבועות — אי אפשר להעביר אליה ידנית 🔒' };
        const plan = buildFundingPlan(amount, target ? target.key : null);
        if (!plan) { const movable = state.pool + state.cubes.filter((c) => !c.locked).reduce((s, c) => s + c.balance, 0);
          return { text: "אין מספיק כסף פנוי — ניתן להעביר בסך הכל ₪" + fmt(movable) + " (מקוביות לא נעולות ומהיתרה). אפשר קודם לחלק כסף לתקציב 🙂" }; }
        pendingAction = { sources: plan, amount: amount, targetKey: target ? target.key : null, createName: target ? null : name };
        const head = target ? "" : 'אין עדיין קובייה בשם "' + name + '", אז אצור אותה. ';
        return {
          text: head + "בטח! אקח " + describeSources(plan) + " ואעביר ₪" + fmt(amount) + ' ל"' + (target ? target.name : name) + '". לאשר?',
          quick: confirmButtons(),
        };
      }

      // 2. Free-form consultation: "כדאי לי X ב-500 או Y ב-800?"
      const cmp = parseComparison(text);
      if (cmp) return adviseComparison(cmp);

      // 3. Purchase decision: "כדאי לי לקנות אוזניות ב-600?" / "אפשר להרשות 500 ₪?"
      if (/(afford|should i buy|can i buy|worth buying|shall i buy|buy|purchase|אפשר להרשות|יכול להרשות|אפשר לקנות|כדאי לי|שווה לי|האם לקנות|לקנות|להוציא|שווה לקנות)/.test(q) && num) {
        const amount = Number(num);
        if (!cubes.length) return { text: 'עדיין לא חילקת את הכסף לקוביות 🙂 לחץ/י על "חלק לתקציב" ואז נוכל לדבר במספרים אמיתיים.' };
        // pull the thing being bought out of the sentence, if it's there
        const itemM = text.match(/(?:לקנות|קניית|על)\s+([^\d,?!]{2,30}?)\s*(?:ב|במחיר|-)?\s*\d/);
        const item = itemM ? cleanItemName(itemM[1]) : "";
        const a = advisePurchase(amount, item);
        const s = a.snapshot;
        const extra = s.goals.length && a.verdict !== "no"
          ? "\n\nשים לב שזה גם משפיע על היעדים שלך: " + s.goals.slice(0, 2).map((g) =>
              '"' + g.name + '" (₪' + fmt(g.balance) + " מתוך ₪" + fmt(Number(g.goalTarget)) + ")").join(", ") + "."
          : "";
        return {
          text: VERDICT_HEAD[a.verdict] + "\n\n" + a.why + extra,
          quick: a.verdict === "no" || a.verdict === "wait"
            ? [{ label: "פתח לי קובייה לזה 🎯", run: () => {
                const nm = item || "הקנייה הבאה";
                createCustomCube(nm, a.perMonth > 0 ? a.perMonth : Math.max(50, Math.round(amount / 6)), { priority: 8, goalPrice: amount });
                return { text: 'נוצרה קובייה "' + nm + '" עם יעד של ₪' + fmt(amount) + ". כל חודש היא תתמלא, ותראה בדיוק כמה נשאר 🎯" };
              } }]
            : null,
        };
      }

      // 4. Expense report → straight into the expense journal, with a reflection.
      if (/(בזבזתי|הוצאתי|קניתי|שילמתי|spent|i paid|i bought|blew)/.test(q) && num) {
        const amount = Number(num);
        const onM = text.match(/(?:על|ב)\s+([^\d,?!]{2,30}?)\s*$/);
        const what = onM ? onM[1].trim() : "";
        // Prefer an explicitly named cube, then the fun cube, then anything flexible.
        const named = findCubeByName(what);
        const from = (named && !named.locked ? named : null) || byKey.lifestyle || byKey.kidfun || cubes.find((c) => !c.locked && !isEmergency(c));
        if (!from) return { text: "אין לי קובייה גמישה להוריד ממנה 🤔 אפשר לרשום את זה במסך „יומן הוצאות”." };
        if (from.balance < amount)
          return { text: 'בקובייה "' + from.name + '" יש רק ₪' + fmt(from.balance) + ", אז לא ארשום הורדה שתשאיר אותה שלילית. " +
            "אפשר לרשום את זה במסך „יומן הוצאות” ולבחור משם קובייה אחרת 🙂" };
        from.balance = Math.max(0, from.balance - amount);
        logExpense({ amount: amount, cubeKey: from.key, cubeName: from.name, what: what, reason: "need" });
        syncAfterChange([from.key]);
        return {
          text: "רשמתי ✅ ₪" + fmt(amount) + (what ? " על " + what : "") + ' ירדו מ"' + from.name + '" (נשאר ₪' + fmt(from.balance) + ").\n\n" +
            "רק שאלה אחת, והיא זו שבאמת משנה: זה היה משהו שהיית חייב, או משהו שנסחפת אליו?",
          quick: SPEND_REASONS.map((r) => ({
            label: r.emoji + " " + r.label,
            kind: r.tone === "warn" ? "danger" : null,
            run: () => {
              if (state.expenses[0]) { state.expenses[0].reason = r.id; saveState(); }
              const ins = expenseInsights();
              return { text: r.tone === "warn"
                ? "תודה על הכנות 🙏 דווקא ההוצאות האלה הן אלה ששווה להסתכל עליהן בסוף החודש." +
                  (ins && ins.regretPct > 0 ? " עד כה " + ins.regretPct + "% מהכסף שדיווחת עליו נכנס לקטגוריה הזו." : "")
                : "מעולה, סימנתי ✅ הוצאה מודעת היא לא בעיה — זו בדיוק המטרה של הקוביות." };
            },
          })),
        };
      }

      if (opts && opts.actionsOnly) return null;

      // 4b. The prepaid card itself
      if (/(כרטיס נטען|פריפייד|נטען|כמה טעון|כמה יש בכרטיס|מינוס|אוברדרפט|prepaid|loaded card|on my card|overdraft)/.test(q)) {
        const s = advisorSnapshot();
        if (!s.prepaid) return { text: "החשבון שלך לא מוגדר ככרטיס נטען 🙂 אם עברת לכרטיס נטען אפשר להגדיר את זה מחדש דרך השאלון." };
        const untouchable = s.emgBalance;
        const spendable = Math.max(0, s.total - untouchable);
        return { text: "בכרטיס טעונים ₪" + fmt(s.total) + ".\n" +
          "• ₪" + fmt(spendable) + " זמינים להוצאה\n" +
          "• ₪" + fmt(untouchable) + " שמורים בקרן החירום — לא נוגעים\n\n" +
          "וזה כל מה שיש: בכרטיס נטען אין מסגרת אשראי ואי אפשר להיכנס למינוס. אם תנסה להוציא יותר, העסקה פשוט לא תעבור.\n" +
          "טענת כסף? לחץ על „טענתי כסף לכרטיס” בדשבורד ואחלק אותו לקוביות לפי האחוזים שלך." };
      }

      // 5. Emergency-fund consultation
      if (/(חירום|רשת ביטחון|קרן חירום|emergency|safety net|rainy day)/.test(q)) {
        const s = advisorSnapshot();
        if (!s.emergency) return { text: "אין לך עדיין קוביית קרן חירום — אפתח לך אותה ברגע שתחלק תקציב 🙂" };
        if (s.emgGoal <= 0) return { text: "כדי לחשב כמה קרן החירום שלך צריכה להכיל אני צריך את ההוצאות החודשיות שלך. הזן הכנסה חודשית במסך „הכנסה” ואחזור עם מספר." };
        const left = Math.max(0, s.emgGoal - s.emgBalance);
        if (left <= 0) return { text: "קרן החירום שלך מלאה 🛟 יש בה ₪" + fmt(s.emgBalance) + " — כשלושה חודשי הוצאות. זה המצב שרוב האנשים לא מגיעים אליו, אז תשמור עליו." };
        const per = s.slack > 0 ? s.slack : (s.emergency.amount || 0);
        return { text: "בקרן החירום יש ₪" + fmt(s.emgBalance) + " מתוך יעד של ₪" + fmt(s.emgGoal) + " (3 חודשי הוצאות של ₪" + fmt(s.essentials) + " כל אחד).\n" +
          "זה מכסה אותך היום כ-" + s.emgMonths + " חודשים בלי הכנסה.\n" +
          (per > 0 ? "בקצב של ₪" + fmt(per) + " בחודש תסגור את הפער תוך " + Math.ceil(left / per) + " חודשים." : "כדי לסגור את הפער צריך להקצות סכום חודשי — אפשר במסך „הכנסה”.") };
      }

      // 6. Savings capacity
      if (/(כמה.*(לחסוך|אני יכול)|יכול לחסוך|כמה נשאר לי|תקציב פנוי|how much can i save|can i save|save a month|save per month|spare budget|free budget|disposable)/.test(q)) {
        const s = advisorSnapshot();
        if (s.income <= 0) return { text: "עוד לא סיפרת לי כמה נכנס לך כל חודש 🙂 הזן את זה במסך „הכנסה חודשית” ואחשב לך בדיוק כמה אפשר לחסוך." };
        return { text: "מתוך ₪" + fmt(s.income) + " בחודש:\n" +
          "• ₪" + fmt(s.income - freeMonthlyBudget()) + " הולכים להוצאות קבועות ונעולות\n" +
          "• ₪" + fmt(freeMonthlyBudget()) + " הם התקציב הגמיש שלך\n" +
          "• ₪" + fmt(s.slack) + " מתוכו עוד לא הובטחו לאף קובייה — זה הסכום שאפשר להפנות היום ליעד חדש.\n\n" +
          "רוצה שאראה לך כמה זה שווה בעוד שנה? פתח את הסימולטור 🔮" };
      }

      // 7. Status
      if (/(מצב|סטטוס|כמה יש|how|status|doing|situation|overview|where do i stand|how much do i have)/.test(q)) {
        const s = advisorSnapshot();
        const low = [...cubes].filter((c) => !c.locked).sort((a, b) => a.balance - b.balance)[0];
        const ins = expenseInsights();
        return { text: (s.prepaid ? "טעון בכרטיס: ₪" : "סה״כ אצלך: ₪") + fmt(s.total) + (s.pool > 0 ? " (מתוכם ₪" + fmt(s.pool) + " עוד לא חולקו)" : "") + ".\n" +
          (s.emergency ? "🛟 קרן חירום: ₪" + fmt(s.emgBalance) + (s.emgGoal > 0 ? " מתוך ₪" + fmt(s.emgGoal) : "") + ".\n" : "") +
          (low ? '📉 הקובייה הכי נמוכה: "' + low.name + '" עם ₪' + fmt(low.balance) + ".\n" : "") +
          (ins ? "🧾 דיווחת על ₪" + fmt(ins.total) + " הוצאות" + (ins.regretPct > 0 ? ", מתוכן " + ins.regretPct + "% סומנו כ\"נסחפתי\"." : ".") : "עוד לא דיווחת על הוצאות — זה המקום שבו התמונה מתחילה להתחדד.") };
      }

      // 8. Greeting
      if (/^(היי|הי|שלום|מה קורה|hi|hey|hello|good morning|good evening)/.test(q))
        return { text: "היי! 👋 יש לך ₪" + fmt(total) + " בקוביות.\nאפשר להתייעץ איתי בחופשיות — למשל \"כדאי לי אוזניות ב-600 או שעון ב-900?\", \"מה מצב קרן החירום?\", \"בזבזתי 200 על מסעדה\", או \"תכניס 100 ₪ לחיסכון\"." };

      // 9. Advisor fallback — a real answer with the user's numbers, not a shrug.
      const s = advisorSnapshot();
      return { text: "אני כאן בדיוק בשביל התלבטויות כאלה 🧊\n" +
        "התמונה שלך כרגע: ₪" + fmt(s.total) + " בקוביות" + (s.income > 0 ? ", ₪" + fmt(s.income) + " נכנסים בחודש, ₪" + fmt(s.slack) + " פנויים להפניה" : "") +
        (s.emergency && s.emgGoal > 0 ? ", וקרן חירום על ₪" + fmt(s.emgBalance) + " מתוך ₪" + fmt(s.emgGoal) : "") + ".\n\n" +
        "כדי שאוכל לעזור באמת, תן לי את המספרים: \"כדאי לי לקנות X ב-800?\", \"X ב-500 או Y ב-900?\", \"מתי אגיע ליעד?\" — או פשוט תגיד לי מה עובר לך בראש ואני אשאל את השאלות." };
    }

    // =====================================================================
    // Worker 4 — state & storage sync: every chat/settings mutation flows
    // through these wrappers so the totals stay mathematically sound and
    // localStorage is updated in the same tick as the UI.
    // =====================================================================
    function syncAfterChange(highlightKeys) {
      state.justFunded = new Set(highlightKeys || []);
      saveState();
      render(); // dashboard behind the chat re-renders instantly
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }

    function execFunding(a) {
      // invariant: money is moved, never created — total (cubes + pool) is preserved
      const before = Math.round(totalBalance() + state.pool);
      a.sources.forEach((s) => {
        if (s.key === "__pool") state.pool = Math.max(0, state.pool - s.amount);
        else { const c = state.cubes.find((x) => x.key === s.key); if (c) c.balance = Math.max(0, c.balance - s.amount); }
      });
      let target = a.targetKey ? state.cubes.find((c) => c.key === a.targetKey) : null;
      if (!target && a.createName) {
        const idx = state.cubes.filter((c) => c.custom).length;
        target = { key: "custom_" + Date.now(), name: a.createName, emoji: "🎯",
          color: CUSTOM_COLORS[idx % CUSTOM_COLORS.length], note: "יעד אישי", pct: 0,
          amount: a.amount, locked: false, balance: 0, custom: true, priority: null };
        state.cubes.push(target);
      }
      if (!target) return { text: "משהו השתבש — לא מצאתי את קוביית היעד 🤔" };
      target.balance += a.amount;
      const after = Math.round(totalBalance() + state.pool);
      if (before !== after) console.warn("[cubey] balance invariant drift:", before, "->", after);
      state.game.flags.funded = true; // badge: rerouted money via chat
      syncAfterChange([target.key]);
      return { text: "בוצע ✅ לקחתי " + describeSources(a.sources) + " והעברתי ₪" + fmt(a.amount) + ' ל"' + target.name + '". היתרה שם עכשיו: ₪' + fmt(target.balance) + "." };
    }

    // =====================================================================

      head.querySelector("#pgback").onclick = onBack;
      v.appendChild(head);
      const body = el("div", "pagebody");
      v.appendChild(body);
      return body;
    }

          '<p>חסכונות משותפים שייכים לכל המשתתפים בהם: הרישומים שלך בהם נשארים אצל השותפים, וחיסכון משותף נמחק רק בהסכמת כולם.</p>';
        body.appendChild(w);
        const d = el("button", "dangerbtn"); d.textContent = "אני מבין/ה — המשך למחיקה";
        d.onclick = () => { settStep = 2; render(); }; body.appendChild(d);
        const bk = el("button", "obback"); bk.textContent = "חזרה";
        bk.onclick = () => { settStep = 0; render(); }; body.appendChild(bk);
      } else {
        const w = el("div", "setcard warn");
        w.innerHTML = '<h3>אישור אחרון 🛑</h3>' +
          '<p>זו הפעולה הסופית. אחרי הלחיצה החשבון נמחק מיד ותועבר/י למסך ההתחברות.</p>';
        body.appendChild(w);
        const d = el("button", "dangerbtn"); d.textContent = "מחק/י את החשבון שלי לצמיתות";
        d.onclick = wipeAccount; body.appendChild(d);

    // Notification settings — the two server notifications (AI chat reply,
    // monthly income), each on/off, plus hiding amounts and replies. Says
    // plainly when they can't work yet, instead of showing switches that do
    // nothing: not available in this build, account not connected, or the

    function renderNotificationsPage() {
      const body = pageShell("התראות 🔔", () => { state.screen = "settings"; render(); });
      const n = Object.assign({}, NOTIF_DEFAULT, state.notif || {});
      const avail = push.available();
      const email = state.authUser ? state.authUser.email : "";

      const stc = el("div", "setcard");
      if (!nativeApp) {
        stc.innerHTML = '<div class="setmail">התראות זמינות באפליקציית האנדרואיד</div>' +

        stc.innerHTML = '<div class="setmail">מחבר את ההתראות לחשבון…</div>';
      } else {

        stc.innerHTML =

          '<div class="setlbl" style="margin-top:4px">' + (mismatch
            ? "כנראה שהסיסמה אופסה באפליקציה. אפשר לקבל מייל לאיפוס הסיסמה של חשבון ההתראות, או להזין כאן את הסיסמה הקודמת."
            : push.status === "error" ? "לא הצלחנו להתחבר לשרת. בדקו את החיבור והזינו את הסיסמה כדי לנסות שוב."
            : "הזינו את סיסמת החשבון פעם אחת כדי לקבל התראות במכשיר הזה.") + '</div>' +
          '<div class="fld" style="margin-top:10px"><input id="nfPw" type="password" dir="ltr" placeholder="••••••••" autocomplete="current-password"></div>' +
          '<button class="distbtn wide" id="nfLink" style="margin-top:10px">חיבור התראות</button>' +
          (mismatch ? '<button class="obback" id="nfReset">שלחו לי מייל לאיפוס</button>' : "");
      }
      body.appendChild(stc);
      const linkBtn = stc.querySelector("#nfLink");
      if (linkBtn) linkBtn.onclick = () => {

        pushLinkAccount(email, pw);
        render();
      };
      const resetBtn = stc.querySelector("#nfReset");
      if (resetBtn) resetBtn.onclick = () => { try { nativeApp.pushSendServerPasswordReset(email); } catch (e) {} };

      // System permission. Without it nothing appears in the shade — the
      // reply is still saved in the chat and the income still recorded.
      if (avail) {
        let perm = "granted";
        try { perm = nativeApp.pushPermissionState(); } catch (e) {}
        const pc = el("div", "setcard");
        pc.innerHTML = perm === "granted"
          ? '<div class="setmail">✅ הרשאת התראות פעילה</div>'

      const st = el("div", "section-t"); st.textContent = "מה לשלוח לי"; body.appendChild(st);
      const rows = [

        ["incomePush", "הכנסה חודשית 💰", "כשההכנסה הקבועה נרשמה אוטומטית בתחילת החודש"],
        ["sharedPush", "חיסכון משותף 🤝", "הצטרפות, הפקדות ובקשות מחיקה — הן נשמרות גם בתיבת ההתראות של המסך"],
        ["hideSensitive", "הסתרת תוכן רגיש 🙈", "בהתראה יופיע נוסח כללי — בלי תשובת ה-AI, בלי סכומים ובלי שמות"],
      ];
      if (!SERVER_FEATURES) { const at = rows.findIndex((r) => r[0] === "sharedPush"); if (at >= 0) rows.splice(at, 1); }
      rows.forEach(([key, label, hint]) => {

        sw.onclick = () => {
          if (!rowAvail) return;
          state.notif = Object.assign({}, n, state.notif || {});
          state.notif[key] = !state.notif[key];
          state.notif.changedAt = Date.now();
          n[key] = state.notif[key];
          sw.classList.toggle("on", !!state.notif[key]);
          saveState();
          pushSyncPrefs(true);
        };
        body.appendChild(c);

      const sp = el("div"); sp.style.height = "24px"; body.appendChild(sp);
    }
