<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CubeFinance — קיובפייננס</title>
  <style>
    /* ==================================================================
       CubeFinance — self-contained web app (single file, UTF-8, RTL).
       Open directly in any browser. No build step, no dependencies.
       ================================================================== */
    :root {
      --bg: #0b0e18; --bg-deep: #070a12; --elevated: #141a28; --card: #151b29;
      --card-2: #1a2136; --border: #273049; --text: #eceff8; --dim: #949cb6;
      --primary: #6472ff; --primary-2: #8f9aff; --primary-dim: #3b44a8;
      --danger: #f0555a; --warning: #f5b544; --success: #10c088;
      --gold: #f2b134; --gold-2: #ffd873;
      --c-essentials: #10c088; --c-savings: #3b82f6; --c-investments: #e8845e;
      --c-emergency: #f0555a; --c-lifestyle: #f5b544; --c-housing: #6472ff;
      --radius: 16px; --radius-lg: 22px;
      --shadow-card: 0 18px 40px -28px rgba(0,0,0,.9);
      --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      direction: rtl; /* robust RTL even if a host strips the html dir attribute */
      text-align: start;
      font-family: var(--font); color: var(--text);
      background:
        radial-gradient(1000px 520px at 18% -12%, #182247 0%, transparent 56%),
        radial-gradient(820px 480px at 112% 6%, #0d2540 0%, transparent 52%),
        var(--bg-deep);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .device {
      width: 400px; max-width: 100%; height: 820px; max-height: 92vh;
      background: var(--bg); border-radius: 42px; padding: 12px;
      border: 1px solid #33334a;
      box-shadow: 0 0 0 10px #101018, 0 40px 90px -30px #000, inset 0 0 0 1px #ffffff08;
      position: relative;
    }
    .screen { position: relative; width: 100%; height: 100%; background: var(--bg);
      border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; }
    .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 24px; background: #000; border-radius: 14px; z-index: 60; }
    .view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 44px 18px 24px; }
    .view::-webkit-scrollbar { width: 0; }

    .brand { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 16px; }
    .brand small { color: var(--dim); font-weight: 600; font-size: 12px; }

    .hero { position: relative; background:
        linear-gradient(158deg, #1e274a 0%, #131a2c 62%, #101524 100%);
      border: 1.5px solid #2f3a5c; border-radius: var(--radius-lg); padding: 22px;
      box-shadow: 0 26px 60px -34px #000, inset 0 1px 0 #ffffff14; overflow: hidden; }
    .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(320px 180px at 85% -20%, #6472ff33, transparent 70%); }
    .hero > * { position: relative; }
    .hero .hl { color: var(--dim); font-size: 13px; font-weight: 700; letter-spacing: .2px; }
    .hero .hv { font-size: 40px; font-weight: 900; letter-spacing: -1.5px; margin: 4px 0 0;
      font-variant-numeric: tabular-nums; }
    .hero .hv small { font-size: 20px; font-weight: 800; color: var(--dim); }

    .poolbox { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
    .poolbox .field { flex: 1; background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); display: flex; align-items: center; padding: 0 12px; }
    .poolbox .field span { color: var(--dim); font-weight: 700; font-size: 15px; }
    .poolbox input { flex: 1; background: none; border: none; outline: none; color: var(--text);
      font-size: 18px; font-weight: 800; padding: 12px 6px; font-family: var(--font);
      font-variant-numeric: tabular-nums; text-align: start; width: 100%; }
    .distbtn { border: none; cursor: pointer; font-family: var(--font); white-space: nowrap;
      background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff;
      font-size: 15px; font-weight: 800; padding: 14px 18px; border-radius: 14px;
      letter-spacing: .2px; box-shadow: 0 14px 28px -14px var(--primary), inset 0 1px 0 #ffffff2e;
      transition: transform .1s, filter .15s, box-shadow .15s; }
    .distbtn:hover { filter: brightness(1.07); box-shadow: 0 18px 34px -14px var(--primary), inset 0 1px 0 #ffffff33; }
    .distbtn:active { transform: scale(.97); }
    .distbtn:disabled { opacity: .5; cursor: not-allowed; }

    .parents { margin-top: 16px; background: #1a2733; border: 1px solid #244; border-radius: var(--radius);
      padding: 14px; display: flex; gap: 10px; align-items: flex-start; }
    .parents .pi { font-size: 20px; }
    .parents .pt { color: #bfe3d6; font-size: 13px; line-height: 1.5; }
    .parents .pt b { color: #eafff7; }

    .toggle { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px; margin-top: 16px; }
    .toggle button { flex: 1; border: none; background: none; color: var(--dim); cursor: pointer;
      font-family: var(--font); font-weight: 700; font-size: 13px; padding: 9px; border-radius: 999px; }
    .toggle button.on { background: var(--primary); color: #fff; }

    .section-t { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800;
      margin: 20px 2px 14px; }
    .section-t::before { content: ""; width: 4px; height: 15px; border-radius: 2px;
      background: linear-gradient(var(--primary), #46e0b4); }

    .cube { background: linear-gradient(168deg, var(--card-2), var(--card) 55%); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card);
      transition: transform .18s, box-shadow .2s, border-color .2s; }
    .cube:hover { border-color: #33406099; }
    .cube.pop { animation: pop .5s ease; }
    @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.035)} 100%{transform:scale(1)} }
    .cube .top { display: flex; align-items: center; gap: 12px; }
    .cube .chip { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
      font-size: 21px; flex: none; box-shadow: inset 0 0 0 1px #ffffff12; }
    .cube .nm { font-size: 16px; font-weight: 800; }
    .cube .nt { font-size: 12px; color: var(--dim); margin-top: 1px; }
    .cube .pct { margin-inline-start: auto; font-size: 13px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
    .cube .brow { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
    .cube .bal { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .cube .bal small { font-size: 15px; font-weight: 800; color: var(--dim); }
    .cube .tgt { font-size: 12.5px; color: var(--dim); font-weight: 600; }
    /* per-cube manual deposit button ("got ₪100 from a friend → straight to Fun") */
    .depbtn { margin-inline-start: auto; width: 34px; height: 34px; flex: none; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--elevated); color: var(--primary-2);
      font-size: 19px; font-weight: 800; line-height: 1; cursor: pointer; font-family: var(--font);
      display: grid; place-items: center; transition: .15s; }
    .depbtn:hover { border-color: var(--primary); background: var(--primary); color: #fff; transform: scale(1.08); }
    .depchips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .depchips .depq { padding: 8px 14px; font-size: 13.5px; cursor: pointer; }
    .segtoggle button small { display: block; font-size: 10.5px; font-weight: 600; opacity: .75; margin-top: 3px; }
    .depgoal { margin-top: 12px; background: rgba(108,99,255,.10); border: 1.5px solid var(--primary-dim);
      border-radius: 12px; padding: 11px 13px; font-size: 13px; font-weight: 700; text-align: center; }
    .emgline { margin-top: 12px; background: rgba(0,184,148,.10); border: 1.5px solid rgba(0,184,148,.42);
      border-radius: 12px; padding: 10px 13px; font-size: 12.5px; font-weight: 700; line-height: 1.55;
      color: var(--dim); text-align: center; }
    .emgline.done { color: #00b894; }
    /* ===== guide bookstore: cinematic billboard + chapter rail + buy box ===== */
    .bkwrap { display: flex; flex-direction: column; gap: 12px; }
    .bkhero { position: relative; border-radius: var(--radius-lg); overflow: hidden;
      border: 1.5px solid var(--border); background: #0b0f1c; min-height: 290px;
      display: flex; flex-direction: column; justify-content: flex-end; }
    .bkheroart { position: absolute; inset: 0; }
    .bkheroart .bkart { width: 100%; height: 100%; display: block; }
    /* the scrim keeps the title readable over the art — dark in BOTH themes,
       because the billboard is deliberately cinematic like a streaming header */
    .bkscrim { position: absolute; inset: 0;
      background: linear-gradient(0deg, #05070ef2 4%, #05070ec4 34%, transparent 74%); }
    .bkheroin { position: relative; padding: 18px 18px 14px; width: 100%; display: flex; align-items: flex-end; gap: 14px; }
    .bkcovershell { flex: 0 0 108px; border-radius: 6px; overflow: hidden;
      box-shadow: 0 14px 30px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06); }
    .bkcover { display: block; width: 100%; height: auto; }
    .bkherotxt { flex: 1; min-width: 0; }
    .bktitle { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: -.5px; color: #fff; line-height: 1.25; }
    .bkhook { margin: 8px 0 0; color: #d7d5ee; font-size: 13.5px; font-weight: 700; line-height: 1.5; }
    .bkmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 11px;
      color: #a7a4c8; font-size: 12.5px; font-weight: 700; }
    .bkmeta .bkage { border: 1px solid #ffffff40; border-radius: 4px; padding: 1px 7px; color: #fff; }
    .bksub { position: relative; margin: 0; padding: 0 18px 16px; color: #a7a4c8; font-size: 13px; line-height: 1.55; }
    /* buy box */
    .bkbuy { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
    .bkprices { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px; }
    .bknow { font-size: 34px; font-weight: 900; letter-spacing: -1.2px; color: var(--success);
      direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
    /* The old price is struck with a deliberate RED bar — the point is that a
       reader must not mistake 35 for what they pay. text-decoration alone
       renders in the text colour, so the bar is drawn explicitly. */
    .bkwas { position: relative; display: inline-block; color: var(--dim); font-size: 20px; font-weight: 800;
      direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; padding: 0 3px; }
    .bkwas::after { content: ""; position: absolute; inset-inline: -2px; top: 50%; height: 3px;
      background: #ff3b30; border-radius: 2px; transform: translateY(-50%) rotate(-8deg); pointer-events: none; }
    .bkwas.sm { font-size: 14px; margin-inline-end: 4px; }
    .bkwas.sm::after { height: 2px; }
    .bkoff { background: rgba(255,59,48,.14); color: #ff5b52; border: 1px solid rgba(255,59,48,.4);
      border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 900; }
    .bkpricenote { margin-top: 10px; color: var(--dim); font-size: 13px; line-height: 1.6; }
    .bkpricenote b { color: var(--text); }
    .bkweb { margin-top: 8px; color: var(--dim); font-size: 12.5px; font-weight: 700; line-height: 1.55; }
    .bkcta { width: 100%; margin-top: 14px; background: var(--primary); border: none; color: #fff;
      border-radius: var(--radius); padding: 15px; font-family: var(--font); font-size: 16px;
      font-weight: 900; cursor: pointer; transition: filter .15s; }
    .bkcta:hover { filter: brightness(1.1); }
    .bkghost { width: 100%; margin-top: 8px; background: none; border: 1.5px solid var(--border);
      color: var(--dim); border-radius: var(--radius); padding: 12px; font-family: var(--font);
      font-size: 14px; font-weight: 800; cursor: pointer; }
    .bkghost:hover { border-color: var(--primary); color: var(--text); }
    .bkowned { margin-top: 10px; text-align: center; color: var(--success); font-size: 13.5px; font-weight: 800; }
    /* terms sit inside the buy box: readable BEFORE paying, not after */
    .bkterms { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .bkterms h4 { margin: 0 0 8px; font-size: 13.5px; font-weight: 900; }
    .bkterms ol { margin: 0; padding-inline-start: 20px; }
    .bkterms li { color: var(--dim); font-size: 12.5px; line-height: 1.7; margin-bottom: 7px; }
    .bkterms li::marker { color: var(--primary-2); font-weight: 800; }
    .bkagree { margin: 8px 0 0; color: var(--dim); font-size: 12px; font-weight: 700; }
    .gpterms { margin-top: 10px; color: var(--dim); font-size: 11.5px; line-height: 1.6; }
    .gpterms b { color: var(--text); }
    /* fact strip */
    .bkfacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .bkfact { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 11px 8px; text-align: center; }
    .bkfact b { display: block; font-size: 19px; font-weight: 900; color: var(--primary-2);
      font-variant-numeric: tabular-nums; }
    .bkfact span { color: var(--dim); font-size: 11.5px; font-weight: 700; }
    .bkblurb p { margin: 0 0 11px; color: var(--dim); font-size: 14px; line-height: 1.75; }
    .bkblurb p:last-child { margin-bottom: 0; color: var(--text); font-weight: 700; }
    /* chapter rail — horizontal shelf */
    .bkrail { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .bkcard { position: relative; flex: 0 0 168px; scroll-snap-align: start; background: var(--card);
      border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 13px 13px;
      transition: transform .18s, border-color .18s; }
    .bkcard:hover { transform: translateY(-3px); border-color: var(--primary); }
    .bknum { position: absolute; inset-inline-end: 8px; bottom: 2px; font-size: 40px; font-weight: 900;
      color: var(--text); opacity: .07; line-height: 1; pointer-events: none; }
    .bklevel { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .6px;
      color: var(--primary-2); background: rgba(108,99,255,.14); border-radius: 5px; padding: 3px 7px;
      direction: ltr; unicode-bidi: isolate; }
    .bkcard b { display: block; margin-top: 9px; font-size: 14px; font-weight: 800; line-height: 1.35; }
    .bkline { display: block; margin-top: 6px; color: var(--dim); font-size: 11.5px; line-height: 1.55; }
    .bkhint { color: var(--dim); font-size: 12px; font-weight: 700; text-align: center; margin-top: -4px; }
    .bkquote { margin: 0; background: var(--card-2); border: 1px solid var(--primary-dim);
      border-radius: var(--radius-lg); padding: 18px; }
    .bkquote p { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.7; }
    .bkquote cite { display: block; margin-top: 10px; color: var(--dim); font-size: 12.5px; font-style: normal; font-weight: 700; }
    /* ===== free worksheet: 40/30/20/10 calculator + homework + tracker ===== */
    .wscard { background: var(--card); border: 1.5px solid var(--primary-dim); border-radius: var(--radius-lg); padding: 18px; }
    .wshead { margin-bottom: 4px; }
    .wsfree { display: inline-block; background: rgba(0,184,148,.14); color: #00b894; border: 1px solid rgba(0,184,148,.4);
      border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 900; }
    .wshead h3 { margin: 10px 0 0; font-size: 18px; font-weight: 900; line-height: 1.35; }
    .wshead p { margin: 8px 0 0; color: var(--dim); font-size: 13px; line-height: 1.65; }
    .wsbar { display: flex; gap: 3px; height: 10px; margin-top: 14px; border-radius: 999px; overflow: hidden; background: var(--bg); }
    .wsbar i { display: block; transition: flex-grow .25s; }
    .wstable { margin-top: 12px; }
    .wsrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .wsrow:last-child { border-bottom: none; padding-bottom: 0; }
    .wsic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; }
    .wsnm { flex: 1; min-width: 0; }
    .wsnm b { display: block; font-size: 14px; font-weight: 800; }
    .wsnm span { display: block; color: var(--dim); font-size: 11.5px; line-height: 1.45; margin-top: 2px; }
    .wspc { flex: none; display: flex; align-items: center; gap: 3px; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 9px; padding: 4px 7px; }
    .wspc:focus-within { border-color: var(--primary); }
    .wspc input { width: 38px; background: none; border: none; outline: none; color: var(--text); text-align: center;
      font-family: var(--font); font-size: 14px; font-weight: 800; }
    .wspc b { color: var(--dim); font-size: 12px; }
    .wsamt { flex: none; min-width: 74px; text-align: left; font-size: 16px; font-weight: 900;
      font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    .wsfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .wsok { color: var(--dim); font-size: 12.5px; font-weight: 700; }
    .wsbad { color: var(--warning); font-size: 12.5px; font-weight: 700; }
    .wsreset { background: none; border: 1.5px solid var(--border); color: var(--dim); border-radius: 999px;
      padding: 7px 13px; font-family: var(--font); font-size: 12.5px; font-weight: 800; cursor: pointer; }
    .wsreset:hover { border-color: var(--primary); color: var(--text); }
    .section-t.wsst { margin-top: 22px; }
    .wstasks { display: flex; flex-direction: column; gap: 8px; }
    .wstask { display: flex; align-items: flex-start; gap: 11px; text-align: start; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px 13px; cursor: pointer;
      font-family: var(--font); color: var(--text); transition: border-color .15s, background .15s; }
    .wstask:hover { border-color: var(--primary-dim); }
    .wstask.on { border-color: #00b894; background: rgba(0,184,148,.07); }
    .wsbox { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border);
      display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; margin-top: 1px; }
    .wstask.on .wsbox { background: #00b894; border-color: #00b894; }
    .wstxt b { display: block; font-size: 14px; font-weight: 800; }
    .wstxt span { display: block; color: var(--dim); font-size: 12px; line-height: 1.6; margin-top: 4px; }
    .wstrack { border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg); }
    .wstrow { display: grid; grid-template-columns: 58px 1fr 66px 82px; gap: 1px; background: var(--border); }
    .wstrow.head { background: var(--card-2); }
    .wstrow.head span { padding: 8px 7px; color: var(--dim); font-size: 11px; font-weight: 800; text-align: center; }
    .wstrow input { background: var(--card); border: none; outline: none; color: var(--text); padding: 10px 7px;
      font-family: var(--font); font-size: 12.5px; min-width: 0; text-align: center; }
    .wstrow input:focus { background: var(--card-2); box-shadow: inset 0 0 0 1.5px var(--primary); }
    .wstrow input::placeholder { color: #55556a; }
    .wstsum { margin-top: 9px; color: var(--dim); font-size: 12.5px; font-weight: 700; line-height: 1.6; }
    .wsprintbtn { width: 100%; margin-top: 18px; background: var(--primary); border: none; color: #fff;
      border-radius: var(--radius); padding: 14px; font-family: var(--font); font-size: 15px; font-weight: 900;
      cursor: pointer; transition: filter .15s; }
    .wsprintbtn:hover { filter: brightness(1.1); }
    .wsnote { margin-top: 9px; color: var(--dim); font-size: 11.5px; line-height: 1.6; text-align: center; }

    /* the printout host is invisible on screen and is all that prints */
    #wsprint { display: none; }
    @media print {
      html, body { background: #fff !important; }
      body > *:not(#wsprint) { display: none !important; }
      #wsprint { display: block; }
      .wp { direction: rtl; color: #101223; font-family: var(--font); padding: 0 4mm; }
      .wphead { display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px; border-bottom: 2.5px solid #101223; padding-bottom: 10px; }
      .wp h1 { margin: 0; font-size: 22pt; font-weight: 900; letter-spacing: -.5px; }
      .wphead p { margin: 4px 0 0; font-size: 10pt; color: #4a4a63; }
      .wpstamp { font-size: 10pt; font-weight: 800; color: #4a4a63; white-space: nowrap; }
      .wpamount { margin: 14px 0 10px; font-size: 13pt; font-weight: 700; }
      .wpamount b { font-size: 17pt; font-weight: 900; }
      .wp h2 { margin: 20px 0 8px; font-size: 13pt; font-weight: 900;
        border-bottom: 1.5px solid #c9cade; padding-bottom: 5px; page-break-after: avoid; }
      .wpt { width: 100%; border-collapse: collapse; font-size: 11pt; }
      .wpt th { text-align: start; font-size: 9.5pt; font-weight: 800; color: #4a4a63;
        border-bottom: 1.5px solid #101223; padding: 6px 8px; }
      .wpt td { border-bottom: 1px solid #d8d9e6; padding: 9px 8px; vertical-align: top; }
      .wpt td i { display: block; font-style: normal; font-size: 9pt; color: #4a4a63; margin-top: 2px; }
      .wpt .wptot td { font-weight: 900; border-top: 2px solid #101223; border-bottom: none; }
      .wptrack td { height: 26px; }

      unicode-bidi: plaintext; }
    .distbtn.wide { width: 100%; margin-top: 6px; }
    /* onboarding wizard */
    .track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .track > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s cubic-bezier(.2,.8,.2,1); }
    .stepcount { color: var(--dim); font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .ob-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; color: var(--text);
      background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 15px;
      margin-bottom: 10px; cursor: pointer; font-family: var(--font); transition: border-color .15s, background .15s; }
    .ob-opt:hover { border-color: var(--primary-dim); } /* token, so light mode doesn't get a dark ring */
    .ob-opt.on { border-color: var(--primary); background: var(--card-2); }
    .ob-opt .obrad { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
      display: grid; place-items: center; flex: none; }
    .ob-opt.on .obrad { border-color: var(--primary); }
    .ob-opt .obrad i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); display: none; }
    .ob-opt.on .obrad i { display: block; }

    .obexit { width: 100%; background: none; border: none; color: var(--dim); opacity: .7; font-weight: 600;

    .obsum b { color: var(--text); }
    /* custom cube */
    .addcube { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent; border: 1.5px dashed var(--border); border-radius: var(--radius-lg);
      padding: 16px; color: var(--dim); font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: var(--font); unicode-bidi: plaintext; margin-top: 4px; transition: border-color .15s, color .15s, background .15s; }
    .addcube:hover { border-color: var(--primary); color: var(--text); background: #ffffff08; }
    .addcube .addicon { font-size: 20px; color: var(--primary); font-weight: 800; }
    .ccwrap { position: absolute; inset: 0; z-index: 46; display: none; flex-direction: column;

    .ccsheet { background: var(--elevated); border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg);
      padding: 18px 20px 28px; max-height: 90%; overflow-y: auto; animation: slideup .3s ease; }
    .handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
    .prio { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
    .prio input[type=range] { flex: 1; accent-color: var(--primary); height: 6px; }
    .priov { min-width: 40px; text-align: center; font-size: 20px; font-weight: 800; color: var(--primary);
      background: #ffffff10; border-radius: 10px; padding: 4px 6px; font-variant-numeric: tabular-nums; }
    .priov.hot { color: #ff9f68; background: #ff9f6820; }

    .aiRes { margin-top: 14px; background: linear-gradient(150deg, #201d38, #17161f);
      border: 1px solid var(--primary-dim); border-radius: var(--radius); padding: 14px; }
    .aiAmt { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .aiAmt span { font-size: 13px; font-weight: 600; color: var(--dim); }
    .aiExp { color: var(--dim); font-size: 13.5px; line-height: 1.5; margin-top: 6px; unicode-bidi: plaintext; }
    .aswitch { text-align: center; color: var(--dim); font-size: 13.5px; margin-top: 14px; }
    .aswitch button { background: none; border: none; color: var(--primary); font-weight: 800; cursor: pointer;

    .gbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 16px;

    .aforgot { display: block; margin: -4px 0 4px auto; background: none; border: none; padding: 4px 0; cursor: pointer;
      color: var(--primary); font: 700 13px var(--font); }

    @media (max-width: 560px) {
      body { padding: 0; }
      .device { width: 100%; height: 100vh; height: 100dvh; max-height: none; border: 0;
        border-radius: 0; padding: 0; box-shadow: none; }
      .screen { border-radius: 0; }
      .notch { display: none; }
      .view { padding-top: 24px; }
    }
    /* ===== light theme: token overrides + the few hard-coded dark surfaces ===== */
    :root { color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f6fc; --bg-deep: #e7ebf6; --elevated: #ffffff; --card: #ffffff;
        --card-2: #eef1fe; --border: #d9deec; --text: #171a2b; --dim: #5c6280;
        --primary: #4f5dff; --primary-2: #6b78ff; --primary-dim: #b4baf5;
        --shadow-card: 0 14px 34px -26px rgba(60,70,120,.6);
      }
      body { background: radial-gradient(1000px 500px at 20% -10%, #dfe4fc 0%, transparent 55%),
             radial-gradient(800px 460px at 110% 8%, #dbeafb 0%, transparent 50%), var(--bg-deep); }
      .hero { background: linear-gradient(158deg, #eef1ff, #ffffff 65%); border-color: #dbe0f2; box-shadow: 0 24px 54px -38px #7a82b5; }
      .hero::before { background: radial-gradient(320px 180px at 85% -20%, #4f5dff22, transparent 70%); }
      .cube { background: linear-gradient(168deg, #f7f8ff, #ffffff 60%); }
      .cube:hover { border-color: #c3c9e6; }
      .device { border-color: #cfd2e4; box-shadow: 0 0 0 10px #ffffff, 0 40px 90px -40px #8a8fb5; }
      .notch { background: #10101a; }
      .authcard { background: linear-gradient(165deg, #f3f0ff, #ffffff); box-shadow: 0 30px 70px -50px #8a8fb5; }
      .parents { background: #e9f7f0; border-color: #bfe3d2; }
      .parents .pt { color: #1e5c44; }
      .parents .pt b { color: #114231; }
      .toast { background: #ffffff; border-color: var(--primary); box-shadow: 0 12px 30px -14px #8a8fb5; }
      .sync { background: #00000008; }
      .sync.ok { color: #0b8f66; border-color: #bfe3d2; background: #e9f7f0; }
      .restart { background: #00000008; }
      .aiRes { background: linear-gradient(150deg, #f1eeff, #ffffff); }
      .priov { background: #6c5ce715; }
      .addcube:hover { background: #00000005; }
      .cube { box-shadow: 0 4px 14px -12px #8a8fb5; }
      .cube .track, .ftrack { background: #eceef6; }
      .chatwrap { background: rgba(30, 30, 60, .35); }
      .ccwrap { background: rgba(30, 30, 60, .4); }
      .qbtns .qd { background: #ffffff; }
      .dangerbtn { background: #fdeaea; border-color: #f3bcbc; color: #c0392b; }
      .dangerbtn:hover { background: #fbdddd; }
      .setitem.danger { color: #c0392b; border-color: #f3bcbc; }
      .chtrack, .badge .btrack, .shptrack, .wibar { background: #eceef6; }
      .wibar i.cur { background: #b9b3e6; }
      .wiwarn { background: #fdeaea; border-color: #f3bcbc; color: #8e2f24; }
      .wiwarn b { color: #c0392b; }
      .wisafe { background: #e9f7f0; border-color: #bfe3d2; color: #1e5c44; }
      .wibar em.negt { color: #c0392b; }
      .obexit:hover { color: #c0392b; }
      .ledamt.neg, .logout { color: #c0392b; }
      .ledamt.pos { color: #0b8f66; }
      .claimbtn { color: #402b00; }
      .lockoverlay { background: radial-gradient(420px 320px at 50% 40%, #ffffffaa, transparent); }
      .payhero { background: linear-gradient(165deg, #fdf6e0, #ffffff 60%); }
      .payprice { color: #b8860b; }
      .setitem.gold { color: #b8860b; }
      .gpaybtn { background: #1a1a2e; color: #fff; }
      .s3 .negv { color: #c0392b; }
      .procbar { background: #eceef6; }
      .cube.landlordc { background: linear-gradient(160deg, #efecff, #ffffff); }
      .skipbtn { color: var(--primary); }
      .unknote { color: #4a4468; }
      /* the intro's brand screen follows the app theme — swap the dark corner
         glows for light ones so they don't read as smudges on a light page.
         (scoped via .introwrap so it beats the intro rules defined later) */
      .introwrap .iv-brandscr { background:
        radial-gradient(80% 34% at 18% -4%, #dfe4fc 0%, transparent 58%),
        radial-gradient(70% 30% at 108% 8%, #dbeafb 0%, transparent 54%), var(--bg); }
      .introwrap .iv-skip { background: #00000010; border-color: #00000022; color: #3b4160; }
      .introwrap .iv-skip:hover { background: #00000018; }

    /* ==================================================================
       Intro splash — a money jar shakes, falls and shatters, and a magical
       poof reveals the brand screen. "בוא נתחיל" then dissolves it to show
       the sign-up / log-in screen underneath. Shown only to logged-out users.
       ================================================================== */
    .introwrap { position: absolute; inset: 0; z-index: 80; overflow: hidden;
      background: var(--bg); display: none; perspective: 1000px; }
    .introwrap.on { display: block; }
    .introwrap.bye { animation: introBye .55s ease forwards; }
    @keyframes introBye { to { opacity: 0; visibility: hidden; } }
    .iv-studio { position: absolute; inset: 0; transition: opacity .5s ease;
      background:
        radial-gradient(65% 34% at 50% 32%, #1d2748 0%, transparent 70%),
        radial-gradient(85% 40% at 50% 100%, #101a33 0%, transparent 70%),
        linear-gradient(180deg, #0a0e1b 0%, #070a12 100%); }
    .iv-floor { position: absolute; left: 50%; top: 66%; width: 190%; height: 44%;
      transform: translateX(-50%) rotateX(74deg); transform-origin: 50% 0; opacity: .9;
      background: radial-gradient(closest-side, #2a3663 0%, #131a2e 45%, transparent 78%); }
    .iv-cam { position: absolute; inset: 0; transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.45,.05,.25,1); }
    .iv-cam.pan { transform: translateY(9%) translateZ(100px) rotateX(-9deg); }
    .iv-jarwrap { position: absolute; left: 50%; top: 46%; width: 190px; height: 254px;
      margin: -136px 0 0 -95px; transform-style: preserve-3d; }
    .iv-jar { position: absolute; inset: 0; transform-origin: 50% 100%; }
    .iv-jar.sh { animation: ivShake .34s linear infinite; }
    .iv-jar.shh { animation: ivShakeH .16s linear infinite; }
    @keyframes ivShake { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-2px,1px) rotate(-.7deg)}
      50%{transform:translate(2px,-1px) rotate(.6deg)} 75%{transform:translate(-1px,-1px) rotate(-.3deg)} }
    @keyframes ivShakeH { 0%,100%{transform:translate(0,0) rotate(0)} 20%{transform:translate(-5px,2px) rotate(-2deg)}
      40%{transform:translate(5px,-2px) rotate(1.8deg)} 60%{transform:translate(-4px,-2px) rotate(-1.4deg)}
      80%{transform:translate(4px,2px) rotate(1.2deg)} }
    .iv-jar.fall { animation: ivFall .5s cubic-bezier(.55,.06,.9,.6) forwards; }
    @keyframes ivFall { 0%{transform:rotate(0) translateY(0)} 45%{transform:rotate(-26deg) translateY(6px)}
      100%{transform:rotate(-74deg) translateY(60px)} }
    .iv-jar.gone { opacity: 0; }
    .iv-glass { position: absolute; left: 13px; right: 13px; top: 31px; bottom: 14px;
      border-radius: 13px 13px 24px 24px; overflow: hidden; border: 1px solid rgba(255,255,255,.30); border-top: none;
      background: linear-gradient(90deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 16%,
        rgba(255,255,255,.02) 44%, rgba(255,255,255,.09) 70%, rgba(255,255,255,.36) 100%),
        linear-gradient(180deg, rgba(190,225,255,.10), rgba(120,170,220,.05));
      box-shadow: inset 0 -20px 30px -18px rgba(120,190,255,.45), inset 0 9px 20px -11px rgba(255,255,255,.35),
        0 22px 46px -24px rgba(90,150,255,.55); }
    .iv-glass::after { content: ""; position: absolute; left: 12%; top: 4%; width: 11%; height: 88%;
      border-radius: 999px; filter: blur(1.5px);
      background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.06)); }
    .iv-rim { position: absolute; left: 5px; right: 5px; top: 14px; height: 31px; border-radius: 50%;
      background: linear-gradient(180deg, rgba(225,240,255,.55), rgba(150,190,230,.18));

    /* ==================================================================
       APPLE-DESIGN PASS
       A presentation layer only — appended last so it wins by cascade
       order. It adds material, depth, response and considered motion.
       It removes no rule above it and no feature: everything here is
       background, shadow, blur, easing, tracking and press feedback.

       Vocabulary follows Apple's two spring parameters rather than the
       physics triplet: response (how fast it reaches target) and damping
       (whether it overshoots). Critically damped is the house default;
       bounce is reserved for motion a gesture actually threw.
       ================================================================== */
    :root {
      /* response ~0.35s, damping 1.0 — the iOS sheet curve, no overshoot */
      --spring: cubic-bezier(.32, .72, 0, 1);
      /* damping ~0.8 — only for motion that followed real momentum */
      --spring-bounce: cubic-bezier(.34, 1.46, .64, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --dur-press: 120ms;   /* pointer-down feedback must feel instant */
      --dur: 260ms;
      --dur-sheet: 420ms;
      /* material weight: bigger surfaces read as thicker glass */
      --glass-sm: blur(14px) saturate(160%);
      --glass-lg: blur(28px) saturate(150%);
      --edge: inset 0 1px 0 rgba(255,255,255,.10); /* light catching the top edge */
    }

    /* ---- 1. Ambient depth ------------------------------------------
       The screen was a flat fill. Three static, wide radial pools give
       the surface somewhere to sit. Deliberately motionless: a moving
       full-viewport background is exactly what reduced-motion users and
       long sessions suffer from. */
    .screen {
      background:
        radial-gradient(760px 420px at 10% -8%, rgba(100,114,255,.20), transparent 62%),
        radial-gradient(640px 460px at 110% 10%, rgba(16,192,136,.11), transparent 58%),
        radial-gradient(560px 340px at 50% 112%, rgba(143,154,255,.09), transparent 64%),
        var(--bg);
    }
    /* Content dissolves under the top chrome instead of hard-cutting at it. */
    .view {
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 34px);
      mask-image: linear-gradient(180deg, transparent 0, #000 34px);
      scroll-behavior: smooth;
    }
    body { font-optical-sizing: auto; }

    /* ---- 2. Typography: tracking is size-specific -------------------
       Large text reads too loose at default tracking and needs negative
       values; body copy sits near zero. One fixed letter-spacing would be
       wrong at one end or the other. */
    .hv, .ppval, .bknow, .aiAmt, .ptsval, .gsbig b, .wsamt, .payprice {
      letter-spacing: -.03em; }
    .pagetitle, .authtitle, .bktitle, .wshead h3, .hero .hl { letter-spacing: -.02em; }
    .cube .nm, .section-t, .setmail { letter-spacing: -.01em; }
    .dzs, .setlbl, .privline, .bkline, .wstxt span { letter-spacing: .005em; } /* small text opens up slightly */

    /* ---- 3. Response: feedback on pointer-down, never on release ----
       Every pressable surface now answers the finger instantly. */
    .distbtn, .modbtn, .fab, .calmfab, .setitem, .bkcta, .bkghost, .wsprintbtn,
    .ppbtn, .backbtn, .fchip, .ob-opt, .wstask, .addcube, .depbtn, .gpaybtn,
    .obback, .dangerbtn, .wsreset, .bankfile, .moodbtn, .claimbtn, .settbtn {
      transition: transform var(--dur-press) var(--ease-out),
                  filter var(--dur-press) var(--ease-out),
                  border-color var(--dur) var(--ease-out),
                  background-color var(--dur) var(--ease-out),
                  box-shadow var(--dur) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }
    .distbtn:not(:disabled):active, .bkcta:active, .wsprintbtn:active,
    .ppbtn:active, .gpaybtn:active, .dangerbtn:active { transform: scale(.972); }
    .modbtn:active, .setitem:active, .fchip:active, .ob-opt:active, .wstask:active,
    .addcube:active, .bkghost:active, .backbtn:active, .obback:active,
    .wsreset:active, .bankfile:active, .moodbtn:active, .settbtn:active { transform: scale(.965); }
    .fab:active, .calmfab:active { transform: scale(.92); }
    .depbtn:active { transform: scale(.88); }
    /* a hover lift and a press must compose, not fight */
    .modbtn:hover:active { transform: translateY(-2px) scale(.965); }

    /* ---- 4. Materials: chrome as translucent layers -----------------
       Scrims blur and push the background back rather than just dimming
       it, which is what makes a sheet read as a layer above the app. */
    .ccwrap, .chatwrap, .depwrap, .paywrap {
      background: rgba(6, 8, 18, .46);
      -webkit-backdrop-filter: var(--glass-sm);
      backdrop-filter: var(--glass-sm);
      animation: scrimIn var(--dur) var(--ease-out);
    }
    @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }

    .ccsheet, .chat {
      background: linear-gradient(180deg, rgba(30,38,60,.94), rgba(19,25,40,.97));
      -webkit-backdrop-filter: var(--glass-lg);
      backdrop-filter: var(--glass-lg);
      box-shadow: 0 -24px 60px -20px rgba(0,0,0,.65), var(--edge);
      border-top: 1px solid rgba(255,255,255,.08);
      /* Materialize: the surface arrives with scale, not a bare slide. */
      animation: sheetIn var(--dur-sheet) var(--spring);
    }
    @keyframes sheetIn {
      from { transform: translateY(100%) scale(.98); opacity: .4; }
      to   { transform: none; scale: 1; opacity: 1; }
    }
    .handle { background: rgba(255,255,255,.22); width: 44px; height: 5px; }

    /* ---- 5. Surfaces: weight and a lit top edge ---------------------- */
    .cube {
      background:
        linear-gradient(168deg, rgba(38,47,74,.92), rgba(21,27,41,.96) 58%);
      box-shadow: 0 22px 44px -30px rgba(0,0,0,.95), var(--edge);
      transition: transform var(--dur) var(--spring),
                  box-shadow var(--dur) var(--ease-out),
                  border-color var(--dur) var(--ease-out);
    }
    .cube:hover { border-color: rgba(143,154,255,.34);
      box-shadow: 0 26px 52px -28px rgba(0,0,0,.95), var(--edge); }
    .cube:active { transform: scale(.995); }
    /* the pop follows a deposit — a gesture with momentum, so it may overshoot */
    .cube.pop { animation: pop .52s var(--spring-bounce); }

    .hero { box-shadow: 0 30px 68px -34px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.13); }
    .hero::after { content: ""; position: absolute; inset-inline: 18%; top: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.34), transparent); }
    .setcard, .wscard, .bkbuy, .gshead, .bkhero, .wstrack, .ledger, .witable {
      box-shadow: 0 16px 36px -30px rgba(0,0,0,.9), var(--edge); }

    .modbtn { background: linear-gradient(170deg, rgba(32,40,63,.85), rgba(21,27,41,.9)); }
    .modbtn:hover { border-color: rgba(143,154,255,.5); }

    .fab, .calmfab { box-shadow: 0 16px 34px -8px rgba(100,114,255,.55), var(--edge); }
    .fab:hover, .calmfab:hover { filter: brightness(1.08); }

    /* ---- 6. Focus: a visible, consistent ring ------------------------ */
    :focus-visible { outline: 2px solid var(--primary-2); outline-offset: 3px; border-radius: 8px; }
    .fld:focus-within { box-shadow: 0 0 0 4px rgba(100,114,255,.16); }

    /* ---- 7. Light theme: the same ideas, inverted -------------------- */
    @media (prefers-color-scheme: light) {
      :root { --edge: inset 0 1px 0 rgba(255,255,255,.9); }
      .screen {
        background:
          radial-gradient(760px 420px at 10% -8%, rgba(100,114,255,.13), transparent 62%),
          radial-gradient(640px 460px at 110% 10%, rgba(16,192,136,.08), transparent 58%),
          radial-gradient(560px 340px at 50% 112%, rgba(143,154,255,.10), transparent 64%),
          var(--bg);
      }
      .ccwrap, .chatwrap, .depwrap, .paywrap { background: rgba(28, 32, 54, .30); }
      .ccsheet, .chat {
        background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(248,249,255,.98));
        border-top: 1px solid rgba(255,255,255,.9);
        box-shadow: 0 -24px 60px -24px rgba(60,64,100,.35), var(--edge); }
      .handle { background: rgba(20,24,48,.18); }
      .cube {
        background: linear-gradient(168deg, #fbfbff, #ffffff 60%);
        box-shadow: 0 12px 28px -22px rgba(70,74,110,.55), var(--edge); }
      .cube:hover { border-color: rgba(100,114,255,.42);
        box-shadow: 0 18px 34px -20px rgba(70,74,110,.5), var(--edge); }
      .hero::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); }
      .setcard, .wscard, .bkbuy, .gshead, .wstrack, .ledger, .witable {
        box-shadow: 0 10px 26px -22px rgba(70,74,110,.45), var(--edge); }
      .modbtn { background: linear-gradient(170deg, #ffffff, #f6f7fd); }
      .fab, .calmfab { box-shadow: 0 16px 32px -10px rgba(100,114,255,.45), var(--edge); }
    }

    /* ---- 8. Accessibility preferences -------------------------------
       Reduced motion is not "no feedback" — it is a gentler, non-vestibular
       equivalent. Travel and overshoot go; opacity and colour stay, so the
       interface still confirms what happened. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .view { scroll-behavior: auto; }
      /* keep press feedback — it is instant and carries no travel */
      .distbtn, .modbtn, .fab, .calmfab, .setitem, .bkcta, .wsprintbtn, .ppbtn,
      .backbtn, .fchip, .ob-opt, .wstask, .addcube, .depbtn {
        transition: filter var(--dur-press) linear, background-color var(--dur-press) linear,
                    border-color var(--dur-press) linear !important; }
      .distbtn:active, .modbtn:active, .fab:active, .calmfab:active, .setitem:active,
      .bkcta:active, .fchip:active, .ob-opt:active, .wstask:active, .addcube:active,
      .depbtn:active { transform: none !important; filter: brightness(1.18); }
      .ccsheet, .chat { animation: fadeInStill 160ms linear !important; }
      @keyframes fadeInStill { from { opacity: 0; } to { opacity: 1; } }
      .cube.pop { animation: none !important; }
    }
    /* Frosted surfaces become solid rather than merely less blurred. */
    @media (prefers-reduced-transparency: reduce) {
      .ccwrap, .chatwrap, .depwrap, .paywrap {
        background: rgba(4, 6, 14, .82);
        -webkit-backdrop-filter: none; backdrop-filter: none; }
      .ccsheet, .chat {
        background: var(--elevated);
        -webkit-backdrop-filter: none; backdrop-filter: none; }
      .screen { background: var(--bg); }
    }
    /* High contrast: near-solid grounds with defined borders. */
    @media (prefers-contrast: more) {
      .screen { background: var(--bg); }
      .cube, .setcard, .wscard, .modbtn, .bkbuy { border-color: var(--primary-2); }
      .setlbl, .privline, .cube .nt, .bkline { color: var(--text); }
      :focus-visible { outline-width: 3px; }
    }

    /* ==================================================================
       REFINEMENT PASS — hierarchy and craft.
       Still presentation-only. The dashboard's job is to answer "how much
       do I have" in one glance and "where do I go" in the second; this
       pass makes those two things read at different weights instead of
       competing as equals.
       ================================================================== */

    /* ---- Navigation as an icon grid ---------------------------------
       Each destination gets a tinted plate and a drawn icon, so the row is
       scannable by colour before it is read. The plate carries the tint;
       the tile stays neutral, or nine coloured cards fight the cubes below. */
    .modnav { gap: 9px; margin-top: 18px; }
    .modbtn {
      gap: 8px; padding: 13px 6px 11px; border-radius: 18px;
      background: linear-gradient(170deg, rgba(34,42,66,.9), rgba(20,26,40,.94));
    }
    .modbtn .mi {
      position: relative; width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center; font-size: 0; /* kills any stray glyph metrics */
      background: color-mix(in srgb, var(--tint) 16%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 26%, transparent);
      transition: transform var(--dur) var(--spring), box-shadow var(--dur) var(--ease-out);
    }
    .modbtn .navsvg { width: 22px; height: 22px; color: var(--tint); display: block; }
    .modbtn .ml { font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .01em; }
    .modbtn:hover { border-color: color-mix(in srgb, var(--tint) 55%, transparent); transform: translateY(-3px); }
    .modbtn:hover .mi { transform: scale(1.06);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 46%, transparent),
                  0 10px 22px -12px var(--tint); }
    .modbtn:hover .ml { color: var(--text); }
    .modbtn .lockb { position: absolute; top: -5px; inset-inline-start: -5px;
      width: 19px; height: 19px; border-radius: 50%; font-size: 10px;
      display: grid; place-items: center; background: linear-gradient(140deg,#ffd86b,#f0a500);
      box-shadow: 0 2px 6px -1px rgba(0,0,0,.55); }

    /* ---- Hero: the balance is the centrepiece ------------------------
       It was the same weight as everything else on the card. Now the number
       carries a soft pool of its own light and the label steps back. */
    .hero { padding: 24px 22px 22px; }
    .hero .hl { font-size: 12.5px; font-weight: 700; color: var(--dim); text-transform: none;
      letter-spacing: .04em; opacity: .9; }
    .hero .hv { font-size: 46px; letter-spacing: -.035em; line-height: 1.02; margin-top: 6px;
      text-shadow: 0 0 46px rgba(143,154,255,.28); }
    .poolbox { margin-top: 20px; gap: 9px; }
    .poolbox .field { border-radius: 14px; padding: 12px 14px;
      background: rgba(9,12,22,.55); border-color: rgba(255,255,255,.09); }
    .poolbox .field:focus-within { border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(100,114,255,.15); }
    .hero .distbtn { border-radius: 14px; }

    /* ---- Cube card: rhythm, plate, and a track worth looking at ------ */
    .cube { padding: 17px 17px 16px; }
    .cube .chip { width: 46px; height: 46px; border-radius: 14px; font-size: 22px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), 0 8px 18px -12px currentColor; }
    .cube .nm { font-size: 15.5px; }
    .cube .pct { font-size: 12.5px; padding: 4px 9px; letter-spacing: -.01em; }
    .cube .brow { margin-top: 15px; }
    .cube .track { height: 9px; margin-top: 15px; background: rgba(0,0,0,.34);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.45); }
    .cube .track > i { position: relative; overflow: hidden;
      transition: width .9s var(--spring); }
    /* a single specular sweep along the fill — depth without a moving background */
    .cube .track > i::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.34), rgba(255,255,255,0) 55%);
      border-radius: inherit; }

    /* ---- Section headers: quieter, better anchored -------------------- */
    .section-t { font-size: 13.5px; letter-spacing: .02em; color: var(--dim);
      text-transform: none; margin: 24px 2px 12px; }
    .section-t::before { width: 3px; height: 13px; opacity: .85; }

    /* ---- Toast: a floating glass pill --------------------------------- */
    .toast {
      background: rgba(22,28,46,.82);
      -webkit-backdrop-filter: var(--glass-sm); backdrop-filter: var(--glass-sm);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 44px -18px rgba(0,0,0,.75), var(--edge);
      border-radius: 999px; padding: 11px 18px; font-size: 13.5px; font-weight: 700;
      transition: opacity var(--dur) var(--ease-out), transform var(--dur-sheet) var(--spring);
    }

    /* ---- Light theme --------------------------------------------------- */
    @media (prefers-color-scheme: light) {
      .modbtn { background: linear-gradient(170deg, #ffffff, #f7f8fd); }
      .modbtn .mi { background: color-mix(in srgb, var(--tint) 13%, #fff);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 24%, transparent); }
      .modbtn .ml { color: #5b6079; }
      .poolbox .field { background: #fff; border-color: #e2e5f2; }
      .hero .hv { text-shadow: 0 0 40px rgba(100,114,255,.18); }
      .cube .track { background: #e9ebf5; box-shadow: inset 0 1px 2px rgba(90,95,130,.18); }
      .cube .track > i::after { background: linear-gradient(90deg, rgba(255,255,255,.5), rgba(255,255,255,0) 55%); }
      .toast { background: rgba(255,255,255,.88); border-color: rgba(120,126,170,.22);
        box-shadow: 0 18px 40px -18px rgba(80,86,130,.4); }
    }

    /* color-mix is recent; without it the plates simply fall back to neutral
       rather than disappearing. */
    @supports not (background: color-mix(in srgb, red 10%, transparent)) {
      .modbtn .mi { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      .modbtn:hover { transform: none; }
      .modbtn:hover .mi { transform: none; }
      .cube .track > i { transition: none; }
    }

    /* ---- Book purchase: binding terms acknowledgement ------------------
       Sits between the clauses and the button: read, tick, then buy. */
    .bkterms { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .bkcheck {
      display: flex; align-items: flex-start; gap: 11px; margin-top: 14px;
      padding: 12px 13px; border-radius: var(--radius);
      background: var(--card-2); border: 1.5px solid var(--border);
      cursor: pointer; user-select: none;
      transition: border-color var(--dur) var(--ease-out), background-color var(--dur) var(--ease-out);
    }
    .bkcheck:hover { border-color: var(--primary-dim); }
    .bkcheck input { position: absolute; opacity: 0; width: 0; height: 0; }
    .bkbox {
      flex: none; width: 22px; height: 22px; border-radius: 7px; margin-top: 1px;
      border: 2px solid var(--dim); background: transparent;
      display: grid; place-items: center;
      transition: background-color var(--dur-press) var(--ease-out),
                  border-color var(--dur-press) var(--ease-out),
                  transform var(--dur-press) var(--ease-out);
    }
    .bkbox::after {
      content: ""; width: 10px; height: 6px; margin-top: -2px;
      /* physical sides on purpose: a tick is a glyph shape, not a direction —
         border-inline-start flips under RTL and turns the check into a chevron */
      border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) scale(.4); opacity: 0;
      transition: opacity var(--dur-press) var(--ease-out), transform var(--dur-press) var(--spring-bounce);
    }
    .bkcheck input:checked ~ .bkbox { background: var(--success); border-color: var(--success); }
    .bkcheck input:checked ~ .bkbox::after { opacity: 1; transform: rotate(-45deg) scale(1); }
    .bkcheck:active .bkbox { transform: scale(.9); }
    .bkcheck input:focus-visible ~ .bkbox { outline: 2px solid var(--primary-2); outline-offset: 3px; }
    .bkchecktxt { font-size: 13.5px; font-weight: 700; line-height: 1.5; }
    .bkcheck input:checked ~ .bkchecktxt { color: var(--text); }

    /* Unanswered: a red border plus one shake, so the objection is impossible
       to miss without being loud about it. */
    .bkcheck.bad { border-color: var(--danger); background: rgba(240,85,90,.07); }
    .bkcheck.bad .bkbox { border-color: var(--danger); }
    .bkcheck.shake { animation: bkShake .42s cubic-bezier(.36,.07,.19,.97); }
    @keyframes bkShake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }
    .bkerr { color: var(--danger); font-size: 13px; font-weight: 800; line-height: 1.5;
      min-height: 0; margin: 0 2px; }
    .bkerr:not(:empty) { min-height: 20px; margin: 9px 2px 0; }
    .bkagree.owned { display: flex; align-items: center; gap: 7px; margin: 14px 0 0;
      color: var(--success); font-size: 13px; font-weight: 800; }

    @media (prefers-color-scheme: light) {
      .bkcheck { background: #f7f8fd; border-color: #e2e5f2; }
      .bkcheck.bad { background: rgba(240,85,90,.06); border-color: var(--danger); }
      .bkbox { border-color: #9aa0bd; }
    }
    /* Reduced motion: keep the red border and the message, drop the shake —
       the objection still lands, without the vestibular jolt. */
    @media (prefers-reduced-motion: reduce) {
      .bkcheck.shake { animation: none !important; }
      .bkbox, .bkbox::after { transition: none !important; }
    }

  <script>
    "use strict";
    // ---- helpers ----------------------------------------------------------

    const $ = (id) => document.getElementById(id);

    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

    // ---- cube model -------------------------------------------------------

    // into wealth-building cubes. Living independently adds a Housing cube.
    const META = {
      housing:     { name: "דיור וחשבונות", emoji: "🏠", color: "var(--c-housing)",     note: "הוצאה חודשית קבועה" },
      landlord:    { name: "בעל הדירה (שכירות)", emoji: "🔑", color: "#6C5CE7",          note: "שכר דירה חודשי (נעול)" },
      bills:       { name: "חשבונות הבית", emoji: "⚡", color: "#00CEC9",               note: "ארנונה, ועד, חשמל ומים" },
      essentials:  { name: "שוטף",           emoji: "🛒", color: "var(--c-essentials)",  note: "אוכל, תחבורה, חשבונות" },
      emergency:   { name: "קרן חירום",      emoji: "🛟", color: "#00B894",              note: "רשת הביטחון — נוגעים בה רק במקרה חירום" },
      savings:     { name: "חיסכון",         emoji: "💰", color: "var(--c-savings)",     note: "כרית ביטחון ויעדים" },
      investments: { name: "השקעות",         emoji: "📈", color: "var(--c-investments)", note: "בניית הון לטווח ארוך" },
      lifestyle:   { name: "בילויים ופנאי",  emoji: "🎉", color: "var(--c-lifestyle)",   note: "כיף, מסעדות, חברים" },
    };

    const DICT = {};  // HE -> EN
    // Hebrew -> English. Generated from a walk of every screen plus the
    // stems the app splices numbers into. See docs/LOCALIZATION.md.
    Object.assign(DICT, {
      "📖 קרא עכשיו": "📖 Read now",
      "✅ הספר בספרייה שלך — נפתח באתר הקריאה": "✅ The book is in your library — it opens on the reading site",
      "✅ אישרת את התקנון בעת הרכישה": "✅ You accepted the terms at purchase",
      "✅ גישת בדיקה — הספר פתוח לקריאה": "✅ Review access — the book is open to read",
      "בעשרה שלבים בסגנון משחק הוא מפרק את הכסף לארבעה ארנקים — מטרה קרובה, קופת חירום, עתיד, וכיף בלי רגשות אשם — ומראה איך נותנים לכל שקל תפקיד, לפני שהוא בוחר לעצמו תפקיד ונעלם. בדרך: חוק 48 השעות שעוצר קניות אימפולסיביות, ההבדל בין „רוצה” ל„צריך” כשהמוח מתחפש, אפקט כדור השלג של ריבית דריבית (עם אזהרה כנה שהשקעות אינן מכונת כסף), המלכודות של תשלום דיגיטלי, ואיך אומרים „לא” ללחץ חברתי בלי לריב.": "In ten game-style steps it breaks the money into four wallets — a near-term goal, an emergency fund, the future, and guilt-free fun — and shows how to give every shekel a job, before it picks one for itself and disappears. Along the way: the 48-hour rule that stops impulse buys, the difference between „want” and „need” when your brain is in disguise, the snowball effect of compound interest (with an honest warning that investing is not a money machine), the traps of digital payment, and how to say „no” to peer pressure without a fight.",
      "תשעה סיפורי מקרה מהחיים — דניאל שתכנן 2,000 ₪ לחופשה והוציא הרבה יותר, מאיה שהטלפון שלה נשבר ביום רגיל, יובל שהבין ש„הנחה של 30%” היא עדיין 450 ₪ שיוצאים מהכיס — לצד ארבעה צ׳ק-ליסטים, אתגר של 30 יום ודף סיכום אחד לצילום מסך.": "Nine real-life case studies — Daniel who budgeted ₪2,000 for a holiday and spent far more, Maya whose phone broke on an ordinary day, Yuval who realised that „30% off” is still ₪450 leaving his pocket — alongside four checklists, a 30-day challenge and a one-page summary to screenshot.",
      "המידע והכלים באפליקציה נועדו למטרות מידע והדרכה בלבד ואינם מהווים ייעוץ פיננסי, ייעוץ השקעות, ייעוץ מס או ייעוץ משפטי. כל הנתונים מדומים או מוזנים ידנית — אין חיבור אמיתי לבנק או לחשבון.": "The information and tools in the app are for information and guidance purposes only and do not constitute financial, investment, tax or legal advice. All data is simulated or entered manually — there is no real connection to a bank or an account.",
      "האפליקציה מיועדת למשתמשים מגיל 13 ומעלה. ילדים מתחת לגיל 13 מוזמנים להשתמש במצב הילדים — בליווי, בהסכמה ובאחריות הורה או אפוטרופוס. נתוני התקציב נשמרים במכשיר. הודעות לצ׳אט ה-AI וההכנסה החודשית הקבועה נשמרות בשרת מאובטח כדי לענות ולשלוח התראות, ונמחקות עם מחיקת החשבון.": "The app is intended for users aged 13 and over. Children under 13 are welcome to use kids mode — accompanied by, with the consent of, and under the responsibility of a parent or guardian. Budget data stays on the device. Messages to the AI chat and the fixed monthly income are kept on a secure server to answer and send notifications, and are deleted with the account.",
      "קיבלת 5,000 ₪. המוח אומר „חופשה”, החברים אומרים „יאללה, יוצאים”, האינטרנט אומר „מבצע אחרון” — והעתיד לוחש „היי... אולי תשאירו לי משהו?”. הספר הזה עוסק בדיוק ברגע הזה.": "You got ₪5,000. Your brain says „vacation”, your friends say „let's go out”, the internet says „last chance sale” — and your future whispers „hey... maybe leave me something?”. This book is about exactly that moment.",
      "לפני שאתם מוציאים את הכסף, תחליטו מה אתם רוצים שהכסף יעשה. כי ברגע שהכסף מקבל תפקיד, אתם מפסיקים להיות שחקן שמגיב למה שקורה — ומתחילים להיות השחקן שמנהל את המשחק.": "Before you spend the money, decide what you want the money to do. Because the moment money gets a job, you stop being the player who reacts to what happens — and start being the player who runs the game.",
      "כדי שאוכל לעזור באמת, תן לי את המספרים: \"כדאי לי לקנות X ב-800?\", \"X ב-500 או Y ב-900?\", \"מתי אגיע ליעד?\" — או פשוט תגיד לי מה עובר לך בראש ואני אשאל את השאלות.": "To really help, give me the numbers: \"Should I buy X for 800?\", \"X for 500 or Y for 900?\", \"When will I reach my goal?\" — or just tell me what's on your mind and I'll ask the questions.",
      "אפשר להתייעץ איתי בחופשיות — למשל \"כדאי לי אוזניות ב-600 או שעון ב-900?\", \"מה מצב קרן החירום?\", \"בזבזתי 200 על מסעדה\", או \"תכניס 100 ₪ לחיסכון\".": "Ask me anything — for example \"headphones for 600 or a watch for 900?\", \"how is my emergency fund?\", \"I spent 200 at a restaurant\", or \"put ₪100 into savings\".",
      "הספר מספק ידע, זוויות ראייה וכלים מעשיים על עולם הכסף שרוב האנשים לא מספרים עליהם — אך האחריות על כל החלטה פיננסית היא של הקורא/ת והוריו בלבד.": "The book provides knowledge, perspectives and practical tools about the world of money that most people don't talk about — but responsibility for every financial decision rests with the reader and their parents alone.",
      "התרגיל הזה עוזר לרגע קשה — הוא לא תחליף לאדם אמיתי. אם קשה לך באמת, או שהמחשבות מפחידות אותך, מותר ואפשר לדבר עכשיו עם מישהו:": "This exercise helps with a hard moment — it is not a substitute for a real person. If things are genuinely hard, or your thoughts frighten you, you can and may talk to someone right now:",
      "האפליקציה לא מציגה ולא שומרת רישום פנימי של פעולות התחברות — רישום כזה עלול לחשוף את כתובת המייל שלך למי שמחזיק במכשיר.": "The app does not display or store an internal log of sign-in activity — such a log could expose your email address to whoever holds the device.",
      "מודל ה-⁦40/30/20/10⁩ מהספר, כמספרים שלכם. אפשר לשנות אחוזים, לסמן משימות ולמלא מעקב שבועי — ואז להוריד את הכול כ-PDF.": "The ⁦40/30/20/10⁩ model from the book, with your numbers. You can change the percentages, tick off tasks and fill in a weekly tracker — then download it all as a PDF.",
      "הזינו את החובות שלכם והסכום החודשי הפנוי — ה-AI יחשב את סדר ההחזר האופטימלי (שיטת מפולת/כדור שלג) וכמה ריבית תחסכו.": "Enter your debts and the monthly amount you have free — the AI will work out the optimal repayment order (avalanche/snowball method) and how much interest you'll save.",
      "המידע, ההדרכה והתכנים בספר מיועדים למטרות לימודיות והעשרה בלבד, ואינם מהווים ייעוץ פיננסי, משפטי או השקעתי מוסמך.": "The information, guidance and content in the book are intended for educational and enrichment purposes only, and do not constitute qualified financial, legal or investment advice.",
      "היי! אני Cubey, היועץ הפיננסי שלך. אני רואה את הקוביות, את ההכנסה ואת קרן החירום — אז אפשר להתייעץ איתי באמת:": "Hi! I'm Cubey, your financial adviser. I can see your cubes, your income and your emergency fund — so you can genuinely ask me things:",
      "כל הזכויות על האפליקציה, העיצוב, הקוד והתוכן שמורות לאיתי לייס. אין להעתיק, להפיץ או להשתמש בתוכן ללא אישור.": "All rights to the app, its design, code and content belong to Itay Leiss. Do not copy, distribute or use the content without permission.",
      "האפליקציה לא מתחברת לבנק, לא מושכת תנועות ולא קוראת קבצים מהמכשיר. פיצ׳ר קריאת העו״ש הוסר מהמערכת לגמרי.": "The app does not connect to a bank, does not pull transactions and does not read files from the device. The bank-statement feature has been removed from the system entirely.",
      "כל ערב לפתוח את האפליקציה של אמצעי התשלום ורק להסתכל על המספר. בלי לחשב, בלי להתבייש — רק לראות.": "Every evening open your payment app and just look at the number. No calculating, no shame — just look.",
      "בפעם הראשונה שתפתח/י את האפליקציה בחודש חדש, ההכנסה נכנסת לקוביות לפי האחוזים — בלי ללחוץ כלום": "The first time you open the app in a new month, your income flows into the cubes by percentage — without pressing anything",
      "המטרה היא לא להפוך אתכם לאנשים שלא קונים כלום. המטרה היא שתדעו בדיוק לאן הולכים ה-1,000 הבאים.": "The goal is not to turn you into someone who buys nothing. The goal is that you know exactly where the next ₪1,000 goes.",
      "בחרו קובייה, הוסיפו סכום חודשי — ותראו בדיוק כמה יהיה לכם בעוד כמה חודשים, מול המסלול הנוכחי.": "Pick a cube, add a monthly amount — and see exactly how much you'll have in a few months, against your current path.",
      "מאיפה מתחילים? 7 כלים קצרים שכל צעיר צריך לפני הדירה, העבודה והחשבונות הראשונים. בחרו נושא 👇": "Where do you start? 7 short tools every young person needs before their first flat, job and bills. Pick a topic 👇",
      "משהו לא חיוני שבא לכם? מחכים יומיים בלי לפתוח שוב את העמוד. הרצון האמיתי שורד, השאר מתאדה.": "Want something non-essential? Wait two days without opening the page again. Real desire survives, the rest evaporates.",

    // ====================================================================
    // Language (Hebrew <-> English) with direction switching.
    //
    // Every screen in this app is built by DOM calls that write Hebrew
    // directly -- there are ~1,300 such literals. Rewriting each call site
    // into t("key") would touch nearly every function in the file and risk
    // breaking working screens for a purely presentational feature, so the
    // translation is applied one layer later instead: after the DOM is built,
    // a pass walks it and swaps Hebrew text for English using DICT below.
    //
    // Consequences worth knowing:
    //   * A string with no DICT entry stays Hebrew rather than breaking.
    //   * Sentences assembled at runtime around a number are matched by the
    //     phrase pass, which substitutes the longest known fragments and
    //     leaves the digits alone.
    // ====================================================================
    const LANG_KEY = "cubefinance_web:lang";
    const HEB_RE = /[֐-׿]/;

    function readLang() {
      try { return localStorage.getItem(LANG_KEY) === "en" ? "en" : "he"; } catch (e) { return "he"; }
    }
    let LANG = readLang();
    const isEn = () => LANG === "en";

    // Direction is a property of the language, so it moves with it. The whole
    // document flips: CSS logical properties follow automatically, and the few
    // deliberately-physical rules are mirrored in the stylesheet.
    function applyLangDir() {
      const h = document.documentElement;
      h.setAttribute("lang", isEn() ? "en" : "he");
      h.setAttribute("dir", isEn() ? "ltr" : "rtl");
      h.classList.toggle("lang-en", isEn());
    }

    // --- the lookup -----------------------------------------------------
    // Built lazily: DICT is authored Hebrew->English, and PHRASES is the same
    // set sorted longest-first so substitution never eats a shorter prefix of
    // a longer phrase.
    let PHRASES = null;
    function phraseList() {
      if (!PHRASES) PHRASES = Object.keys(DICT).sort((a, b) => b.length - a.length);
      return PHRASES;
    }

    function translateText(raw) {
      const t = raw.trim();
      if (!t || !HEB_RE.test(t)) return null;          // nothing Hebrew to do
      if (Object.prototype.hasOwnProperty.call(DICT, t)) {
        // preserve the node's original padding
        const lead = raw.slice(0, raw.length - raw.trimStart().length);
        const tail = raw.slice(raw.trimEnd().length);
        return lead + DICT[t] + tail;
      }
      // Composite string -- usually a number or a name spliced into a sentence.
      // Substitute known fragments longest-first, under two rules learned the
      // hard way:
      //
      //  1. A fragment must not sit inside a longer Hebrew word. Hebrew glues
      //     prefixes on ("ה", "ב", "ו"), so a plain indexOf turned
      //     "המספרים" (the numbers) into "המBooks" by matching "ספרים".
      //     Both neighbours therefore have to be non-letters.
      //  2. All or nothing. If Hebrew survives the pass the sentence is only
      //     half-translated, which reads worse than leaving it alone -- so the
      //     original is returned untouched and the caller shows Hebrew.
      let out = raw;
      const list = phraseList();
      for (let i = 0; i < list.length; i++) {
        const k = list[i];
        if (k.length < 2) continue;
        out = replaceStandalone(out, k, DICT[k]);
      }
      if (out === raw || HEB_RE.test(out)) return null;
      // A sentence that began with a Hebrew word now begins with whichever
      // fragment replaced it, which may be mid-sentence wording like "of".
      // Restore the capital so the line still reads as a sentence.
      if (HEB_RE.test(raw.trimStart()[0] || "")) {
        out = out.replace(/^(\s*)([a-z])/, (m, sp, ch) => sp + ch.toUpperCase());
      }
      return out;
    }

    // Replace every occurrence of `needle` that is not glued to a Hebrew letter
    // on either side.
    function replaceStandalone(hay, needle, rep) {
      let out = "", from = 0;
      for (;;) {
        const at = hay.indexOf(needle, from);
        if (at === -1) { out += hay.slice(from); return out; }
        const before = at > 0 ? hay[at - 1] : "";
        const after = hay[at + needle.length] || "";
        const glued = (before && HEB_RE.test(before)) || (after && HEB_RE.test(after));
        out += hay.slice(from, at) + (glued ? needle : rep);
        from = at + needle.length;
      }
    }

    // Attributes that hold user-visible prose.
    const TR_ATTRS = ["placeholder", "aria-label", "title", "alt"];

    function translateTree(root) {
      if (!isEn() || !root) return;
      const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      const jobs = [];
      let n;
      while ((n = walk.nextNode())) {
        const parent = n.parentNode;
        if (parent && (parent.nodeName === "SCRIPT" || parent.nodeName === "STYLE")) continue;
        const next = translateText(n.nodeValue);
        if (next !== null && next !== n.nodeValue) jobs.push([n, next]);
      }
      jobs.forEach((j) => { j[0].nodeValue = j[1]; });

      const els = root.querySelectorAll ? root.querySelectorAll("*") : [];
      for (let i = 0; i < els.length; i++) {
        const e = els[i];
        for (let a = 0; a < TR_ATTRS.length; a++) {
          const v = e.getAttribute && e.getAttribute(TR_ATTRS[a]);
          if (!v) continue;
          const nv = translateText(v);
          if (nv !== null && nv !== v) e.setAttribute(TR_ATTRS[a], nv);
        }
        // <input type=button|submit> shows its value
        if (e.nodeName === "INPUT" && /^(button|submit)$/i.test(e.type || "")) {
          const nv = translateText(e.value || "");
          if (nv !== null && nv !== e.value) e.value = nv;
        }
      }
    }

    // Anything the app injects later -- toasts, sheets, chat bubbles, the
    // coin burst -- goes through the same pass without its call site knowing.
    // Translating produces further mutations, but those carry no Hebrew, so
    // the second pass is a no-op and the loop settles immediately.
    let trObserver = null;
    function startTranslateObserver() {
      if (trObserver || typeof MutationObserver === "undefined") return;
      trObserver = new MutationObserver((muts) => {
        if (!isEn()) return;
        trObserver.disconnect();
        try {
          muts.forEach((m) => {
            if (m.type === "characterData") {
              const nv = translateText(m.target.nodeValue);
              if (nv !== null) m.target.nodeValue = nv;
            } else {
              m.addedNodes.forEach((node) => {
                if (node.nodeType === 3) {
                  const nv = translateText(node.nodeValue);
                  if (nv !== null) node.nodeValue = nv;
                } else if (node.nodeType === 1) {
                  translateTree(node);
                }
              });
            }
          });
        } finally {
          trObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
        }
      });
      trObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
    }

    function setLang(l) {
      const next = l === "en" ? "en" : "he";
      if (next === LANG) return;
      try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
      // Switching back to Hebrew has no inverse map -- the original strings
      // were overwritten in place -- so reload to rebuild the DOM from source.
      location.reload();
    }

    // A two-way segmented control. Each label is written in its own language,
    // so someone who cannot read the current one can still find their way out.
    function langSwitchHTML() {
      return '<div class="langsw" role="group" aria-label="Language / שפה">' +
        '<button type="button" data-lang="he"' + (isEn() ? "" : ' class="on" aria-current="true"') + '>עברית</button>' +
        '<button type="button" data-lang="en"' + (isEn() ? ' class="on" aria-current="true"' : "") + '>English</button>' +
      '</div>';
    }
    function bindLangSwitch(root) {
      if (!root) return;
      root.querySelectorAll(".langsw button[data-lang]").forEach((b) => {
        b.onclick = () => setLang(b.getAttribute("data-lang"));
      });
    }


    const state = {
      pool: 0,              // money to distribute (bank balance or income)
      cubes: [],            // generated from the profile
      justFunded: new Set(),
      profile: null,        // { age, hasBank, balance, works, income, withParents, rent, arnona, utilities, committee }
      // auth gate
      screen: "auth",       // 'auth' | 'onboarding' | 'app'
      authUser: null,       // { id, email }
      authMode: "login",    // 'login' | 'signup'
      authError: "",
      onboarded: false,
      incognito: false, // privacy: blur sensitive figures on the dashboard
      premium: false,   // isPremiumUser — set ONLY by verifyGooglePlayPurchase
      // engagement modules
      game: { points: 0, claimed: {}, flags: {} }, // challenges + badges
      shared: [],                                   // shared cubes with friends
      debts: [],                                    // debt optimizer entries
      calmLog: [],                                  // "one small step" notes from the calm flow
      // budgeting core
      salary: { auto: true, lastApplied: "", history: [] }, // fixed monthly income → buckets
      expenses: [],                                 // expense journal (what left, and why)
      books: { owned: {} },                         // guide-book library (id -> purchase record)
      worksheet: null,                              // free 40/30/20/10 worksheet (see WS_DEFAULT)
      chat: null,                                   // the Cubey conversation: { cid, messages:[{id,role,text,status,at}] }
      notif: null,                                  // server-push settings (see NOTIF_DEFAULT)

    // AI cube generation (verified logic): independent -> locked Housing +
    // Essentials/Savings/Investments/Lifestyle; with parents -> no Housing, the
    // freed rent share boosts Savings/Investments/Lifestyle.
    function generateCubes(p) {
      const income = p.works ? (Number(p.income) || 0) : 0;
      const rnd = (n) => Math.round(n * 10) / 10;
      const mk = (key, pct, amount, locked, noteOverride, mandatory) => ({
        key, name: META[key].name, emoji: META[key].emoji, color: META[key].color,
        note: noteOverride || META[key].note,
        pct, amount: Math.round(amount), locked: !!locked, balance: 0, mandatory: !!mandatory,
      });
      // The pot the buckets are sized against. With a salary it's the salary;
      // without one — a prepaid-card user, someone between jobs — it's the money
      // actually on hand, so the AI can still break a real amount into buckets
      // instead of handing back a row of zeros.
      const potBase = income > 0 ? income : (Number(p.balance) || 0);
      const cubes = [];
      if (p.withParents) {
        // parents: no housing cubes at all — wealth cubes get the boost.
        // The emergency fund is carved out first: it is mandatory for everyone.
        const W = { essentials: 0.23, emergency: 0.12, savings: 0.25, investments: 0.23, lifestyle: 0.17 };
        ["essentials", "emergency", "savings", "investments", "lifestyle"].forEach((k) =>
          cubes.push(mk(k, rnd(W[k] * 100), W[k] * potBase, false, null, k === "emergency")));
        return cubes;
      }
      // lives alone / with roommates
      const e = p.exp || {};
      const rent = p.ownership === "rent" ? (Number(e.rent) || 0) : 0; // owned => NO rent cube
      const bills = (Number(e.arnona) || 0) + (Number(e.committee) || 0) + (Number(e.electricity) || 0) + (Number(e.water) || 0);
      const food = Number(e.food) || 0;
      const base = potBase || 1;
      const pctOf = (amt) => rnd(Math.min(100, (amt / base) * 100));
      if (rent > 0) cubes.push(mk("landlord", pctOf(rent), rent, true));
      if (bills > 0) cubes.push(mk("bills", pctOf(bills), bills, true,
        "ארנונה " + fmt(Number(e.arnona) || 0) + " · ועד " + fmt(Number(e.committee) || 0) +
        " · חשמל " + fmt(Number(e.electricity) || 0) + " · מים " + fmt(Number(e.water) || 0)));
      if (food > 0) cubes.push(mk("essentials", pctOf(food), food, false, "אוכל וסופר"));
      // Whatever's left after fixed expenses flows to wealth-building cubes —
      // and the mandatory emergency fund is funded off the top of that money.
      const disc = Math.max(0, potBase - rent - bills - food);
      const W = { emergency: 0.15, savings: 0.32, investments: 0.28, lifestyle: 0.25 };
      ["emergency", "savings", "investments", "lifestyle"].forEach((k) =>
        cubes.push(mk(k, pctOf(W[k] * disc), W[k] * disc, false, null, k === "emergency")));
      return cubes;
    }
    // ---- Kids mode --------------------------------------------------------

    const KID_AGE_MAX = 13;
    const isKidMode = () => !!(state.profile && state.profile.kid);
    // Kid cubes: one goal cube to aim at, everyday fun, long-term saving, and
    // giving — the four habits worth learning first.
    function generateKidCubes(p) {
      const m = Math.max(0, Math.round(p.kidMonthly || 0));
      const mk = (key, name, emoji, color, note, pct, extra) => Object.assign({
        key: key, name: name, emoji: emoji, color: color, note: note,
        pct: pct, amount: Math.round(m * pct / 100), locked: false, balance: 0, kid: true,
      }, extra || {});
      const goal = p.goal && p.goal.name && p.goal.price > 0 ? p.goal : null;
      // Kids get the emergency fund too — in kid words: the cube you don't touch,
      // for when something breaks or gets lost. Same habit, age-appropriate name.
      const emg = (pct) => mk("emergency", "קופת חירום", "🛟", "#00B894",
        "לא נוגעים — למקרה שמשהו נשבר או הולך לאיבוד", pct, { mandatory: true });
      const cubes = [];
      if (goal) {
        cubes.push(mk("kidgoal", goal.name, "🎯", "#FD79A8", "היעד שלי · ₪" + fmt(goal.price), 35, { goalTarget: goal.price }));
        cubes.push(mk("kidfun", "כיף וממתקים", "🍬", "var(--c-lifestyle)", "מה שבא לי עכשיו", 22));

        cubes.push(mk("kidsave", "חיסכון גדול", "🐷", "var(--c-savings)", "לדברים גדולים בהמשך", 22));
