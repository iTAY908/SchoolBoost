<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CubeFinance — קיובפייננס</title>
  <style>
    /* ==================================================================
       CubeFinance — self-contained web app (single file, UTF-8, RTL).
       Open directly in any browser. No build step, no dependencies.
       ================================================================== */
    :root {
      --bg: #0b0e18; --bg-deep: #070a12; --elevated: #141a28; --card: #151b29;
      --card-2: #1a2136; --border: #273049; --text: #eceff8; --dim: #949cb6;
      --primary: #6472ff; --primary-2: #8f9aff; --primary-dim: #3b44a8;
      --danger: #f0555a; --warning: #f5b544; --success: #10c088;
      --gold: #f2b134; --gold-2: #ffd873;
      --c-essentials: #10c088; --c-savings: #3b82f6; --c-investments: #e8845e;
      --c-emergency: #f0555a; --c-lifestyle: #f5b544; --c-housing: #6472ff;
      --radius: 16px; --radius-lg: 22px;
      --shadow-card: 0 18px 40px -28px rgba(0,0,0,.9);
      --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      direction: rtl; /* robust RTL even if a host strips the html dir attribute */
      font-family: var(--font); color: var(--text);
      background:
        radial-gradient(1000px 520px at 18% -12%, #182247 0%, transparent 56%),
        radial-gradient(820px 480px at 112% 6%, #0d2540 0%, transparent 52%),
        var(--bg-deep);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .device {
      width: 400px; max-width: 100%; height: 820px; max-height: 92vh;
      background: var(--bg); border-radius: 42px; padding: 12px;
      border: 1px solid #33334a;
      box-shadow: 0 0 0 10px #101018, 0 40px 90px -30px #000, inset 0 0 0 1px #ffffff08;
      position: relative;
    }
    .screen { position: relative; width: 100%; height: 100%; background: var(--bg);
      border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; }
    .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 24px; background: #000; border-radius: 14px; z-index: 60; }
    .view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 44px 18px 24px; }
    .view::-webkit-scrollbar { width: 0; }

    .brand { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 16px; }
    .brand small { color: var(--dim); font-weight: 600; font-size: 12px; }

    .hero { position: relative; background:
        linear-gradient(158deg, #1e274a 0%, #131a2c 62%, #101524 100%);
      border: 1.5px solid #2f3a5c; border-radius: var(--radius-lg); padding: 22px;
      box-shadow: 0 26px 60px -34px #000, inset 0 1px 0 #ffffff14; overflow: hidden; }
    .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(320px 180px at 85% -20%, #6472ff33, transparent 70%); }
    .hero > * { position: relative; }
    .hero .hl { color: var(--dim); font-size: 13px; font-weight: 700; letter-spacing: .2px; }
    .hero .hv { font-size: 40px; font-weight: 900; letter-spacing: -1.5px; margin: 4px 0 0;
      font-variant-numeric: tabular-nums; }
    .hero .hv small { font-size: 20px; font-weight: 800; color: var(--dim); }

    .poolbox { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
    .poolbox .field { flex: 1; background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); display: flex; align-items: center; padding: 0 12px; }
    .poolbox .field span { color: var(--dim); font-weight: 700; font-size: 15px; }
    .poolbox input { flex: 1; background: none; border: none; outline: none; color: var(--text);
      font-size: 18px; font-weight: 800; padding: 12px 6px; font-family: var(--font);
      font-variant-numeric: tabular-nums; text-align: right; width: 100%; }
    .distbtn { border: none; cursor: pointer; font-family: var(--font); white-space: nowrap;
      background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff;
      font-size: 15px; font-weight: 800; padding: 14px 18px; border-radius: 14px;
      letter-spacing: .2px; box-shadow: 0 14px 28px -14px var(--primary), inset 0 1px 0 #ffffff2e;
      transition: transform .1s, filter .15s, box-shadow .15s; }
    .distbtn:hover { filter: brightness(1.07); box-shadow: 0 18px 34px -14px var(--primary), inset 0 1px 0 #ffffff33; }
    .distbtn:active { transform: scale(.97); }
    .distbtn:disabled { opacity: .5; cursor: not-allowed; }

    .parents { margin-top: 16px; background: #1a2733; border: 1px solid #244; border-radius: var(--radius);
      padding: 14px; display: flex; gap: 10px; align-items: flex-start; }
    .parents .pi { font-size: 20px; }
    .parents .pt { color: #bfe3d6; font-size: 13px; line-height: 1.5; }
    .parents .pt b { color: #eafff7; }

    .toggle { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px; margin-top: 16px; }
    .toggle button { flex: 1; border: none; background: none; color: var(--dim); cursor: pointer;
      font-family: var(--font); font-weight: 700; font-size: 13px; padding: 9px; border-radius: 999px; }
    .toggle button.on { background: var(--primary); color: #fff; }

    .section-t { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800;
      margin: 20px 2px 14px; }
    .section-t::before { content: ""; width: 4px; height: 15px; border-radius: 2px;
      background: linear-gradient(var(--primary), #46e0b4); }

    .cube { background: linear-gradient(168deg, var(--card-2), var(--card) 55%); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card);
      transition: transform .18s, box-shadow .2s, border-color .2s; }
    .cube:hover { border-color: #33406099; }
    .cube.pop { animation: pop .5s ease; }
    @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.035)} 100%{transform:scale(1)} }
    .cube .top { display: flex; align-items: center; gap: 12px; }
    .cube .chip { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
      font-size: 21px; flex: none; box-shadow: inset 0 0 0 1px #ffffff12; }
    .cube .nm { font-size: 16px; font-weight: 800; }
    .cube .nt { font-size: 12px; color: var(--dim); margin-top: 1px; }
    .cube .pct { margin-inline-start: auto; font-size: 13px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
    .cube .brow { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
    .cube .bal { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .cube .bal small { font-size: 15px; font-weight: 800; color: var(--dim); }
    .cube .tgt { font-size: 12.5px; color: var(--dim); font-weight: 600; }
    .cube .track { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 14px; }
    .cube .track > i { display: block; height: 100%; border-radius: 999px; width: 0;
      transition: width .8s cubic-bezier(.2,.8,.2,1); }

    /* coins */
    .coins { position: absolute; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
    .coin { position: absolute; top: -40px; font-size: 28px; }

    /* FAB + chat */
    .fab { position: absolute; inset-inline-end: 18px; bottom: 22px; z-index: 30;
      width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(140deg, var(--primary-2), var(--primary)); font-size: 28px;
      display: grid; place-items: center; box-shadow: 0 12px 30px -6px var(--primary); }
    .fab:hover { filter: brightness(1.08); }
    .fab { position: absolute; }
    .fablock { position: absolute; top: -2px; inset-inline-start: -2px; width: 24px; height: 24px;
      border-radius: 50%; background: linear-gradient(140deg,#ffd86b,#f0a500); color: #3a2a00;
      font-size: 12px; display: grid; place-items: center; box-shadow: 0 3px 8px -2px #000a;
      border: 2px solid var(--bg); }
    .chatlocked .chlockbody { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 28px 26px; gap: 6px; }
    .chatlocked .goldlock { font-size: 46px; filter: drop-shadow(0 6px 14px #f0a50055); margin-bottom: 6px; }
    .chatlocked h3 { margin: 4px 0; font-size: 19px; font-weight: 900; }
    .chatlocked p { color: var(--dim); font-size: 13.5px; line-height: 1.65; margin: 0 0 14px; }
    .chatlocked .distbtn { max-width: 320px; }
    .chlockman { color: var(--dim); font-size: 12px; margin-top: 10px; }
    .chatwrap { position: absolute; inset: 0; z-index: 45; display: none; flex-direction: column;
      justify-content: flex-end; background: rgba(0,0,0,.45); }
    .chatwrap.on { display: flex; }
    .chat { height: 84%; background: var(--bg); border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg); display: flex; flex-direction: column;
      overflow: hidden; animation: slideup .3s ease; }
    @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
    .chat .ch { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
    .chat .ch .t { font-size: 17px; font-weight: 800; }
    .chat .ch .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
    .chat .ch .x { margin-inline-start: auto; background: none; border: none; color: var(--dim);
      font-size: 20px; cursor: pointer; }
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msgs::-webkit-scrollbar { width: 0; }
    .intro { text-align: center; padding: 26px 20px; color: var(--dim); }
    .intro .e { font-size: 40px; }
    .intro p { font-size: 14px; line-height: 1.5; margin-top: 8px; }
    .bubble { max-width: 84%; padding: 11px 14px; border-radius: 16px; font-size: 15px;
      line-height: 1.45; white-space: pre-wrap; unicode-bidi: plaintext; }
    .bubble.u { align-self: flex-start; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.b { align-self: flex-end; background: var(--card); border-bottom-left-radius: 4px; }
    .sugg { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
    .sugg button { background: var(--card); border: 1px solid var(--border); border-radius: 999px;
      padding: 9px 13px; color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
      font-family: var(--font); }
    .sugg button:hover { border-color: var(--primary); }
    .inbar { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); flex: none; }
    .sugg.hidden { display: none; }
    .qbtns { display: flex; gap: 8px; flex-wrap: wrap; align-self: flex-end; margin: 2px 0 6px; }
    .qbtns button { border: none; cursor: pointer; font-family: var(--font); font-weight: 800; font-size: 14px;
      padding: 10px 18px; border-radius: 999px; transition: filter .15s; }
    .qbtns .qp { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; }
    .qbtns .qp:hover { filter: brightness(1.08); }
    .qbtns .qd { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
    .qbtns .qd:hover { color: var(--text); }
    .settbtn { background: none; border: 1px solid var(--border); border-radius: 999px; color: var(--dim);
      font-weight: 700; font-size: 12.5px; padding: 7px 12px; cursor: pointer; font-family: var(--font); transition: color .15s, border-color .15s; }
    .settbtn:hover { color: var(--text); border-color: #3c3c52; }
    .dangerbtn { width: 100%; border: 1px solid #5c2626; background: #2a1616; color: #ff8f8f; font-weight: 800;
      font-size: 15px; padding: 14px; border-radius: var(--radius); cursor: pointer; font-family: var(--font); margin-top: 10px; }
    .dangerbtn:hover { background: #3a1c1c; }

    /* full-screen pages: settings + terms */
    .pagehead { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .pagetitle { font-size: 24px; font-weight: 900; letter-spacing: -.5px; margin: 0; flex: 1; text-align: center; }
    .backbtn { background: var(--card); border: 1px solid var(--border); color: var(--dim); border-radius: 999px;
      padding: 8px 14px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: var(--font);
      transition: color .15s, border-color .15s; white-space: nowrap; }
    .backbtn:hover { color: var(--text); border-color: var(--primary); }
    .pgspacer { width: 76px; flex: none; } /* balances the back button so the title stays centered */
    .pagebody { display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }
    .setcard { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
    .setcard.warn h3 { margin: 0 0 8px; font-size: 19px; }
    .setcard.warn p { margin: 0; color: var(--dim); line-height: 1.6; font-size: 14px; }
    .setlbl { color: var(--dim); font-size: 12.5px; font-weight: 700; }
    .setmail { font-weight: 800; font-size: 15px; margin-top: 4px; unicode-bidi: plaintext; }
    .setlist { display: flex; flex-direction: column; gap: 10px; }
    .setitem { text-align: right; background: var(--card); border: 1.5px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 15px 16px; font-weight: 800; font-size: 15px; cursor: pointer;
      font-family: var(--font); transition: border-color .15s; }
    .setitem:hover { border-color: var(--primary); }
    .setitem.danger { color: #ff8f8f; border-color: #5c2626; }
    .termsec { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
    .termsec h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 16px; }
    .tnum { width: 26px; height: 26px; border-radius: 8px; background: var(--card-2); color: var(--primary);
      display: grid; place-items: center; font-size: 13px; font-weight: 900; flex: none; }
    .termsec p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.7; }
    .termsec .contact { margin-top: 8px; color: var(--text); font-weight: 700; }
    .termsec a { color: var(--primary); font-weight: 800; text-decoration: none; }
    .termsec a:hover { text-decoration: underline; }
    .termupd { text-align: center; color: var(--dim); font-size: 12px; margin: 8px 0 0; }

    /* ===== security module ===== */
    .pwmeter { display: flex; gap: 5px; margin: 10px 2px 6px; }
    .pwmeter i { flex: 1; height: 6px; border-radius: 999px; background: var(--border); transition: background .2s; }
    .pwmeter i.bad { background: var(--danger); }
    .pwmeter i.mid { background: var(--warning); }
    .pwmeter i.good { background: #74b9ff; }
    .pwmeter i.great { background: var(--success); }
    .pwlbl { color: var(--dim); font-size: 12px; line-height: 1.5; margin: 0 2px 4px; min-height: 16px; }
    .locknote { color: var(--warning); font-size: 13px; font-weight: 800; min-height: 18px; margin: 0 2px 8px; unicode-bidi: plaintext; }
    .seclogbtn { margin-top: 14px; background: #0c0c14; border: 1px solid var(--primary-dim); color: var(--primary-2);
      border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: var(--font); }
    .seclogbtn:hover { filter: brightness(1.2); }
    /* the log keeps a dark terminal look in BOTH themes — deliberate */
    .seclog { width: 100%; max-width: 340px; max-height: 180px; overflow-y: auto; margin-top: 10px;
      background: #07070d; border: 1px solid #23233a; border-radius: 12px; padding: 10px 12px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; line-height: 1.7; }
    .seclog.hidden { display: none; }
    .pagebody .seclog { max-width: none; max-height: 240px; }
    .sl { color: #9fd8b4; unicode-bidi: plaintext; text-align: right; }
    .sl span { color: #5a5a78; }
    .sl.warn { color: #ffd98a; }
    .sl.error { color: #ff9c9c; }
    .swrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sw { position: relative; width: 48px; height: 27px; border-radius: 999px; background: var(--border);
      border: none; cursor: pointer; transition: background .2s; flex: none; }
    .sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 21px; height: 21px;
      border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px #0006; }
    .sw.on { background: var(--success); }
    .sw.on::after { transform: translateX(-21px); }
    /* ===== engagement modules ===== */
    .modnav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .modbtn { flex: 1 1 28%; min-width: 88px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 12px 6px; color: var(--text); font-weight: 800; font-size: 12.5px; cursor: pointer;
      font-family: var(--font); transition: border-color .15s, transform .15s; }
    .modbtn:hover { border-color: var(--primary); transform: translateY(-2px); }
    .modbtn .mi { font-size: 22px; }
    .ptsrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ptsval { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .chal { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .chal.done { border-color: #2e7d5b; }
    .chtop { display: flex; align-items: center; gap: 12px; }
    .chemoji { font-size: 24px; }
    .chinfo { flex: 1; } .chinfo b { display: block; font-size: 15px; }
    .chinfo span { color: var(--dim); font-size: 12.5px; }
    .chstatus { font-weight: 900; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .chal.done .chstatus { color: var(--success); }
    .chtrack { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 12px; }
    .chtrack.big { height: 10px; }
    .chtrack i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #46e0b4);
      transition: width .8s cubic-bezier(.2,.8,.2,1); }
    .claimbtn { width: 100%; margin-top: 12px; border: none; cursor: pointer; font-family: var(--font);
      background: linear-gradient(135deg, #ffd166, #f4a261); color: #402b00; font-weight: 900; font-size: 14px;
      padding: 12px; border-radius: var(--radius); animation: claimpulse 1.4s ease-in-out infinite; }
    @keyframes claimpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); box-shadow: 0 0 22px -6px #ffd166; } }
    .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 14px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: transform .18s, border-color .18s, box-shadow .18s; }
    .badge .bemoji { font-size: 26px; filter: grayscale(1) opacity(.45); transition: filter .2s; }
    .badge b { font-size: 12px; } .badge .bdesc { color: var(--dim); font-size: 10.5px; line-height: 1.35; }
    .badge .btrack { width: 100%; height: 5px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 5px; }
    .badge .btrack i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
    .badge.open { border-color: var(--primary); }
    .badge.open .bemoji { filter: none; }
    .badge.open:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 26px -14px var(--primary); }
    .badge .bdone { color: var(--success); font-size: 11px; font-weight: 900; margin-top: 3px; }
    .frow { display: flex; flex-wrap: wrap; gap: 8px; }
    .fchip { background: var(--card); border: 1.5px solid var(--border); border-radius: 999px; color: var(--dim);
      font-weight: 800; font-size: 13px; padding: 8px 14px; cursor: pointer; font-family: var(--font);
      transition: border-color .15s, color .15s; }
    .fchip.on { border-color: var(--fc, var(--primary)); color: var(--text); }
    .fchip.wide { width: 100%; text-align: right; border-radius: var(--radius); }
    .shtop { display: flex; align-items: center; justify-content: space-between; }
    .shtop b { font-size: 16px; }
    .shpct { color: var(--primary); font-weight: 900; font-variant-numeric: tabular-nums; }
    .shdone { color: var(--success); font-weight: 900; }
    .shsum { font-size: 24px; font-weight: 900; margin: 8px 0 10px; font-variant-numeric: tabular-nums; }
    .shsum span { font-size: 13px; color: var(--dim); font-weight: 600; }
    .shparts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .shp { display: flex; align-items: center; gap: 10px; }
    .shpname { width: 52px; font-size: 13px; color: var(--dim); flex: none; }
    .shptrack { flex: 1; height: 7px; background: var(--bg); border-radius: 999px; overflow: hidden; }
    .shptrack i { display: block; height: 100%; border-radius: 999px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
    .shpamt { width: 70px; text-align: left; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
    .shactions { display: flex; gap: 8px; margin-top: 14px; align-items: stretch; }
    .fld.small { flex: 1; margin: 0; }
    .shactions .distbtn { padding: 10px 14px; font-size: 13.5px; }
    .wichips { display: flex; flex-direction: column; gap: 8px; }
    .witable { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }

    /* onboarding wizard */
    .track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .track > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s cubic-bezier(.2,.8,.2,1); }
    .stepcount { color: var(--dim); font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .ob-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; color: var(--text);
      background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 15px;
      margin-bottom: 10px; cursor: pointer; font-family: var(--font); transition: border-color .15s, background .15s; }
    .ob-opt:hover { border-color: #3c3c52; }
    .ob-opt.on { border-color: var(--primary); background: var(--card-2); }
    .ob-opt .obrad { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
      display: grid; place-items: center; flex: none; }
    .ob-opt.on .obrad { border-color: var(--primary); }
    .ob-opt .obrad i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); display: none; }
    .ob-opt.on .obrad i { display: block; }
    .ob-opt .obtxt b { display: block; font-weight: 800; color: var(--dim); }
    .ob-opt.on .obtxt b { color: var(--text); }
    .ob-opt .obtxt span { color: var(--dim); font-size: 12.5px; }
    .obback { width: 100%; background: none; border: none; color: var(--dim); font-weight: 600; font-size: 15px;
      padding: 12px; cursor: pointer; font-family: var(--font); margin-top: 2px; }
    .obback:hover { color: var(--text); }
    .obexit { width: 100%; background: none; border: none; color: var(--dim); opacity: .7; font-weight: 600;
      font-size: 13px; padding: 8px; cursor: pointer; font-family: var(--font); }
    .obexit:hover { color: #ff8f8f; opacity: 1; }
    .obsum { color: var(--dim); font-size: 13.5px; margin-top: 8px; }

    /* custom cube */
    .addcube { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;

      font-family: var(--font); unicode-bidi: plaintext; margin-top: 4px; transition: border-color .15s, color .15s, background .15s; }
    .addcube:hover { border-color: var(--primary); color: var(--text); background: #ffffff08; }
    .addcube .addicon { font-size: 20px; color: var(--primary); font-weight: 800; }
    .ccwrap { position: absolute; inset: 0; z-index: 46; display: none; flex-direction: column;
      justify-content: flex-end; background: rgba(0,0,0,.5); }
    .ccwrap.on { display: flex; }
    .ccsheet { background: var(--elevated); border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg);
      padding: 18px 20px 28px; max-height: 90%; overflow-y: auto; animation: slideup .3s ease; }
    .handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
    .prio { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
    .prio input[type=range] { flex: 1; accent-color: var(--primary); height: 6px; }
    .priov { min-width: 40px; text-align: center; font-size: 20px; font-weight: 800; color: var(--primary);
      background: #ffffff10; border-radius: 10px; padding: 4px 6px; font-variant-numeric: tabular-nums; }
    .aiRes { margin-top: 14px; background: linear-gradient(150deg, #201d38, #17161f);
      border: 1px solid var(--primary-dim); border-radius: var(--radius); padding: 14px; }
    .aiAmt { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .aiAmt span { font-size: 13px; font-weight: 600; color: var(--dim); }
    .aiExp { color: var(--dim); font-size: 13.5px; line-height: 1.5; margin-top: 6px; unicode-bidi: plaintext; }
    .aswitch { text-align: center; color: var(--dim); font-size: 13.5px; margin-top: 14px; }
    .aswitch button { background: none; border: none; color: var(--primary); font-weight: 800; cursor: pointer;
      font-family: var(--font); font-size: 13.5px; }
    .aswitch button:hover { text-decoration: underline; }
    .brandrow { display: flex; align-items: center; justify-content: space-between; }
    .logout { background: none; border: none; color: #ff8f8f; font-weight: 800; font-size: 13px;
      cursor: pointer; font-family: var(--font); }

    @media (max-width: 560px) {
      body { padding: 0; }
      .device { width: 100%; height: 100vh; height: 100dvh; max-height: none; border: 0;
        border-radius: 0; padding: 0; box-shadow: none; }
      .screen { border-radius: 0; }
      .notch { display: none; }
      .view { padding-top: 24px; }
    }
    /* ===== light theme: token overrides + the few hard-coded dark surfaces ===== */
    :root { color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f6fc; --bg-deep: #e7ebf6; --elevated: #ffffff; --card: #ffffff;
        --card-2: #eef1fe; --border: #d9deec; --text: #171a2b; --dim: #5c6280;
        --primary: #4f5dff; --primary-2: #6b78ff; --primary-dim: #b4baf5;
        --shadow-card: 0 14px 34px -26px rgba(60,70,120,.6);
      }
      body { background: radial-gradient(1000px 500px at 20% -10%, #dfe4fc 0%, transparent 55%),
             radial-gradient(800px 460px at 110% 8%, #dbeafb 0%, transparent 50%), var(--bg-deep); }
      .hero { background: linear-gradient(158deg, #eef1ff, #ffffff 65%); border-color: #dbe0f2; box-shadow: 0 24px 54px -38px #7a82b5; }
      .hero::before { background: radial-gradient(320px 180px at 85% -20%, #4f5dff22, transparent 70%); }
      .cube { background: linear-gradient(168deg, #f7f8ff, #ffffff 60%); }
      .cube:hover { border-color: #c3c9e6; }
      .device { border-color: #cfd2e4; box-shadow: 0 0 0 10px #ffffff, 0 40px 90px -40px #8a8fb5; }
      .notch { background: #10101a; }
      .authcard { background: linear-gradient(165deg, #f3f0ff, #ffffff); box-shadow: 0 30px 70px -50px #8a8fb5; }
      .parents { background: #e9f7f0; border-color: #bfe3d2; }
      .parents .pt { color: #1e5c44; }
      .parents .pt b { color: #114231; }
      .toast { background: #ffffff; border-color: var(--primary); box-shadow: 0 12px 30px -14px #8a8fb5; }
      .sync { background: #00000008; }
      .sync.ok { color: #0b8f66; border-color: #bfe3d2; background: #e9f7f0; }
      .restart { background: #00000008; }
      .aiRes { background: linear-gradient(150deg, #f1eeff, #ffffff); }
      .priov { background: #6c5ce715; }
      .addcube:hover { background: #00000005; }
      .cube { box-shadow: 0 4px 14px -12px #8a8fb5; }
      .cube .track, .ftrack { background: #eceef6; }
      .chatwrap { background: rgba(30, 30, 60, .35); }
      .ccwrap { background: rgba(30, 30, 60, .4); }
      .qbtns .qd { background: #ffffff; }
      .dangerbtn { background: #fdeaea; border-color: #f3bcbc; color: #c0392b; }
      .dangerbtn:hover { background: #fbdddd; }

      .chtrack, .badge .btrack, .shptrack, .wibar { background: #eceef6; }
      .wibar i.cur { background: #b9b3e6; }
      .wiwarn { background: #fdeaea; border-color: #f3bcbc; color: #8e2f24; }
      .wiwarn b { color: #c0392b; }
      .wisafe { background: #e9f7f0; border-color: #bfe3d2; color: #1e5c44; }
      .wibar em.negt { color: #c0392b; }
      .ledamt.neg, .logout, .bankmetric.exp b { color: #c0392b; }
      .ledamt.pos, .banknet.pos b, .bankmetric.inc b { color: #0b8f66; }
      .banknet.neg b { color: #c0392b; }
      .claimbtn { color: #402b00; }
      .insight.warn { background: #fdf3e2; border-color: #ecd9ae; color: #7a5a12; }
      .lockoverlay { background: radial-gradient(420px 320px at 50% 40%, #ffffffaa, transparent); }
      .payhero { background: linear-gradient(165deg, #fdf6e0, #ffffff 60%); }
      .payprice { color: #b8860b; }
      .setitem.gold { color: #b8860b; }
      .gpaybtn { background: #1a1a2e; color: #fff; }
      .insight.info { background: #e8f2fb; border-color: #c3ddf1; color: #23557e; }
      .s3 .negv { color: #c0392b; }
      .procbar, .cattrack { background: #eceef6; }
      .cube.landlordc { background: linear-gradient(160deg, #efecff, #ffffff); }
      .skipbtn { color: var(--primary); }

    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="notch"></div>
    <div class="screen">
      <div class="view" id="view"></div>
      <div class="coins" id="coins"></div>
      <button class="fab" id="fab" aria-label="פתח צ׳אט">🧊<span class="fablock" id="fablock">🔒</span></button>
      <div class="chatwrap" id="chatwrap"></div>
      <div class="ccwrap" id="ccwrap"></div>
      <div class="ccwrap" id="paywrap"></div>
    </div>
  </div>

  <script>
    "use strict";
    // ---- helpers ----------------------------------------------------------
    const fmt = (n) => Math.round(Number(n) || 0).toLocaleString("en-US"); // grouped digits, NaN-safe
    const $ = (id) => document.getElementById(id);
    const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

    // ---- cube model -------------------------------------------------------
    // Living WITH parents (default): no rent, so the freed money is redirected
    // into wealth-building cubes. Living independently adds a Housing cube.
    const META = {
      housing:     { name: "דיור וחשבונות", emoji: "🏠", color: "var(--c-housing)",     note: "הוצאה חודשית קבועה" },
      landlord:    { name: "בעל הדירה (שכירות)", emoji: "🔑", color: "#6C5CE7",          note: "שכר דירה חודשי (נעול)" },
      bills:       { name: "חשבונות הבית", emoji: "⚡", color: "#00CEC9",               note: "ארנונה, ועד, חשמל ומים" },
      essentials:  { name: "שוטף",           emoji: "🛒", color: "var(--c-essentials)",  note: "אוכל, תחבורה, חשבונות" },
      savings:     { name: "חיסכון",         emoji: "💰", color: "var(--c-savings)",     note: "כרית ביטחון ויעדים" },
      investments: { name: "השקעות",         emoji: "📈", color: "var(--c-investments)", note: "בניית הון לטווח ארוך" },
      lifestyle:   { name: "בילויים ופנאי",  emoji: "🎉", color: "var(--c-lifestyle)",   note: "כיף, מסעדות, חברים" },
    };

    const state = {
      pool: 0,              // money to distribute (bank balance or income)
      cubes: [],            // generated from the profile
      justFunded: new Set(),
      profile: null,        // { age, hasBank, balance, works, income, withParents, rent, arnona, utilities, committee }
      // auth gate
      screen: "auth",       // 'auth' | 'onboarding' | 'app'
      authUser: null,       // { id, email }
      authMode: "login",    // 'login' | 'signup'
      authError: "",
      onboarded: false,
      incognito: false, // privacy: blur sensitive figures on the dashboard
      premium: false,   // isPremiumUser — set ONLY by verifyGooglePlayPurchase
      // engagement modules
      game: { points: 0, claimed: {}, flags: {} }, // challenges + badges
      shared: [],                                   // shared cubes with friends
      debts: [],                                    // debt optimizer entries
    };

    // AI cube generation (verified logic): independent -> locked Housing +
    // Essentials/Savings/Investments/Lifestyle; with parents -> no Housing, the
    // freed rent share boosts Savings/Investments/Lifestyle.
    function generateCubes(p) {
      const income = p.works ? (Number(p.income) || 0) : 0;
      const rnd = (n) => Math.round(n * 10) / 10;
      const mk = (key, pct, amount, locked, noteOverride) => ({
        key, name: META[key].name, emoji: META[key].emoji, color: META[key].color,
        note: noteOverride || META[key].note,
        pct, amount: Math.round(amount), locked: !!locked, balance: 0,
      });
      const cubes = [];
      if (p.withParents) {
        // parents: no housing cubes at all — wealth cubes get the boost
        const W = { essentials: 0.25, savings: 0.30, investments: 0.27, lifestyle: 0.18 };
        ["essentials", "savings", "investments", "lifestyle"].forEach((k) =>
          cubes.push(mk(k, rnd(W[k] * 100), W[k] * income)));
        return cubes;
      }
      // lives alone / with roommates
      const e = p.exp || {};
      const rent = p.ownership === "rent" ? (Number(e.rent) || 0) : 0; // owned => NO rent cube
      const bills = (Number(e.arnona) || 0) + (Number(e.committee) || 0) + (Number(e.electricity) || 0) + (Number(e.water) || 0);
      const food = Number(e.food) || 0;
      const base = income > 0 ? income : ((Number(p.balance) || 0) || 1);
      const pctOf = (amt) => rnd(Math.min(100, (amt / base) * 100));
      if (rent > 0) cubes.push(mk("landlord", pctOf(rent), rent, true));
      if (bills > 0) cubes.push(mk("bills", pctOf(bills), bills, true,
        "ארנונה " + fmt(Number(e.arnona) || 0) + " · ועד " + fmt(Number(e.committee) || 0) +
        " · חשמל " + fmt(Number(e.electricity) || 0) + " · מים " + fmt(Number(e.water) || 0)));
      if (food > 0) cubes.push(mk("essentials", pctOf(food), food, false, "אוכל וסופר"));
      // whatever's left after fixed expenses flows to wealth-building cubes
      const disc = Math.max(0, income - rent - bills - food);
      const W = { savings: 0.40, investments: 0.32, lifestyle: 0.28 };
      ["savings", "investments", "lifestyle"].forEach((k) =>
        cubes.push(mk(k, pctOf(W[k] * disc), W[k] * disc)));
      return cubes;
    }
    // Resolve a category to an existing cube (the bank manager uses "housing" as the
    // generic fixed-costs category; new profiles have bills/landlord instead).
    function cubeFor(key) {
      if (state.cubes.find((c) => c.key === key)) return key;
      if (key === "housing") {
        if (state.cubes.find((c) => c.key === "bills")) return "bills";
        if (state.cubes.find((c) => c.key === "landlord")) return "landlord";
      }
      return "essentials";
    }

    // ====================================================================
    // Mock Auth Service — simulated secure local user store (no real DB).
    // Passwords are salted + key-stretched with a mock hash (NOT crypto-secure;
    // a production app must hash server-side). Users live in localStorage.
    // ====================================================================
    const USERS_KEY = "cubefinance_web:users";
    const SESSION_KEY = "cubefinance_web:session";
    const loadUsers = () => { try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); } catch (e) { return {}; } };
    const saveUsers = (u) => { try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch (e) {} };
    function mockHash(s) {
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
      for (let r = 0; r < 800; r++) h = ((h * 33) ^ (h >>> 7)) >>> 0; // key-stretch
      return h.toString(16);
    }
    const hashPw = (pw, salt) => mockHash(salt + "::" + pw);
    const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const normEmail = (e) => (e || "").trim().toLowerCase();

    // ====================================================================
    // Security core — live security log, password policy, rate limiting.
    // ====================================================================
    const SECLOG_KEY = "cubefinance_web:seclog";
    let secLogArr = [];
    try { secLogArr = JSON.parse(localStorage.getItem(SECLOG_KEY) || "[]"); } catch (e) {}
    function secLog(level, msg) {
      const t = new Date();
      const hh = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + ":" + String(t.getSeconds()).padStart(2, "0");
      secLogArr.push({ t: hh, level: level, msg: msg });
      if (secLogArr.length > 60) secLogArr.splice(0, secLogArr.length - 60);
      try { localStorage.setItem(SECLOG_KEY, JSON.stringify(secLogArr)); } catch (e) {}
      document.querySelectorAll(".seclog").forEach(renderSecLogInto); // live panels update instantly
    }
    function renderSecLogInto(box) {
      box.innerHTML = secLogArr.length
        ? secLogArr.map((l) => '<div class="sl ' + l.level.toLowerCase() + '"><span dir="ltr">' + l.t + " [" + l.level + "]</span> " + l.msg + "</div>").join("")
        : '<div class="sl info">אין רישומים עדיין — בצעו הרשמה או התחברות כדי לראות את מנגנוני האבטחה בפעולה.</div>';
      box.scrollTop = box.scrollHeight;
    }
    function clearSecLog() {
      secLogArr = [];
      try { localStorage.removeItem(SECLOG_KEY); } catch (e) {}
      document.querySelectorAll(".seclog").forEach(renderSecLogInto);
    }

    // Password policy: 8+ chars, uppercase, lowercase, digit, special char.
    const PW_RULES = [
      { re: /.{8,}/, label: "לפחות 8 תווים" },
      { re: /[A-Z]/, label: "אות גדולה (A–Z)" },
      { re: /[a-z]/, label: "אות קטנה (a–z)" },
      { re: /[0-9]/, label: "ספרה (0–9)" },
      { re: /[^A-Za-z0-9]/, label: "תו מיוחד (!@#…)" },
    ];
    const pwScore = (pw) => PW_RULES.reduce((s, r) => s + (r.re.test(pw || "") ? 1 : 0), 0);
    const PW_LABELS = ["", "חלשה מאוד", "חלשה", "בינונית", "חזקה", "מצוינת 💪"];
    const GENERIC_ERR = "שגיאה: פרטי ההתחברות שגויים או שהחשבון ננעל זמנית";
    const LOCK_MS = 30000, MAX_FAILS = 3;

    function authSignUp(email, pw) {
      const e = normEmail(email);
      if (!validEmail(e)) return { error: "כתובת אימייל לא תקינה" };
      // enforce the strong-password policy (never accept weak credentials)
      const missing = PW_RULES.filter((r) => !r.re.test(pw || ""));
      if (missing.length) {
        secLog("WARN", "הרשמה נדחתה — הסיסמה לא עומדת במדיניות (" + missing.length + " דרישות חסרות)");
        return { error: "סיסמה חלשה מדי — חסר: " + missing.map((m) => m.label).join(", ") };
      }
      const users = loadUsers();
      if (users[e]) { secLog("WARN", "ניסיון הרשמה עם אימייל קיים נחסם"); return { error: "האימייל כבר רשום במערכת" }; }
      const salt = Math.random().toString(36).slice(2);
      const id = "acc_" + mockHash(e).slice(0, 8) + Date.now().toString(36);
      users[e] = { id, email: e, salt, hash: hashPw(pw, salt), failCount: 0, lockUntil: 0, createdAt: Date.now() };
      saveUsers(users);
      secLog("INFO", "נוצר salt אקראי ייחודי לחשבון");
      secLog("INFO", "הסיסמה עברה גיבוב מוקשה (bcrypt מדומה, 800 סבבים) — לא נשמרת כטקסט גלוי");
      secLog("INFO", "חשבון חדש נוצר: " + e);
      return { user: { id, email: e } };
    }
    // Rate limiting: 3 wrong passwords in a row lock the account for 30s.
    // Errors are deliberately generic so attackers can't probe which part failed.
    function authLogIn(email, pw) {
      const e = normEmail(email);
      const users = loadUsers();
      const u = users[e];
      const now = Date.now();
      if (u && u.lockUntil && u.lockUntil > now) {
        const left = Math.ceil((u.lockUntil - now) / 1000);
        secLog("ERROR", "ניסיון התחברות לחשבון נעול יורט (" + left + " שניות לשחרור)");
        return { error: GENERIC_ERR, lockedFor: left };
      }
      if (!u) { secLog("WARN", "ניסיון התחברות עם אימייל לא מוכר יורט"); return { error: GENERIC_ERR }; }
      if (u.hash !== hashPw(pw, u.salt)) {
        u.failCount = (u.failCount || 0) + 1;
        secLog("WARN", "ניסיון התחברות שגוי יורט (" + u.failCount + "/" + MAX_FAILS + ")");
        if (u.failCount >= MAX_FAILS) {
          u.lockUntil = now + LOCK_MS;
          u.failCount = 0;
          saveUsers(users);
          secLog("ERROR", "זוהה דפוס Brute-Force — החשבון ננעל זמנית ל-30 שניות");
          return { error: GENERIC_ERR, lockedFor: Math.ceil(LOCK_MS / 1000) };
        }
        saveUsers(users);
        return { error: GENERIC_ERR };
      }
      u.failCount = 0; u.lockUntil = 0; saveUsers(users);
      secLog("INFO", "אימות הצליח — נפתח סשן מאובטח עבור " + e);
      return { user: { id: u.id, email: u.email } };
    }
    const setSession = (e) => { try { localStorage.setItem(SESSION_KEY, normEmail(e)); } catch (x) {} };
    const clearSession = () => { try { localStorage.removeItem(SESSION_KEY); } catch (x) {} };
    const getSession = () => { try { return localStorage.getItem(SESSION_KEY); } catch (x) { return null; } };

    // Per-account app state (pool, cubes, onboarding) namespaced by user id.
    const stateKey = () => "cubefinance_web:state:" + (state.authUser ? state.authUser.id : "anon");
    function saveState() {
      if (state.screen === "auth" || !state.authUser) return;
      try {
        localStorage.setItem(stateKey(), JSON.stringify({
          onboarded: state.onboarded, pool: state.pool, profile: state.profile, cubes: state.cubes,
          incognito: !!state.incognito, premium: !!state.premium, game: state.game, shared: state.shared, debts: state.debts,
        }));
      } catch (e) {}
    }
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(stateKey()) || "null"); } catch (e) {}
      state.profile = s && s.profile ? s.profile : null;
      state.onboarded = !!(s && s.onboarded);
      state.pool = s && s.pool != null ? s.pool : 0;
      state.cubes = s && Array.isArray(s.cubes) ? s.cubes : [];
      state.incognito = !!(s && s.incognito);
      state.premium = !!(s && s.premium);
      const g = (s && s.game) || {};
      state.game = { points: g.points || 0, claimed: g.claimed || {}, flags: g.flags || {} };
      state.shared = s && Array.isArray(s.shared) ? s.shared : [];
      state.debts = s && Array.isArray(s.debts) ? s.debts : [];
    }

    function enterApp(user) {
      state.authUser = user; state.authError = ""; setSession(user.email);
      loadState();
      if (state.onboarded) { state.screen = "app"; }
      else { startOnboarding(); state.screen = "onboarding"; }
      render();
    }
    function logout() {
      clearSession();
      state.authUser = null; state.screen = "auth"; state.authMode = "login"; state.authError = "";
      state.onboarded = false; state.pool = 0; state.profile = null; state.cubes = []; state.incognito = false;
      state.game = { points: 0, claimed: {}, flags: {} }; state.shared = []; state.debts = []; state.premium = false;
      resetModuleGlobals(); // clear per-session module state so it never leaks to the next account
      render();
    }
    // Wipe module-scoped globals that hold one account's derived data (bank
    // report, debt result, simulator/guide UI state, chat) so a different user
    // logging in on the same device never sees the previous account's data.
    function resetModuleGlobals() {
      bankData = null; bankPhase = "idle"; bankReport = null; bankMoves = null;
      debtResult = null; debtDraft = { name: "", balance: "", rate: "", type: "credit", unknown: false };
      shForm = null; guideFeat = null; cc = null; settStep = 0;
      wiScenario = null; wiWithCut = false; wiCustomType = "once"; wiCustomAmt = "";
      try { resetChat(); } catch (e) {}
    }
    function initAuth() {
      const email = getSession();
      const users = loadUsers();
      if (email && users[email]) { enterApp({ id: users[email].id, email: users[email].email }); }
      else { state.screen = "auth"; state.authMode = Object.keys(users).length ? "login" : "signup"; render(); }
    }

    // ---- Custom cube: AI allocation by 1–10 priority ----------------------
    const CUSTOM_COLORS = ["#A29BFE", "#55EFC4", "#FD79A8", "#74B9FF", "#81ECEC", "#FAB1A0", "#B2BEC3"];
    function allocateCustomCube(priority) {
      const p = Math.max(1, Math.min(10, Math.round(priority)));
      const income = state.profile && state.profile.works ? (Number(state.profile.income) || 0) : 0;
      const housing = state.cubes.find((c) => c.key === "housing");
      const discretionary = Math.max(0, income - (housing ? (housing.amount || 0) : 0));
      let pct, tone;
      if (p >= 8) { pct = 0.10 + (p - 8) * 0.05; tone = "high"; } // 10% / 15% / 20%
      else { pct = 0.01 + (p - 1) * 0.005; tone = "low"; }        // ~1%..4% (symbolic)
      let amount = Math.round(discretionary * pct);
      if (income > 0 && amount < 50) amount = 50;
      const explanation = tone === "high"
        ? "דירגת את זה " + p + "/10 — עדיפות גבוהה. הקצאתי ₪" + fmt(amount) + " בחודש, נתח משמעותי מהתקציב הפנוי (₪" + fmt(discretionary) + "), על חשבון צמצום קל בקוביית ההנאות."
        : "דירגת את זה " + p + "/10, אז זה לא דחוף. הקצאתי סכום קטן וסמלי של ₪" + fmt(amount) + " בחודש כדי שתוכל להמשיך להתמקד ביעדי החיסכון העיקריים.";
      return { amount: amount, priority: p, tone: tone, discretionary: discretionary, explanation: explanation };
    }

    function createCustomCube(name, amount, meta) {
      meta = meta || {};
      const income = state.profile && state.profile.works ? (Number(state.profile.income) || 0) : 0;
      amount = Math.max(0, Math.round(amount));
      const idx = state.cubes.filter((c) => c.custom).length;
      const cube = {
        key: "custom_" + Date.now(),
        name: (name || "").trim() || "קובייה אישית",
        emoji: "🎯", color: CUSTOM_COLORS[idx % CUSTOM_COLORS.length],
        note: meta.priority ? "יעד אישי · עדיפות " + meta.priority + "/10" : "יעד אישי",
        pct: income > 0 ? Math.round((amount / income) * 1000) / 10 : 0,
        amount: amount, locked: false, balance: 0, custom: true, priority: meta.priority || null,
      };
      // High-priority cubes "make room" by trimming the Lifestyle target.
      if (meta.priority && meta.priority >= 8) {
        const life = state.cubes.find((c) => c.key === "lifestyle");
        if (life) {
          const cut = Math.min(life.amount || 0, amount);
          life.amount = Math.round((life.amount || 0) - cut);
          life.pct = income > 0 ? Math.round((life.amount / income) * 1000) / 10 : life.pct;
        }
      }
      state.cubes.push(cube);
      state.justFunded = new Set([cube.key]);
      saveState();
      render();
      showToast("🎯 נוצרה קובייה: " + cube.name);
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }

    // Onboarding wizard draft (module-scoped; reset when onboarding starts).
    let ob = null;
    const obKey = () => "cubefinance_web:ob:" + (state.authUser ? state.authUser.id : "anon");
    function saveOb() { if (!state.authUser || !ob) return; try { localStorage.setItem(obKey(), JSON.stringify(ob)); } catch (e) {} }
    function loadOb() { try { const s = JSON.parse(localStorage.getItem(obKey()) || "null"); return s && s.d ? s : null; } catch (e) { return null; } }
    function clearOb() { try { localStorage.removeItem(obKey()); } catch (e) {} }
    function startOnboarding() {
      // Resume an in-progress questionnaire if the user refreshed mid-flow.
      const saved = loadOb();
      ob = saved || { i: 0, building: false, d: { age: "", hasBank: null, balance: "", works: null, income: "",
                        living: null, ownership: null, exp: {}, expEst: {} } };
      ob.building = false; // never resume stuck inside the build animation
    }
    // Conditional step machine:
    // parents  -> straight to the income questions (no property/expenses)
    // alone    -> property status -> dynamic expense fields (per status)
    function obSteps() {
      const d = ob.d, age = Number(d.age);
      const s = ["age"];
      if (age >= 16) { s.push("bank"); if (d.hasBank) s.push("balance"); }
      s.push("living");
      if (d.living === "alone") { s.push("property", "expenses"); }
      s.push("work"); if (d.works) s.push("income");
      return s;
    }
    // Expense fields per property status + realistic defaults for an 18-year-old
    // (used by the per-field "לא יודע / דלג" buttons).
    const EXP_DEFAULTS = { rent: 2200, arnona: 180, committee: 80, electricity: 250, water: 60, food: 1000 };
    const EXP_LABELS = { rent: "שכר דירה חודשי", arnona: "ארנונה", committee: "ועד בית",
                         electricity: "חשמל", water: "מים", food: "אוכל וסופר" };
    function expFields() {
      return ob.d.ownership === "rent"
        ? ["rent", "arnona", "committee", "electricity", "water", "food"]
        : ["electricity", "water", "arnona", "committee", "food"]; // owned: NO rent field
    }

    const totalBalance = () => state.cubes.reduce((s, c) => s + c.balance, 0);

    // ---- render dispatcher ------------------------------------------------
    function render() {
      $("fab").style.display = state.screen === "app" ? "grid" : "none";
      { const fl = $("fablock"); if (fl) fl.style.display = state.premium ? "none" : "grid"; }
      // incognito: blur sensitive figures on the dashboard (hover to reveal)
      document.querySelector(".screen").classList.toggle("incognito", state.screen === "app" && !!state.incognito);
      if (state.screen === "auth") return renderAuth();
      if (state.screen === "onboarding") return renderOnboarding();
      if (state.screen === "settings") return renderSettingsPage();
      if (state.screen === "terms") return renderTermsPage();
      if (state.screen === "privacy") return renderPrivacyPage();
      if (state.screen === "upgrade") return renderUpgradePage();
      if (state.screen === "guide") return renderGuidePage();
      if (state.screen === "challenges") return renderChallengesPage();
      if (state.screen === "shared") return renderSharedPage();
      if (state.screen === "whatif") return renderWhatIfPage();
      if (state.screen === "debt") return renderDebtPage();
      if (state.screen === "bank") return renderBankPage();
      renderDashboard();
    }

    // ---- Auth screen (Sign Up / Log In + security instrumentation) --------
    let lockTimer = null;
    function renderAuth() {
      const isSignup = state.authMode === "signup";
      const v = $("view"); v.innerHTML = "";
      if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
      const wrap = el("div", "authwrap");
      wrap.innerHTML =
        '<div class="authcard">' +
          '<div class="authbrand">🧊 CubeFinance</div>' +
          '<h2 class="authtitle">' + (isSignup ? "יצירת חשבון" : "התחברות") + '</h2>' +
          '<p class="authsub">' + (isSignup ? "הירשם כדי להתחיל לחלק את הכסף לקוביות." : "התחבר כדי להמשיך לקוביות שלך.") + '</p>' +
          '<label class="flbl">אימייל</label>' +
          '<div class="fld"><input id="aEmail" type="email" dir="ltr" placeholder="you@example.com" autocomplete="email"></div>' +
          '<label class="flbl">סיסמה</label>' +
          '<div class="fld"><input id="aPass" type="password" dir="ltr" placeholder="••••••••" autocomplete="' + (isSignup ? "new-password" : "current-password") + '"></div>' +
          (isSignup
            ? '<div class="pwmeter" id="pwMeter"><i></i><i></i><i></i><i></i><i></i></div>' +
              '<div class="pwlbl" id="pwLbl">מד חוזק סיסמה — 8+ תווים, אות גדולה, אות קטנה, ספרה ותו מיוחד</div>'
            : "") +
          '<div class="aerr" id="aErr">' + (state.authError || "") + '</div>' +
          '<div class="locknote" id="aLock"></div>' +
          '<button class="distbtn wide" id="aSubmit">' + (isSignup ? "הרשמה" : "התחברות") + '</button>' +
          '<div class="aswitch">' + (isSignup ? "כבר יש לך חשבון?" : "עדיין אין לך חשבון?") +
            ' <button id="aToggle">' + (isSignup ? "התחבר" : "הירשם") + '</button></div>' +
        '</div>' +
        '<button class="seclogbtn" id="slToggle">🛰️ יומן אבטחה חי</button>' +
        '<div class="seclog hidden" id="authSeclog"></div>';
      v.appendChild(wrap);
      const email = v.querySelector("#aEmail"), pass = v.querySelector("#aPass");

      // real-time password strength meter (signup only)
      if (isSignup) {
        pass.oninput = () => {
          const sc = pwScore(pass.value);
          v.querySelectorAll("#pwMeter i").forEach((seg, i) => {
            seg.className = i < sc ? (sc <= 2 ? "bad" : sc <= 3 ? "mid" : sc <= 4 ? "good" : "great") : "";
          });
          const missing = PW_RULES.filter((r) => !r.re.test(pass.value));
          v.querySelector("#pwLbl").textContent = pass.value
            ? "חוזק: " + PW_LABELS[sc] + (missing.length ? " · חסר: " + missing.map((m) => m.label).join(", ") : " — כל הדרישות מולאו ✓")
            : "מד חוזק סיסמה — 8+ תווים, אות גדולה, אות קטנה, ספרה ותו מיוחד";
        };
      }

      const startLockCountdown = (secs) => {
        const lockEl = v.querySelector("#aLock");
        let left = secs;
        const tick = () => {
          if (left <= 0) { clearInterval(lockTimer); lockTimer = null; lockEl.textContent = ""; return; }
          lockEl.textContent = "🔒 החשבון נעול — נסו שוב בעוד " + left + " שניות";
          left--;
        };
        if (lockTimer) clearInterval(lockTimer);
        tick();
        lockTimer = setInterval(tick, 1000);
      };

      const submit = () => {
        const res = isSignup ? authSignUp(email.value, pass.value) : authLogIn(email.value, pass.value);
        if (res.error) {
          state.authError = res.error;
          v.querySelector("#aErr").textContent = res.error;
          if (res.lockedFor) startLockCountdown(res.lockedFor);
          return;
        }
        if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
        enterApp(res.user); // signup -> onboarding; login -> dashboard or onboarding
      };
      v.querySelector("#aSubmit").onclick = submit;
      pass.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      v.querySelector("#aToggle").onclick = () => { state.authMode = isSignup ? "login" : "signup"; state.authError = ""; render(); };

      // live security log panel
      const slBox = v.querySelector("#authSeclog");
      renderSecLogInto(slBox);
      v.querySelector("#slToggle").onclick = () => { slBox.classList.toggle("hidden"); renderSecLogInto(slBox); };
    }

    // ---- Onboarding (multi-step, conditional, with skip-estimates) --------
    function renderOnboarding() {
      if (!ob) startOnboarding();
      saveOb(); // persist the draft so a refresh mid-questionnaire resumes here
      const v = $("view");

      // AI-processing animation before the dashboard appears
      if (ob.building) {
        v.innerHTML = "";
        const wrap = el("div", "authwrap");
        wrap.innerHTML = '<div class="authcard buildcard">' +
          '<div class="buildcube">🧊</div>' +
          '<h2 class="authtitle" style="text-align:center">ה-AI מעבד את הנתונים<br>ומקים את הקוביות שלך…</h2>' +
          '<div class="procbar" style="margin-top:16px"><i></i></div></div>';
        v.appendChild(wrap);
        return;
      }

      const steps = obSteps();
      const idx = Math.min(ob.i, steps.length - 1);
      const step = steps[idx];
      const isLast = idx === steps.length - 1;
      const d = ob.d, age = Number(d.age);
      const digits = (val) => val.replace(/[^0-9]/g, "");

      const canNext = () => {
        switch (step) {
          case "age": { const a = Number(d.age); return a >= 13 && a <= 120; }
          case "bank": return d.hasBank !== null;
          case "balance": return d.balance !== "" && Number(d.balance) >= 0;
          case "living": return d.living !== null;
          case "property": return d.ownership !== null;
          case "expenses": return expFields().every((k) => d.exp[k] !== undefined && d.exp[k] !== "");
          case "work": return d.works !== null;
          case "income": return Number(d.income) > 0;
          default: return false;
        }
      };

      v.innerHTML = "";
      const wrap = el("div", "authwrap");
      const money = (id, lbl, ph, val) =>
        '<label class="flbl">' + lbl + '</label><div class="fld"><span class="cur">₪</span>' +
        '<input id="' + id + '" inputmode="numeric" placeholder="' + ph + '" value="' + (val || "") + '"></div>';
      const choice = (p, lbl, sub, on) =>
        '<button class="ob-opt' + (on ? " on" : "") + '" data-v="' + p + '"><span class="obrad"><i></i></span>' +
        '<span class="obtxt"><b>' + lbl + '</b>' + (sub ? '<span>' + sub + '</span>' : "") + '</span></button>';

      let inner = '<div class="track" style="margin-bottom:12px"><i style="width:' +
        Math.round(((idx + 1) / steps.length) * 100) + '%"></i></div>' +
        '<div class="stepcount">שלב ' + (idx + 1) + ' מתוך ' + steps.length + '</div>';

      if (step === "age") inner += '<h2 class="authtitle">בן כמה את/ה?</h2><p class="authsub">נשאל שאלות מותאמות לגיל שלך.</p>' + money("f", "גיל", "17", d.age);
      else if (step === "bank") inner += '<h2 class="authtitle">יש לך חשבון בנק?</h2><p class="authsub">מגיל 16 אפשר לנהל יתרה עצמאית.</p>' +
        choice("1", "כן, יש לי חשבון", "", d.hasBank === true) + choice("0", "לא, אין לי עדיין", "נדלג על שאלת היתרה", d.hasBank === false);
      else if (step === "balance") inner += '<h2 class="authtitle">מה היתרה לניהול?</h2><p class="authsub">הסכום שתרצה לעקוב אחריו ולחלק (מדומה — ללא חיבור לבנק).</p>' + money("f", "יתרה נוכחית משוערת", "3000", d.balance);
      else if (step === "living") inner += '<h2 class="authtitle">איפה אתה גר כרגע?</h2><p class="authsub">זה קובע אילו קוביות הוצאה ניצור לך.</p>' +
        choice("alone", "גר לבד / עם שותפים", "נשאל על סטטוס הדירה וההוצאות", d.living === "alone") +
        choice("parents", "גר עם ההורים", "בלי הוצאות דיור — נדלג ישר לשאלות ההכנסה", d.living === "parents");
      else if (step === "property") inner += '<h2 class="authtitle">מה סטטוס המגורים שלך?</h2><p class="authsub">שכירות תקבל קוביית "בעל הדירה" ייעודית.</p>' +
        choice("rent", "בשכירות (בית שכור)", "ניצור קוביית שכירות בולטת", d.ownership === "rent") +
        choice("owned", "דירה קנויה / בבעלות", "בלי שכר דירה — רק חשבונות שוטפים", d.ownership === "owned");
      else if (step === "expenses") {
        inner += '<h2 class="authtitle">הערכת הוצאות חודשיות</h2><p class="authsub">לא בטוחים? לחצו "לא יודע / דלג" — ה-AI ישבץ הערכה סטנדרטית.</p>';
        expFields().forEach((k) => {
          const est = d.expEst[k];
          inner += '<label class="flbl">' + EXP_LABELS[k] + (est ? ' <i class="est">(הערכת AI ✨)</i>' : "") + '</label>' +
            '<div class="exprow"><div class="fld" style="flex:1"><span class="cur">₪</span>' +
            '<input data-exp="' + k + '" inputmode="numeric" placeholder="' + EXP_DEFAULTS[k] + '" value="' + (d.exp[k] !== undefined ? d.exp[k] : "") + '"></div>' +
            '<button class="skipbtn" data-skip="' + k + '">לא יודע / דלג</button></div>';
        });
        const tot = expFields().reduce((s, k) => s + (Number(d.exp[k]) || 0), 0);
        inner += '<div class="obsum">סה״כ הוצאות משוערות: <b>₪' + fmt(tot) + '</b></div>';
      }
      else if (step === "work") inner += '<h2 class="authtitle">האם את/ה עובד/ת?</h2><p class="authsub">נבנה את התקציב סביב ההכנסה.</p>' +
        choice("1", "כן, אני עובד/ת", "", d.works === true) + choice("0", "לא כרגע", "נדלג על שאלת ההכנסה", d.works === false);
      else if (step === "income") inner += '<h2 class="authtitle">מהי ההכנסה החודשית המשוערת?</h2><p class="authsub">ההכנסה החודשית נטו שלך.</p>' + money("f", "הכנסה חודשית", "10000", d.income);

      inner += '<button class="distbtn wide" id="obNext" style="margin-top:18px">' + (isLast ? "סיום השאלון 🧊" : "המשך") + '</button>';
      if (idx > 0) inner += '<button class="obback" id="obBack">חזרה</button>';
      inner += '<button class="obexit" id="obExit">↩ יציאה מהחשבון</button>';
      wrap.innerHTML = '<div class="authcard">' + inner + '</div>';
      v.appendChild(wrap);
      v.querySelector("#obExit").onclick = () => { logout(); };

      const bindNum = (id, key) => { const inp = v.querySelector("#" + id); if (inp) inp.oninput = () => { inp.value = digits(inp.value); d[key] = inp.value; syncNext(); }; };
      if (step === "age") bindNum("f", "age");
      else if (step === "balance") bindNum("f", "balance");
      else if (step === "income") bindNum("f", "income");
      else if (step === "expenses") {
        v.querySelectorAll("input[data-exp]").forEach((inp) => {
          inp.oninput = () => {
            inp.value = digits(inp.value);
            d.exp[inp.dataset.exp] = inp.value;
            d.expEst[inp.dataset.exp] = false; // manual edit overrides the estimate
            syncNext(); updateSum();
          };
        });
        // "לא יודע / דלג" -> assign the industry-standard default for an 18yo
        v.querySelectorAll(".skipbtn").forEach((b) => {
          b.onclick = () => {
            const k = b.dataset.skip;
            d.exp[k] = String(EXP_DEFAULTS[k]);
            d.expEst[k] = true;
            renderOnboarding();
          };
        });
      }
      const autof = v.querySelector(".authcard input"); if (autof && step !== "expenses") setTimeout(() => autof.focus(), 40);

      v.querySelectorAll(".ob-opt").forEach((b) => {
        b.onclick = () => {
          const raw = b.dataset.v;
          if (step === "bank") { d.hasBank = raw === "1"; if (raw !== "1") d.balance = ""; }
          else if (step === "work") { d.works = raw === "1"; if (raw !== "1") d.income = ""; }
          else if (step === "living") { d.living = raw; if (raw === "parents") { d.ownership = null; d.exp = {}; d.expEst = {}; } }
          else if (step === "property") { if (d.ownership !== raw) { d.exp = {}; d.expEst = {}; } d.ownership = raw; }
          renderOnboarding();
        };
      });

      function syncNext() { const nb = v.querySelector("#obNext"); if (nb) nb.disabled = !canNext(); }
      function updateSum() { const b2 = v.querySelector(".obsum b"); if (b2) b2.textContent = "₪" + fmt(expFields().reduce((s, k) => s + (Number(d.exp[k]) || 0), 0)); }
      syncNext();

      v.querySelector("#obNext").onclick = () => {
        if (!canNext()) return;
        if (isLast) {
          ob.building = true;
          renderOnboarding();
          setTimeout(finishOnboarding, 1500); // the 1.5s AI build moment
        } else { ob.i = idx + 1; renderOnboarding(); }
      };
      const back = v.querySelector("#obBack");
      if (back) back.onclick = () => { ob.i = Math.max(0, idx - 1); renderOnboarding(); };
    }

    function finishOnboarding() {
      const d = ob.d;
      const num = (x) => Number(x) || 0;
      const profile = {

    function cubeCard(c) {
      // Stable monthly target: locked cubes = their fixed amount; others = the
      // set amount, else a share of income. Never fall back to the current
      // balance (that made the bar read 100% with a meaningless "₪1" target).
      const income = (state.profile && Number(state.profile.income)) || 0;
      const monthly = c.locked ? (c.amount || 0)
        : (c.amount && c.amount > 0 ? c.amount : Math.round(income * ((c.pct || 0) / 100)));
      const target = monthly || 0;
      const hasTarget = target >= 10; // hide nonsense targets
      const fill = hasTarget ? Math.max(0, Math.min(1, c.balance / target)) * 100 : (c.balance > 0 ? 100 : 0);
      const card = el("div", "cube" + (state.justFunded.has(c.key) ? " pop" : "") + (c.key === "landlord" ? " landlordc" : ""));
      card.innerHTML =
        '<div class="top">' +
          '<div class="chip" style="background:' + c.color + '22">' + c.emoji + '</div>' +
          '<div><div class="nm">' + esc(c.name) + (c.locked ? ' <span title="נעול">🔒</span>' : '') + '</div><div class="nt">' + esc(c.note) + '</div></div>' +
          (c.pct ? '<div class="pct" style="color:' + c.color + ';background:' + c.color + '22">' + c.pct + '%</div>' : '') +
        '</div>' +

          (hasTarget || c.locked ? '<span class="tgt">מתוך ₪' + fmt(target) + (c.locked ? ' (נעול)' : ' לחודש') + '</span>' : '') + '</div>' +
        '<div class="track"><i style="background:' + c.color + '"></i></div>';
      requestAnimationFrame(() => { const bar = card.querySelector(".track > i"); if (bar) bar.style.width = fill + "%"; });
      return card;

    // ---- distribute (animation + count-up) --------------------------------
    function distribute() {
      const pool = state.pool;
      if (pool <= 0) return;
      state.game.flags.dist = true; // badge: distributed a budget
      // Give each cube its own percentage share, clamped so it never exceeds
      // what's left — a cube can never go negative, and any rounding remainder
      // (or an over-100% allocation) stays as available balance in the pool.
      let remaining = pool, distributed = 0;
      state.cubes.forEach((c) => {
        let give = Math.max(0, Math.round(pool * ((c.pct || 0) / 100)));
        if (give > remaining) give = remaining;
        c.balance += give; remaining -= give; distributed += give;
      });
      state.pool = remaining;
      state.justFunded = new Set(state.cubes.map((c) => c.key));
      burstCoins();
      render();
      animateCounts();
      showToast("🪙 חולקו ₪" + fmt(distributed) + " לקוביות");
      setTimeout(() => { state.justFunded = new Set(); }, 800);
    }

    function animateCounts() {
      document.querySelectorAll(".bal").forEach((node) => {
        const to = Number(node.dataset.to), from = 0, start = performance.now(), dur = 650;
        (function tick(t) {
          const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
          node.textContent = "₪" + fmt(from + (to - from) * e);
          if (p < 1) requestAnimationFrame(tick);
        })(start);
      });
    }

    function burstCoins(emoji) {
      const box = $("coins");
      for (let i = 0; i < 16; i++) {
        const c = el("div", "coin"); c.textContent = emoji || "🪙";
        c.style.left = (Math.random() * 320 + 24) + "px";
        box.appendChild(c);
        const dur = 800 + Math.random() * 500, delay = Math.random() * 250;
        c.animate(
          [{ transform: "translateY(-40px) rotate(0)", opacity: 1 },
           { transform: "translateY(840px) rotate(" + (360 + Math.random() * 360) + "deg)", opacity: 0 }],
          { duration: dur, delay: delay, easing: "cubic-bezier(.4,0,.7,1)", fill: "forwards" }
        );
        setTimeout(() => c.remove(), dur + delay + 50);
      }
    }

    function showToast(msg) {
      const t = el("div", "toast"); t.textContent = msg;
      $("view").parentElement.appendChild(t); // .screen is the positioned container
      requestAnimationFrame(() => t.classList.add("on"));

    // =====================================================================
    // Worker 1 — Cubey chat, persistent DOM.
    // The shell (header/messages/suggestions/input) is built ONCE; messages
    // are appended incrementally. No full re-render => no flicker/jumping,
    // the open animation runs only on first open, and history survives
    // close/reopen. scrollToBottom() fires on every append + stream tick.
    // =====================================================================
    let chatBuilt = false, chatOpen = false, streaming = false, pendingAction = null;
    const chatLog = [];
    const SUGG = ["מה המצב שלי?", "אפשר להרשות 500 ₪?", "תכניס 100 ₪ לחיסכון"];

    function scrollToBottom() { const m = $("msgs"); if (m) m.scrollTop = m.scrollHeight; }

    function buildChatShell() {
      if (chatBuilt) return;
      chatBuilt = true;
      const w = $("chatwrap");
      w.innerHTML =
        '<div class="chat" id="chatbox">' +
          '<div class="ch"><div><div class="t">Cubey 🧊</div><div class="s" id="chstate">היועץ הפיננסי החכם שלך · מכיר את הקוביות</div></div>' +
          '<button class="x" id="chx" aria-label="סגור">✕</button></div>' +
          '<div class="msgs" id="msgs"><div class="intro" id="chintro"><div class="e">👋</div><p>היי! אני Cubey. אפשר לשאול, לדווח על הוצאה — וגם לבקש פעולות, למשל: "תכניס 200 ₪ לקוביית טיול".</p></div></div>' +
          '<div class="sugg" id="sugg"></div>' +
          '<div class="inbar"><input id="cin" placeholder="כתוב ל-Cubey…"><button id="csend">➤</button></div>' +
        '</div>';
      w.onclick = (e) => { if (e.target === w) closeChat(); };
      $("chx").onclick = closeChat;
      const sg = $("sugg");
      SUGG.forEach((s) => { const b = el("button"); b.textContent = s; b.onclick = () => send(s); sg.appendChild(b); });
      const input = $("cin");
      const go = () => { const val = (input.value || "").trim(); if (val && !streaming) { input.value = ""; send(val); } };
      $("csend").onclick = go;
      input.onkeydown = (e) => { if (e.key === "Enter") go(); };
      // Keyboard-overlap guard: when the on-screen keyboard shrinks the visual
      // viewport, pad the chat so the input stays visible, and re-anchor scroll.
      input.onfocus = () => setTimeout(scrollToBottom, 250);
      // Bind the viewport-resize handler exactly once (buildChatShell can run
      // many times — every logout/clear-history/upgrade cycle — so re-adding it
      // would stack duplicate listeners).
      if (window.visualViewport && !vvBound) {
        vvBound = true;
        window.visualViewport.addEventListener("resize", () => {
          if (!chatOpen) return;
          const vv = window.visualViewport;
          const overlap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
          const box = $("chatbox");
          if (box) box.style.paddingBottom = overlap ? overlap + "px" : "";
          scrollToBottom();
        });
      }
    }
    let vvBound = false;

    function openChat() {
      // The AI buddy (Cubey chat) is part of the one-time Premium purchase.
      if (!state.premium) { openChatLocked(); return; }
      buildChatShell();
      chatOpen = true;
      $("chatwrap").classList.add("on");
      setTimeout(() => { scrollToBottom(); const i = $("cin"); if (i) i.focus(); }, 60);
    }
    // Premium gate for the chat: shows the AI buddy behind a gold lock with an
    // upgrade CTA, so free users see the value but the chat itself stays paid.
    function openChatLocked() {
      const w = $("chatwrap");
      w.innerHTML =
        '<div class="chat chatlocked" id="chatbox">' +
          '<div class="ch"><div><div class="t">Cubey 🧊</div><div class="s">היועץ הפיננסי החכם שלך</div></div>' +
          '<button class="x" id="chx" aria-label="סגור">✕</button></div>' +
          '<div class="chlockbody"><div class="goldlock">🔒</div>' +
            '<h3>הצ׳אט עם Cubey הוא פיצ׳ר Premium</h3>' +
            '<p>שאל כל שאלה כספית, דווח על הוצאות בשפה חופשית ובקש פעולות אמיתיות — "תעביר 200 ₪ לקוביית טיול". Cubey מכיר את הקוביות שלך ועונה לפי המצב האמיתי.</p>' +
            '<button class="distbtn wide" id="chUp">👑 שדרוג ל-\u2066AI Premium · ₪110\u2069</button>' +
