    function closeChat() { chatOpen = false; $("chatwrap").classList.remove("on"); }
    function resetChat() {
      chatLog.length = 0; pendingAction = null; streaming = false;
      chatBuilt = false; chatOpen = false;
      const w = $("chatwrap"); w.classList.remove("on"); w.innerHTML = "";
    }

    function setTyping(on) {
      streaming = on;
      const s = $("chstate"); if (s) s.textContent = on ? "מקליד…" : "היועץ הפיננסי החכם שלך · מכיר את הקוביות";
      const i = $("cin"); if (i) i.disabled = on;
      const b = $("csend"); if (b) b.disabled = on;
    }

    function appendBubble(role, text) {
      const intro = $("chintro"); if (intro && role === "u") intro.remove();
      if (role === "u") { const sg = $("sugg"); if (sg) sg.classList.add("hidden"); }
      const b = el("div", "bubble " + (role === "u" ? "u" : "b"));
      b.textContent = text;
      $("msgs").appendChild(b);
      scrollToBottom();
      return b;
    }

    function showQuickButtons(buttons) {
      const holder = el("div", "qbtns");
      buttons.forEach((qb) => {
        const b = el("button", qb.kind === "danger" ? "qd" : "qp");
        b.textContent = qb.label;
        b.onclick = () => { if (streaming) return; holder.remove(); appendBubble("u", qb.label); botSay(qb.run()); };
        holder.appendChild(b);
      });
      $("msgs").appendChild(holder);
      scrollToBottom();
    }

    function send(text) {
      if (streaming) return;
      chatLog.push({ role: "u", text });
      appendBubble("u", text);
      botSay(respond(text));
    }

    // Stream a bot reply into a single bubble, then reveal optional buttons.
    function botSay(res) {
      const full = res.text || "";
      chatLog.push({ role: "b", text: full });
      const bubble = appendBubble("b", "");
      setTyping(true);
      let i = 0;
      const iv = setInterval(() => {
        i += 3;
        bubble.textContent = full.slice(0, i);
        scrollToBottom();
        if (i >= full.length) {
          clearInterval(iv);
          bubble.textContent = full;
          setTyping(false);
          if (res.quick && res.quick.length) showQuickButtons(res.quick);
          const inp = $("cin"); if (inp && chatOpen) inp.focus();
        }
      }, 16);
    }

    // =====================================================================
    // Worker 2 — conversational actions: "תכניס 200 ₪ לקוביית X".
    // Parses intent + amount + target cube; builds a funding plan that never
    // creates money out of nowhere (free pool first, then small proportional
    // deductions from other cubes); asks for confirmation before executing.
    // =====================================================================
    const CHAT_SYNONYMS = {
      lifestyle: ["בילויים", "פנאי", "בילוי", "כיף"],
      essentials: ["שוטף", "אוכל", "מכולת"],
      savings: ["חיסכון", "חסכון"],
      investments: ["השקעות", "השקעה"],
      housing: ["דיור", "שכירות"],
    };
    function findCubeByName(nameRaw) {
      const n = (nameRaw || "").trim();
      if (!n) return null;
      for (const c of state.cubes) if (c.name === n || c.name.includes(n) || n.includes(c.name)) return c;
      for (const key in CHAT_SYNONYMS)
        if (CHAT_SYNONYMS[key].some((s) => n.includes(s))) { const c = state.cubes.find((x) => x.key === key); if (c) return c; }
      return null;
    }

    // Free pool first, then spread the remainder across donor cubes
    // proportionally to their balances (so no single cube takes the whole hit).
    function buildFundingPlan(amount, excludeKey) {
      const sources = [];
      let remaining = amount;
      if (state.pool > 0 && remaining > 0) {
        const take = Math.min(state.pool, remaining);
        sources.push({ key: "__pool", name: "היתרה הפנויה", amount: take });
        remaining -= take;
      }
      if (remaining <= 0) return sources;
      const order = ["lifestyle", "essentials", "savings", "investments"];
      const ok = (c) => c && c.key !== excludeKey && !c.locked && c.balance > 0;
      const baseDonors = order.map((k) => state.cubes.find((c) => c.key === k)).filter(ok);
      // personal-goal cubes are only tapped if the base cubes can't cover it
      let donors = baseDonors;
      if (baseDonors.reduce((s, d) => s + d.balance, 0) < remaining) {
        donors = baseDonors.concat(state.cubes.filter((c) => c.custom).filter(ok));
      }
      const totalAvail = donors.reduce((s, d) => s + d.balance, 0);
      if (totalAvail < remaining) return null; // not enough money anywhere
      const takes = donors.map((d) => Math.min(d.balance, Math.floor(remaining * d.balance / totalAvail)));
      let leftover = remaining - takes.reduce((s, t) => s + t, 0);
      for (let i = 0; i < donors.length && leftover > 0; i++) {
        const room = donors[i].balance - takes[i];
        const add = Math.min(room, leftover);
        takes[i] += add; leftover -= add;
      }
      donors.forEach((d, i) => { if (takes[i] > 0) sources.push({ key: d.key, name: d.name, amount: takes[i] }); });
      return sources;
    }

    function describeSources(sources) {
      return sources.map((s) => "₪" + fmt(s.amount) + " מ" + (s.key === "__pool" ? "היתרה הפנויה" : '"' + s.name + '"')).join(" ו־");
    }
    function confirmButtons() {
      return [
        { label: "לאשר ✓", run: () => { const a = pendingAction; pendingAction = null; return a ? execFunding(a) : { text: "אין פעולה ממתינה 🙂" }; } },
        { label: "ביטול", kind: "danger", run: () => { pendingAction = null; return { text: "בוטל 👍 לא שיניתי כלום." }; } },
      ];
    }

    function respond(text) {
      const q = text.toLowerCase();
      const cubes = state.cubes;
      const byKey = Object.fromEntries(cubes.map((c) => [c.key, c]));
      const total = totalBalance();
      const num = (text.replace(/,/g, "").match(/(\d+)/) || [])[1];

      // 0. A funding action is waiting for confirmation.
      if (pendingAction) {
        if (/^(כן|לאשר|אשר|מאשר|בצע|אוקיי|יאללה|ok)/.test(q.trim())) {
          const a = pendingAction; pendingAction = null; return execFunding(a);
        }
        if (/(לא|בטל|ביטול|עזוב)/.test(q)) { pendingAction = null; return { text: "בוטל 👍 לא שיניתי כלום." }; }
        return { text: 'יש פעולה שממתינה לאישור — אפשר ללחוץ על הכפתור או לכתוב "לאשר" / "ביטול" 🙂', quick: confirmButtons() };
      }

      // 1. Funding command: "תכניס 200 שקל לקוביית שיעורי נהיגה"
      const fund = text.match(/(?:תכניס|תעביר|הוסף|תוסיף|העבר|שים)\s+([\d,]+)\s*(?:שקלים|שקל|ש"ח|שח|₪)?\s+ל(.+)/);
      if (fund) {
        const amount = Number(fund[1].replace(/,/g, ""));
        const name = fund[2].trim()
          .replace(/^(קוביית|קובית|קובייה|קוביה)\s+/, "")
          .replace(/["'.!?]+$/g, "");
        if (!(amount > 0)) return { text: 'לא הבנתי את הסכום 🙂 נסה למשל: "תכניס 200 ₪ לחיסכון".' };
        const target = findCubeByName(name);
        if (target && target.locked) return { text: 'קוביית "' + target.name + '" נעולה על הוצאות הדיור הקבועות — אי אפשר להעביר אליה ידנית 🔒' };
        const plan = buildFundingPlan(amount, target ? target.key : null);
        if (!plan) { const movable = state.pool + state.cubes.filter((c) => !c.locked).reduce((s, c) => s + c.balance, 0);
          return { text: "אין מספיק כסף פנוי — ניתן להעביר בסך הכל ₪" + fmt(movable) + " (מקוביות לא נעולות ומהיתרה). אפשר קודם לחלק כסף לתקציב 🙂" }; }
        pendingAction = { sources: plan, amount: amount, targetKey: target ? target.key : null, createName: target ? null : name };
        const head = target ? "" : 'אין עדיין קובייה בשם "' + name + '", אז אצור אותה. ';
        return {
          text: head + "בטח! אקח " + describeSources(plan) + " ואעביר ₪" + fmt(amount) + ' ל"' + (target ? target.name : name) + '". לאשר?',
          quick: confirmButtons(),
        };
      }

      // 2. Affordability
      if (/(afford|אפשר להרשות|יכול להרשות|אפשר לקנות)/.test(q) && num) {
        const amount = Number(num);
        const life = byKey.lifestyle;
        if (!life) return { text: 'עדיין לא חילקת את הכסף לקוביות 🙂 לחץ/י על "חלק לתקציב".' };
        if (amount <= life.balance)
          return { text: "כן! 🎉 הוצאה של ₪" + fmt(amount) + ' מקוביית "בילויים ופנאי" (יתרה ₪' + fmt(life.balance) + ") משאירה לך ₪" + fmt(life.balance - amount) + " שם. אפשר בשקט." };
        if (amount <= total)
          return { text: "קצת גבולי — בקוביית הבילויים יש רק ₪" + fmt(life.balance) + ". יש לך ₪" + fmt(total) + " בסך הכל, אז אם ממש צריך קח את ההפרש מהחיסכון במודע." };
        return { text: "הייתי אומר לא כרגע. ₪" + fmt(amount) + " זה יותר מכל היתרה שלך (₪" + fmt(total) + ")." };
      }

      // 3. Expense report
      if (/(בזבזתי|הוצאתי|קניתי|שילמתי|spent)/.test(q) && num) {
        const life = byKey.lifestyle || cubes.find((c) => c.key !== "housing");
        if (life) { life.balance = Math.max(0, life.balance - Number(num)); syncAfterChange([life.key]); }
        return { text: "רשמתי ✅ הורדתי ₪" + fmt(Number(num)) + ' מקוביית "' + (life ? life.name : "") + '". היתרה החדשה: ₪' + fmt(life ? life.balance : 0) + "." };
      }

      // 4. Status
      if (/(מצב|סטטוס|כמה יש|how|status|doing)/.test(q)) {
        const low = [...cubes].sort((a, b) => a.balance - b.balance)[0];
        return { text: "סה״כ בקוביות: ₪" + fmt(total) + "." + (low ? ' הקובייה הכי נמוכה כרגע: "' + low.name + '" עם ₪' + fmt(low.balance) + "." : "") };

      if (/^(היי|הי|שלום|מה קורה|hi|hey|hello)/.test(q))
        return { text: "היי! 👋 אני Cubey. יש לך ₪" + fmt(total) + ' בקוביות. אפשר לשאול "אפשר להרשות 300 ₪?", לדווח "בזבזתי 200 ₪", או לבקש "תכניס 100 ₪ לחיסכון".' };

      // 6. Fallback
      return { text: "אני Cubey 🧊 — רואה את הקוביות שלך (סה״כ ₪" + fmt(total) + '). נסה: "אפשר להרשות 500 ₪?", "בזבזתי 200 ₪", או "תכניס 100 ₪ לחיסכון".' };
    }

    function execFunding(a) {
      // invariant: money is moved, never created — total (cubes + pool) is preserved
      const before = Math.round(totalBalance() + state.pool);
      a.sources.forEach((s) => {
        if (s.key === "__pool") state.pool = Math.max(0, state.pool - s.amount);

    // =====================================================================
    // MODULE 1 — AI Debt & Savings Optimizer.
    // A real month-by-month amortization simulation implementing the Debt
    // Avalanche (highest APR first) and Snowball (lowest balance first) methods,
    // compared against a naive even-split baseline to quantify interest saved.
    // =====================================================================
    // simulate paying a fixed monthly budget with a given priority order.
    function simulateDebts(debts, budget, mode) {
      budget = Math.max(0, +budget || 0); // a negative budget must never grow a debt
      const ds = debts.map((d) => ({ name: d.name, bal: +d.balance, rate: +d.rate }));
      let order;
      if (mode === "snowball") order = [...ds].sort((a, b) => a.bal - b.bal).map((d) => d.name);
      else if (mode === "avalanche") order = [...ds].sort((a, b) => b.rate - a.rate).map((d) => d.name);
      else order = null; // even-split baseline
      let months = 0, interest = 0;
      const payoff = [];
      const CAP = 1200;
      while (ds.some((d) => d.bal > 0.01) && months < CAP) {
        months++;
        // accrue one month of interest on every outstanding balance
        ds.forEach((d) => { if (d.bal > 0) { const i = d.bal * (d.rate / 100 / 12); d.bal += i; interest += i; } });
        let avail = budget;
        if (order) {
          for (const name of order) {
            const d = ds.find((x) => x.name === name);
            if (!d || d.bal <= 0) continue;
            const pay = Math.min(d.bal, avail);
            d.bal -= pay; avail -= pay;
            if (d.bal <= 0.01 && !payoff.find((p) => p.name === name)) payoff.push({ name: name, month: months });
            if (avail <= 0) break;
          }
        } else {
          const active = ds.filter((d) => d.bal > 0);
          const share = budget / active.length;
          active.forEach((d) => { d.bal -= Math.min(d.bal, share); });
        }
      }
      const payable = ds.every((d) => d.bal <= 0.02);
      return { months: payable ? months : Infinity, interest: Math.round(interest), payoff: payoff, payable: payable, order: order };
    }
    function runOptimizer(debts, budget, mode) {
      const opt = simulateDebts(debts, budget, mode);
      const base = simulateDebts(debts, budget, null); // naive even split
      return {
        opt: opt, base: base,
        monthsSaved: (base.payable && opt.payable) ? base.months - opt.months : null,
        interestSaved: (base.payable && opt.payable) ? Math.max(0, base.interest - opt.interest) : null,
        firstTarget: opt.order ? opt.order[0] : null,
      };
    }

    let debtDraft = { name: "", balance: "", rate: "", type: "credit", unknown: false };
    let debtBudget = "";
    let debtMode = "avalanche";
    let debtResult = null;
    function renderDebtPage() {

    //   שופרסל / יוחננוף / רמי לוי  → קוביית אוכל (essentials)
    //   עירייה / ארנונה / חברת החשמל → חשבונות קבועים (housing/bills)
    //   משכורת / העברה נכנסת        → הכנסה (income)
    const INCOME_RE = /(משכורת|שכר עבודה|העברה נכנסת|זיכוי|החזר מס|מענק|קצבה|מלגה)/;
    const BANK_RULES = [
      { re: /(שכר דירה|ארנונה|עירייה|חברת החשמל|חשמל|בזק|הוט|פרטנר|סלקום|גולן|ועד בית|מים|תאגיד מים|גז)/, cube: "housing" },
      { re: /(נטפליקס|ספוטיפיי|ספוטיפי|דיסני|yes|youtube premium|מנוי)/i, cube: "lifestyle", sub: true },
      { re: /(שופרסל|יוחננוף|רמי לוי|ויקטורי|יינות ביתן|טיב טעם|אושר עד|סופר|פארם|מכולת|יינות)/, cube: "essentials" },
      { re: /(קפה|מסעד|וולט|wolt|בר |פאב|סינמה|זארה|castro|ביגוד|אופנה|בגדים|קניון|נעל)/i, cube: "lifestyle" },
    ];
    // AGENT 3 — robust, HEADER-AWARE parser for real-world CSV exports.
    // Tolerates BOM, CRLF endings, quoted cells, currency symbols and
    // thousands separators. Detects the common Israeli-bank column layouts:
    //   • single signed "סכום" column (positive = credit, negative = debit)
    //   • split "חובה"/"זכות" (debit / credit) columns
    // It locates the "תיאור" (description) column by header name, and falls
    // back to positional order (date,desc,amount) when there is no header row.
    function splitCSVLine(line, delim) {
      // quoted-CSV splitter so the delimiter inside "..." doesn't break cells.
      // delim is auto-detected per file (real Israeli exports often use ";" or TAB).
      delim = delim || ",";
      const out = []; let cur = "", q = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
        else if (ch === delim && !q) { out.push(cur); cur = ""; }
        else cur += ch;

      out.push(cur);
      return out.map((x) => x.replace(/^["\s]+|["\s]+$/g, ""));
    }
    // Pick the delimiter that most consistently splits the data lines. Excel in
    // a Hebrew locale saves CSV with ";", and some banks export TAB-separated.
    function detectDelimiter(lines) {
      const cands = [";", "\t", ",", "|"];
      let best = ",", bestScore = -1;
      cands.forEach((d) => {
        const counts = lines.map((l) => l.split(d).length - 1).filter((c) => c > 0);
        if (counts.length < Math.max(1, lines.length * 0.4)) return;
        counts.sort((a, b) => a - b);
        const med = counts[Math.floor(counts.length / 2)];
        const score = med * counts.length;
        if (score > bestScore) { bestScore = score; best = d; }
      });
      return best;
    }
    // Robust number parser: handles ₪/spaces, US "1,234.56" and European
    // "1.234,56" thousands/decimal conventions, and parentheses-for-negative.
    function toNum(s) {
      s = String(s == null ? "" : s).trim();
      if (!s) return 0;
      const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s); // leading/trailing sign only
      s = s.replace(/[^\d.,]/g, "");
      if (!s) return 0;
      if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
        else s = s.replace(/,/g, "");
      } else if (s.indexOf(",") > -1) {
        const parts = s.split(",");
        if (parts.length === 2 && parts[1].length <= 2) s = parts[0] + "." + parts[1]; // decimal comma
        else s = s.replace(/,/g, ""); // thousands
      }
      let n = Number(s);
      if (isNaN(n)) n = 0;
      return neg ? -Math.abs(n) : n;
    }
    function isNumericCell(s) {
      s = String(s == null ? "" : s).trim();
      if (!s) return false;
      if (/^\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?$/.test(s)) return false; // a date, not a number
      const n = s.replace(/[^0-9.\-]/g, "");
      return n !== "" && /\d/.test(s) && !isNaN(Number(n));
    }
    function isDateCell(s) { return /^\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?$/.test(String(s || "").trim()); }
    function hasLetter(s) { return /[A-Za-z֐-׿]/.test(String(s || "")); }

    // Header synonyms across the common Israeli banks (Leumi / Hapoalim / Discount / Mizrahi …)
    const H_DESC = /(תיאור|תאור|פירוט|פרטים|שם בית העסק|בית עסק|תנועה|פעולה|הפעולה|העסקה)/;
    const H_DATE = /(תאריך|ת\.? ?ערך|יום)/;
    const H_AMOUNT = /(^\s*סכום|סכום התנועה|סכום העסקה|סכום בש|סכום חיוב|סכום זיכוי)/;
    const H_DEBIT = /(חובה|בחובה|^\s*חיוב\s*$|משיכה|יצא)/;
    const H_CREDIT = /(זכות|בזכות|^\s*זיכוי\s*$|הפקדה|נכנס)/;
    const H_BALANCE = /(יתרה)/;

    // AGENT 3 — robust, DATA-AWARE parser for real-world CSV exports.
    // 1. Splits quoted CSV (commas inside "..." are safe), strips BOM/CRLF/₪/thousands.
    // 2. If a header row exists, maps columns BY NAME (description, date, signed
    //    amount, or split חובה/זכות) and never mistakes a יתרה (balance) column
    //    for the amount.
    // 3. If there is NO header, it INFERS the columns from the data itself —
    //    the text column is the description, date-shaped column is the date,
    //    a cumulative always-filled numeric column is the balance (ignored),
    //    and the remaining numeric column(s) are the amount / debit+credit.
    //    This is what stops a plain "date,desc,debit,credit,balance" export from
    //    being misread as pure income.
    function inferLayout(rows) {
      const cols = Math.max.apply(null, rows.map((r) => r.length));
      const stat = [];
      for (let c = 0; c < cols; c++) {
        let numeric = 0, letters = 0, dates = 0, filled = 0, signed = 0, sumAbs = 0;
        rows.forEach((r) => {
          const cell = (r[c] == null ? "" : r[c]).trim();
          if (cell) filled++;
          if (isDateCell(cell)) dates++;
          else if (isNumericCell(cell)) { numeric++; const v = toNum(cell); sumAbs += Math.abs(v); if (v < 0 || /-/.test(cell)) signed++; }
          else if (cell && hasLetter(cell)) letters++;
        });
        stat.push({ c: c, numeric: numeric, letters: letters, dates: dates, filled: filled, signed: signed, avgAbs: numeric ? sumAbs / numeric : 0 });
      }
      const n = rows.length;
      const dateI = (stat.filter((s) => s.dates >= n * 0.6).sort((a, b) => b.dates - a.dates)[0] || {}).c;
      const descI = (stat.filter((s) => s.c !== dateI && s.letters >= s.numeric).sort((a, b) => b.letters - a.letters)[0] || {}).c;
      // A "number column" contains numbers and no free text — even a sparse
      // credit column that only holds the monthly salary counts.
      let numCols = stat.filter((s) => s.c !== dateI && s.c !== descI && s.numeric >= 1 && s.letters === 0 && s.numeric >= s.filled * 0.8);
      // a balance column is filled on (almost) every row and carries the largest values
      let balanceI = -1;
      if (numCols.length > 1) {
        const cand = numCols.slice().sort((a, b) => (b.filled - a.filled) || (b.avgAbs - a.avgAbs))[0];
        if (cand && cand.filled >= n * 0.9 && cand.avgAbs >= Math.max.apply(null, numCols.map((x) => x.avgAbs)) * 0.9)
          balanceI = cand.c;
      }
      numCols = numCols.filter((s) => s.c !== balanceI);
      // date defaults to -1 (no date) rather than colliding with the desc column
      const layout = { date: dateI == null ? -1 : dateI, desc: descI == null ? 1 : descI, mode: "signed", amount: -1, debit: -1, credit: -1, signedCol: false };
      if (numCols.length >= 2) {
        // two amount columns with mostly-exclusive fills → debit then credit (Israeli order)
        numCols.sort((a, b) => a.c - b.c);
        layout.mode = "split"; layout.debit = numCols[0].c; layout.credit = numCols[1].c;
      } else if (numCols.length === 1) {
        layout.mode = "signed"; layout.amount = numCols[0].c; layout.signedCol = numCols[0].signed > 0;
      } else {
        layout.mode = "signed"; layout.amount = 2; layout.signedCol = false;
      }
      return layout;
    }
    function mapHeader(first) {
      const find = (re) => first.findIndex((c) => re.test(c));
      const dateI = find(H_DATE), descI = find(H_DESC);
      const amtI = first.findIndex((c) => H_AMOUNT.test(c) && !H_BALANCE.test(c));
      const debI = first.findIndex((c) => H_DEBIT.test(c) && !H_BALANCE.test(c) && !H_AMOUNT.test(c));
      const creI = first.findIndex((c) => H_CREDIT.test(c) && !H_BALANCE.test(c) && !H_AMOUNT.test(c));
      // date defaults to -1 (no date) rather than colliding with column 0 / the desc
      const layout = { date: dateI >= 0 ? dateI : -1, desc: descI >= 0 ? descI : 1, mode: "signed", amount: -1, debit: -1, credit: -1, signedCol: true };
      if (debI >= 0 && creI >= 0) { layout.mode = "split"; layout.debit = debI; layout.credit = creI; }
      else if (amtI >= 0) { layout.mode = "signed"; layout.amount = amtI; }
      else if (debI >= 0) { layout.mode = "debitOnly"; layout.debit = debI; }
      else if (creI >= 0) { layout.mode = "creditOnly"; layout.credit = creI; }
      else { layout.mode = "signed"; layout.amount = 2; }
      return layout;
    }
    function parseBankCSV(csv) {
      let lines = String(csv).replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim() !== "");
      if (!lines.length) return [];
      const delim = detectDelimiter(lines);
      let rows = lines.map((l) => splitCSVLine(l, delim));
      // Trim preamble/footer junk (bank name, account no, blank separators):
      // keep only the rows whose column count matches the table's dominant width.
      const widths = {};
      rows.forEach((r) => { widths[r.length] = (widths[r.length] || 0) + 1; });
      let tableW = 2, wBest = 0;
      Object.keys(widths).forEach((w) => { if (+w >= 2 && widths[w] > wBest) { wBest = widths[w]; tableW = +w; } });
      if (tableW >= 2) rows = rows.filter((r) => r.length >= tableW - 1 && r.length <= tableW + 1);
      if (!rows.length) return [];
      const first = rows[0];
      const headerish = first.some((c) => H_DESC.test(c)) &&
        first.some((c) => H_AMOUNT.test(c) || H_DEBIT.test(c) || H_CREDIT.test(c) || H_BALANCE.test(c)) &&
        !first.some((c) => isNumericCell(c));
      let layout, dataRows;
      if (headerish) { layout = mapHeader(first); dataRows = rows.slice(1); }
      else { layout = inferLayout(rows); dataRows = rows; }
      // Detect whether a single signed-amount column actually carries any signs.
      // If every value is positive (whether or not there was a header — e.g. a
      // payslip-style "סכום" column that is all positive) we sign each row by
      // its description keywords instead of treating everything as income.
      let anyNegative = false;
      if (layout.mode === "signed" && layout.amount >= 0) {
        anyNegative = dataRows.some((r) => toNum(r[layout.amount]) < 0);
      }
      return dataRows.map((parts) => {
        if (parts.length < 2) return null;
        const desc = parts[layout.desc] != null ? parts[layout.desc] : "";
        if (!desc || (!hasLetter(desc) && layout.desc !== 1)) return null;
        let amount = 0;
        if (layout.mode === "split") {
          const debit = layout.debit >= 0 ? Math.abs(toNum(parts[layout.debit])) : 0;
          const credit = layout.credit >= 0 ? Math.abs(toNum(parts[layout.credit])) : 0;
          amount = credit - debit; // זכות (credit)=income(+), חובה (debit)=spend(−)
        } else if (layout.mode === "debitOnly") {
          amount = -Math.abs(toNum(parts[layout.debit]));
        } else if (layout.mode === "creditOnly") {
          amount = Math.abs(toNum(parts[layout.credit]));
        } else if (layout.amount >= 0) {
          amount = toNum(parts[layout.amount]);
          // unsigned single-column export → sign by keyword (income keywords = +, else −)
          if (amount > 0 && !anyNegative) amount = INCOME_RE.test(desc) ? amount : -amount;
        }
        if (amount !== 0 && INCOME_RE.test(desc)) amount = Math.abs(amount); // salary/refund is always income
        return { date: parts[layout.date] != null ? parts[layout.date] : "", desc: desc, amount: amount };
      }).filter((t) => t && t.desc && !isNaN(t.amount) && t.amount !== 0);
    }
    function analyzeStatement(csv) {
      const txns = parseBankCSV(csv);
      const income = txns.filter((t) => t.amount > 0).reduce((s, t) => s + t.amount, 0);
      const expenses = txns.filter((t) => t.amount < 0);
      const totalOut = expenses.reduce((s, t) => s - t.amount, 0);

      // categorize
      const byCube = {}, subs = [];
      expenses.forEach((t) => {
        const rule = BANK_RULES.find((r) => r.re.test(t.desc));
        const cube = cubeFor(rule ? rule.cube : "essentials"); // housing -> bills/landlord fallback
        (byCube[cube] = byCube[cube] || { total: 0, count: 0, txns: [] });
        byCube[cube].total += -t.amount; byCube[cube].count++; byCube[cube].txns.push(t);
        if (rule && rule.sub) subs.push(t);
      });

      // insights — all computed from the data
      const insights = [];
      const seen = {};
      expenses.forEach((t) => {
        const k = t.desc + "|" + t.amount;
        seen[k] = (seen[k] || 0) + 1;
      });
      Object.keys(seen).forEach((k) => {
        if (seen[k] >= 2) {
          const parts = k.split("|");
          insights.push({ kind: "warn", text: 'זיהיתי חיוב כפול החודש: "' + parts[0] + '" (₪' + fmt(-parts[1]) + ' × ' + seen[k] + ') — מומלץ לבדוק מול הספק.' });
        }
      });
      subs.forEach((t) => {
        insights.push({ kind: "info", text: 'זיהיתי מינוי פעיל: ' + t.desc + ' (₪' + fmt(-t.amount) + '/חודש) — שויך אוטומטית כהוצאה קבועה בקוביית הבילויים.' });
      });
      const avgExp = totalOut / Math.max(1, expenses.length);
      expenses.filter((t) => -t.amount >= 1000 && !/שכר דירה/.test(t.desc)).forEach((t) => {
        insights.push({ kind: "warn", text: 'הוצאה חריגה: ' + t.desc + ' ₪' + fmt(-t.amount) + ' — גבוהה פי ' + Math.round(-t.amount / avgExp) + ' מהממוצע החודשי לתנועה.' });
      });
      const net = income - totalOut;
      if (net > 0) insights.push({ kind: "info", text: 'נשאר לך עודף של ₪' + fmt(net) + ' החודש — מומלץ להעביר אותו לקוביית החיסכון.' });
      else insights.push({ kind: "warn", text: 'הוצאת ₪' + fmt(-net) + ' יותר ממה שנכנס החודש — האיזון האוטומטי יסייע למנוע מינוס.' });

      return { txns: txns, income: income, totalOut: totalOut, net: net, byCube: byCube, insights: insights };
    }
    // Automated re-balancing: top up each cube so it can cover its real-world
    // spending this month. Money is only ever pulled from the free pool and from
    // cubes that hold MORE than their own spending need — a cube that is itself
    // short is never used as a donor, so money never shuttles in circles.
    // Returns { moves, fullyCovered }.
    function rebalanceFromBank(report) {
      const moves = [];
      const targets = {};
      Object.keys(report.byCube).forEach((k) => { targets[k] = Math.round(report.byCube[k].total); });
      // Donors: surplus above each cube's own spending need (locked cubes never give).
      const donors = [];
      state.cubes.forEach((c) => {
        if (c.locked) return;
        const surplus = c.balance - (targets[c.key] || 0);
        if (surplus > 0) donors.push({ cube: c, avail: surplus });
      });
      const deficits = state.cubes
        .map((c) => ({ cube: c, gap: Math.round((targets[c.key] || 0) - c.balance) }))
        .filter((d) => d.gap > 0);
      let fullyCovered = true;
      deficits.forEach((d) => {
        let need = d.gap;
        if (state.pool > 0 && need > 0) {
          const take = Math.min(state.pool, need);
          state.pool -= take; need -= take; d.cube.balance += take;
          moves.push({ from: "היתרה הפנויה", to: d.cube.name, amount: take });
        }
        for (let i = 0; i < donors.length && need > 0; i++) {
          const src = donors[i];
          if (src.avail <= 0 || src.cube === d.cube) continue;
          const take = Math.min(src.avail, need);
          src.avail -= take; need -= take; src.cube.balance -= take; d.cube.balance += take;
          moves.push({ from: src.cube.name, to: d.cube.name, amount: take });
        }
        if (need > 0) fullyCovered = false; // the money genuinely isn't there

      return { moves: moves, fullyCovered: fullyCovered };
    }

    let bankData = null, bankPhase = "idle", bankReport = null, bankMoves = null;
    function startBankCSV(label, csv) {
      if (bankPhase === "proc") return;
      if (parseBankCSV(csv).length === 0) { showToast("לא הצלחתי לקרוא תנועות מהקובץ 😕 ודאו שיש עמודות של תאריך, תיאור וסכום (או חובה/זכות). מפריד פסיק, נקודה-פסיק או טאב — הכול נתמך."); return; }

        bankPhase = "done";
        state.game.flags.bank = true; saveState();

    }
    function startBankProcess(id) { startBankCSV(BANK_FILES[id].label, BANK_FILES[id].csv); }
    function renderBankPage() {
      const body = pageShell("ניהול עו״ש אוטומטי 🏦", () => { bankData = null; bankPhase = "idle"; bankReport = null; bankMoves = null; state.screen = "app"; render(); });
      const locked = applyPremiumLock(body); // strict lock when isPremiumUser === false

      const dz = el("div", "dropzone" + (bankPhase === "proc" ? " busy" : ""));
      dz.innerHTML = '<span class="dzi">📄</span><b>העלאת קובץ תנועות עו״ש (CSV)</b>' +
        '<span class="dzs">גררו לכאן קובץ CSV מהבנק או לחצו לבחירה · תומך בכל בנק ישראלי (פסיק / נקודה-פסיק / טאב, כולל עמודות חובה/זכות)</span>' +
        '<input type="file" id="bankFileIn" accept=".csv,text/csv" hidden>';
      const fin = dz.querySelector("#bankFileIn");
      const readRealFile = (file) => {
        if (!file) return;
        if (!state.premium) { showToast("🔒 העלאת קובץ אמיתי היא פיצ׳ר Premium"); return; }
        if (/\.xlsx?$/i.test(file.name)) { showToast("קובץ Excel — ייצאו מאתר הבנק כ-CSV (או שמרו מ-Excel בפורמט CSV) ולאחר מכן העלו 🙂"); return; }
        const reader = new FileReader();
        reader.onload = () => {
          // Decode robustly: try UTF-8, and if it produced replacement characters
          // fall back to Windows-1255 (the legacy Hebrew encoding some banks use),
          // so descriptions aren't gibberish.
          let text;
          try {
            const buf = new Uint8Array(reader.result);
            text = new TextDecoder("utf-8").decode(buf);
            if (/�/.test(text)) { try { text = new TextDecoder("windows-1255").decode(buf); } catch (e) {} }
          } catch (e) { text = String(reader.result); }
          secLog("INFO", 'נקרא קובץ מקומי "' + file.name + '" (' + file.size + ' בתים) דרך FileReader');
          startBankCSV(file.name, text);
        };
        reader.onerror = () => showToast("קריאת הקובץ נכשלה");
        reader.readAsArrayBuffer(file);
      };
      dz.onclick = (e) => { if (e.target !== fin) fin.click(); };
      fin.onchange = () => { readRealFile(fin.files[0]); fin.value = ""; };
      dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); };
      dz.ondragleave = () => dz.classList.remove("over");
      dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("over"); readRealFile(e.dataTransfer.files && e.dataTransfer.files[0]); };
      body.appendChild(dz);

      const files = el("div", "bankfiles");
      Object.keys(BANK_FILES).forEach((id) => {
        const f = el("button", "bankfile" + (bankData && bankData.label === BANK_FILES[id].label ? " on" : ""));
        f.innerHTML = '<span>📑</span><b>' + BANK_FILES[id].label + '</b>';
        f.onclick = () => startBankProcess(id);
        files.appendChild(f);
      });
      body.appendChild(files);

      if (bankPhase === "proc") {
        const pr = el("div", "setcard procbox");
        pr.innerHTML = '<div class="procbar"><i></i></div><div class="proclbl">🤖 סוכן ה-AI קורא את הקובץ, מזהה תבניות ומסווג ' + parseBankCSV(bankData.csv).length + ' תנועות…</div>';
        body.appendChild(pr);
        return;
      }
      if (bankPhase !== "done" || !bankReport) return;
      const r = bankReport;

      // summary — big live metrics computed straight from the CSV math
      const st0 = el("div", "section-t"); st0.textContent = "סיכום " + bankData.label.replace(/\.csv$/i, ""); body.appendChild(st0);
      const bigm = el("div", "bankbig");
      bigm.innerHTML =
        '<div class="bankmetric inc"><span>סך הכנסות</span><b>' + fmt(r.income) + ' ₪</b></div>' +
        '<div class="bankmetric exp"><span>סך הוצאות</span><b>' + fmt(r.totalOut) + ' ₪</b></div>';

        '<b>' + (r.net >= 0 ? "+" : "−") + fmt(Math.abs(r.net)) + ' ₪</b>';

      // transparent transaction ledger — every row parsed from the CSV, so the

      const stT = el("div", "section-t"); stT.textContent = "התנועות שנקראו מהקובץ 🧾"; body.appendChild(stT);

      // auto-categorization
      const st1 = el("div", "section-t"); st1.textContent = "סיווג אוטומטי לקוביות"; body.appendChild(st1);
      const catbox = el("div", "setcard");
      Object.keys(r.byCube).forEach((k) => {
        const meta = META[k] || { name: k, emoji: "🧊", color: "var(--primary)" };

        const row = el("div", "catrow");
        row.innerHTML = '<span class="catname">' + meta.emoji + " " + meta.name + ' <i>(' + r.byCube[k].count + ' תנועות)</i></span>' +
          '<div class="cattrack"><i style="width:0%;background:' + meta.color + '"></i></div>' +
          '<span class="catamt">₪' + fmt(r.byCube[k].total) + '</span>';

      // AI insights

      r.insights.forEach((ins) => {

      // automated re-balancing
      if (!bankMoves) {

        btn.onclick = () => {
          bankMoves = rebalanceFromBank(r);
          syncAfterChange(bankMoves.moves.map((m) => m.to));
          saveState();
          render();
        };
        body.appendChild(btn);
      } else {
        const done = el("div", bankMoves.fullyCovered ? "wisafe" : "wiwarn");
        done.innerHTML = !bankMoves.moves.length
          ? "✅ לא נדרש איזון — כל הקוביות כבר מכסות את ההוצאות בפועל."
          : bankMoves.fullyCovered
            ? "✅ בוצע איזון — הועבר כסף מקוביות עודפות ומהיתרה הפנויה כדי לכסות את ההוצאות בפועל."
            : "⚠️ בוצע איזון חלקי — הועבר כל הכסף הזמין מקוביות עודפות, אך ההוצאות החודש גבוהות מסך היתרות. שקלו לצמצם הוצאות או להגדיל הכנסה.";

    // =====================================================================
    // Worker 1 — Gamification: live challenges, badges grid, claim rewards.
    // Challenge progress is DERIVED live from the real cube balances, so the
    // tracker always reflects the current financial state.
    // =====================================================================
    function challengeDefs() {
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const life = by.lifestyle, sav = by.savings, inv = by.investments;
      const lifeRatio = life && life.amount > 0 ? life.balance / life.amount : 0;
      return [
        { id: "secret", emoji: "🤫", title: "אתגר הקובייה הסודית", desc: "לשמור לפחות 60% מקוביית הבילויים", reward: 50,
          progress: Math.min(1, lifeRatio / 0.6), done: lifeRatio >= 0.6 },
        { id: "saver1k", emoji: "💰", title: "האלף הראשון", desc: "לצבור ₪1,000 בקוביית החיסכון", reward: 40,
          progress: sav ? Math.min(1, sav.balance / 1000) : 0, done: !!sav && sav.balance >= 1000 },
        { id: "goal", emoji: "🎯", title: "יעד אישי בתנועה", desc: "ליצור קובייה אישית ולהכניס אליה כסף", reward: 30,
          progress: state.cubes.some((c) => c.custom && c.balance > 0) ? 1 : (state.cubes.some((c) => c.custom) ? 0.5 : 0),
          done: state.cubes.some((c) => c.custom && c.balance > 0) },
        { id: "invest", emoji: "📈", title: "משקיע מתחיל", desc: "לצבור ₪500 בקוביית ההשקעות", reward: 30,
          progress: inv ? Math.min(1, inv.balance / 500) : 0, done: !!inv && inv.balance >= 500 },
      ];
    }
    function badgeDefs() {
      const g = state.game;
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const sav = by.savings;
      return [
        { emoji: "💎", name: "חוסך על", desc: "₪2,000 בחיסכון", progress: sav ? Math.min(1, sav.balance / 2000) : 0 },
        { emoji: "🧭", name: "מחשב מסלול מחדש", desc: "העברת כסף בין קוביות בצ׳אט", progress: g.flags.funded ? 1 : 0 },
        { emoji: "🧱", name: "בנאי קוביות", desc: "יצירת קובייה אישית", progress: state.cubes.some((c) => c.custom) ? 1 : 0 },
        { emoji: "🕶️", name: "צל פיננסי", desc: "הפעלת מצב סמוי", progress: g.flags.incog ? 1 : 0 },
        { emoji: "🪙", name: "מחלק אלוף", desc: "חלוקת תקציב לקוביות", progress: (g.flags.dist || totalBalance() > 0) ? 1 : 0 },
        { emoji: "📜", name: "האותיות הקטנות", desc: "קריאת התקנון", progress: g.flags.terms ? 1 : 0 },
      ];
    }
    function claimReward(ch) {
      state.game.claimed[ch.id] = true;
      state.game.points += ch.reward;
      saveState();
      burstCoins("⭐");
      showToast("🎁 +" + ch.reward + " נק׳ — האתגר הושלם!");
      render();
    }
    function renderChallengesPage() {
      const body = pageShell("אתגרים 🏆", () => { state.screen = "app"; render(); });
      const pts = el("div", "setcard ptsrow");
      pts.innerHTML = '<div><div class="setlbl">הנקודות שלך</div><div class="ptsval">' + fmt(state.game.points) + ' ⭐</div></div>' +
        '<div class="setlbl">השלם אתגרים כדי לצבור נקודות ומדליות</div>';
      body.appendChild(pts);

      const st1 = el("div", "section-t"); st1.textContent = "אתגרים פעילים"; body.appendChild(st1);
      challengeDefs().forEach((ch) => {
        const claimed = !!state.game.claimed[ch.id];
        const card = el("div", "chal" + (ch.done ? " done" : ""));
        card.innerHTML =
          '<div class="chtop"><span class="chemoji">' + ch.emoji + '</span>' +
          '<div class="chinfo"><b>' + ch.title + '</b><span>' + ch.desc + '</span></div>' +
          '<span class="chstatus">' + (claimed ? "נאסף ✓" : ch.done ? "הושלם!" : Math.round(ch.progress * 100) + "%") + '</span></div>' +
          '<div class="chtrack"><i style="width:0%"></i></div>';
        const bar = card.querySelector(".chtrack i");
        requestAnimationFrame(() => { bar.style.width = Math.round(ch.progress * 100) + "%"; });
        if (ch.done && !claimed) {
          const btn = el("button", "claimbtn"); btn.textContent = "🎁 קבל פרס (+" + ch.reward + " נק׳)";
          btn.onclick = () => claimReward(ch);
          card.appendChild(btn);
        }
        body.appendChild(card);
      });

      const st2 = el("div", "section-t"); st2.textContent = "מדליות והישגים"; body.appendChild(st2);
      const grid = el("div", "badges");
      badgeDefs().forEach((bd) => {
        const unlocked = bd.progress >= 1;
        const b = el("div", "badge" + (unlocked ? " open" : ""));
        b.innerHTML = '<span class="bemoji">' + bd.emoji + '</span><b>' + bd.name + '</b><span class="bdesc">' + bd.desc + '</span>' +
          (unlocked ? '<span class="bdone">הושג ✓</span>' : '<div class="btrack"><i style="width:' + Math.round(bd.progress * 100) + '%"></i></div>');
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }

    // =====================================================================
    // Worker 2 — Shared Cubes: create with mock friends, per-participant
    // progress, and instant updates. The user's own deposits are funded via
    // the same money-sound plan used by the chat (never invented money).
    // =====================================================================
    const FRIENDS = [
      { name: "יוסי", color: "#74B9FF" }, { name: "דנה", color: "#FD79A8" },
      { name: "נועה", color: "#55EFC4" }, { name: "אבי", color: "#FAB1A0" },
    ];
    let shForm = null; // {open, name, target, picked:Set}
    function renderSharedPage() {
      const body = pageShell("קוביות משותפות 🤝", () => { shForm = null; state.screen = "app"; render(); });

      const opener = el("button", "addcube");
      opener.innerHTML = '<span class="addicon">＋</span><span>צור קובייה משותפת</span>';
      opener.onclick = () => { shForm = { name: "", target: "", picked: new Set(["יוסי", "דנה"]) }; render(); };
      if (!shForm) body.appendChild(opener);

      if (shForm) {
        const f = el("div", "setcard");
        f.innerHTML = '<h3 style="margin:0 0 10px">קובייה משותפת חדשה</h3>' +
          '<label class="flbl">שם הקובייה</label><div class="fld"><input id="shName" placeholder="טיול חברים לאילת 2026" value="' + shForm.name + '"></div>' +
          '<label class="flbl">סכום יעד</label><div class="fld"><span class="cur">₪</span><input id="shTarget" inputmode="numeric" placeholder="5000" value="' + shForm.target + '"></div>' +
          '<label class="flbl">הזמן חברים</label><div class="frow" id="shFriends"></div>' +
          '<button class="distbtn wide" id="shCreate" style="margin-top:14px">צור ✨</button>' +
          '<button class="obback" id="shCancel">ביטול</button>';
        body.appendChild(f);
        const fr = f.querySelector("#shFriends");
        FRIENDS.forEach((p) => {
          const c = el("button", "fchip" + (shForm.picked.has(p.name) ? " on" : ""));
          c.textContent = p.name;
          c.style.setProperty("--fc", p.color);
          c.onclick = () => { shForm.picked.has(p.name) ? shForm.picked.delete(p.name) : shForm.picked.add(p.name); c.classList.toggle("on"); };
          fr.appendChild(c);
        });
        f.querySelector("#shName").oninput = (e) => { shForm.name = e.target.value; };
        f.querySelector("#shTarget").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); shForm.target = e.target.value; };
        f.querySelector("#shCancel").onclick = () => { shForm = null; render(); };
        f.querySelector("#shCreate").onclick = () => {
          const name = (shForm.name || "").trim(), target = Number(shForm.target) || 0;
          if (!name || target <= 0) { showToast("צריך שם וסכום יעד 🙂"); return; }
          const parts = [{ name: "אתה", me: true, amount: 0, color: "#6c5ce7" }]
            .concat(FRIENDS.filter((p) => shForm.picked.has(p.name)).map((p) => ({ name: p.name, me: false, amount: 0, color: p.color })));
          state.shared.push({ id: "sh_" + Date.now(), name: name, target: target, participants: parts });
          shForm = null;
          saveState(); render();
          showToast("🤝 נוצרה קובייה משותפת: " + name);
        };
      }

      if (!state.shared.length && !shForm) {
        const e0 = el("p", "termupd"); e0.textContent = "אין עדיין קוביות משותפות — צרו אחת והזמינו חברים!";
        body.appendChild(e0);
      }

      state.shared.forEach((sc) => body.appendChild(sharedCard(sc)));
    }
    function sharedCard(sc) {
      const total = sc.participants.reduce((s, p) => s + p.amount, 0);
      const donePct = Math.min(100, Math.round((total / sc.target) * 100));
      const card = el("div", "setcard shcard");
      card.innerHTML =
        '<div class="shtop"><b>🤝 ' + esc(sc.name) + '</b>' +
          (total >= sc.target ? '<span class="shdone">הושלם! 🎉</span>' : '<span class="shpct">' + donePct + '%</span>') + '</div>' +
        '<div class="shsum">₪' + fmt(total) + ' <span>מתוך ₪' + fmt(sc.target) + '</span></div>' +
        '<div class="chtrack big"><i style="width:0%"></i></div>' +
        '<div class="shparts"></div>' +
        '<div class="shactions">' +
          '<div class="fld small"><span class="cur">₪</span><input inputmode="numeric" placeholder="200" class="shAmt"></div>' +
          '<button class="distbtn shAdd">הפקדה שלי</button>' +
          '<button class="fchip on shSim">⚡ חבר מפקיד</button>' +
        '</div>';
      requestAnimationFrame(() => { card.querySelector(".chtrack i").style.width = donePct + "%"; });
      const parts = card.querySelector(".shparts");
      sc.participants.forEach((p) => {
        const pct = sc.target > 0 ? Math.min(100, Math.round((p.amount / sc.target) * 100)) : 0;
        const row = el("div", "shp");
        row.innerHTML = '<span class="shpname"' + (p.me ? ' style="color:var(--primary);font-weight:800"' : "") + '>' + esc(p.name) + '</span>' +
          '<div class="shptrack"><i style="width:0%;background:' + p.color + '"></i></div>' +
          '<span class="shpamt">₪' + fmt(p.amount) + '</span>';
        parts.appendChild(row);
        requestAnimationFrame(() => { row.querySelector("i").style.width = pct + "%"; });
      });
      const amtInp = card.querySelector(".shAmt");
      amtInp.oninput = () => { amtInp.value = amtInp.value.replace(/[^0-9]/g, ""); };
      card.querySelector(".shAdd").onclick = () => {
        const amount = Number(amtInp.value) || 0;
        if (amount <= 0) return;
        const plan = buildFundingPlan(amount, null);
        if (!plan) { showToast("אין מספיק כסף פנוי בקוביות 🙂"); return; }
        plan.forEach((s) => {
          if (s.key === "__pool") state.pool = Math.max(0, state.pool - s.amount);
          else { const c = state.cubes.find((x) => x.key === s.key); if (c) c.balance = Math.max(0, c.balance - s.amount); }
        });
        sc.participants.find((p) => p.me).amount += amount;
        saveState(); render();
        showToast("💸 הפקדת ₪" + fmt(amount) + " (נלקח: " + describeSources(plan) + ")");
      };
      card.querySelector(".shSim").onclick = () => {
        const friends = sc.participants.filter((p) => !p.me);
        if (!friends.length) { showToast("אין חברים בקובייה הזו 🙂"); return; }
        const f = friends[Math.floor(Math.random() * friends.length)];
        const add = (Math.floor(Math.random() * 9) + 2) * 50; // 100–500
        f.amount += add;
        saveState(); render();
        showToast("🎉 " + f.name + " הפקיד/ה ₪" + fmt(add) + ' ל"' + sc.name + '"');
      };
      return card;
    }

    // =====================================================================

    // ahead against the real cube data, with crisis detection + an actionable

              '<div class="gnote">' + (budget < 2500 ? "בשכר הזה שותפים כמעט תמיד הבחירה החכמה — כך נשאר לך לחיסכון ולחיים." : "יש לך גמישות — אבל גם בדירה פרטית שמור על קוביית חירום.") + '</div>';
          };
        },
      },
      {

        sub: "קורות חיים + ההבדל בין ברוטו לנטו",
        build(box) {
          const items = ["קורות חיים במקום אחד, עד עמוד — שם, טלפון, ניסיון וכישורים",
            "לשאול על השכר ב<b>ברוטו</b> — זה לפני ניכוי מס, ביטוח לאומי וקרן פנסיה",

            "לבקש תלוש שכר כל חודש — ולשמור אותו",

          box.querySelector("#jCalc").onclick = () => {

        build(box) {
          const rows = [["⚡", "חשמל", "₪180–350", "כל חודשיים · תלוי במזגן"],
            ["💧", "מים", "₪80–160", "כל חודשיים · לפי צריכה"],
            ["🏛️", "ארנונה", "₪150–400", "דו-חודשי (ניתן לפרוס להוראת קבע חודשית) · לפי גודל ואזור"],
            ["🏢", "ועד בית", "₪80–250", "חודשי · לפי הבניין ומעלית"],
            ["🌐", "אינטרנט + סלולר", "₪100–200", "חודשי · אפשר להוזיל בהשוואה"],
            ["🔥", "גז", "₪40–90", "חודשי · תלוי בשימוש"]];
          const total = "₪700–1,300";
          box.innerHTML =
            '<p class="gtip">מעבר לשכר הדירה — אלה החשבונות ש"נעלמים" מהמשכורת. תכננו אותם מראש בקובייה אחת:</p>' +
            '<div class="gbills">' + rows.map((r) =>
              '<div class="gbill"><span class="ge">' + r[0] + '</span><div class="gbmid"><b>' + r[1] + '</b><i>' + r[3] + '</i></div><span class="gbamt">' + r[2] + '</span></div>').join("") +
            '</div>' +
            '<div class="gres"><span>סה״כ חשבונות בית טיפוסי</span><b>' + total + ' / חודש</b></div>' +
            '<div class="gnote">💡 חשמל ומים מגיעים כל חודשיים — חלקו את הסכום ל-2 ושמרו בצד כל חודש, כדי שהחיוב הכפול לא יפתיע.</div>';
        },
      },
      {
        id: "interest", emoji: "🪤", title: "מלכודות הריבית",
        sub: "איך הלוואות ומינוס אוכלים את החיסכון",
        build(box) {
          box.innerHTML =
            '<p class="gtip">ריבית עובדת נגדך כשאתה חייב. מינוס בבנק (לרוב 10%–17%) והלוואות מוחקים חיסכון בשקט. בדקו כמה זה עולה בשנה:</p>' +
            gNum("iAmt", "סכום ההלוואה / המינוס", "10000") +
            gNum("iRate", "ריבית שנתית (%)", "11") +
            '<button class="distbtn wide" id="iCalc">כמה זה עולה לי</button><div class="gout" id="iOut"></div>';
          box.querySelector("#iCalc").onclick = () => {
            const amt = gVal(box, "iAmt"), rate = gVal(box, "iRate"); const out = box.querySelector("#iOut");
            if (amt <= 0 || rate <= 0) { out.innerHTML = '<div class="gwarn">הזינו סכום וריבית 🙂</div>'; return; }
            const yr = Math.round(amt * rate / 100), mo = Math.round(yr / 12);
            out.innerHTML =
              '<div class="gres bad"><span>ריבית בשנה — כסף שנעלם</span><b>₪' + fmt(yr) + '</b></div>' +
              '<div class="gnote">זה ₪' + fmt(mo) + ' בחודש שהולכים לבנק במקום לקוביית החיסכון שלך. אותו סכום מושקע לאורך שנים היה <b>מכפיל</b> את עצמו לטובתך — במקום נגדך.</div>' +
              '<div class="gnote">💡 סדר עדיפויות: קודם לסגור מינוס והלוואות יקרות, רק אחר כך לחסוך.</div>';
          };
        },
      },
      {
        id: "lease", emoji: "📜", title: "5 דברים לבדוק לפני שחותמים על חוזה",
        sub: "צ׳קליסט חוזה שכירות",
        build(box) {
          const pts = [
            ["מי משלם מה", "ודאו בכתב מי אחראי לארנונה, ועד בית, תיקונים ובלאי. \"בעל הבית ידאג\" בעל־פה = כלום."],
            ["הבטחונות", "ערבות/שיק ביטחון סבירים. אל תיתנו שיקים פתוחים ללא סכום וללא תנאי מימוש ברור."],
            ["יציאה מוקדמת", "בדקו סעיף יציאה מוקדמת — מה קורה אם חייבים לעזוב לפני הזמן, ומי אחראי למצוא שוכר חלופי."],
            ["מצב הדירה", "צלמו הכול ביום הכניסה וצרפו פרוטוקול ליקויים לחוזה — כדי שלא יגלגלו עליכם נזק קיים."],
            ["העלאת שכר הדירה", "ודאו שכתוב במפורש כמה שכר הדירה יכול לעלות בחידוש, ושאי אפשר להעלות באמצע התקופה."]];
          box.innerHTML =
            '<p class="gtip">חוזה שכירות הוא מסמך משפטי. חמש הנקודות שהכי מפילות שוכרים צעירים:</p>' +
            '<ol class="glease">' + pts.map((p) => '<li><b>' + p[0] + '</b><span>' + p[1] + '</span></li>').join("") + '</ol>' +
            '<div class="gnote">📸 טיפ זהב: וידאו קצר של כל חדר ביום הכניסה שווה זהב ביום היציאה.</div>';
        },
      },
      {
        id: "emergency", emoji: "🛟", title: "כמה זמן ייקח לבנות קופת חירום",
        sub: "מחשבון חודשים ליעד",
        build(box) {
          box.innerHTML =
            '<p class="gtip">קופת חירום = 3–6 חודשי הוצאות בצד, לרגע שהכול משתבש. נחשב כמה זמן ייקח לך:</p>' +
            gNum("eExp", "ההוצאות החודשיות שלי", "5000") +
            gNum("eSave", "כמה אני מפריש לחיסכון בחודש", "800") +
            '<button class="distbtn wide" id="eCalc">חשב יעד</button><div class="gout" id="eOut"></div>';
          box.querySelector("#eCalc").onclick = () => {
            const exp = gVal(box, "eExp"), save = gVal(box, "eSave"); const out = box.querySelector("#eOut");
            if (exp <= 0 || save <= 0) { out.innerHTML = '<div class="gwarn">הזינו הוצאות וחיסכון 🙂</div>'; return; }
            const target3 = exp * 3, target6 = exp * 6;
            const m3 = Math.ceil(target3 / save), m6 = Math.ceil(target6 / save);
            out.innerHTML =
              '<div class="grow2"><div class="gcard2"><span>יעד מינימום · 3 חודשים</span><b>₪' + fmt(target3) + '</b><i>' + m3 + ' חודשי חיסכון</i></div>' +
              '<div class="gcard2 hl"><span>יעד בטוח · 6 חודשים</span><b>₪' + fmt(target6) + '</b><i>' + m6 + ' חודשי חיסכון</i></div></div>' +
              '<div class="gnote">התחילו מהיעד הראשון — גם ₪' + fmt(target3) + ' בצד משנים לגמרי את השקט הנפשי. קוביית "חירום" באפליקציה תשמור עליו בשבילכם.</div>';
          };
        },
      },
      {
        id: "cube", emoji: "🧊", title: "שיטת הקוביות — ההסבר ב-30 שניות",
        sub: "למה זה עובד איפה שתקציב רגיל נכשל",
        build(box) {
          box.innerHTML =
            '<p class="gtip">במקום חשבון בנק אחד גדול ומבלבל — הכסף מתפצל ל<b>קוביות</b> נפרדות, כל אחת עם תפקיד:</p>' +
            '<div class="gcubes">' +
              '<div class="gc" style="--gc:#6c63ff"><span>🏠</span><b>דיור</b><i>שכירות + חשבונות</i></div>' +
              '<div class="gc" style="--gc:#2ecc71"><span>🛒</span><b>אוכל</b><i>סופר ובסיס</i></div>' +
              '<div class="gc" style="--gc:#f39c12"><span>✨</span><b>בילויים</b><i>מה שנשאר לכיף</i></div>' +
              '<div class="gc" style="--gc:#3498db"><span>🐷</span><b>חיסכון</b><i>העתיד שלך</i></div>' +
            '</div>' +
            '<ol class="gsteps">' +
              '<li>המשכורת נכנסת ל<b>יתרה הפנויה</b>.</li>' +
              '<li>מחלקים אותה לקוביות לפי אחוזים קבועים.</li>' +
              '<li>כל קובייה יודעת בדיוק כמה יש בה — אי אפשר "בטעות" לבזבז את שכר הדירה.</li>' +
              '<li>מה שנשאר בבילויים בסוף החודש — זה באמת שלך לכיף, בלי אשמה.</li>' +
            '</ol>' +
            '<button class="distbtn wide" id="cGo">בוא נבנה את הקוביות שלי →</button>';
          box.querySelector("#cGo").onclick = () => { state.screen = "app"; render(); };
        },
      },
    ];

    function renderGuidePage() {
      const body = pageShell("מדריך דור העתיד 🧭", () => { guideFeat = null; state.screen = "app"; render(); });
      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl" style="font-size:15px">מאיפה מתחילים? 7 כלים קצרים שכל צעיר צריך לפני הדירה, העבודה והחשבונות הראשונים. בחרו נושא 👇</div>';
      body.appendChild(intro);

      const hub = el("div", "guidehub");
      GUIDE_FEATURES.forEach((f, i) => {
        const open = guideFeat === f.id;
        const card = el("div", "gcardw" + (open ? " open" : ""));
        const head = el("button", "gcardhead");
        head.innerHTML = '<span class="gemoji">' + f.emoji + '</span>' +
          '<span class="gtxt"><b>' + f.title + '</b><i>' + f.sub + '</i></span>' +
          '<span class="gchev">' + (open ? "▲" : "▼") + '</span>';
        head.onclick = () => { guideFeat = open ? null : f.id; render(); };
        card.appendChild(head);
        if (open) {
          const bd = el("div", "gcardbody");
          f.build(bd);
          bd.querySelectorAll("input").forEach((inp) => { inp.oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9.]/g, ""); }; });
          card.appendChild(bd);
        }
        hub.appendChild(card);
      });
      body.appendChild(hub);
      const sp = el("div"); sp.style.height = "60px"; body.appendChild(sp);
    }

    let wiScenario = null, wiWithCut = false, wiCustomType = "once", wiCustomAmt = "";
    const WI_PRESETS = [
      { id: "nowork", label: "🏖️ להפסיק לעבוד ל-3 חודשים", opts: { incomeOff: [1, 3] } },
      { id: "car", label: "🚗 לקנות רכב ב-30,000 ₪", opts: { oneTime: 30000 } },
      { id: "extra", label: "📈 הוצאה קבועה חדשה של 500 ₪ בחודש", opts: { extraMonthly: 500 } },
    ];
    function wiModel() {
      const by = Object.fromEntries(state.cubes.map((c) => [c.key, c]));
      const income = state.profile && state.profile.works ? (Number(state.profile.income) || 0) : 0;
      const housing = (by.housing ? by.housing.amount : 0) + (by.landlord ? by.landlord.amount : 0) + (by.bills ? by.bills.amount : 0);
      const ess = by.essentials ? by.essentials.amount : 0;
      const life = by.lifestyle ? by.lifestyle.amount : 0;
      return { income: income, spend: housing + ess + life, life: life, start: totalBalance() + state.pool };
    }
    function wiProject(opts, lifeCut) {
      const m = wiModel();
      const rows = [];
      let cur = m.start;
      let sim = m.start - (opts.oneTime || 0);
      for (let month = 0; month <= 6; month++) {
        rows.push({ month: month, cur: Math.round(cur), sim: Math.round(sim) });
        cur += m.income - m.spend;
        let inc = m.income;
        if (opts.incomeOff && month + 1 >= opts.incomeOff[0] && month + 1 <= opts.incomeOff[1]) inc = 0;
        const spend = m.spend + (opts.extraMonthly || 0) - (lifeCut ? m.life * lifeCut : 0);
        sim += inc - spend;
      }
      return rows;
    }
    function renderWhatIfPage() {
      const body = pageShell("סימולטור מה-אם? 🔮", () => { wiScenario = null; wiWithCut = false; state.screen = "app"; render(); });

      const intro = el("div", "setcard");
      intro.innerHTML = '<div class="setlbl">בחרו תרחיש — ה-AI יקרין את המצב הכספי שלכם 6 חודשים קדימה, מול המסלול הנוכחי.</div>';
      body.appendChild(intro);

      const chips = el("div", "wichips");
      WI_PRESETS.forEach((p) => {
        const c = el("button", "fchip wide" + (wiScenario && wiScenario.id === p.id ? " on" : ""));
        c.textContent = p.label;
        c.onclick = () => { wiScenario = p; wiWithCut = false; render(); };
        chips.appendChild(c);
      });
      body.appendChild(chips);

      // custom expense — with a "סוג ההוצאה" (one-time / monthly recurring) toggle
      const typeWrap = el("div", "setcard");
      typeWrap.innerHTML =
        '<div class="setlbl">סוג ההוצאה</div>' +
        '<div class="segtoggle" id="wiType">' +
          '<button data-t="once" class="' + (wiCustomType === "once" ? "on" : "") + '">💥 חד-פעמי</button>' +
          '<button data-t="monthly" class="' + (wiCustomType === "monthly" ? "on" : "") + '">🔁 חודשי קבוע</button>' +
        '</div>';
      body.appendChild(typeWrap);
      typeWrap.querySelectorAll("#wiType button").forEach((btn) => {
        btn.onclick = () => { wiCustomType = btn.getAttribute("data-t"); render(); };
      });

      const cust = el("div", "shactions");
      cust.innerHTML = '<div class="fld small"><span class="cur">₪</span><input inputmode="numeric" value="' + (wiCustomAmt || "") + '" placeholder="' + (wiCustomType === "monthly" ? "500" : "12000") + '" id="wiAmt"></div>' +
        '<button class="distbtn" id="wiRun">' + (wiCustomType === "monthly" ? "הוצאה חודשית קבועה" : "הוצאה חד-פעמית") + '</button>';
      body.appendChild(cust);
      cust.querySelector("#wiAmt").oninput = (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); wiCustomAmt = e.target.value; };
      cust.querySelector("#wiRun").onclick = () => {
        const amt = Number(cust.querySelector("#wiAmt").value) || 0;
        if (amt <= 0) return;
        wiCustomAmt = String(amt);
        if (wiCustomType === "monthly") {
          // recurring expense — drains the cube every single month in the projection
          wiScenario = { id: "custom", label: "הוצאה חודשית קבועה של ₪" + fmt(amt), opts: { extraMonthly: amt } };
        } else {
          wiScenario = { id: "custom", label: "הוצאה חד-פעמית של ₪" + fmt(amt), opts: { oneTime: amt } };
        }
        wiWithCut = false; render();
      };

      if (!wiScenario) return;

      const rows = wiProject(wiScenario.opts, wiWithCut ? 0.4 : 0);
      const crisis = rows.find((r) => r.sim < 0);
      const maxAbs = Math.max(1, ...rows.map((r) => Math.max(Math.abs(r.cur), Math.abs(r.sim))));
      const m = wiModel();

      const st = el("div", "section-t"); st.textContent = "תחזית: " + wiScenario.label + (wiWithCut ? " · עם ההמלצה ✨" : ""); body.appendChild(st);

      const tbl = el("div", "witable");
      tbl.innerHTML = '<div class="wirow head"><span>חודש</span><span>מסלול נוכחי</span><span>בתרחיש</span></div>';
      rows.forEach((r) => {
        const row = el("div", "wirow");
        row.innerHTML = '<span>' + (r.month === 0 ? "עכשיו" : r.month) + '</span>' +
          '<span class="wibar"><i class="cur" style="width:' + Math.round(Math.max(0, r.cur) / maxAbs * 100) + '%"></i><em>₪' + fmt(r.cur) + '</em></span>' +
          '<span class="wibar"><i class="' + (r.sim < 0 ? "neg" : "sim") + '" style="width:' + Math.round(Math.abs(r.sim) / maxAbs * 100) + '%"></i><em' + (r.sim < 0 ? ' class="negt"' : "") + '>₪' + fmt(r.sim) + '</em></span>';
        tbl.appendChild(row);
      });
      body.appendChild(tbl);

      if (crisis) {
        const w = el("div", "wiwarn");
        const saveAmt = Math.round(m.life * 0.4);
        const when = crisis.month === 0 ? "מיד" : "תוך " + crisis.month + " חודשים";
        if (wiWithCut) {
          // the recommendation is already applied but the scenario is still negative
          w.innerHTML = '<b>⚠️ עדיין לא מספיק:</b> גם אחרי צמצום של 40% בקוביית הבילויים היתרה מתרוקנת ' + when +
            '. התרחיש הזה גדול מדי ביחס להכנסה — שקלו לפרוס אותו על פני זמן, להגדיל הכנסה, או לוותר עליו.';
          body.appendChild(w);
        } else if (m.life > 0 && saveAmt > 0) {
          w.innerHTML = '<b>⚠️ אזהרה:</b> היתרה שלך תתרוקן ' + when + ' בתרחיש הזה. ' +
            'ה‑AI ממליץ לצמצם את קוביית הבילויים ב-40% (חיסכון של ₪' + fmt(saveAmt) + ' בחודש) כדי לשמור על איזון.';
          body.appendChild(w);
          const b = el("button", "distbtn wide"); b.textContent = "✨ הצג תחזית עם ההמלצה";
          b.onclick = () => { wiWithCut = true; render(); };
          body.appendChild(b);
        } else {
          // no lifestyle cube to trim — don't recommend a ₪0 cut
          w.innerHTML = '<b>⚠️ אזהרה:</b> היתרה שלך תתרוקן ' + when + ' בתרחיש הזה. ' +
            'אין קוביית בילויים משמעותית לצמצם — כדי לאזן צריך להגדיל הכנסה או להקטין את ההוצאה הזו.';
          body.appendChild(w);
        }
      } else {
        const ok = el("div", "wisafe");
        ok.textContent = wiWithCut
          ? "✅ עם ההמלצה התרחיש מאוזן — היתרה נשארת חיובית לאורך כל התקופה."
          : "✅ התרחיש בטוח — היתרה נשארת חיובית לאורך כל 6 החודשים.";
        body.appendChild(ok);
      }
    }

    // Worker 4 — hard wipe: per-account state + user record + session + chat.
    function wipeAccount() {
      if (!state.authUser) return;
      const email = state.authUser.email;
      try { localStorage.removeItem(stateKey()); } catch (e) {}
      try { localStorage.removeItem(obKey()); } catch (e) {} // saved onboarding draft
      const users = loadUsers(); delete users[email]; saveUsers(users);
      clearSecLog(); // the security log holds this user's email — wipe it too
      settStep = 0;
      resetChat();
      logout(); // clears session + in-memory state, routes to the login screen
      showToast("🗑️ החשבון נמחק לצמיתות");
    }

    $("fab").onclick = openChat;

    // ---- boot -------------------------------------------------------------
    initAuth();
  </script>
</body>
