<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CubeFinance — אנימציית פתיחה</title>
<style>
/* ==========================================================================
   CubeFinance — 3D intro animation, PORTRAIT 9:16 (phone / reels / stories).
   Sequence: a glass money jar shakes → the camera pans down to its base →
   the jar falls and shatters → a magical "poof" → the app's opening screen.
   Pure CSS 3D + keyframes, a small JS timeline, and a synthesized soundtrack
   built with the Web Audio API. No dependencies, no external assets.
   ========================================================================== */
:root{
  --ink:#eceff8; --dim:#949cb6;
  --primary:#6472ff; --primary-2:#8f9aff;
  --gold:#f2b134; --money:#4caf76; --money-2:#2f8f57;
  --bg-deep:#070a12;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#05070d; color:var(--ink);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:12px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}

/* ---- PORTRAIT 9:16 stage — matches the app and fits reels/stories ------- */
.frame{
  position:relative; aspect-ratio:9/16;
  height:min(96vh,940px); max-width:96vw;
  border-radius:22px; overflow:hidden; background:var(--bg-deep);
  box-shadow:0 40px 100px -40px #000, 0 0 0 1px #ffffff12;
}
.stage{position:absolute; inset:0; perspective:1100px; perspective-origin:50% 44%; overflow:hidden}

.studio{
  position:absolute; inset:0;
  background:
    radial-gradient(65% 34% at 50% 30%, #1d2748 0%, transparent 70%),
    radial-gradient(85% 40% at 50% 100%, #101a33 0%, transparent 70%),
    linear-gradient(180deg,#0a0e1b 0%, #070a12 100%);
  transition:opacity .5s ease;
}
.floor{
  position:absolute; left:50%; top:66%; width:190%; height:44%;
  transform:translateX(-50%) rotateX(74deg); transform-origin:50% 0;
  background:radial-gradient(closest-side, #2a3663 0%, #131a2e 45%, transparent 78%);
  opacity:.9;
}

/* ---- camera rig --------------------------------------------------------- */
.camera{position:absolute; inset:0; transform-style:preserve-3d; transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.camera.pan{transform:translateY(9%) translateZ(110px) rotateX(-9deg)}

/* ---- the jar ------------------------------------------------------------ */
.jarwrap{
  position:absolute; left:50%; top:46%; width:210px; height:280px;
  margin:-150px 0 0 -105px; transform-style:preserve-3d;
}
.jar{position:absolute; inset:0; transform-origin:50% 100%; transform-style:preserve-3d}
.shake{animation:shake .34s linear infinite}
.shake-hard{animation:shakeHard .16s linear infinite}
@keyframes shake{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-2px,1px) rotate(-.7deg)}
  50%{transform:translate(2px,-1px) rotate(.6deg)}
  75%{transform:translate(-1px,-1px) rotate(-.3deg)}
}
@keyframes shakeHard{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-5px,2px) rotate(-2deg)}
  40%{transform:translate(5px,-2px) rotate(1.8deg)}
  60%{transform:translate(-4px,-2px) rotate(-1.4deg)}
  80%{transform:translate(4px,2px) rotate(1.2deg)}
}
.jar.fall{animation:fall .5s cubic-bezier(.55,.06,.9,.6) forwards}
@keyframes fall{
  0%{transform:rotate(0) translateY(0)}
  45%{transform:rotate(-26deg) translateY(6px)}
  100%{transform:rotate(-74deg) translateY(66px)}
}
.jar.gone{opacity:0}

.glass{
  position:absolute; left:14px; right:14px; top:34px; bottom:16px;
  border-radius:14px 14px 26px 26px;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 16%,
      rgba(255,255,255,.02) 44%, rgba(255,255,255,.09) 70%,
      rgba(255,255,255,.36) 100%),
    linear-gradient(180deg, rgba(190,225,255,.10), rgba(120,170,220,.05));
  border:1px solid rgba(255,255,255,.30); border-top:none;
  box-shadow:
    inset 0 -22px 34px -20px rgba(120,190,255,.45),
    inset 0 10px 22px -12px rgba(255,255,255,.35),
    0 24px 50px -26px rgba(90,150,255,.55);
  overflow:hidden;
}
.glass::after{
  content:""; position:absolute; left:12%; top:4%; width:11%; height:88%;
  border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.06));
  filter:blur(1.5px);
}
.rim{
  position:absolute; left:6px; right:6px; top:16px; height:34px; border-radius:50%;
  background:linear-gradient(180deg,rgba(225,240,255,.55),rgba(150,190,230,.18));
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 6px 16px -6px rgba(120,190,255,.6), inset 0 -4px 10px -4px rgba(255,255,255,.6);
}
.neck{
  position:absolute; left:14px; right:14px; top:30px; height:20px;
  background:linear-gradient(90deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 40%,rgba(255,255,255,.28));
  border-left:1px solid rgba(255,255,255,.28); border-right:1px solid rgba(255,255,255,.28);
}
.base{
  position:absolute; left:18px; right:18px; bottom:6px; height:26px; border-radius:50%;
  background:linear-gradient(180deg,rgba(150,195,240,.30),rgba(90,140,200,.15));
  border:1px solid rgba(255,255,255,.22);
}
.jarshadow{
  position:absolute; left:50%; top:calc(46% + 128px); width:230px; height:34px; margin-left:-115px;
  border-radius:50%; background:radial-gradient(closest-side,#000a 0%,transparent 75%);
  filter:blur(3px); transition:opacity .35s, transform .35s;
}

/* ---- money inside the jar ---------------------------------------------- */
.bills{position:absolute; inset:0}
.bill{
  position:absolute; width:52px; height:26px; border-radius:3px;
  background:linear-gradient(180deg,var(--money) 0%, var(--money-2) 100%);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.13), 0 2px 5px -2px #000a;
  display:grid; place-items:center;
  font-size:12px; font-weight:900; color:rgba(255,255,255,.85); text-shadow:0 1px 1px #0006;
  animation:jiggle var(--dur,1.1s) ease-in-out infinite alternate; animation-delay:var(--dl,0s);
}
.bill::before{content:"$"}
@keyframes jiggle{
  from{transform:translate(0,0) rotate(var(--rot,0deg))}
  to{transform:translate(var(--jx,3px),var(--jy,-4px)) rotate(calc(var(--rot,0deg) + var(--jr,6deg)))}
}
.bills.wild .bill{animation-duration:.22s}

/* ---- shatter ------------------------------------------------------------ */
.debris{position:absolute; inset:0; pointer-events:none}
.shard{
  position:absolute; left:50%; top:47%; width:var(--w,26px); height:var(--h,30px);
  background:linear-gradient(140deg, rgba(226,242,255,.95), rgba(140,190,240,.45) 55%, rgba(255,255,255,.2));
  border:1px solid rgba(255,255,255,.6);
  clip-path:polygon(var(--p, 50% 0%, 100% 62%, 62% 100%, 0% 74%, 12% 22%));
  opacity:0; transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 10px rgba(120,190,255,.35));
}
.fly .shard{animation:shardFly var(--d,1s) cubic-bezier(.15,.6,.35,1) forwards; animation-delay:var(--sd,0s)}
@keyframes shardFly{
  0%{opacity:0; transform:translate(-50%,-50%) rotate(0) scale(.4)}
  8%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scale(var(--sc,1))}
}
.flybill{position:absolute; left:50%; top:47%; opacity:0; transform:translate(-50%,-50%)}
.fly .flybill{animation:billFly 1.15s cubic-bezier(.2,.65,.3,1) forwards; animation-delay:var(--sd,0s)}
@keyframes billFly{
  0%{opacity:0; transform:translate(-50%,-50%) rotate(0)}
  10%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot))}
}
.flash{
  position:absolute; inset:0; background:radial-gradient(26% 18% at 50% 50%, #fff 0%, #cfe4ff44 40%, transparent 72%);
  opacity:0; pointer-events:none; mix-blend-mode:screen;
}
.flash.on{animation:flashPop .30s ease-out forwards}
@keyframes flashPop{0%{opacity:0}10%{opacity:.6}100%{opacity:0}}
.ring{
  position:absolute; left:50%; top:50%; width:60px; height:20px; margin:-10px 0 0 -30px;
  border:2px solid rgba(200,230,255,.85); border-radius:50%; opacity:0; pointer-events:none;
}
.ring.on{animation:ringOut .7s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ringOut{0%{opacity:.95; transform:scale(.3)}100%{opacity:0; transform:scale(9)}}

/* ---- magic poof --------------------------------------------------------- */
.poof{position:absolute; inset:0; pointer-events:none; opacity:0}
.poof.on{opacity:1}
.puff{
  position:absolute; left:50%; top:48%; width:var(--s,180px); height:var(--s,180px);
  margin-left:calc(var(--s,180px) / -2); margin-top:calc(var(--s,180px) / -2);
  border-radius:50%; opacity:0;
  background:radial-gradient(closest-side, #ffffff 0%, #dfe4ff 42%, rgba(140,150,255,.55) 68%, transparent 78%);
  filter:blur(6px);
}
.poof.on .puff{animation:puffOut var(--pd,.9s) cubic-bezier(.16,.72,.28,1) forwards; animation-delay:var(--pdl,0s)}
@keyframes puffOut{
  0%{opacity:0; transform:translate(var(--px,0),var(--py,0)) scale(.2)}
  18%{opacity:.95}
  100%{opacity:0; transform:translate(var(--px,0),var(--py,0)) scale(var(--pscale,3.2))}
}
.spark{
  position:absolute; left:50%; top:48%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
  border-radius:50%; background:var(--sc,#fff); opacity:0;
  box-shadow:0 0 12px 2px currentColor; color:var(--sc,#fff);
}
.poof.on .spark{animation:sparkOut .95s cubic-bezier(.1,.7,.3,1) forwards; animation-delay:var(--sdl,0s)}
@keyframes sparkOut{
  0%{opacity:0; transform:translate(0,0) scale(.4)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(.2)}
}
.wipe{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.wipe.on{animation:wipeOver .85s ease-in-out forwards}
@keyframes wipeOver{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}

/* ---- ACT 2 — the app's opening screen (portrait) ------------------------ */
.app{
  position:absolute; inset:0; opacity:0; pointer-events:none;
  background:
    radial-gradient(80% 34% at 18% -4%, #182247 0%, transparent 58%),
    radial-gradient(70% 30% at 108% 8%, #0d2540 0%, transparent 54%),
    var(--bg-deep);
  display:grid; place-items:center; padding:26px;
}
.app.on{opacity:1; transition:opacity .5s ease}
.appinner{text-align:center; width:100%; transform:translateY(14px); opacity:0}
.app.on .appinner{animation:riseIn .7s cubic-bezier(.2,.7,.3,1) .12s forwards}
@keyframes riseIn{to{transform:translateY(0); opacity:1}}

.logo{
  width:108px; height:108px; margin:0 auto 20px; border-radius:28px;
  display:grid; place-items:center; font-size:54px;
  background:linear-gradient(150deg,var(--primary-2),var(--primary));
  box-shadow:0 26px 60px -22px var(--primary), inset 0 2px 0 #ffffff40;
  transform:scale(.5) rotate(-14deg); opacity:0;
}
.app.on .logo{animation:logoPop .75s cubic-bezier(.22,1.3,.36,1) .05s forwards}
@keyframes logoPop{to{transform:scale(1) rotate(0); opacity:1}}

.brand{font-size:34px; font-weight:900; letter-spacing:-1px; margin:0}
.brand small{display:block; font-size:14px; font-weight:700; color:var(--dim); letter-spacing:.3px; margin-top:7px}
.tag{color:var(--dim); font-size:15px; margin:16px 0 24px; line-height:1.65}
.tag b{color:var(--ink)}

.cubes{display:flex; gap:9px; justify-content:center; margin-bottom:28px}
.qcube{
  flex:1; max-width:82px; padding:13px 6px; border-radius:15px; text-align:center;
  background:linear-gradient(168deg,#1a2136,#151b29 60%);
  border:1.5px solid #273049; box-shadow:0 18px 40px -28px #000;
  opacity:0; transform:translateY(22px) scale(.9);
}
.app.on .qcube{animation:cubeIn .55s cubic-bezier(.2,1.15,.35,1) forwards; animation-delay:var(--cd,.3s)}
@keyframes cubeIn{to{opacity:1; transform:translateY(0) scale(1)}}
.qcube .ce{font-size:21px}
.qcube .cn{display:block; font-size:11px; font-weight:800; margin-top:5px}
.qcube .cv{display:block; font-size:11.5px; font-weight:900; margin-top:3px; color:var(--primary-2); font-variant-numeric:tabular-nums}

.cta{
  border:none; cursor:pointer; font-family:inherit; font-size:16.5px; font-weight:800;
  color:#fff; padding:16px 46px; border-radius:16px;
  background:linear-gradient(135deg,var(--primary-2),var(--primary));
  box-shadow:0 16px 34px -14px var(--primary), inset 0 1px 0 #ffffff33;
  opacity:0; transform:translateY(12px);
}
.app.on .cta{animation:riseIn .55s cubic-bezier(.2,.7,.3,1) .62s forwards}

/* ---- controls ----------------------------------------------------------- */
.ctrls{position:absolute; inset-inline-end:12px; bottom:12px; z-index:30; display:flex; gap:8px}
.ctrl{
  background:#ffffff14; border:1px solid #ffffff2e; color:#dfe3f5;
  font-family:inherit; font-size:13px; font-weight:700; padding:9px 15px;
  border-radius:999px; cursor:pointer; backdrop-filter:blur(6px);
  transition:opacity .4s, background .2s;
}
.ctrl:hover{background:#ffffff26}
.ctrl.hide{opacity:0; pointer-events:none}
/* the big "play with sound" call-to-action (browsers block autoplay audio) */
.soundcta{
  position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:31;
  background:linear-gradient(135deg,var(--primary-2),var(--primary)); color:#fff;
  border:none; font-family:inherit; font-size:15px; font-weight:800;
  padding:14px 26px; border-radius:999px; cursor:pointer; white-space:nowrap;
  box-shadow:0 16px 34px -12px var(--primary);
  animation:pulseCta 1.9s ease-in-out infinite;
}
@keyframes pulseCta{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.soundcta.hide{display:none}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="frame">
  <div class="stage" id="stage">

    <!-- ACT 1 — the money jar -->
    <div class="studio" id="studio"><div class="floor"></div></div>
    <div class="camera" id="camera">
      <div class="jarshadow" id="jarshadow"></div>
      <div class="jarwrap">
        <div class="jar" id="jar">
          <div class="glass"><div class="bills" id="bills"></div></div>
          <div class="neck"></div>
          <div class="rim"></div>
          <div class="base"></div>
        </div>
      </div>
    </div>

    <div class="debris" id="debris"></div>
    <div class="flash" id="flash"></div>
    <div class="ring" id="ring"></div>
    <div class="poof" id="poof"></div>
    <div class="wipe" id="wipe"></div>

    <!-- ACT 2 — the app opening screen -->
    <div class="app" id="app">
      <div class="appinner">
        <div class="logo">🧊</div>
        <h1 class="brand">CubeFinance<small>קיובפייננס · הכסף שלך, מסודר בקוביות</small></h1>
        <p class="tag">שוברים את הקופה — ובונים <b>סדר</b>.<br>כל שקל יודע לאן הוא הולך.</p>
        <div class="cubes">
          <div class="qcube" style="--cd:.34s"><span class="ce">🏠</span><span class="cn">דיור</span><span class="cv">₪3,500</span></div>
          <div class="qcube" style="--cd:.42s"><span class="ce">🛒</span><span class="cn">שוטף</span><span class="cv">₪1,200</span></div>
          <div class="qcube" style="--cd:.50s"><span class="ce">🐷</span><span class="cn">חיסכון</span><span class="cv">₪2,400</span></div>
          <div class="qcube" style="--cd:.58s"><span class="ce">🎉</span><span class="cn">בילויים</span><span class="cv">₪900</span></div>
        </div>
        <button class="cta">בוא נתחיל 🧊</button>
      </div>
    </div>

    <button class="soundcta" id="soundcta">🔊 נגן עם סאונד</button>
    <div class="ctrls">
      <button class="ctrl hide" id="replay">↻ נגן שוב</button>
      <button class="ctrl hide" id="mute">🔊</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var rand = function(a,b){ return a + Math.random()*(b-a); };

  /* =======================================================================
     SOUND — everything is synthesized live with the Web Audio API, so the
     file stays self-contained (no .mp3 assets). A compressor on the master
     bus keeps the impact from clipping.
     ======================================================================= */
  var SFX = (function(){
    var ctx=null, master=null, noiseBuf=null, on=true;
    function init(){
      if (ctx) return ctx;
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 9; comp.attack.value = .003; comp.release.value = .22;
      master = ctx.createGain(); master.gain.value = .85;
      master.connect(comp); comp.connect(ctx.destination);
      var len = Math.floor(ctx.sampleRate * 2);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i=0;i<len;i++) d[i] = Math.random()*2 - 1;
      return ctx;
    }
    // filtered noise burst — rattles, whooshes, glass spray
    function noise(at, dur, type, freq, q, vol, sweepTo){
      if (!ctx) return;
      var src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      var f = ctx.createBiquadFilter(); f.type = type;
      f.frequency.setValueAtTime(Math.max(40,freq), at);
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), at+dur);
      if (q) f.Q.value = q;
      var g = ctx.createGain();
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol), at + Math.min(.03, dur*.25));
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(at); src.stop(at + dur + .05);
    }
    // pitched tone — thuds, tinkles, chimes
    function tone(at, freq, dur, type, vol, freqEnd){
      if (!ctx) return;
      var o = ctx.createOscillator(); o.type = type || "sine";
      o.frequency.setValueAtTime(freq, at);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd), at+dur);
      var g = ctx.createGain();
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol), at + .014);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(master);
      o.start(at); o.stop(at + dur + .05);
    }
    return {
      enable:function(){ var c = init(); if (c && c.state === "suspended") c.resume(); return !!c; },
      ready:function(){ return !!ctx; },
      setMuted:function(m){ on = !m; if (master) master.gain.value = m ? 0 : .85; },
      isMuted:function(){ return !on; },
      /* the full soundtrack, scheduled in one go against the audio clock so it
         stays locked to the visual timeline */
      score:function(){
        if (!ctx) return;
        var t = ctx.currentTime + .05;
        // 0.1–1.1s — the jar shakes: paper rustle + faint glass ring
        for (var i=0;i<10;i++)
          noise(t+.12+i*.115, .075, "bandpass", rand(1600,3600), 1.4, rand(.05,.09));
        tone(t+.15, 430, .5, "sine", .025);
        // 1.1–1.8s — it shakes harder and faster
        for (var j=0;j<16;j++)
          noise(t+1.1+j*.045, .05, "bandpass", rand(2000,5200), 2, rand(.08,.13));
        tone(t+1.1, 620, .55, "sine", .04);
        // 1.8s — camera pan whoosh
        noise(t+1.82, .85, "lowpass", 320, 1, .10, 1500);
        // 2.9s — the jar tips and drops
        noise(t+2.9, .5, "bandpass", 900, 1.2, .11, 240);
        tone(t+2.92, 300, .45, "sine", .06, 110);
        // 3.4s — IMPACT + glass shatter
        tone(t+3.4, 115, .5, "sine", .34, 40);            // body thud
        noise(t+3.4, .16, "highpass", 2400, .7, .30);      // the crack
        noise(t+3.43, .75, "highpass", 3600, .7, .18);     // spraying glass
        for (var k=0;k<18;k++)                             // individual tinkles
          tone(t+3.45+Math.random()*.6, rand(2200,6200), rand(.10,.26), "triangle", rand(.04,.085));
        // 3.9s — the magical poof
        noise(t+3.9, .55, "lowpass", 300, 1, .20, 2800);
        var sparkle = [784, 988, 1175, 1568, 1976];
        for (var m=0;m<sparkle.length;m++) tone(t+3.95+m*.055, sparkle[m], .45, "sine", .085);
        // 4.5s — the app is revealed: warm major chord + shimmer
        var chord = [523.25, 659.25, 783.99, 1046.50];
        for (var n=0;n<chord.length;n++) tone(t+4.5+n*.07, chord[n], 1.5, "sine", .095);
        tone(t+4.5, 130.81, 1.7, "triangle", .07);         // bass root
        noise(t+4.52, 1.1, "highpass", 6000, .7, .045);    // air shimmer
        tone(t+5.15, 1568, .8, "sine", .05);               // final sparkle
      }
    };
  })();

  /* ---------- build the money, the debris and the poof ------------------- */
  var BILLS = 22;
  function buildBills(){
    var box = $("bills"); box.innerHTML = "";
    for (var i=0;i<BILLS;i++){
      var b = document.createElement("div");
      b.className = "bill";
      var row = Math.floor(i/4);
      b.style.left = rand(2, 72) + "%";
      b.style.bottom = (3 + row*13 + rand(-3,3)) + "%";
      b.style.setProperty("--rot", rand(-28,28).toFixed(1) + "deg");
      b.style.setProperty("--jx", rand(-4,4).toFixed(1) + "px");
      b.style.setProperty("--jy", rand(-6,-1).toFixed(1) + "px");
      b.style.setProperty("--jr", rand(-9,9).toFixed(1) + "deg");
      b.style.setProperty("--dur", rand(.7,1.4).toFixed(2) + "s");
      b.style.setProperty("--dl", rand(0,.6).toFixed(2) + "s");
      b.style.transform = "rotate(" + b.style.getPropertyValue("--rot") + ")";
      box.appendChild(b);
    }
  }
  var SHAPES = [
    "50% 0%, 100% 62%, 62% 100%, 0% 74%, 12% 22%",
    "0% 0%, 100% 28%, 74% 100%, 18% 82%",
    "22% 0%, 100% 46%, 54% 100%, 0% 58%",
    "0% 18%, 82% 0%, 100% 78%, 30% 100%"
  ];
  function buildDebris(){
    var d = $("debris"); d.innerHTML = "";
    for (var i=0;i<20;i++){
      var s = document.createElement("div");
      s.className = "shard";
      var ang = rand(0, Math.PI*2), dist = rand(110, 330);
      s.style.setProperty("--p", SHAPES[i % SHAPES.length]);
      s.style.setProperty("--w", rand(20,46).toFixed(0) + "px");
      s.style.setProperty("--h", rand(22,50).toFixed(0) + "px");
      s.style.setProperty("--tx", (Math.cos(ang)*dist).toFixed(0) + "px");
      s.style.setProperty("--ty", (Math.sin(ang)*dist*.8 - rand(20,120)).toFixed(0) + "px");
      s.style.setProperty("--rot", rand(-540,540).toFixed(0) + "deg");
      s.style.setProperty("--sc", rand(.5,1.15).toFixed(2));
      s.style.setProperty("--d", rand(.85,1.25).toFixed(2) + "s");
      s.style.setProperty("--sd", rand(0,.09).toFixed(2) + "s");
      d.appendChild(s);
    }
    for (var j=0;j<10;j++){
      var w = document.createElement("div");
      w.className = "flybill";
      var a2 = rand(-Math.PI, 0), r2 = rand(130, 300);
      w.style.setProperty("--tx", (Math.cos(a2)*r2).toFixed(0) + "px");
      w.style.setProperty("--ty", (Math.sin(a2)*r2).toFixed(0) + "px");
      w.style.setProperty("--rot", rand(-420,420).toFixed(0) + "deg");
      w.style.setProperty("--sd", rand(0,.12).toFixed(2) + "s");
      var inner = document.createElement("div");
      inner.className = "bill";
      inner.style.position = "static"; inner.style.animation = "none";
      w.appendChild(inner); d.appendChild(w);
    }
  }
  function buildPoof(){
    var p = $("poof"); p.innerHTML = "";
    for (var i=0;i<9;i++){
      var puff = document.createElement("div");
      puff.className = "puff";
      puff.style.setProperty("--s", rand(120,230).toFixed(0) + "px");
      puff.style.setProperty("--px", rand(-110,110).toFixed(0) + "px");
      puff.style.setProperty("--py", rand(-110,80).toFixed(0) + "px");
      puff.style.setProperty("--pscale", rand(2.4,4.4).toFixed(2));
      puff.style.setProperty("--pd", rand(.75,1.05).toFixed(2) + "s");
      puff.style.setProperty("--pdl", rand(0,.22).toFixed(2) + "s");
      p.appendChild(puff);
    }
    var colors = ["#ffffff","#cdd4ff","#f2b134","#8f9aff","#a8f0d0"];
    for (var k=0;k<28;k++){
      var sp = document.createElement("div");
      sp.className = "spark";
      var a = rand(0,Math.PI*2), r = rand(110,300);
      sp.style.setProperty("--tx", (Math.cos(a)*r).toFixed(0) + "px");
      sp.style.setProperty("--ty", (Math.sin(a)*r).toFixed(0) + "px");
      sp.style.setProperty("--sc", colors[k % colors.length]);
      sp.style.setProperty("--sdl", rand(0,.28).toFixed(2) + "s");
      p.appendChild(sp);
    }
  }

  /* ---------- the timeline ---------------------------------------------- */
  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

  function reset(){
    timers.forEach(clearTimeout); timers = [];
    buildBills(); buildDebris(); buildPoof();
    $("jar").className = "jar";
    $("bills").className = "bills";
    $("camera").className = "camera";
    $("debris").className = "debris";
    $("flash").className = "flash";
    $("ring").className = "ring";
    $("poof").className = "poof";
    $("wipe").className = "wipe";
    $("app").className = "app";
    $("studio").style.opacity = "1";
    $("jarshadow").style.opacity = "1";
    $("jarshadow").style.transform = "";
    $("replay").classList.add("hide");
    $("mute").classList.add("hide");
  }

  function play(withSound){
    reset();
    if (withSound && SFX.ready() && !SFX.isMuted()) SFX.score();
    at(120,  function(){ $("jar").classList.add("shake"); });
    at(1100, function(){
      $("jar").classList.remove("shake");
      $("jar").classList.add("shake-hard");
      $("bills").classList.add("wild");
    });
    at(1800, function(){ $("camera").classList.add("pan"); });
    at(2900, function(){
      $("jar").classList.remove("shake-hard");
      $("jar").classList.add("fall");
      $("jarshadow").style.opacity = ".35";
      $("jarshadow").style.transform = "scale(1.15)";
    });
    at(3400, function(){
      $("jar").classList.add("gone");
      $("debris").classList.add("fly");
      $("flash").classList.add("on");
      $("ring").classList.add("on");
    });
    at(3900, function(){
      $("poof").classList.add("on");
      $("studio").style.opacity = "0";
      $("jarshadow").style.opacity = "0";
    });
    at(4250, function(){ $("wipe").classList.add("on"); });
    at(4500, function(){ $("app").classList.add("on"); });
    at(6600, function(){
      $("replay").classList.remove("hide");
      if (SFX.ready()) $("mute").classList.remove("hide");
    });
  }

  // Browsers block audio until the user interacts, so the first pass runs
  // silently and this button starts it again WITH the soundtrack.
  $("soundcta").onclick = function(){
    var ok = SFX.enable();
    $("soundcta").classList.add("hide");
    if (ok) { SFX.setMuted(false); $("mute").textContent = "🔊"; }
    play(true);
  };
  $("replay").onclick = function(){ play(SFX.ready()); };
  $("mute").onclick = function(){
    var m = !SFX.isMuted();
    SFX.setMuted(m);
    $("mute").textContent = m ? "🔇" : "🔊";
  };

  play(false); // silent first run so the animation is visible immediately
})();
</script>
</body>
</html>
